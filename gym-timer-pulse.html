<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Gym Timer — PULSE</title>
<!-- The ONLY external resource — loaded NON-BLOCKING (media=print, flipped to all on
     load) so a stalled/captive gym connection can never hang first paint. display=optional
     means the fonts apply only when ready immediately (HTTP cache after first visit) and
     never swap in mid-session — no live-countdown re-metric. The tuned fallback stacks
     below keep the app fully usable and deliberately styled if this never loads. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=optional" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* ============ TOKENS — ICU MONITOR ============ */
:root {
  --g0:#050505;            /* monitor bezel / canvas (OLED black) */
  --g1:#0c0c0c;            /* panel */
  --g2:#161616;            /* module */
  --g3:#212121;            /* control face */
  --g4:#2d2d2d;            /* pressed / filled */
  --hairline:#242424;
  --edge:rgba(255,255,255,.045);
  --txt:#e9e9e9;
  --txt2:#9c9c9c;
  --txt3:#6c6c6c;
  --etch:#565656;
  --red:#ff3b30;
  --red-hot:#ff6258;
  --red-dim:rgba(255,59,48,.32);
  --red-wash:#2a0f0d;
  --red-wash-bd:#5c1714;
  --scr:#070303;           /* monitor screen background (near-black, faint warm) */
  --grid:#1c1414;          /* graticule minor lines (dark warm gray) */
  --grid-maj:#2a1c1a;      /* graticule major lines */
  /* graticule = the classic monitor grid: dark warm-gray lines on near-black. The
     trace (red) is the only signal color; the grid stays monochrome-warm. */
  --graticule:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  --trace-dim:rgba(255,59,48,.16); /* swept/elapsed phosphor ghost */
  --font-cond:"Barlow Condensed","Arial Narrow",Arial,system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease-out:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.34,1.45,.4,1);
  --r-lg:16px;
  --r-md:11px;
  --r-sm:7px;
  --bd:rgba(255,255,255,.07);
  --panel-grad:linear-gradient(180deg,#171717,#0f0f0f);
  --ctl-grad:linear-gradient(180deg,#222,#181818);
  --elev:0 12px 32px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);
  /* heartbeat period — driven from JS as rest depletes (idle baseline -> tachycardia) */
  --beat-period:1100ms;
}
/* ============ BASE ============ */
* { margin:0; padding:0; box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
html, body { height:100%; background:var(--g0); overscroll-behavior:none; }
body {
  font-family:var(--font-mono);
  font-size:13.5px; line-height:1.5;
  color:var(--txt);
  -webkit-tap-highlight-color:transparent;
  overflow:hidden;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  touch-action:manipulation;
}
::selection { background:var(--g4); color:var(--txt); }
button {
  font:inherit; color:inherit; background:none; border:none; cursor:pointer;
  touch-action:manipulation;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
button:disabled { cursor:default; }
:focus { outline:none; }
:focus-visible { outline:1px solid var(--txt2); outline-offset:2px; }
.num, .mono { font-family:var(--font-mono); font-variant-numeric:tabular-nums lining-nums; }
.lbl {
  font-family:var(--font-cond); font-weight:700; font-size:11px;
  letter-spacing:.14em; text-transform:uppercase;
  color:#7e7e7e;
}
.mod {
  background:var(--panel-grad);
  border:1px solid var(--bd);
  border-radius:var(--r-lg);
  box-shadow:var(--elev);
}
.hidden { display:none !important; }

/* ============ APP FRAME ============ */
#app {
  position:fixed; inset:0;
  height:100vh; height:100dvh;
  background:var(--g0);
  display:flex; flex-direction:column;
  overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);
}
@media (min-width:500px) {
  #app {
    left:50%; right:auto; transform:translateX(-50%);
    width:430px;
    border-left:1px solid var(--hairline);
    border-right:1px solid var(--hairline);
  }
}
/* GO-at-zero alarm strobe (reused by restDone/alert flow) */
#wash {
  position:absolute; inset:0; background:var(--red);
  opacity:0; pointer-events:none; z-index:90;
}
#wash.washing { animation:washout 280ms ease-out forwards; }
@keyframes washout { 0%{opacity:.82;} 100%{opacity:0;} }

/* ============ HEADER (56px) ============ */
#hdr {
  height:56px; flex:0 0 56px;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 12px 0 14px;
  border-bottom:1px solid var(--hairline);
  background:var(--g1);
  box-shadow:inset 0 1px 0 var(--edge);
  position:relative; z-index:20;
}
#hdr-left { font-family:var(--font-cond); font-weight:700; font-size:13px; letter-spacing:.14em; color:#7e7e7e; text-transform:uppercase; white-space:nowrap; }
#hdr-left .day { color:var(--txt2); }
#hdr-right { display:flex; align-items:center; gap:2px; }
#hdr-reg {
  font-family:var(--font-mono); font-variant-numeric:tabular-nums lining-nums;
  font-size:10px; color:var(--txt3); letter-spacing:.02em; white-space:nowrap;
  margin-right:6px;
}
.pip-status { width:5px; height:5px; border-radius:50%; margin:0 3px; flex:0 0 auto; background:var(--g4); }
#pip-wake.held { background:var(--txt3); }
#pip-wake.lost { background:transparent; border:1px solid var(--red); }
#pip-save { background:transparent; }
#pip-save.fail { background:var(--red-dim); border:1px solid var(--red-wash-bd); }
#undo-btn, #gear-btn {
  min-width:44px; min-height:44px;
  display:flex; align-items:center; justify-content:center;
  color:var(--txt3);
}
#undo-btn { font-family:var(--font-cond); font-weight:700; font-size:10px; letter-spacing:.14em; }
#undo-btn:disabled { opacity:.28; }
#undo-btn:active:not(:disabled), #gear-btn:active { color:var(--txt2); transform:scale(.96); }
#gear-btn svg { width:18px; height:18px; display:block; }

/* ============ RAIL (64px) — lead "channels" strip ============ */
#rail {
  height:64px; flex:0 0 64px;
  display:flex; align-items:stretch;
  border-bottom:1px solid var(--hairline);
  background:var(--g1);
  position:relative; z-index:15;
  touch-action:manipulation;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
.tile {
  flex:1 1 0; min-width:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:7px; border-right:1px solid var(--hairline);
  padding:4px 2px;
}
.tile:last-child { border-right:none; }
.tile .ab {
  font-family:var(--font-cond); font-weight:700; font-size:13px;
  letter-spacing:.1em; color:var(--txt3);
}
.tile.cur .ab { color:var(--txt2); }
.tile.donex .ab { color:var(--etch); }
.tile .pips { display:flex; gap:5px; align-items:center; justify-content:center; }
.pip { width:10px; height:10px; border-radius:50%; flex:0 0 auto; box-sizing:border-box; }
.pip.fut  { border:1.5px solid #3a3a3a; background:transparent; }
.pip.done { background:var(--g4); }
/* WORKING cursor = SOLID red (filled, breathing). */
.pip.work { background:var(--red); animation:pipbreathe 2.2s ease-in-out infinite; }
@keyframes pipbreathe { 0%,100% { box-shadow:0 0 0 0 rgba(255,59,48,0); } 50% { box-shadow:0 0 0 3.5px rgba(255,59,48,.22); } }
/* VIEWING cursor = HOLLOW red ring (outline only). */
.pip.view { border:2px solid var(--red); background:transparent; }

/* ============ STAGE ============ */
#stage { flex:1 1 auto; position:relative; overflow:hidden; min-height:0; }
#stage-inner { position:absolute; inset:0; overflow:hidden; display:flex; flex-direction:column; }
#stage-inner.scrolly { overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
.stage-enter .idle-wrap > *, .stage-enter .work-wrap > *, .stage-enter .rest-wrap > *,
.stage-enter .browse-wrap > *, .stage-enter .done-wrap > * { animation:rise 320ms var(--ease-out) backwards; }
.stage-enter .idle-wrap > :nth-child(2), .stage-enter .work-wrap > :nth-child(2), .stage-enter .rest-wrap > :nth-child(2),
.stage-enter .browse-wrap > :nth-child(2), .stage-enter .done-wrap > :nth-child(2) { animation-delay:40ms; }
.stage-enter .idle-wrap > :nth-child(3), .stage-enter .work-wrap > :nth-child(3), .stage-enter .rest-wrap > :nth-child(3),
.stage-enter .browse-wrap > :nth-child(3), .stage-enter .done-wrap > :nth-child(3) { animation-delay:80ms; }
.stage-enter .idle-wrap > :nth-child(4), .stage-enter .work-wrap > :nth-child(4), .stage-enter .rest-wrap > :nth-child(4),
.stage-enter .browse-wrap > :nth-child(4), .stage-enter .done-wrap > :nth-child(4) { animation-delay:120ms; }
.stage-enter .idle-wrap > :nth-child(5), .stage-enter .work-wrap > :nth-child(5), .stage-enter .rest-wrap > :nth-child(5),
.stage-enter .browse-wrap > :nth-child(5), .stage-enter .done-wrap > :nth-child(5) { animation-delay:160ms; }
.stage-enter .idle-wrap > :nth-child(6), .stage-enter .work-wrap > :nth-child(6), .stage-enter .rest-wrap > :nth-child(6),
.stage-enter .browse-wrap > :nth-child(6), .stage-enter .done-wrap > :nth-child(6) { animation-delay:200ms; }
.stage-enter .idle-wrap > :nth-child(7), .stage-enter .work-wrap > :nth-child(7), .stage-enter .rest-wrap > :nth-child(7),
.stage-enter .browse-wrap > :nth-child(7), .stage-enter .done-wrap > :nth-child(7) { animation-delay:240ms; }
@keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
.stage-ghost {
  position:absolute; inset:0; z-index:5; pointer-events:none;
  animation:ghostout 180ms ease forwards;
  display:flex; flex-direction:column; overflow:hidden;
  background:var(--g0);
}
@keyframes ghostout { to { opacity:0; transform:translate(var(--gx,0px),12px); } }

/* ============ COMMIT BAR ============ */
#commit {
  flex:0 0 auto;
  padding:8px 12px max(16px,env(safe-area-inset-bottom)) 12px;
  background:var(--g1);
  border-top:1px solid var(--hairline);
  box-shadow:inset 0 1px 0 var(--edge);
  position:relative; z-index:20;
}
#commit-btn {
  width:100%; height:66px;
  background:linear-gradient(180deg,#f2f2f2,#d7d7d7);
  border:none;
  border-radius:var(--r-lg);
  box-shadow:0 10px 26px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.65);
  font-family:var(--font-cond); font-weight:700; font-size:21px;
  letter-spacing:.18em; text-transform:uppercase;
  color:#0b0b0b;
  position:relative;
  transition:transform 160ms var(--spring), filter 120ms ease, background 120ms ease, color 120ms ease;
}
#commit-btn:active:not(:disabled) { transform:scale(.97); filter:brightness(.88); }
#commit-btn.inert {
  background:var(--g2); color:var(--txt3); letter-spacing:.14em; font-size:15px;
  border:1px solid var(--bd); box-shadow:none;
  pointer-events:none;
}
#commit-btn.go {
  background:linear-gradient(180deg,#ff4b40,#e02e24); color:#fff; border:none;
  box-shadow:0 10px 30px rgba(255,59,48,.3), inset 0 1px 0 rgba(255,255,255,.25);
  animation:goglow 1.2s ease-in-out infinite;
}
@keyframes goglow { 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.012);} }
#commit-btn.slash { background:var(--g2); color:var(--txt3); pointer-events:none; font-size:15px; border:1px solid var(--bd); box-shadow:none; }
#commit-btn.slash::before {
  content:''; position:absolute; left:10%; right:10%; top:50%;
  height:1px; background:var(--hairline);
  transform:rotate(-4deg);
}
#commit-btn.flash { animation:copyflash 120ms ease; }
@keyframes copyflash { 0%{ box-shadow:inset 0 0 0 2px var(--txt2);} 100%{ box-shadow:inset 0 1px 0 var(--edge);} }

/* ============ IDLE ============ */
.idle-wrap { padding:22px 16px 28px; display:flex; flex-direction:column; gap:14px; }
.day-hero {
  font-family:var(--font-cond); font-weight:700; font-size:56px; line-height:1;
  letter-spacing:.06em; text-transform:uppercase; color:var(--txt);
}
.day-hero .rule { display:block; height:1px; background:var(--hairline); margin-top:10px; transform-origin:left; animation:ruledraw 400ms var(--ease-out); }
@keyframes ruledraw { from { transform:scaleX(0);} to { transform:scaleX(1);} }
.day-sub { margin-top:-6px; }
.soft-banner {
  background:var(--red-wash); border:1px solid var(--red-wash-bd); border-radius:var(--r-md);
  color:var(--red); font-family:var(--font-cond); font-weight:700;
  font-size:12px; letter-spacing:.16em; text-transform:uppercase;
  padding:9px 12px;
}
/* IDLE baseline monitor — the trace is ALWAYS alive, even before START */
.idle-monitor {
  position:relative; height:74px; border-radius:var(--r-md);
  border:1px solid var(--bd); overflow:hidden;
  background:var(--scr);
}
.idle-monitor .idle-grid { position:absolute; inset:0; background-image:var(--graticule); background-size:18px 18px; opacity:.5; }
.idle-monitor .idle-trace { position:absolute; inset:0; }
.idle-monitor .idle-tag {
  position:absolute; left:9px; top:7px; z-index:2;
  font-family:var(--font-cond); font-weight:700; font-size:9px; letter-spacing:.18em;
  color:var(--txt3); text-transform:uppercase;
}
.idle-monitor .idle-bpm {
  position:absolute; right:9px; bottom:6px; z-index:2;
  font-family:var(--font-mono); font-size:10px; color:var(--red); letter-spacing:.04em;
}
.brief { padding:12px 14px; }
.brief .lbl { margin-bottom:6px; }
.brief-text { font-size:12px; line-height:1.55; color:var(--txt2); white-space:pre-wrap; }
.brief-text.clamped {
  display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;
}
.brief-more {
  min-height:44px; padding:0 4px; margin-top:2px;
  font-family:var(--font-cond); font-weight:700; font-size:11px; letter-spacing:.14em;
  color:var(--txt3); text-transform:uppercase;
}
.manifest { display:flex; flex-direction:column; }
.man-row {
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:11px 14px; border-bottom:1px solid var(--hairline);
  animation:rise 240ms var(--ease-out) backwards;
}
.man-row:last-child { border-bottom:none; }
.man-name {
  font-family:var(--font-cond); font-weight:600; font-size:16px; letter-spacing:.04em;
  text-transform:uppercase; color:var(--txt2);
  display:flex; align-items:center; gap:8px; min-width:0;
}
.man-name .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.man-spec {
  font-family:var(--font-mono); font-variant-numeric:tabular-nums;
  font-size:10.5px; color:var(--txt3); text-align:right;
  white-space:normal; max-width:55%; flex:0 0 auto;
}
.man-spec .man-drop {
  display:inline-block; padding:0 4px; margin-left:5px;
  border:1px solid var(--bd); border-radius:var(--r-sm); background:var(--g2);
  color:var(--txt2); white-space:nowrap;
}
.stop-chip {
  flex:0 0 auto;
  font-family:var(--font-cond); font-weight:700; font-size:9px; letter-spacing:.14em;
  color:var(--red); background:var(--red-wash); border:1px solid var(--red-wash-bd);
  border-radius:999px; padding:2px 7px;
}
.build-stamp { font-size:9px; color:var(--etch); text-align:center; letter-spacing:.1em; }

/* ============ WORK ============ */
.work-wrap { padding:14px 16px 12px; display:flex; flex-direction:column; gap:12px; flex:1 1 auto; min-height:0; }
.work-hero { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; justify-content:center; gap:12px; }
.ex-name {
  font-family:var(--font-cond); font-weight:700; font-size:30px; line-height:1.05;
  letter-spacing:.05em; text-transform:uppercase; color:var(--txt);
  min-height:32px;
}
.weight-stack { display:flex; align-items:baseline; gap:10px; min-height:100px; }
.weight-num {
  font-family:var(--font-mono); font-weight:700; font-size:96px; line-height:1;
  font-variant-numeric:tabular-nums lining-nums; letter-spacing:-.045em;
  color:var(--txt);
}
.weight-unit { font-family:var(--font-cond); font-weight:600; font-size:16px; letter-spacing:.18em; color:var(--txt3); }
.drop-tag {
  font-family:var(--font-mono); font-size:11px; color:var(--txt2);
  border:1px solid var(--bd); background:var(--ctl-grad); border-radius:var(--r-sm);
  padding:3px 7px; white-space:nowrap;
}
.sub-reg { display:flex; align-items:baseline; gap:10px; min-height:26px; }
.sub-reg .lbl { font-size:11px; }
.srv {
  font-family:var(--font-mono); font-weight:500; font-size:22px; line-height:1;
  font-variant-numeric:tabular-nums lining-nums; color:var(--txt2);
  margin-right:8px;
}
/* Unmissable STOP annunciator (injury-armed exercises) — alarm banner. */
.stop-plate {
  background:var(--red-wash); border:1px solid var(--red-wash-bd); border-radius:var(--r-md);
  color:var(--red);
  font-family:var(--font-cond); font-weight:700; font-size:13px;
  letter-spacing:.12em; text-transform:uppercase;
  padding:10px 12px 10px 30px; line-height:1.35;
  position:relative;
}
.stop-plate::before {
  content:''; position:absolute; left:11px; top:50%; width:9px; height:9px;
  margin-top:-4.5px; border-radius:50%; background:var(--red);
  box-shadow:0 0 8px var(--red);
  animation:alarmblink 900ms steps(1) infinite;
}
@keyframes alarmblink { 0%,49%{opacity:1;} 50%,100%{opacity:.15;} }
.advice { padding:12px 14px; display:flex; flex-direction:column; gap:6px; }
.advice-text { font-family:var(--font-mono); font-size:13.5px; line-height:1.5; color:var(--txt2); }
.advice-text.clamped { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.advice-more {
  align-self:flex-start; min-height:44px; min-width:44px; padding:0 4px;
  font-family:var(--font-cond); font-weight:700; font-size:11px; letter-spacing:.14em;
  color:var(--txt3); text-transform:uppercase;
}

/* ============ REST — THE MONITOR ============ */
.rest-wrap { padding:10px 16px 12px; display:flex; flex-direction:column; gap:11px; flex:1 1 auto; min-height:0; }
/* Logged → dock collapses to a slim receipt. On tall screens, center the shorter
   stack so the freed room reads as symmetric breathing space, never a bottom void.
   Gated by min-height so small viewports stay top-aligned + scrollable (no clip). */
@media (min-height:761px) { .rest-wrap:has(.receipt) { justify-content:center; } }

/* The oscilloscope screen — graticule grid + traveling red phosphor trace. */
.monitor-zoom { transition:transform 480ms var(--spring); will-change:transform; }
.monitor-zoom.roomy { transform:scaleY(1.06); }
.monitor {
  position:relative;
  flex:1 1 auto; min-height:150px;
  border-radius:var(--r-md);
  border:1px solid #1f1212;
  background:radial-gradient(120% 140% at 50% 0%, #0a0404 0%, var(--scr) 70%);
  overflow:hidden;
  box-shadow:inset 0 0 40px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,59,48,.04);
}
/* graticule — dark warm-gray grid (GREEN BANNED; trace is the only signal color) */
.mon-grid {
  position:absolute; inset:0;
  background-image:var(--graticule);
  background-size:24px 24px;
  opacity:.85;
}
.mon-grid.maj {
  background-image:linear-gradient(var(--grid-maj) 1px,transparent 1px),linear-gradient(90deg,var(--grid-maj) 1px,transparent 1px);
  background-size:96px 96px; opacity:.7;
}
/* SVG trace strip — wider than the screen; translateX driven by paintRestVisuals.
   Single transform = compositor-only. */
#trace-strip {
  position:absolute; top:0; bottom:0; left:0;
  width:300%;
  will-change:transform;
}
#trace-strip svg { width:100%; height:100%; display:block; }
.trace-ghost { stroke:var(--trace-dim); }
.trace-live  { stroke:var(--red); filter:drop-shadow(0 0 4px rgba(255,59,48,.7)); }
.monitor.t10 .trace-live { stroke:var(--red-hot); filter:drop-shadow(0 0 7px rgba(255,98,88,.95)); }
.monitor.flat .trace-live, .monitor.flat .trace-ghost { opacity:0; }
/* the sweep line + glowing head sit at a fixed x; trace scrolls under them */
#sweep {
  position:absolute; top:6%; bottom:6%; width:2px;
  background:linear-gradient(180deg,transparent,rgba(255,59,48,.55),transparent);
  left:72%; transform:translateX(-1px);
  box-shadow:0 0 10px rgba(255,59,48,.5);
}
#sweep-head {
  position:absolute; left:72%; width:9px; height:9px; border-radius:50%;
  margin-left:-4.5px; background:var(--red);
  box-shadow:0 0 14px 2px rgba(255,59,48,.85);
  will-change:transform; top:50%;
}
.monitor.t10 #sweep-head { background:var(--red-hot); box-shadow:0 0 18px 3px rgba(255,98,88,1); }
/* heartbeat pulse ring — period set via --beat-period, quickens with urgency */
#beat {
  position:absolute; left:72%; top:50%; width:14px; height:14px; margin:-7px 0 0 -7px;
  border-radius:50%; border:1.5px solid var(--red);
  opacity:0; pointer-events:none;
  animation:beatping var(--beat-period) ease-out infinite;
}
@keyframes beatping {
  0% { transform:scale(.5); opacity:.85; }
  70% { opacity:0; }
  100% { transform:scale(2.6); opacity:0; }
}
.monitor.flat #beat { animation:none; opacity:0; }
/* flatline strobe overlay at zero */
.monitor.flat { box-shadow:inset 0 0 60px rgba(255,59,48,.28), inset 0 0 0 2px rgba(255,59,48,.4); animation:flatstrobe 1.1s ease-in-out infinite; }
@keyframes flatstrobe { 0%,100%{ box-shadow:inset 0 0 60px rgba(255,59,48,.18), inset 0 0 0 2px rgba(255,59,48,.3);} 50%{ box-shadow:inset 0 0 80px rgba(255,59,48,.42), inset 0 0 0 2px rgba(255,59,48,.6);} }
.flat-bar { position:absolute; left:0; right:0; top:50%; height:2px; background:var(--red); opacity:0; box-shadow:0 0 10px var(--red); }
.monitor.flat .flat-bar { opacity:1; }
/* per-rep-tap visual ping on the trace (set-logging blip) */
.monitor.ping::after {
  content:''; position:absolute; left:72%; top:50%; width:20px; height:20px;
  margin:-10px 0 0 -10px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,98,88,.6) 0%, transparent 70%);
  animation:tapblip 360ms ease-out forwards; pointer-events:none;
}
@keyframes tapblip { from { transform:scale(.4); opacity:1; } to { transform:scale(2.2); opacity:0; } }

/* monitor corner readouts (secondary data — the TRACE is the primary read) */
.mon-corner {
  position:absolute; z-index:3; font-family:var(--font-mono);
  font-variant-numeric:tabular-nums lining-nums;
}
.mon-tl { left:10px; top:8px; }
.mon-tl .lbl { font-size:9px; letter-spacing:.16em; color:var(--txt3); }
.mon-tr { right:10px; top:8px; text-align:right; }
.mon-clock { font-size:21px; font-weight:700; color:var(--txt); letter-spacing:.02em; }
.monitor.t10 .mon-clock { color:var(--red); }
.mon-clock .colon { animation:colonfade 1s ease infinite; }
.mon-clock .ss { display:inline-block; animation:tickin 280ms var(--ease-out); }
@keyframes colonfade { 0%,100%{opacity:1;} 55%{opacity:.3;} }
@keyframes tickin { from { opacity:.3; transform:translateY(.09em); } to { opacity:1; transform:none; } }
.mon-tr .sub { font-size:8.5px; letter-spacing:.14em; color:var(--txt3); margin-top:1px; }
.mon-bl { left:10px; bottom:8px; }
.mon-bl .hr { font-size:23px; font-weight:700; color:var(--red); line-height:1; }
.monitor.t10 .mon-bl .hr { color:var(--red-hot); }
.mon-bl .hr-u { font-size:9px; letter-spacing:.14em; color:var(--txt3); margin-left:3px; }
.mon-br { right:10px; bottom:8px; text-align:right; font-size:9px; letter-spacing:.12em; color:var(--txt3); }
.mon-asys {
  position:absolute; inset:0; z-index:4; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-cond); font-weight:700; font-size:46px; letter-spacing:.08em;
  color:var(--red); text-transform:uppercase; opacity:0;
}
.monitor.flat .mon-asys { opacity:1; animation:gopulse 1.1s ease-in-out infinite; }
@keyframes gopulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }

/* bezel adjust controls (-15 / +30 / SKIP / PAUSE) */
.adjust-row { display:flex; gap:8px; min-height:48px; }
.adjust-row button {
  flex:1 1 0; min-height:48px;
  background:var(--ctl-grad); border:1px solid var(--bd); border-radius:var(--r-md);
  box-shadow:inset 0 1px 0 var(--edge);
  font-family:var(--font-mono); font-variant-numeric:tabular-nums;
  font-size:13px; color:var(--txt2); letter-spacing:.06em;
  transition:transform 160ms var(--spring), background 120ms ease;
}
.adjust-row button:active { transform:scale(.94); background:var(--g4); color:var(--txt); }

/* next-set advisor plate (rep band + HOLD/DROP token + trigger status) */
.plate { padding:12px 14px; display:flex; flex-direction:column; gap:6px; }
.plate-kicker { font-size:11px; }
.plate-line { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
.plate-band {
  font-family:var(--font-mono); font-weight:700; font-size:40px; line-height:1;
  font-variant-numeric:tabular-nums lining-nums; letter-spacing:-.02em;
  color:var(--txt); min-height:40px;
}
.plate-band .band-unit { font-family:var(--font-cond); font-weight:600; font-size:14px; letter-spacing:.16em; color:var(--txt3); }
.plate-token {
  font-family:var(--font-mono); font-weight:500; font-size:15px;
  font-variant-numeric:tabular-nums; color:var(--txt2);
  border:1px solid var(--bd); border-radius:var(--r-sm); background:var(--ctl-grad);
  padding:4px 9px; white-space:nowrap;
}
.plate-token.drop { color:var(--red); border-color:var(--red-wash-bd); background:var(--red-wash); }
.plate-status { font-family:var(--font-mono); font-size:12.5px; line-height:1.5; color:var(--txt2); }
.plate-status.alive { color:var(--red); }
.plate-status .rate-prompt { color:var(--etch); display:block; margin-top:3px; font-size:11px; letter-spacing:.06em; }
.flip-stamp {
  border:1px solid var(--red); border-radius:var(--r-md); background:var(--red-wash);
  color:var(--red);
  font-family:var(--font-cond); font-weight:700; font-size:14px; letter-spacing:.12em;
  text-transform:uppercase; text-align:center;
  padding:12px 10px;
  animation:stampdraw 300ms var(--ease-out);
}
.flip-stamp.soft { border-color:var(--hairline); background:var(--g2); color:var(--txt2); }
@keyframes stampdraw { from { opacity:0; transform:scale(.98);} to { opacity:1; transform:none;} }

/* ============ SET-LOGGING — TAP-TO-COUNT INPUT PANEL ============ */
.logpanel { padding:9px 11px; display:flex; flex-direction:column; gap:8px; animation:dockin 180ms var(--ease-out); }
@keyframes dockin { from { opacity:0; transform:translateY(6px);} to { opacity:1; transform:none;} }
.lp-head { display:flex; align-items:center; gap:8px; }
.lp-head .lbl { flex:1 1 auto; font-size:12px; color:var(--txt3); }
.lp-codekey {
  min-height:44px; padding:0 12px;
  background:var(--red-wash); border:1px solid var(--red-wash-bd); border-radius:var(--r-md);
  font-family:var(--font-cond); font-weight:700; font-size:11px; letter-spacing:.12em;
  color:var(--red); text-transform:uppercase;
  transition:transform 160ms var(--spring), background 120ms ease;
}
.lp-codekey:active { transform:scale(.94); background:#3a1311; }
.lp-notekey {
  min-height:44px; padding:0 12px;
  background:var(--ctl-grad); border:1px solid var(--bd); border-radius:var(--r-md);
  font-family:var(--font-cond); font-weight:700; font-size:11px; letter-spacing:.12em;
  color:var(--txt2); text-transform:uppercase;
  transition:transform 160ms var(--spring), background 120ms ease;
}
.lp-notekey:active { transform:scale(.94); background:var(--g4); }

/* the big tap field — tap to count a rep. Sweaty-thumb sized. */
.tapfield {
  position:relative; width:100%; min-height:120px;
  background:radial-gradient(120% 130% at 50% 0%, #0c0606 0%, #070404 75%);
  border:1px solid #1f1212; border-radius:var(--r-md);
  box-shadow:inset 0 2px 10px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,59,48,.05);
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
  touch-action:manipulation; -webkit-user-select:none; user-select:none;
}
.tapfield .tf-grid { position:absolute; inset:0; background-image:var(--graticule); background-size:20px 20px; opacity:.5; pointer-events:none; }
/* dashed SET-POINT reference line (advisor target) the count snaps toward */
.tf-setpoint {
  position:absolute; left:0; right:0; height:0; border-top:1.5px dashed var(--red-dim);
  pointer-events:none; transition:top 320ms var(--ease-out);
}
.tf-setpoint .sp-tag {
  position:absolute; right:8px; top:-8px;
  font-family:var(--font-mono); font-size:10px; color:var(--red-dim); letter-spacing:.06em;
  background:var(--scr); padding:0 4px;
}
.tf-count {
  position:relative; z-index:2;
  font-family:var(--font-mono); font-weight:700; font-size:84px; line-height:1;
  font-variant-numeric:tabular-nums lining-nums; letter-spacing:-.04em;
  color:var(--txt);
  transition:color 160ms ease;
}
.tf-count.at-target { color:var(--red); text-shadow:0 0 18px rgba(255,59,48,.5); }
.tf-count.punch { animation:reppunch 170ms var(--spring); }
@keyframes reppunch { 0%{transform:scale(1);} 45%{transform:scale(1.16);} 100%{transform:scale(1);} }
.tf-reps-lbl {
  position:absolute; left:12px; bottom:9px; z-index:2;
  font-family:var(--font-cond); font-weight:700; font-size:10px; letter-spacing:.16em;
  color:var(--txt3); text-transform:uppercase;
}
.tf-hint {
  position:absolute; left:50%; bottom:9px; transform:translateX(-50%); z-index:2;
  font-family:var(--font-cond); font-weight:700; font-size:9px; letter-spacing:.18em;
  color:var(--etch); text-transform:uppercase; white-space:nowrap;
}
/* -1 corner key (also long-press the field) */
.tf-minus {
  position:absolute; right:0; top:0; z-index:3;
  min-width:52px; min-height:52px;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-size:26px; color:var(--txt3);
  border-left:1px solid var(--bd); border-bottom:1px solid var(--bd);
  border-radius:0 var(--r-md) 0 var(--r-md);
  background:rgba(255,255,255,.02);
  transition:transform 120ms var(--spring), color 120ms ease, background 120ms ease;
}
.tf-minus:active { transform:scale(.9); color:var(--txt); background:var(--g4); }
/* monitor status line for the gate caption */
.lp-status {
  min-height:15px; text-align:center;
  font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; color:var(--txt3);
}
.lp-status.cleared { color:var(--red); }
.lp-status.shortfall { color:var(--red); }
/* difficulty soft-keys along the bezel (selected illuminates bright/white) */
.softkeys { display:flex; gap:8px; }
.softkey {
  flex:1 1 0; min-height:48px;
  background:var(--ctl-grad); border:1px solid var(--bd); border-radius:var(--r-md);
  box-shadow:inset 0 1px 0 var(--edge);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  transition:transform 160ms var(--spring), background 120ms ease;
}
.softkey b { font-family:var(--font-mono); font-weight:700; font-size:18px; line-height:1; color:var(--txt2); }
.softkey i { font-style:normal; font-family:var(--font-cond); font-weight:700; font-size:8.5px; letter-spacing:.13em; color:var(--txt3); }
.softkey:active { transform:scale(.92); }
.softkey.sel { background:linear-gradient(180deg,#f4f4f4,#dcdcdc); border-color:transparent; animation:selpop 260ms var(--ease-out); box-shadow:0 6px 18px rgba(0,0,0,.45), 0 0 14px rgba(255,255,255,.12); }
.softkey.sel b, .softkey.sel i { color:var(--g0); }
@keyframes selpop { 0%{transform:scale(.92);} 60%{transform:scale(1.06);} 100%{transform:scale(1);} }

/* collapsed receipt — a thin monitor "logged" readout row */
.receipt {
  width:100%; min-height:50px;
  background:var(--panel-grad); border:1px solid var(--bd); border-radius:var(--r-md);
  box-shadow:var(--elev);
  font-family:var(--font-mono); font-variant-numeric:tabular-nums;
  font-size:15px; color:var(--txt2); letter-spacing:.04em;
  display:flex; align-items:center; justify-content:center; gap:10px;
  animation:receiptin 360ms var(--ease-out);
}
@keyframes receiptin { 0%{opacity:0; transform:translateY(12px) scale(.96);} 60%{transform:translateY(-2px) scale(1.012);} 100%{opacity:1; transform:none;} }
.receipt .rdot { width:7px; height:7px; border-radius:50%; background:var(--red); box-shadow:0 0 6px var(--red); flex:0 0 auto; }
.receipt .pencil { color:var(--txt3); font-size:13px; }

/* browse */
.browse-bar { display:flex; align-items:center; justify-content:center; gap:8px; min-height:44px; }
.mini-clock {
  font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-weight:700;
  font-size:15px; color:var(--txt2);
  border:1px solid var(--bd); background:var(--ctl-grad); border-radius:999px;
  padding:6px 14px; min-height:36px; display:inline-flex; align-items:center; gap:6px;
}
.mini-clock::before { content:''; width:6px; height:6px; border-radius:50%; background:var(--red); box-shadow:0 0 6px var(--red); animation:beatping 1100ms ease-out infinite; }
.mini-clock.t10 { color:var(--red); }
.pill {
  min-height:44px; padding:0 16px;
  border-radius:999px; border:1px solid var(--bd); background:var(--ctl-grad);
  font-family:var(--font-cond); font-weight:700; font-size:11px; letter-spacing:.14em;
  color:var(--txt2); text-transform:uppercase;
  transition:transform 160ms var(--spring), background 120ms ease;
}
.pill:active { transform:scale(.94); background:var(--g4); }
.pill.live { color:var(--red); border-color:var(--red-wash-bd); background:var(--red-wash); }
.browse-wrap { padding:10px 16px; display:flex; flex-direction:column; gap:10px; flex:1 1 auto; min-height:0; }
.browse-ctx { display:flex; flex-direction:column; gap:2px; }
.browse-ctx .ex-name { font-size:24px; min-height:26px; }
.browse-ctx .meta { font-family:var(--font-mono); font-size:12px; color:var(--txt3); font-variant-numeric:tabular-nums; }

/* ============ DONE ============ */
.done-wrap { padding:22px 16px 30px; display:flex; flex-direction:column; gap:14px; }
.done-hero {
  font-family:var(--font-mono); font-weight:700; font-size:80px; line-height:1;
  font-variant-numeric:tabular-nums lining-nums; letter-spacing:-.04em;
  color:var(--txt); text-align:center;
}
.done-sub { text-align:center; font-size:11px; }
.done-block { padding:12px 14px; display:flex; flex-direction:column; gap:7px; }
.done-block .lbl { margin-bottom:2px; }
.trig-row { display:flex; gap:10px; font-family:var(--font-mono); font-size:12.5px; font-variant-numeric:tabular-nums; color:var(--txt2); }
.trig-row .ab { color:var(--txt3); flex:0 0 36px; }
.trig-row.flipped, .trig-row.flipped .ab { color:var(--red); }
.soft-note { font-size:10.5px; color:var(--etch); }
.done-ex {
  display:flex; flex-direction:column; gap:3px;
  padding:11px 14px; border-bottom:1px solid var(--hairline);
  animation:rise 240ms var(--ease-out) backwards;
}
.done-ex:last-child { border-bottom:none; }
.done-ex .top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.done-ex .nm { font-family:var(--font-cond); font-weight:600; font-size:16px; letter-spacing:.04em; text-transform:uppercase; color:var(--txt2); }
.done-ex .tm { font-family:var(--font-mono); font-size:10.5px; color:var(--txt3); font-variant-numeric:tabular-nums; white-space:nowrap; }
.done-ex .wt { font-family:var(--font-mono); font-size:10.5px; color:var(--txt3); }
.done-ex .sets { font-family:var(--font-mono); font-size:13px; color:var(--txt); font-variant-numeric:tabular-nums; line-height:1.6; }
.done-rests { text-align:center; font-family:var(--font-mono); font-size:11px; color:var(--txt3); }

/* ============ SHEETS / TOAST ============ */
#sheet-backdrop {
  position:absolute; inset:0; background:rgba(0,0,0,.7); z-index:100;
  animation:fadein 180ms ease;
}
@keyframes fadein { from{opacity:0;} to{opacity:1;} }
#sheet {
  position:absolute; left:0; right:0; bottom:0; z-index:110;
  background:linear-gradient(180deg,#161616,#0f0f0f); border-top:1px solid var(--bd);
  border-radius:22px 22px 0 0;
  box-shadow:0 -18px 50px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
  max-height:72%; display:flex; flex-direction:column;
  padding:14px 16px max(16px,env(safe-area-inset-bottom)) 16px;
  animation:sheetup 300ms var(--spring);
}
@keyframes sheetup { from { transform:translateY(24px); opacity:0; } to { transform:none; opacity:1; } }
#sheet-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
#sheet-title { font-family:var(--font-cond); font-weight:700; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:#7e7e7e; }
#sheet-x { min-height:44px; min-width:44px; font-family:var(--font-cond); font-weight:700; font-size:11px; letter-spacing:.14em; color:var(--txt3); }
#sheet-body { overflow-y:auto; -webkit-overflow-scrolling:touch; min-height:0; }
.sheet-note-text { font-size:12.5px; color:var(--txt2); line-height:1.55; white-space:pre-wrap; margin-bottom:10px; }
.sheet-sec { margin-bottom:12px; }
.sheet-sec .lbl { margin-bottom:4px; }
.note-input {
  width:100%; min-height:48px; padding:10px 12px;
  background:#0a0a0a; border:1px solid var(--bd); border-radius:var(--r-md);
  font-family:var(--font-mono); font-size:16px; color:var(--txt);
  outline:none; caret-color:var(--txt2);
  -webkit-user-select:auto; user-select:auto;
}
.note-input:focus { border-color:var(--g4); }
.note-input::placeholder { color:var(--etch); }
.sheet-row {
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:12px 0; border-bottom:1px solid var(--hairline); min-height:56px;
}
.sheet-row:last-child { border-bottom:none; }
.sheet-row .t { font-family:var(--font-cond); font-weight:600; font-size:15px; letter-spacing:.05em; text-transform:uppercase; color:var(--txt2); }
.sheet-row .s { font-size:10px; color:var(--txt3); margin-top:1px; font-family:var(--font-mono); }
.tgl {
  width:52px; height:30px; border-radius:15px; background:var(--g3);
  border:1px solid var(--hairline); position:relative; flex:0 0 auto;
  transition:background 140ms ease;
}
.tgl::before { content:''; position:absolute; inset:-8px; }
.tgl .knob {
  position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%;
  background:var(--txt3); transition:left 140ms ease, background 140ms ease;
}
.tgl.on { background:var(--g4); }
.tgl.on .knob { left:25px; background:var(--txt); }
.sheet-btn {
  width:100%; min-height:52px; margin-top:8px;
  background:var(--ctl-grad); border:1px solid var(--bd); border-radius:var(--r-md);
  font-family:var(--font-cond); font-weight:700; font-size:13px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--txt2);
  transition:transform 160ms var(--spring), background 120ms ease;
}
.sheet-btn:active:not(:disabled) { transform:scale(.98); background:var(--g4); }
.sheet-btn:disabled { opacity:.32; }
.order-row { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--hairline); }
.order-row:last-child { border-bottom:none; }
.order-row .onm { flex:1 1 auto; font-family:var(--font-cond); font-weight:600; font-size:15px; letter-spacing:.04em; text-transform:uppercase; color:var(--txt2); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.order-row .oab { flex:0 0 36px; font-family:var(--font-mono); font-size:11px; color:var(--txt3); }
.order-btn {
  flex:0 0 56px; min-height:56px;
  background:var(--ctl-grad); border:1px solid var(--bd); border-radius:var(--r-md);
  font-size:18px; color:var(--txt2);
  transition:transform 160ms var(--spring), background 120ms ease;
}
.order-btn:active:not(:disabled) { transform:scale(.94); background:var(--g4); }
.order-btn:disabled { opacity:.25; }
#toast {
  position:absolute; left:50%; bottom:120px; transform:translateX(-50%);
  background:var(--ctl-grad); border:1px solid var(--bd); border-radius:999px;
  box-shadow:0 10px 30px rgba(0,0,0,.55);
  font-family:var(--font-mono); font-size:11.5px; color:var(--txt2);
  padding:9px 14px; white-space:nowrap;
  opacity:0; pointer-events:none; z-index:130;
  transition:opacity 300ms ease;
}
#toast.show { opacity:1; }

/* ============ COMPACT VIEWPORTS ============ */
@media (max-height:760px) {
  .monitor { min-height:118px; }
  .monitor-zoom.roomy { transform:scaleY(1.04); }
  .mon-clock { font-size:18px; }
  .mon-asys { font-size:38px; }
  .weight-num { font-size:72px; }
  .weight-stack { min-height:76px; }
  .work-wrap, .rest-wrap, .browse-wrap { gap:7px; padding-top:8px; }
  .plate { padding:9px 12px; gap:4px; }
  .plate-band { font-size:32px; min-height:32px; }
  .logpanel { padding:8px 10px; gap:7px; }
  .tapfield { min-height:96px; }
  .tf-count { font-size:66px; }
  .softkey { min-height:44px; }
  .adjust-row { min-height:44px; }
  .adjust-row button { min-height:44px; }
  .day-hero { font-size:44px; }
  .done-hero { font-size:64px; }
}

/* ============ REDUCED MOTION ============ */
@media (prefers-reduced-motion:reduce) {
  *, *::before, *::after { animation-duration:120ms !important; transition-duration:120ms !important; }
  #wash { display:none; }
  /* freeze the heartbeat loop + trace travel to a static read */
  #beat, .monitor.flat, .mini-clock::before, .stop-plate::before { animation:none !important; }
  #beat { opacity:0; }
  .monitor-zoom { transition:none; }
  #trace-strip { transition:none; }
  .mon-clock .colon, .mon-clock .ss, .mon-asys { animation:none; }
  .pip.work, #commit-btn.go { animation:none; }
  .tf-count.punch { animation:none; }

// Dock prefill = the advisor's predicted band-high for the set when computable, else
// the rep-range top.
function prefillRepsFor(exIdx, setIdx) {
  const ex = workout[exIdx];
  if (!ex) return 10;
  if (setIdx > 0) {
    const prevLogs = gradedPrevLogs(exIdx, setIdx);
    if (prevLogs && prevLogs.length === setIdx) {
      const s = dynamicRepAdviceStruct(setIdx, prevLogs, ex);
      if (s && s.band) return Math.max(0, Math.min(40, s.band[1]));
    }
  }
  return Math.max(0, Math.min(40, getMaxReps(ex.reps)));
}
// START is ONE gesture: audio recovery + unlock + keepalive happen in the commit
// handler; this adds the wake lock and the session start + cue chain.
function startSession() {

}
function startWorkout() {
  workoutStartTime = Date.now();

  saveState();
  const startClip = dayType.toLowerCase().includes('upper') ? 'start-upper' : 'start-lower';
  const firstExClip = exerciseClipName(workout[0] && workout[0].name);
  const seq = [startClip, firstExClip].filter(Boolean);
  const _dcStart = dailyClipFor(0, 0);
  if (_dcStart) {
    // The daily hype line states the weight + target itself.
    seq.push(_dcStart);
  } else if (workout[0]) {
    seq.push(...weightClipsFor(workout[0]));
    const repClip = repRangeClipFor(workout[0].reps);

}
function setDone() {

    const dt = (Date.now() - lastSetStartAt) / 1000;
    if (dt >= 5 && dt <= 900) observedSetTimes.push(dt);
    lastSetStartAt = null;
  }
  const finishedExercise = currentExercise;
  const finishedSet = currentSet;
  const prefill = prefillRepsFor(finishedExercise, finishedSet);
  captureLog();
  // Dedup: re-logging an already-logged (exercise,set) — the ↓SET redo flow — UPDATES
  // that log, never pushes a second one. find()-based reads mean a duplicate would
  // silently shadow the correction. Existing reps/note/difficulty are kept (they were
  // live-edited into the log); only the timestamp refreshes.
  let logEntry = setLogs.find(l => l.exercise === finishedExercise && l.set === finishedSet);
  if (logEntry) {
    logEntry.timestamp = Date.now();
  } else {
    logEntry = {
      exercise: finishedExercise,
      set: finishedSet,
      reps: prefill,
      note: '',
      difficulty: null,
      timestamp: Date.now()
    };
    setLogs.push(logEntry);
  }
  currentLogEntry = logEntry;
  dockCollapsed = false;
  flipStampExName = null;
  restAdjustedThisRest = false;
  logExerciseIndex = finishedExercise;
  // Evaluated on every log write; the graded-gate inside means the optimistic prefill
  // alone can never latch a flip.
  evaluateTriggerFlip(finishedExercise);

  currentSet++;
  const isLastSet = finishedExercise >= workout.length - 1 && currentSet >= workout[finishedExercise].sets;
  if (isLastSet) {
    // Stay pinned on the final set: viewing == working, the dock binds to the last log.
    currentSet = workout[finishedExercise].sets - 1;
    viewingExercise = currentExercise;
    viewingSet = currentSet;
    state = 'finishing';
    recomputeEst();
    render();
    VoiceCue.playSequence(['received', 'final-set-logged']);
    saveState();
    return;
  }
  const switchingExercise = currentSet >= workout[currentExercise].sets;
  if (switchingExercise) {
    currentExercise++;
    currentSet = 0;
  }
  viewingExercise = currentExercise;
  viewingSet = currentSet;
  state = 'resting';
  restKind = switchingExercise ? 'inter' : 'intra'; // inter-exercise = hard-coded 60s UP NEXT
  restRemaining = switchingExercise ? 60 : workout[finishedExercise].rest;
  restTotalSeconds = restRemaining;
  restEndTime = Date.now() + restRemaining * 1000;
  countdownFiredThresholds = new Set();
  lastPaintedSec = null;
  startCountdown();
  recomputeEst();
  render();
  // Voice: "Received" then branch (exercise switch vs normal in-exercise rest).
  {
    let seq;
    if (switchingExercise) {
      const isFinalExercise = (currentExercise === workout.length - 1);
      const exClip = exerciseClipName(workout[currentExercise].name);
      seq = ['received', 'exercise-complete'];
      seq.push(isFinalExercise ? 'final-exercise' : 'up-next');
      if (exClip) seq.push(exClip);
      // Weight + rep range for the upcoming exercise — skipped when a set-1 daily clip
      // exists for it (the daily line states the weight/target itself; otherwise the
      // weight double-announces).
      if (!dailyClipFor(currentExercise, 0)) {
        seq.push(...weightClipsFor(workout[currentExercise]));
        const repClipSwitch = repRangeClipFor(workout[currentExercise].reps);
        if (repClipSwitch) seq.push(repClipSwitch);
      }
      const switchRestClip = restClipForDuration(restRemaining);
      if (switchRestClip) seq.push(switchRestClip);
    } else {
      const restClip = restClipForDuration(workout[finishedExercise].rest);
      seq = restClip ? ['received', restClip] : ['received'];
    }
    VoiceCue.playSequence(seq);
  }

  requestAnimationFrame(() => {
    initAudio();
    requestWakeLock();
    saveState();
  });
}

    // floor; applySnapshot's expired-rest branch re-anchors restEndTime from it.

function pauseRest() {

  restRemaining = Math.max(0, (restEndTime - Date.now()) / 1000);

function resumeRest() {

  // it (verified 60s → 0s wipe), adjustRest mutations were discarded by the late
  // overwrite, and a background return could see an "expired" rest and fire restDone
  // with a minute left. Anchoring here makes every reader of restEndTime correct.

// path that does — pause/resume deliberately do not).
function adjustRest(deltaSec) {

    if (!restEndTime) return;
    restEndTime = Math.max(Date.now(), restEndTime + deltaSec * 1000);
    renormalizeCountdownThresholds();
    if (deltaSec > 0 && !restAdjustedThisRest) { extendedRests++; restAdjustedThisRest = true; }
    paintRestVisuals(Math.max(0, (restEndTime - Date.now()) / 1000));
    saveState();
  } else if (state === 'paused') {
    restRemaining = Math.max(0, restRemaining + deltaSec);
    countdownFiredThresholds = new Set(COUNTDOWN_THRESHOLDS.filter(t => t > Math.ceil(restRemaining)));
    if (deltaSec > 0 && !restAdjustedThisRest) { extendedRests++; restAdjustedThisRest = true; }
    paintRestVisuals(restRemaining);
    saveState();
  }
}

function handleRailTap(target) {

  if (!tile || tile.dataset.ex == null) return false;
  const exIdx = Number(tile.dataset.ex);
  if (!Number.isFinite(exIdx) || !workout[exIdx]) return false;
  if (exIdx === viewingExercise) {

  let hdr = '| Exercise | Weight |';
  let sep = '|---|---|';
  for (let j = 1; j <= maxSets; j++) { hdr += ' S' + j + ' |'; sep += '---|'; }
  hdr += ' Time |'; sep += '---|';
  text += hdr + '\n' + sep + '\n';
  const firstExIdx = firstPerformedExercise();
  workout.forEach((ex, i) => {
    let row = '| ' + ex.name + ' | ' + ex.weight + ' |';
    const drop = structuralDrop(ex);
    for (let j = 0; j < maxSets; j++) {
      if (j >= ex.sets) { row += ' — |'; continue; }       // set doesn't exist
      const log = findLog(i, j);
      if (!log) { row += ' ? |'; continue; }               // exists but unlogged
      let c = String(log.reps);                            // 0 stays plain on stops
      if (log.difficulty) c += ' [' + DIFFICULTY_LABELS[log.difficulty] + ']';
      if (drop && drop.setIdx === j) c += ' @' + drop.w;   // structural-drop set
      row += ' ' + c + ' |';
    }
    const dur = exerciseDurationForSummary(i, firstExIdx);
    row += ' ' + (dur && dur > 0 ? formatDurCompact(dur) : '—') + ' |';
    text += row + '\n';
  });
  const trigBits = [];
  let anySoftStar = false;
  workout.forEach((ex, i) => {
    const oc = triggerOutcome(i);
    if (!oc) return;
    const ab = abbrevFor(ex.name);
    if (oc.st === 'flipped') {
      trigBits.push(ab + ' CLEARED → ' + (ex.triggerWeight || '') + (softDay ? '*' : ''));
      if (softDay) anySoftStar = true;
    } else if (oc.st === 'out') {
      trigBits.push(ab + ' OUT S' + (oc.setIdx + 1) + ' (' + oc.reps + '<' + oc.req + ')');
    } else {
      trigBits.push(ab + ' —');
    }
  });
  if (trigBits.length) text += 'Triggers: ' + trigBits.join(' · ') + '\n';
  if (anySoftStar) text += '*' + SOFT_NOTE + '\n';
  const noteLines = [];
  workout.forEach((ex, i) => {
    for (let j = 0; j < ex.sets; j++) {
      const log = findLog(i, j);
      if (log && log.note) noteLines.push(ex.name + ' S' + (j + 1) + ': ' + log.reps + ' — ' + log.note);
    }
  });
  if (noteLines.length === 1) text += 'Notes: ' + noteLines[0] + '\n';
  else if (noteLines.length > 1) text += 'Notes:\n' + noteLines.join('\n') + '\n';
  if (skippedRests || extendedRests) {
    const bits = [];
    if (skippedRests) bits.push(skippedRests + ' skipped');
    if (extendedRests) bits.push(extendedRests + ' extended');
    text += 'Rests: ' + bits.join(' · ') + '\n';
  }
  // Clipboard payload is ASCII-only (Windows-paste safe — the summary lands in
  // tracker.md / daily logs). On-screen DONE typography keeps its glyphs; only the
  // copied text is sanitized: — → --, → → ->, · → |, ✓ dropped, – → -.
  return text
    .replace(/✓\s*/g, '')
    .replace(/—/g, '--')
    .replace(/–/g, '-')
    .replace(/→/g, '->')
    .replace(/·/g, '|');
}
function legacyCopy(t) {
  try {
    const ta = document.createElement('textarea');
    ta.value = t;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    // body is user-select:none globally; the copy shim needs selection back.
    ta.style.webkitUserSelect = 'text';
    ta.style.userSelect = 'text';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) { return false; }
}
function copySummary() {
  const text = buildSummary();
  const after = () => {
    elCommit.classList.remove('flash');
    void elCommit.offsetWidth;
    elCommit.classList.add('flash');
    elCommit.textContent = 'COPIED';
    setTimeout(() => { if (state === 'finished') elCommit.textContent = 'COPY SUMMARY'; }, 2000);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(after, () => { legacyCopy(text); after(); });
  } else {
    legacyCopy(text);
    after();
  }
}

// ============ INPUT HANDLERS ============
elCommit.addEventListener('click', () => {
  recoverAudioCtx();
  VoiceCue.unlock();
  // 'finished' guard: COPY SUMMARY lands here — must not resurrect the keepalive
  // that finishWorkout just stopped (battery burn on the done screen).
  if (state !== 'finished') startAudioKeepalive();
  if (state !== 'finished' && isBrowsing()) return;
  if (state === 'pre-start') startSession();
  else if (state === 'ready') setDone();
  else if (state === 'alert') acknowledgeAlert();
  else if (state === 'finishing') finishWorkout();
  else if (state === 'finished') copySummary();
});
// Tap-to-count long-press: a held press on the tap field decrements (forgiving −1),
// matching the −1 corner. Guarded so it never fights the click-to-increment: when a
// long-press fires it sets _tapHeld; the next click on the field is swallowed once.
let _tapPressTimer = null;
let _tapHeld = false;
function decActiveRep() {
  const log = getActiveLogForEdit();
  if (!log) return;
  log.reps = Math.max(0, Math.min(40, (Number(log.reps) || 0) - 1));
  evaluateTriggerFlip(log.exercise);
  refreshSetNote();
  saveState();
}
function incActiveRep() {
  const log = getActiveLogForEdit();
  if (!log) return;
  log.reps = Math.max(0, Math.min(40, (Number(log.reps) || 0) + 1));
  evaluateTriggerFlip(log.exercise);
  pingTrace();
  const tc = byId('tf-count');
  if (tc) { tc.classList.remove('punch'); void tc.offsetWidth; tc.classList.add('punch'); }
  refreshSetNote();
  saveState();
}
elStageInner.addEventListener('pointerdown', (e) => {
  const tf = e.target.closest ? e.target.closest('#tapfield') : null;
  if (!tf) return;
  // Don't arm the long-press when the press starts on the −1 corner (its own handler).
  if (e.target.closest && e.target.closest('.tf-minus')) return;
  _tapHeld = false;
  if (_tapPressTimer) clearTimeout(_tapPressTimer);
  _tapPressTimer = setTimeout(() => {
    _tapPressTimer = null;
    _tapHeld = true;
    decActiveRep();
  }, 480);
});
function _clearTapPress() {
  if (_tapPressTimer) { clearTimeout(_tapPressTimer); _tapPressTimer = null; }
}
elStageInner.addEventListener('pointerup', _clearTapPress);
elStageInner.addEventListener('pointercancel', () => { _clearTapPress(); _tapHeld = false; });
elStageInner.addEventListener('pointermove', (e) => {
  // Cancel the long-press if the finger drifts (treat as a scroll, not a hold).
  if (_tapPressTimer && (Math.abs(e.movementX) > 4 || Math.abs(e.movementY) > 4)) _clearTapPress();
});

document.addEventListener('click', (e) => {
  const el = e.target.closest ? e.target.closest('[data-action],[data-diff]') : null;
  if (!el || el.disabled) return;
  // Difficulty soft-keys (numeric 1-5 scale; UI exposes 2-5, EASY=1 stays legacy-only).
  if (el.dataset.diff != null) {
    const log = getActiveLogForEdit();
    if (!log) return;
    const diff = Number(el.dataset.diff);
    if (!diff) return;
    log.difficulty = (log.difficulty === diff) ? null : diff; // re-tap clears the grade
    evaluateTriggerFlip(log.exercise);
    if (log.difficulty != null && !isBrowsing()) dockCollapsed = true; // collapse to receipt
    const dz = byId('dock-zone');
    if (dz) dz.innerHTML = dockZoneHTML();
    const zm = byId('monitor-zoom');
    if (zm) zm.classList.toggle('roomy', dockCollapsed && !isBrowsing() && log.difficulty != null);
    refreshSetNote();
    saveState();
    return;
  }
  const action = el.dataset.action;
  if (!action) return;
  switch (action) {
    case 'undo': undoStep(); break;
    case 'redo': closeSheet(); redoStep(); break;
    case 'gear': openGearSheet(); break;
    case 'sheet-close': closeSheet(); break;
    case 'order-open': openOrderSheet(); break;
    case 'order-up': {
      const i = Number(el.dataset.idx);
      reorderExercise(i, i - 1);
      if (sheetKind === 'order') elSheetBody.innerHTML = orderSheetBodyHTML();
      break;
    }
    case 'order-down': {
      const i = Number(el.dataset.idx);
      reorderExercise(i, i + 1);
      if (sheetKind === 'order') elSheetBody.innerHTML = orderSheetBodyHTML();
      break;
    }
    case 'toggle-autostart':
      settings.autoStart = !settings.autoStart;
      saveSettings();
      if (sheetKind === 'gear') elSheetBody.innerHTML = gearSheetBodyHTML();
      break;
    case 'toggle-voice':
      settings.voice = !settings.voice;
      if (!settings.voice) VoiceCue.cancel();
      saveSettings();
      if (sheetKind === 'gear') elSheetBody.innerHTML = gearSheetBodyHTML();
      break;
    case 'reset': resetWorkout(); break;
    case 'brief-expand': {
      const bt = byId('brief-text');
      const bm = byId('brief-more');
      if (bt) {
        bt.classList.toggle('clamped');
        if (bm) bm.textContent = bt.classList.contains('clamped') ? 'EXPAND' : 'COLLAPSE';
      }
      break;
    }
    case 'more-advice': openAdviceSheet(); break;
    case 'note-open': openNoteSheet(); break;
    // TAP-TO-COUNT: a tap on the big field = +1 rep (mirrors the donor's rep-plus path).
    // _tapHeld swallows the click synthesized after a long-press decrement.
    case 'rep-tap': {
      if (_tapHeld) { _tapHeld = false; break; }
      incActiveRep();
      break;
    }
    case 'rep-minus': {
      const log = getActiveLogForEdit();
      if (!log) return;
      log.reps = Math.max(0, Math.min(40, (Number(log.reps) || 0) - 1));
      evaluateTriggerFlip(log.exercise);
      refreshSetNote();
      saveState();
      break;
    }
    case 'rep-zero': {
      const log = getActiveLogForEdit();
      if (!log) return;
      log.reps = 0; // difficulty deliberately stays null — injury abort
      evaluateTriggerFlip(log.exercise);
      refreshSetNote();
      saveState();
      break;
    }
    case 'receipt-expand': {
      dockCollapsed = false;
      const dz = byId('dock-zone');
      if (dz) dz.innerHTML = dockZoneHTML();
      const zm = byId('monitor-zoom');
      if (zm) zm.classList.remove('roomy');
      saveState(); // dockCollapsed is persisted state — a reload must not re-collapse
      break;
    }
    case 'set-current': setCurrentFromView(); break;
    case 'return-live': returnToWorking(); break;
    case 'adj-minus': adjustRest(-15); break;
    case 'adj-plus': adjustRest(30); break;
    case 'adj-skip': skipRest(); break;
    case 'adj-pause':
      if (state === 'resting') pauseRest();
      else if (state === 'paused') resumeRest();
      break;
  }
});
// The ONLY text input lives in the note sheet; every keystroke writes the active log.
elSheetBody.addEventListener('input', (e) => {
  if (e.target && e.target.id === 'note-input') {
    const log = getActiveLogForEdit();
    if (log) {
      log.note = e.target.value;
      saveState();
    }
  }
});
elSheetBackdrop.addEventListener('click', closeSheet);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && sheetKind) closeSheet();
});

// Rail tap shim: RAW touch events (≤15px slop, ≤700ms tap, 500ms long-press → ORDER
// sheet, 500ms synthetic-click swallow, contextmenu prevented). Click fallback for
// desktop mouse.
let railTapInfo = null;
let railLongPressTimer = null;
let lastRailTouchTap = 0;
elRail.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) { railTapInfo = null; return; }
  const t = e.touches[0];
  railTapInfo = { x: t.clientX, y: t.clientY, time: Date.now(), target: e.target };
  if (railLongPressTimer) clearTimeout(railLongPressTimer);
  railLongPressTimer = setTimeout(() => {
    railLongPressTimer = null;
    if (railTapInfo) {
      railTapInfo = null;
      lastRailTouchTap = Date.now(); // swallow the synthetic click after the long-press
      if (state !== 'finished') openOrderSheet();
    }
  }, 500);
}, { passive: true });
elRail.addEventListener('touchmove', (e) => {
  if (!railTapInfo) return;
  const t = e.touches[0];
  if (!t) return;
  if (Math.abs(t.clientX - railTapInfo.x) > 15 || Math.abs(t.clientY - railTapInfo.y) > 15) {
    railTapInfo = null;
    if (railLongPressTimer) { clearTimeout(railLongPressTimer); railLongPressTimer = null; }
  }
}, { passive: true });
elRail.addEventListener('touchend', (e) => {
  if (railLongPressTimer) { clearTimeout(railLongPressTimer); railLongPressTimer = null; }
  if (!railTapInfo) return;
  const info = railTapInfo;
  railTapInfo = null;
  if (Date.now() - info.time > 700) return;
  if (e.changedTouches && e.changedTouches[0]) {
    const t = e.changedTouches[0];
    if (Math.abs(t.clientX - info.x) > 15 || Math.abs(t.clientY - info.y) > 15) return;
  }
  if (handleRailTap(info.target)) {
    lastRailTouchTap = Date.now();
    try { e.preventDefault(); } catch (err) {}
  }
}, { passive: false });
elRail.addEventListener('touchcancel', () => {
  railTapInfo = null;
  if (railLongPressTimer) { clearTimeout(railLongPressTimer); railLongPressTimer = null; }
}, { passive: true });
elRail.addEventListener('click', (e) => {
  if (Date.now() - lastRailTouchTap < 500) return;
  handleRailTap(e.target);
});
elRail.addEventListener('contextmenu', (e) => e.preventDefault());

// ============ BACKGROUND RETURN ============
// Shared handler for tab-return + BFCache restore (iOS back/forward swipe closes
// AudioContexts). Audio recovery runs FIRST — before any path that fires audio.
function handleResumeFromBackground() {
  recoverAudioCtx();
  if (state === 'resting' && restEndTime) {
    const remaining = Math.ceil((restEndTime - Date.now()) / 1000);
    if (remaining <= 0) {
      // Clear the interval BEFORE restDone — the visibility handler and the 100ms
      // tick used to double-fire it (restDone's state guard is the second net).
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      restDone();
    } else {
      restRemaining = remaining;
      // Threshold catch-up: every threshold already passed while backgrounded is
      // pre-marked so nothing announces late and stale.
      renormalizeCountdownThresholds();
      paintRestVisuals(Math.max(0, (restEndTime - Date.now()) / 1000));
      startAudioKeepalive();
    }
  }
  // Wake lock re-acquire for ALL active states INCLUDING 'ready'.
  if (isActiveState() && !wakeLock) requestWakeLock();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  handleResumeFromBackground();
});
window.addEventListener('pageshow', (e) => {
  if (e.persisted) handleResumeFromBackground();
});

// ============ INIT ============
// URL reset (?reset=1) wipes saved workout state, then strips itself. The undo stack
// is deliberately NOT named `history` — window.history must stay reachable here.
if (new URLSearchParams(location.search).has('reset')) {
  try { localStorage.removeItem('gtpls-state'); } catch (e) {}
  try { window.history.replaceState(null, '', location.pathname); } catch (e) {}
}
VoiceCue.init();
attachGlobalAudioRecovery();
if (!restoreState()) {
  // Fresh load (no saved state, or TTL expired): IDLE. The START tap unlocks audio,
  // requests the wake lock, records workoutStartTime, and plays the opening chain.
  state = 'pre-start';
  render();
}
// 1Hz header elapsed register (textContent only).
setInterval(() => {
  if (workoutStartTime && state !== 'finished' && state !== 'pre-start') renderHeader();
}, 1000);
</script>
