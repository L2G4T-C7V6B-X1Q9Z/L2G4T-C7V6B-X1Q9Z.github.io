  function getJulianDate(date) {
    const y = date.getUTCFullYear();
    const m = date.getUTCMonth() + 1;
    const d = date.getUTCDate();
    const h = date.getUTCHours() + date.getUTCMinutes() / 60 + date.getUTCSeconds() / 3600;
    let Y = y, M = m;
    if (M <= 2) { Y -= 1; M += 12; }
    const A = Math.floor(Y / 100);
    const B = 2 - A + Math.floor(A / 4);
    return Math.floor(365.25 * (Y + 4716)) + Math.floor(30.6001 * (M + 1)) + d + h / 24.0 + B - 1524.5;
  }

  function getGMST(date) {
    const JD = getJulianDate(date);
    const T = (JD - 2451545.0) / 36525.0;
    let gmstDeg = 280.46061837 + 360.98564736629 * (JD - 2451545.0) + 0.000387933 * T * T - (T * T * T) / 38710000.0;
    gmstDeg = ((gmstDeg % 360) + 360) % 360;
    return gmstDeg / 15.0;
  }

  function getLST(date) {
    const gmst = getGMST(date);
    let lst = gmst + observer.lon / 15.0;
    return ((lst % 24) + 24) % 24;
  }

  function raDecToAltAz(ra, dec, date) {
    const now = date || new Date();
    const lst = getLST(now);
    let ha = (lst - ra) * 15.0;
    ha = ((ha % 360) + 360) % 360;
    const haRad = degToRad(ha);
    const decRad = degToRad(dec);
    const latRad = degToRad(observer.lat);
    const sinAlt = Math.sin(decRad) * Math.sin(latRad) + Math.cos(decRad) * Math.cos(latRad) * Math.cos(haRad);
    const alt = radToDeg(Math.asin(Math.max(-1, Math.min(1, sinAlt))));
    const cosAz = (Math.sin(decRad) - Math.sin(degToRad(alt)) * Math.sin(latRad)) / (Math.cos(degToRad(alt)) * Math.cos(latRad));
    let az = radToDeg(Math.acos(Math.max(-1, Math.min(1, cosAz))));
    if (Math.sin(haRad) > 0) az = 360 - az;
    return { alt, az };
  }

  function project(alt, az) {
    if (alt < -2) return null;
    if (!canvas) return null;
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const maxR = Math.min(cx, cy) * 0.92;
    const clampedAlt = Math.max(0, alt);
    const r = maxR * (1 - clampedAlt / 90);
    const azRad = degToRad(az);
    return { x: cx + r * Math.sin(azRad), y: cy - r * Math.cos(azRad) };
  }

  function initTwinkle() {
    twinklePhases = new Float32Array(stars.length);
    for (let i = 0; i < stars.length; i++) twinklePhases[i] = Math.random() * Math.PI * 2;
  }

  function magToRadius(mag) {
    const r = 3.5 * Math.pow(10, -0.15 * (mag + 1.46));
    return Math.max(0.4, Math.min(4.0, r));
  }

  function magToBrightness(mag) {
    const b = 1.0 - (mag + 1.5) / 8.0;
    return Math.max(0.25, Math.min(1.0, b));
  }

  // Pre-render star glow sprites at init time.
  // Creates one sprite per (color, sizeBucket) combo on an offscreen canvas.
  // Key format: "r,g,b|sizeBucket"
  function initStarSprites() {
    // 3 color categories
    const colors = [
      [255, 240, 220], // bright (mag < 1.0)
      [245, 245, 255], // mid (mag < 2.5)
      [200, 210, 240], // dim
    ];
    // Size buckets: the distinct glow radii we'll use (radius * 3 for glow)
    const sizeBuckets = [5, 7, 9, 11, 13];
    for (const [r, g, b] of colors) {
      for (const glowR of sizeBuckets) {
        const key = `${r},${g},${b}|${glowR}`;
        const size = glowR * 2 + 2;
        const osc = document.createElement('canvas');
        osc.width = size;
        osc.height = size;
        const octx = osc.getContext('2d');
        const cx = size / 2;
        const grad = octx.createRadialGradient(cx, cx, 0, cx, cx, glowR);
        grad.addColorStop(0, `rgba(${r},${g},${b},0.5)`);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        octx.fillStyle = grad;
        octx.beginPath();
        octx.arc(cx, cx, glowR, 0, Math.PI * 2);
        octx.fill();
        starSprites[key] = osc;
      }
    }
  }

  function getGlowBucket(radius) {
    const glowR = radius * 3;
    // Snap to nearest bucket: 5, 7, 9, 11, 13
    if (glowR <= 6) return 5;
    if (glowR <= 8) return 7;
    if (glowR <= 10) return 9;
    if (glowR <= 12) return 11;
    return 13;
  }

  function updateStarPositionCache() {
    const date = new Date();
    const now = date.getTime();
    if (starPosCache && (now - starPosCache.timestamp) < STAR_POS_CACHE_MS) return;
    const positions = new Array(stars.length);
    for (let i = 0; i < stars.length; i++) {
      positions[i] = raDecToAltAz(stars[i].ra, stars[i].dec, date);
    }
    starPosCache = { positions, timestamp: now };
  }

  function renderStars(now) {
    if (!WeatherUI.settings.showStars) return;
    if (!twinklePhases) initTwinkle();
    if (!starSprites['255,240,220|5']) initStarSprites();

    updateStarPositionCache();

    const time = now / 1000;
    const positions = starPosCache.positions;
    const showLabels = WeatherUI.settings.showLabels;

    for (let i = 0; i < stars.length; i++) {
      const pos = positions[i];
      if (pos.alt < 0) continue;
      const screen = project(pos.alt, pos.az);
      if (!screen) continue;

      const s = stars[i];
      const phase = twinklePhases[i];
      const twinkle = 0.7 + 0.3 * Math.sin(time * (1.2 + (i % 7) * 0.3) + phase);
      const brightness = magToBrightness(s.mag) * twinkle;
      const radius = magToRadius(s.mag);

      let r, g, b;
      if (s.mag < 1.0) { r = 255; g = 240; b = 220; }
      else if (s.mag < 2.5) { r = 245; g = 245; b = 255; }
      else { r = 200; g = 210; b = 240; }

      // Draw glow using pre-rendered sprite instead of per-frame gradient
      if (radius > 1.5) {
        const bucket = getGlowBucket(radius);
        const key = `${r},${g},${b}|${bucket}`;
        const sprite = starSprites[key];
        if (sprite) {
          const halfW = sprite.width / 2;
          ctx.globalAlpha = brightness;
          ctx.drawImage(sprite, screen.x - halfW, screen.y - halfW);
          ctx.globalAlpha = 1.0;
        }
      }

      // Draw star core dot
      ctx.fillStyle = `rgba(${r},${g},${b},${brightness})`;
      ctx.beginPath();
      ctx.arc(screen.x, screen.y, radius, 0, Math.PI * 2);
      ctx.fill();

      // Star name labels
      if (s.name && showLabels && s.mag < 1.5) {
        ctx.font = '10px monospace';
        ctx.fillStyle = `rgba(${r},${g},${b},${brightness * 0.5})`;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(s.name, screen.x + radius + 4, screen.y);
      }
    }
  }

  function renderFrame() {
    if (WeatherUI.settings.paused) {
      animFrameId = setTimeout(renderFrame, FRAME_INTERVAL);
      return;
    }
    const timestamp = performance.now();
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Subtle sky gradient (dark blue near horizon)
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const maxR = Math.min(cx, cy) * 0.92;
    const skyGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR);
    skyGrad.addColorStop(0, 'rgba(0, 0, 10, 0)');
    skyGrad.addColorStop(0.85, 'rgba(5, 8, 25, 0.3)');
    skyGrad.addColorStop(1, 'rgba(10, 15, 35, 0.5)');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Horizon circle
    ctx.strokeStyle = 'rgba(60,60,80,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, maxR, 0, Math.PI * 2);
    ctx.stroke();

    renderStars(timestamp);

    for (const layer of renderLayers) {
      try { layer.fn(ctx, timestamp); } catch (e) { console.warn(`Layer "${layer.name}" error:`, e); }
    }
    animFrameId = setTimeout(renderFrame, FRAME_INTERVAL);
  }

  function handleResize() {
    if (!canvas) return;
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  return {
    init(canvasEl) {
      canvas = canvasEl;
      ctx = canvas.getContext('2d');
      handleResize();
      window.addEventListener('resize', handleResize);
      animFrameId = setTimeout(renderFrame, 0);
    },
    project,
    getObserver() { return { lat: observer.lat, lon: observer.lon }; },
    setObserver(lat, lon) { observer.lat = lat; observer.lon = lon; starPosCache = null; },
    getSiderealTime(date) { return getLST(date || new Date()); },
    raDecToAltAz(ra, dec, date) { return raDecToAltAz(ra, dec, date || new Date()); },
    addRenderLayer(name, fn) {
      const idx = renderLayers.findIndex(l => l.name === name);
      if (idx >= 0) renderLayers.splice(idx, 1);
      renderLayers.push({ name, fn });
    },
    get canvas() { return canvas; },

const Aircraft = (function () {

      altAzDirty = false;
    }
    if (now - lastFetchTime >= POLL_INTERVAL) { lastFetchTime = now; fetchAircraft(obs).catch(() => {}); }
    for (const [icao, ac] of tracked) if (now - ac.lastSeen > STALE_TIMEOUT) tracked.delete(icao);
  }

  return { render, update, getStats() { let v = 0; for (const [, ac] of tracked) if (ac.alt > 0) v++; return { count: tracked.size, visible: v }; } };
})();


// ============================================================
// MODULE 6: WEATHER & UI OVERLAY
// ============================================================
const WeatherUI = (() => {
  let weatherData = null, locationName = null, lastFetchTime = 0, settingsOpen = false, keyboardInit = false;
  const FETCH_INTERVAL = 5 * 60 * 1000;
  const WMO = { 0: { d: 'Clear', i: '\u2600' }, 1: { d: 'Mostly Clear', i: '\u26C5' }, 2: { d: 'Partly Cloudy', i: '\u26C5' }, 3: { d: 'Overcast', i: '\u2601' }, 45: { d: 'Foggy', i: '\uD83C\uDF2B' }, 51: { d: 'Drizzle', i: '\uD83C\uDF27' }, 61: { d: 'Rain', i: '\uD83C\uDF27' }, 71: { d: 'Snow', i: '\u2744' }, 80: { d: 'Showers', i: '\uD83C\uDF26' }, 95: { d: 'Thunderstorm', i: '\u26C8' } };
  function getWMO(code) { if (WMO[code]) return WMO[code]; if (code <= 3) return WMO[2]; if (code <= 48) return WMO[45]; if (code <= 55) return WMO[51]; if (code <= 65) return WMO[61]; if (code <= 75) return WMO[71]; if (code <= 82) return WMO[80]; if (code <= 99) return WMO[95]; return { d: 'Unknown', i: '?' }; }

  const settings = { showStars: true, showConstellations: true, showSatellites: true, showAircraft: true, showPlanets: true, showLabels: true, showTrails: true, paused: false };

  let geoDetected = false;
  function autoDetect(engine) {
    if (geoDetected || !navigator.geolocation) return;
    geoDetected = true;
    navigator.geolocation.getCurrentPosition(p => {
      engine.setObserver(p.coords.latitude, p.coords.longitude);
      locationName = null; lastFetchTime = 0; weatherData = null;
      fetchW(p.coords.latitude, p.coords.longitude);
      fetchLoc(p.coords.latitude, p.coords.longitude);
    }, () => {}, { enableHighAccuracy: false, timeout: 10000 });
  }

  async function fetchW(lat, lon) {
    if (Date.now() - lastFetchTime < FETCH_INTERVAL && weatherData) return;
    lastFetchTime = Date.now();
    try {
      const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=relativehumidity_2m&timezone=auto`);
      if (!r.ok) return;
      const d = await r.json(), cw = d.current_weather;
      let hum = null;
      if (d.hourly && d.hourly.time) { const ch = new Date().toISOString().slice(0, 13); const idx = d.hourly.time.findIndex(t => t.startsWith(ch)); if (idx >= 0) hum = d.hourly.relativehumidity_2m[idx]; }
      weatherData = { temp_c: cw.temperature, temp_f: Math.round(cw.temperature * 9 / 5 + 32), wind: cw.windspeed, winddir: cw.winddirection, code: cw.weathercode, humidity: hum };
    } catch {}
  }

  async function fetchLoc(lat, lon) {
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&zoom=10`, { headers: { 'User-Agent': 'SkyViewApp/1.0' } });
      if (!r.ok) return;
      const d = await r.json();
      if (d.address) { locationName = d.address.city || d.address.town || d.address.village || d.address.county || null; if (locationName && d.address.state) locationName += ', ' + d.address.state; }
    } catch { locationName = null; }
  }

  function windDir(deg) { const d = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW']; return d[Math.round(deg / 22.5) % 16]; }
  function fmtTime(d) { return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true }); }
  function fmtUTC(d) { return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: 'UTC' }) + ' UTC'; }
  function fmtDate(d) { return d.toLocaleDateString('en-US', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' }); }
  function txt(ctx, sz, a) { ctx.font = `${sz}px monospace`; ctx.fillStyle = `rgba(200,200,200,${a||0.7})`; ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 0; ctx.shadowOffsetX = 1; ctx.shadowOffsetY = 1; ctx.textBaseline = 'top'; }

  let fetchTimerStarted = false;
  function startFetchTimers(engine) {
    if (fetchTimerStarted) return;
    fetchTimerStarted = true;
    const doFetch = () => { const obs = engine.getObserver(); fetchW(obs.lat, obs.lon); if (!locationName) fetchLoc(obs.lat, obs.lon); };
    doFetch();
    setInterval(doFetch, FETCH_INTERVAL);
  }

  function render(ctx, engine, planetInfo, satStats, acStats) {
    const w = ctx.canvas.width, h = ctx.canvas.height, pad = 16, lh = 18, now = new Date();
    const obs = engine.getObserver();
    ctx.save();

    // TOP-LEFT: Location & Time
    let y = pad;
    txt(ctx, 14, 0.8); ctx.textAlign = 'left';
    ctx.fillText(locationName || `${obs.lat.toFixed(2)}\u00B0, ${obs.lon.toFixed(2)}\u00B0`, pad, y); y += lh;
    txt(ctx, 13, 0.6); ctx.fillText(fmtDate(now), pad, y); y += lh;
    txt(ctx, 14, 0.7); ctx.fillText(fmtTime(now), pad, y); y += lh;
    txt(ctx, 11, 0.5); ctx.fillText(fmtUTC(now), pad, y);

    // TOP-RIGHT: Weather
    if (weatherData) {
      ctx.textAlign = 'right'; let wy = pad;
      const info = getWMO(weatherData.code);
      txt(ctx, 16, 0.8); ctx.fillText(`${weatherData.temp_f}\u00B0F / ${weatherData.temp_c}\u00B0C`, w - pad, wy); wy += lh + 2;
      txt(ctx, 14, 0.7); ctx.fillText(`${info.i}  ${info.d}`, w - pad, wy); wy += lh;
      txt(ctx, 13, 0.6); ctx.fillText(`Wind: ${weatherData.wind} km/h ${windDir(weatherData.winddir)}`, w - pad, wy); wy += lh;
      if (weatherData.humidity != null) ctx.fillText(`Humidity: ${weatherData.humidity}%`, w - pad, wy);
    }

    // BOTTOM-LEFT: Sun/Moon
    if (planetInfo) {
      ctx.textAlign = 'left'; let by = h - pad - lh * 3;
      txt(ctx, 13, 0.6);
      if (planetInfo.sunrise && planetInfo.sunset) { ctx.fillText(`\u2600 Rise ${planetInfo.sunrise}  Set ${planetInfo.sunset}`, pad, by); by += lh; }
      if (planetInfo.moonPhaseName) { ctx.fillText(`\uD83C\uDF19 ${planetInfo.moonPhaseName} (${Math.round(planetInfo.moonIllumination * 100)}%)`, pad, by); by += lh; }
      if (planetInfo.dayState) { txt(ctx, 12, 0.5); ctx.fillText(planetInfo.dayState, pad, by); }
    }

    // BOTTOM-CENTER: Compass
    const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
    const compassY = h - 12, centerX = w / 2, spread = Math.min(w * 0.35, 300);
    ctx.strokeStyle = 'rgba(200,200,200,0.15)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(centerX - spread - 40, compassY); ctx.lineTo(centerX + spread + 40, compassY); ctx.stroke();
    for (let i = 0; i < dirs.length; i++) {
      const t = (i / dirs.length) * 2 - 1, px = centerX + t * spread, isCard = i % 2 === 0;
      txt(ctx, isCard ? 13 : 10, isCard ? 0.6 : 0.35); ctx.textAlign = 'center'; ctx.fillText(dirs[i], px, compassY - 16);
      ctx.strokeStyle = `rgba(200,200,200,${isCard ? 0.4 : 0.2})`; ctx.beginPath(); ctx.moveTo(px, compassY); ctx.lineTo(px, compassY - (isCard ? 6 : 4)); ctx.stroke();
    }

    // BOTTOM-RIGHT: Legend
    ctx.textAlign = 'right'; let ly = h - pad - lh * 4;
    txt(ctx, 12, 0.5); ctx.fillText('\u2605 Star   \u25C6 Satellite   \u2708 Aircraft   \u25CF Planet', w - pad, ly); ly += lh;
    txt(ctx, 13, 0.6); ctx.fillText(`${satStats || 0} satellites   ${acStats || 0} aircraft visible`, w - pad, ly); ly += lh + 4;
    txt(ctx, 11, 0.4); ctx.fillText('Press S for settings', w - pad, ly);

    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
    ctx.restore();

    // Settings panel
    if (settingsOpen) renderSettingsPanel(ctx);
  }

  function renderSettingsPanel(ctx) {
    const w = ctx.canvas.width, h = ctx.canvas.height;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, w, h);
    const pw = 420, ph = 380, px = (w - pw) / 2, py = (h - ph) / 2;
    ctx.fillStyle = 'rgba(30,30,40,0.95)'; ctx.strokeStyle = 'rgba(200,200,200,0.2)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 8); ctx.fill(); ctx.stroke();
    let ty = py + 20;
    txt(ctx, 16, 0.9); ctx.textAlign = 'center'; ctx.fillText('SETTINGS', px + pw / 2, ty); ty += 30;
    const toggles = [['1','Stars','showStars'],['2','Constellations','showConstellations'],['3','Satellites','showSatellites'],['4','Aircraft','showAircraft'],['5','Planets','showPlanets'],['6','Labels','showLabels'],['7','Trails','showTrails']];
    ctx.textAlign = 'left';
    for (const [k, label, prop] of toggles) {
      const on = settings[prop];
      txt(ctx, 14, on ? 0.8 : 0.4);
      ctx.fillText(`  ${k}   ${on ? '[\u2713]' : '[ ]'}  ${label}`, px + 30, ty);
      ty += 28;
    }
    ty += 10;
    txt(ctx, 13, 0.6); ctx.fillText(`  Space  ${settings.paused ? '[PAUSED]' : '[RUNNING]'}`, px + 30, ty); ty += 28;
    ctx.fillText('  F      Toggle fullscreen', px + 30, ty); ty += 28;
    txt(ctx, 12, 0.4); ctx.fillText(`  Location: ${locationName || 'Detecting...'}`, px + 30, ty); ty += 34;
    txt(ctx, 12, 0.4); ctx.textAlign = 'center'; ctx.fillText('Press S to close', px + pw / 2, ty);
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
    ctx.restore();
  }

  function initKeyboard(engine) {
    if (keyboardInit) return;
    keyboardInit = true;
    autoDetect(engine);
    const props = ['showStars','showConstellations','showSatellites','showAircraft','showPlanets','showLabels','showTrails'];
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      const k = e.key;
      if (k.toLowerCase() === 's') { settingsOpen = !settingsOpen; e.preventDefault(); }
      else if (k.toLowerCase() === 'f') { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen().catch(() => {}); e.preventDefault(); }
      else if (k === ' ') { settings.paused = !settings.paused; e.preventDefault(); }
      else if (k >= '1' && k <= '7') { settings[props[parseInt(k) - 1]] = !settings[props[parseInt(k) - 1]]; e.preventDefault(); }
    });
  }

  return { settings, render, initKeyboard, startFetchTimers };
})();


// ============================================================
// MAIN: WIRE EVERYTHING TOGETHER
// ============================================================
(function main() {
  const canvas = document.getElementById('sky');
  SkyEngine.init(canvas);
  WeatherUI.initKeyboard(SkyEngine);
  WeatherUI.startFetchTimers(SkyEngine);

  // Register render layers
  SkyEngine.addRenderLayer('constellations', (ctx) => {
    Constellations.render(ctx, SkyEngine);
  });

  SkyEngine.addRenderLayer('satellites', (ctx) => {
    Satellites.render(ctx, SkyEngine);
  });

  SkyEngine.addRenderLayer('planets', (ctx) => {
    Planets.render(ctx, SkyEngine);
  });

  SkyEngine.addRenderLayer('aircraft', (ctx) => {
    Aircraft.render(ctx, SkyEngine);
  });

  // Cache planet info (sun/moon) - recalculate every 60s instead of every frame
  let cachedPlanetInfo = null;
  let planetInfoLastCalc = 0;
  const PLANET_INFO_INTERVAL = 60000;

  function updatePlanetInfoCache() {
    const sunInfo = Planets.getSunInfo(SkyEngine);
    const moonInfo = Planets.getMoonInfo(SkyEngine);
    cachedPlanetInfo = {
      sunrise: sunInfo.rise ? sunInfo.rise.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true }) : null,
      sunset: sunInfo.set ? sunInfo.set.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true }) : null,
      moonPhaseName: moonInfo.phaseName,
      moonIllumination: moonInfo.illumination,
      dayState: sunInfo.altitude > 0 ? 'Daytime' : sunInfo.altitude > -6 ? 'Civil Twilight' : sunInfo.altitude > -12 ? 'Nautical Twilight' : sunInfo.altitude > -18 ? 'Astronomical Twilight' : 'Night',
    };
    planetInfoLastCalc = Date.now();
  }

  SkyEngine.addRenderLayer('ui', (ctx) => {
    // Refresh cached planet info every 60s
    if (!cachedPlanetInfo || Date.now() - planetInfoLastCalc > PLANET_INFO_INTERVAL) {
      updatePlanetInfoCache();
    }

    const satCount = Satellites.getVisibleCount();
    const acStats = Aircraft.getStats();

    WeatherUI.render(ctx, SkyEngine, cachedPlanetInfo, satCount, acStats.visible);
  });

  // Periodic updates for satellites and aircraft
  let lastSatUpdate = 0;
  setInterval(() => {
    Satellites.update(SkyEngine);
  }, 2000);

  setInterval(() => {
    Aircraft.update(SkyEngine.getObserver());
  }, 5000);

  // Initial updates
  Satellites.update(SkyEngine);
  Aircraft.update(SkyEngine.getObserver());
})();
</script>
