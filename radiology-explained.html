<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Protected</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0a0a0c; --fg:#e8e8ea; --dim:#6b6b73; --line:#22222a; --accent:#e5484d;
  }
  html,body{height:100%}
  body{
    font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    background:var(--bg); color:var(--fg);
    display:flex; align-items:center; justify-content:center;
    min-height:100dvh;
    padding:max(1.5rem,env(safe-area-inset-top)) 1.5rem max(1.5rem,env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    overflow:hidden;
  }
  /* One cheap compositor-only ambient gradient. No backdrop-filter anywhere on
     this page - it is the single biggest cause of sub-30fps on iOS Safari. */
  .glow{
    position:fixed; inset:-30%; pointer-events:none; z-index:0;
    background:
      radial-gradient(38% 32% at 22% 18%, rgba(229,72,77,.16), transparent 70%),
      radial-gradient(34% 30% at 80% 84%, rgba(120,120,190,.10), transparent 70%);
    animation:drift 24s ease-in-out infinite alternate;
    will-change:transform;
  }
  @keyframes drift{ from{transform:translate3d(-2%,-1%,0) scale(1)} to{transform:translate3d(2%,1%,0) scale(1.06)} }
  .box{position:relative; z-index:1; width:100%; max-width:22rem; text-align:center}
  .lock{
    width:34px;height:34px;margin:0 auto 1.35rem;display:block;
    stroke:var(--dim); stroke-width:1.5; fill:none;
    stroke-linecap:round; stroke-linejoin:round;
  }
  h1{
    font-size:.8125rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
    color:var(--dim); margin-bottom:1.5rem;
  }
  .field{position:relative}
  input{
    width:100%; padding:.875rem 1rem; font:inherit; font-size:1rem;
    color:var(--fg); background:#121218;
    border:1px solid var(--line); border-radius:12px; outline:none;
    transition:border-color .18s ease, box-shadow .18s ease;
    -webkit-appearance:none; appearance:none;
  }
  input::placeholder{color:#4a4a52}
  input:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(229,72,77,.13)}
  input:disabled{opacity:.55}
  .msg{font-size:.8125rem; color:var(--dim); margin-top:.9rem; min-height:1.3em; transition:color .18s}
  .msg.bad{color:var(--accent)}
  .shake{animation:shake .32s cubic-bezier(.36,.07,.19,.97)}
  @keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}
    30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
  .spin{display:inline-block;width:11px;height:11px;margin-right:.5rem;vertical-align:-1px;
    border:1.5px solid var(--line); border-top-color:var(--dim); border-radius:50%;
    animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){ .glow,.shake,.spin{animation:none} }
</style>
</head>
<body>
<div class="glow"></div>
<main class="box">
  <svg class="lock" viewBox="0 0 24 24" aria-hidden="true">
    <rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/>
    <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
  </svg>
  <h1>Protected</h1>
  <div class="field">
    <!-- Page passphrase, not a site login: a saved credential must never be offered here.
         The login-style autocomplete hint used until 2026-08-19 made Chrome and every password
         manager prefill an unrelated saved password, which reads as a broken gate. Turning
         autocomplete off alone is widely ignored by managers, hence the vendor opt-outs, the
         non-login field name, and the readonly-until-focus trick in the script below. -->
    <input id="pw" type="password" placeholder="Passphrase" autocomplete="off"
           name="page-passphrase" data-lpignore="true" data-1p-ignore data-bwignore
           data-form-type="other" readonly
           autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
  </div>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
</main>

  var pw=document.getElementById('pw'), msg=document.getElementById('msg'), box=document.querySelector('.box');

  // Anti-autofill: drop readonly on first interaction, and wipe anything a manager
  // injected before that. Without this the field arrives prefilled with an unrelated
  // saved password and the user cannot tell the gate from a bug.
  function armField(){ if(pw.hasAttribute('readonly')){ pw.removeAttribute('readonly'); } }
  ['focus','pointerdown','touchstart','keydown'].forEach(function(ev){
    pw.addEventListener(ev, armField, {once:false});
  });
  setTimeout(function(){ if(!pw.value) return; if(document.activeElement!==pw) pw.value=''; }, 60);
  setTimeout(function(){ armField(); pw.focus(); }, 120);

  function hb(h){var b=new Uint8Array(h.length/2);for(var i=0;i<h.length;i+=2)b[i/2]=parseInt(h.substr(i,2),16);return b;}
  function bb(s){var x=atob(s),b=new Uint8Array(x.length);for(var i=0;i<x.length;i++)b[i]=x.charCodeAt(i);return b;}

  async function open_(pass){
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:hb(SALT),iterations:600000,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);
    var ct=bb(DATA), tag=hb(TAG), all=new Uint8Array(ct.length+tag.length);
    all.set(ct); all.set(tag,ct.length);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:hb(IV)},key,all);
    return new TextDecoder().decode(plain);
  }

  function paint(html){ document.open(); document.write(html); document.close(); }

  function attempt(pass, remember){
    msg.className='msg'; msg.innerHTML='<span class="spin"></span>Deriving key…'; pw.disabled=true;
    // Yield a frame so the spinner paints before PBKDF2 blocks the thread.
    requestAnimationFrame(function(){ setTimeout(function(){
      open_(pass).then(function(html){
        if(remember){ try{ sessionStorage.setItem(SK,pass); }catch(e){} }
        paint(html);
      }).catch(function(){
        try{ sessionStorage.removeItem(SK); }catch(e){}
        pw.disabled=false; pw.value=''; pw.focus();
        msg.className='msg bad'; msg.textContent='Incorrect passphrase';
        box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
      });
    },0); });
  }

  var saved=null; try{ saved=sessionStorage.getItem(SK); }catch(e){}
  if(saved){ attempt(saved,false); }

  pw.addEventListener('keydown',function(e){ if(e.key==='Enter'&&pw.value) attempt(pw.value,true); });
