<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0908">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Gym Timer — SOLARI</title>
<!-- The ONLY external resource — loaded NON-BLOCKING (media=print, flipped to all on
     load) so a stalled/captive gym connection can never hang first paint. display=optional
     means the fonts apply only when ready immediately (HTTP cache after first visit) and
     never swap in mid-session — no live-countdown re-metric. The tuned fallback stacks
     below keep the app fully usable and deliberately styled if this never loads.
     DDIN Condensed-style board face via Oswald (the split-flap departure-board look);
     JetBrains Mono backs the few true tabular registers. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=optional" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* ============ TOKENS — SOLARI departure board ============ */
:root {
  --g0:#0a0908;            /* canvas — warm charcoal, the board's dead space */
  --g1:#121110;            /* panel */
  --g2:#1b1917;            /* module */
  --g3:#262320;            /* control face */
  --g4:#332f2b;            /* pressed / filled */
  --hairline:#2a2724;
  --edge:rgba(255,250,242,.05);
  --txt:#ece7df;           /* warm bone-white */
  --txt2:#a39c90;          /* warm gray */
  --txt3:#6f6960;          /* dim warm gray */
  --etch:#56514a;
  --red:#ff3b30;
  --red-dim:rgba(255,59,48,.32);
  --red-wash:#2a0f0d;
  --red-wash-bd:#5c1714;
  /* Split-flap tile faces — charcoal with warm-gray characters, NEVER amber. */
  --flap-top:#23201d;      /* upper-half face */
  --flap-bot:#1a1815;      /* lower-half face (slightly darker — light falls off) */
  --flap-char:#d8d2c7;     /* the printed character */
  --flap-char-dim:#8d877d;
  --flap-seam:#0a0908;     /* the mechanical seam line across the tile middle */
  --flap-edge:rgba(255,250,242,.06);
  --flap-shadow:rgba(0,0,0,.55);
  --font-cond:"Oswald","Arial Narrow",Arial,system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease-out:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.34,1.45,.4,1);
  --flap-ease:cubic-bezier(.36,.05,.31,1); /* the mechanical drop — fast in, hard stop */
  --r-lg:14px;
  --r-md:10px;
  --r-sm:6px;
  --bd:rgba(255,250,242,.07);
  --panel-grad:linear-gradient(180deg,#1a1816,#100f0d);
  --ctl-grad:linear-gradient(180deg,#262320,#1a1815);
  --elev:0 12px 32px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,250,242,.05);
}
/* ============ BASE ============ */
* { margin:0; padding:0; box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
html, body { height:100%; background:var(--g0); overscroll-behavior:none; }
body {
  font-family:var(--font-cond);
  font-size:13.5px; line-height:1.5;
  color:var(--txt);
  -webkit-tap-highlight-color:transparent;
  overflow:hidden;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  touch-action:manipulation;
}
::selection { background:var(--g4); color:var(--txt); }
button {
  font:inherit; color:inherit; background:none; border:none; cursor:pointer;
  touch-action:manipulation;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
button:disabled { cursor:default; }
:focus { outline:none; }
:focus-visible { outline:1px solid var(--txt2); outline-offset:2px; }
.num, .mono { font-family:var(--font-mono); font-variant-numeric:tabular-nums lining-nums; }
.lbl {
  font-family:var(--font-cond); font-weight:600; font-size:11px;
  letter-spacing:.22em; text-transform:uppercase;
  color:#8a8275;
}
.mod {
  background:var(--panel-grad);
  border:1px solid var(--bd);
  border-radius:var(--r-lg);
  box-shadow:var(--elev);
}
.hidden { display:none !important; }

/* ============ APP FRAME ============ */
#app {
  position:fixed; inset:0;
  height:100vh; height:100dvh;
  background:var(--g0);
  display:flex; flex-direction:column;
  overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);
}
@media (min-width:500px) {
  #app {
    left:50%; right:auto; transform:translateX(-50%);
    width:430px;
    border-left:1px solid var(--hairline);
    border-right:1px solid var(--hairline);
  }
}
#wash {
  position:absolute; inset:0; background:var(--red);
  opacity:0; pointer-events:none; z-index:90;
}
#wash.washing { animation:washout 280ms ease-out forwards; }
@keyframes washout { 0%{opacity:.82;} 100%{opacity:0;} }

/* ============ HEADER (56px) — board header rail ============ */
#hdr {
  height:56px; flex:0 0 56px;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 12px 0 14px;
  border-bottom:1px solid var(--hairline);
  background:var(--g1);
  box-shadow:inset 0 1px 0 var(--edge);
  position:relative; z-index:20;
}
#hdr-left { font-family:var(--font-cond); font-weight:600; font-size:13px; letter-spacing:.2em; color:#8a8275; text-transform:uppercase; white-space:nowrap; }
#hdr-left .day { color:var(--txt2); }
#hdr-right { display:flex; align-items:center; gap:2px; }
#hdr-reg {
  font-family:var(--font-mono); font-variant-numeric:tabular-nums lining-nums;
  font-size:10px; color:var(--txt3); letter-spacing:.02em; white-space:nowrap;
  margin-right:6px;
}
.pip-status { width:5px; height:5px; border-radius:50%; margin:0 3px; flex:0 0 auto; background:var(--g4); }
#pip-wake.held { background:var(--txt3); }
#pip-wake.lost { background:transparent; border:1px solid var(--red); }
#pip-save { background:transparent; }
#pip-save.fail { background:var(--red-dim); border:1px solid var(--red-wash-bd); }
#undo-btn, #gear-btn {
  min-width:44px; min-height:44px;
  display:flex; align-items:center; justify-content:center;
  color:var(--txt3);
}
#undo-btn { font-family:var(--font-cond); font-weight:600; font-size:10px; letter-spacing:.18em; }
#undo-btn:disabled { opacity:.28; }
#undo-btn:active:not(:disabled), #gear-btn:active { color:var(--txt2); transform:scale(.96); }
#gear-btn svg { width:18px; height:18px; display:block; }

/* ============ RAIL (64px) — track/platform map ============ */
#rail {
  height:64px; flex:0 0 64px;
  display:flex; align-items:stretch;
  border-bottom:1px solid var(--hairline);
  background:var(--g1);
  position:relative; z-index:15;
  touch-action:manipulation;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
.tile {
  flex:1 1 0; min-width:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:7px; border-right:1px solid var(--hairline);
  padding:4px 2px;
}
.tile:last-child { border-right:none; }
.tile .ab {
  font-family:var(--font-cond); font-weight:600; font-size:13px;
  letter-spacing:.14em; color:var(--txt3);
}
.tile.cur .ab { color:var(--txt2); }
.tile.donex .ab { color:var(--etch); }
.tile .pips { display:flex; gap:5px; align-items:center; justify-content:center; }
.pip { width:10px; height:10px; border-radius:50%; flex:0 0 auto; box-sizing:border-box; }
.pip.fut  { border:1.5px solid #3a3631; background:transparent; }
.pip.done { background:var(--g4); }
.pip.work { background:var(--red); animation:pipbreathe 2.2s ease-in-out infinite; }
@keyframes pipbreathe { 0%,100% { box-shadow:0 0 0 0 rgba(255,59,48,0); } 50% { box-shadow:0 0 0 3.5px rgba(255,59,48,.22); } }
.pip.view { border:2px solid var(--red); background:transparent; }

/* ============ STAGE ============ */
#stage { flex:1 1 auto; position:relative; overflow:hidden; min-height:0; }
#stage-inner { position:absolute; inset:0; overflow:hidden; display:flex; flex-direction:column; }
#stage-inner.scrolly { overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
.stage-enter .idle-wrap > *, .stage-enter .work-wrap > *, .stage-enter .rest-wrap > *,
.stage-enter .browse-wrap > *, .stage-enter .done-wrap > * { animation:rise 320ms var(--ease-out) backwards; }
.stage-enter .idle-wrap > :nth-child(2), .stage-enter .work-wrap > :nth-child(2), .stage-enter .rest-wrap > :nth-child(2),
.stage-enter .browse-wrap > :nth-child(2), .stage-enter .done-wrap > :nth-child(2) { animation-delay:40ms; }
.stage-enter .idle-wrap > :nth-child(3), .stage-enter .work-wrap > :nth-child(3), .stage-enter .rest-wrap > :nth-child(3),
.stage-enter .browse-wrap > :nth-child(3), .stage-enter .done-wrap > :nth-child(3) { animation-delay:80ms; }
.stage-enter .idle-wrap > :nth-child(4), .stage-enter .work-wrap > :nth-child(4), .stage-enter .rest-wrap > :nth-child(4),
.stage-enter .browse-wrap > :nth-child(4), .stage-enter .done-wrap > :nth-child(4) { animation-delay:120ms; }
.stage-enter .idle-wrap > :nth-child(5), .stage-enter .work-wrap > :nth-child(5), .stage-enter .rest-wrap > :nth-child(5),
.stage-enter .browse-wrap > :nth-child(5), .stage-enter .done-wrap > :nth-child(5) { animation-delay:160ms; }
.stage-enter .idle-wrap > :nth-child(6), .stage-enter .work-wrap > :nth-child(6), .stage-enter .rest-wrap > :nth-child(6),
.stage-enter .browse-wrap > :nth-child(6), .stage-enter .done-wrap > :nth-child(6) { animation-delay:200ms; }
.stage-enter .idle-wrap > :nth-child(7), .stage-enter .work-wrap > :nth-child(7), .stage-enter .rest-wrap > :nth-child(7),
.stage-enter .browse-wrap > :nth-child(7), .stage-enter .done-wrap > :nth-child(7) { animation-delay:240ms; }
@keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
.stage-ghost {
  position:absolute; inset:0; z-index:5; pointer-events:none;
  animation:ghostout 180ms ease forwards;
  display:flex; flex-direction:column; overflow:hidden;
  background:var(--g0);
}
@keyframes ghostout { to { opacity:0; transform:translate(var(--gx,0px),12px); } }

/* ============ COMMIT BAR ============ */
#commit {
  flex:0 0 auto;
  padding:8px 12px max(16px,env(safe-area-inset-bottom)) 12px;
  background:var(--g1);
  border-top:1px solid var(--hairline);
  box-shadow:inset 0 1px 0 var(--edge);
  position:relative; z-index:20;
}
#commit-btn {
  width:100%; height:70px;
  background:linear-gradient(180deg,#efe9df,#d2ccc0);
  border:none;
  border-radius:var(--r-lg);
  box-shadow:0 10px 26px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.55);
  font-family:var(--font-cond); font-weight:700; font-size:21px;
  letter-spacing:.2em; text-transform:uppercase;
  color:#100f0d;
  position:relative;
  transition:transform 160ms var(--spring), filter 120ms ease, background 120ms ease, color 120ms ease;
}
#commit-btn:active:not(:disabled) { transform:scale(.97); filter:brightness(.88); }
#commit-btn.inert {
  background:var(--g2); color:var(--txt3); letter-spacing:.16em; font-size:15px;
  border:1px solid var(--bd); box-shadow:none;
  pointer-events:none;
}
#commit-btn.go {
  background:linear-gradient(180deg,#ff4b40,#e02e24); color:#fff; border:none;
  box-shadow:0 10px 30px rgba(255,59,48,.25), inset 0 1px 0 rgba(255,255,255,.25);
  animation:goglow 1.2s ease-in-out infinite;
}
@keyframes goglow { 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.012);} }
#commit-btn.slash { background:var(--g2); color:var(--txt3); pointer-events:none; font-size:15px; border:1px solid var(--bd); box-shadow:none; }
#commit-btn.slash::before {
  content:''; position:absolute; left:10%; right:10%; top:50%;
  height:1px; background:var(--hairline);
  transform:rotate(-4deg);
}
#commit-btn.flash { animation:copyflash 120ms ease; }
@keyframes copyflash { 0%{ box-shadow:inset 0 0 0 2px var(--txt2);} 100%{ box-shadow:inset 0 1px 0 var(--edge);} }

/* ============ SPLIT-FLAP TILE PRIMITIVE ============ */
/* A flap tile renders one character on a charcoal face split by a horizontal seam.
   When the character changes the top half "drops" (rotateX) revealing the new top, and
   a new lower leaf swings down — the classic Solari cascade. JS sets data-c and toggles
   .flip with the outgoing char stashed in --prev. Compositor-only: only transform +
   opacity animate. */
.flap {
  position:relative; display:inline-block;
  background:var(--flap-bot);
  border-radius:var(--r-sm);
  box-shadow:0 6px 16px var(--flap-shadow), inset 0 0 0 1px var(--flap-edge);
  overflow:hidden;
  font-family:var(--font-cond); font-weight:600;
  color:var(--flap-char); line-height:1;
  -webkit-font-smoothing:antialiased;
  perspective:240px;
}
/* the two static printed halves (current value), and the animating leaves */
.flap .half { position:absolute; left:0; right:0; height:50%; overflow:hidden; }
.flap .half .glyph {
  position:absolute; left:0; right:0; text-align:center;
  height:200%;
}
.flap .top { top:0; background:var(--flap-top); border-radius:var(--r-sm) var(--r-sm) 0 0;
  box-shadow:inset 0 1px 0 rgba(255,250,242,.05); }
.flap .top .glyph { top:0; }
.flap .bot { bottom:0; background:var(--flap-bot); border-radius:0 0 var(--r-sm) var(--r-sm);
  box-shadow:inset 0 -1px 2px rgba(0,0,0,.4); }
.flap .bot .glyph { bottom:0; }
/* the seam — a thin dark line across the tile middle */
.flap::after {
  content:''; position:absolute; left:0; right:0; top:50%; height:2px;
  margin-top:-1px; background:var(--flap-seam);
  box-shadow:0 1px 0 rgba(255,250,242,.04);
  z-index:6; pointer-events:none;
}
/* leaves used only during a flip */
.flap .leaf {
  position:absolute; left:0; right:0; height:50%; overflow:hidden;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  transform-style:preserve-3d;
  z-index:5;
}
.flap .leaf .glyph { position:absolute; left:0; right:0; text-align:center; height:200%; }
/* outgoing top leaf — starts upright at top, drops to flat (closing down over seam) */
.flap .leaf-fold-top { top:0; transform-origin:bottom center; background:var(--flap-top);
  border-radius:var(--r-sm) var(--r-sm) 0 0; }
.flap .leaf-fold-top .glyph { top:0; }
/* incoming bottom leaf — starts flat (folded up under seam), swings down to upright */
.flap .leaf-fold-bot { bottom:0; transform-origin:top center; background:var(--flap-bot);
  border-radius:0 0 var(--r-sm) var(--r-sm); }
.flap .leaf-fold-bot .glyph { bottom:0; }
.flap.flip .leaf-fold-top { animation:flapTopDrop var(--flap-dur,330ms) var(--flap-ease) forwards; }
.flap.flip .leaf-fold-bot { animation:flapBotFall var(--flap-dur,330ms) var(--flap-ease) forwards; }
/* the new lower half is revealed by the static .bot as soon as the top leaf clears it,
   so the bottom leaf carries the same NEW glyph and lands flush */
@keyframes flapTopDrop {
  0%   { transform:rotateX(0deg);   opacity:1; }
  50%  { transform:rotateX(-90deg); opacity:1; }
  50.1%{ opacity:0; }
  100% { transform:rotateX(-90deg); opacity:0; }
}
@keyframes flapBotFall {
  0%   { transform:rotateX(90deg);  }
  50%  { transform:rotateX(90deg);  }
  100% { transform:rotateX(0deg);   }
}
/* red signal state — under-10s + STOP tiles */
.flap.sig { color:var(--red); }
.flap.sig .top, .flap.sig .leaf-fold-top { background:#2a100e; }
.flap.sig .bot, .flap.sig .leaf-fold-bot { background:#220c0b; }
.flap.sig { box-shadow:0 6px 18px rgba(255,59,48,.22), inset 0 0 0 1px rgba(255,59,48,.18); }
/* illuminated/selected face — used by difficulty board tiles when chosen */
.flap.lit { color:var(--g0); }
.flap.lit .top, .flap.lit .leaf-fold-top { background:#efe9df; }
.flap.lit .bot, .flap.lit .leaf-fold-bot { background:#d2ccc0; }
.flap.lit { box-shadow:0 6px 18px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,250,242,.2); }

/* the big rest clock — a row of flap tiles */
.board {
  display:flex; align-items:center; justify-content:center; gap:6px;
  transition:transform 460ms var(--spring); will-change:transform;
}
.board.roomy { transform:scale(1.06); }
.flap.clock-tile {
  width:clamp(58px,17vw,108px);
  height:clamp(86px,25.5vw,162px);
  font-size:clamp(64px,19vw,124px);
}
.flap.clock-tile .glyph { font-variant-numeric:tabular-nums lining-nums; }
.board .colon-sep {
  font-family:var(--font-mono); font-weight:700;
  font-size:clamp(40px,12vw,80px); color:var(--flap-char-dim);
  line-height:1; padding-bottom:.12em;
  animation:colonfade 1s ease infinite;
}
.board.sig .colon-sep { color:var(--red); }
@keyframes colonfade { 0%,100%{opacity:1;} 55%{opacity:.28;} }
.board.alertpulse { animation:gopulse 1.1s ease-in-out infinite; }
@keyframes gopulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.04);} }
/* GO board: two wide letter tiles */
.flap.go-tile {
  width:clamp(72px,21vw,128px);
  height:clamp(86px,25.5vw,162px);
  font-size:clamp(58px,17vw,108px);
  font-weight:700;
}

/* ============ IDLE — the departures manifest ============ */
.idle-wrap { padding:22px 16px 28px; display:flex; flex-direction:column; gap:14px; }
.day-hero {
  font-family:var(--font-cond); font-weight:700; font-size:54px; line-height:1;
  letter-spacing:.08em; text-transform:uppercase; color:var(--txt);
}
.day-hero .rule { display:block; height:1px; background:var(--hairline); margin-top:10px; transform-origin:left; animation:ruledraw 400ms var(--ease-out); }
@keyframes ruledraw { from { transform:scaleX(0);} to { transform:scaleX(1);} }
.day-sub { margin-top:-6px; }
.soft-banner {
  background:var(--red-wash); border:1px solid var(--red-wash-bd); border-radius:var(--r-md);
  color:var(--red); font-family:var(--font-cond); font-weight:600;
  font-size:12px; letter-spacing:.2em; text-transform:uppercase;
  padding:9px 12px;
}
.brief { padding:12px 14px; }
.brief .lbl { margin-bottom:6px; }
.brief-text { font-family:var(--font-mono); font-size:12px; line-height:1.55; color:var(--txt2); white-space:pre-wrap; }
.brief-text.clamped {
  display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;
}
.brief-more {
  min-height:44px; padding:0 4px; margin-top:2px;
  font-family:var(--font-cond); font-weight:600; font-size:11px; letter-spacing:.18em;
  color:var(--txt3); text-transform:uppercase;
}
/* the manifest reads like a board: ABBR · NAME ......... SPEC */
.manifest { display:flex; flex-direction:column; }
.man-row {
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:11px 14px; border-bottom:1px solid var(--hairline);
  animation:rise 240ms var(--ease-out) backwards;
}
.man-row:last-child { border-bottom:none; }
.man-name {
  font-family:var(--font-cond); font-weight:600; font-size:16px; letter-spacing:.05em;
  text-transform:uppercase; color:var(--txt2);
  display:flex; align-items:center; gap:8px; min-width:0;
}
.man-name .mab {
  font-family:var(--font-mono); font-weight:700; font-size:11px; color:var(--txt3);
  background:var(--g2); border:1px solid var(--bd); border-radius:var(--r-sm);
  padding:2px 5px; flex:0 0 auto; letter-spacing:.05em;
}
.man-name .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.man-spec {
  font-family:var(--font-mono); font-variant-numeric:tabular-nums;
  font-size:10.5px; color:var(--txt3); text-align:right;
  white-space:normal; max-width:52%; flex:0 0 auto;
}
.man-spec .man-drop {
  display:inline-block; padding:0 4px; margin-left:5px;
  border:1px solid var(--bd); border-radius:var(--r-sm); background:var(--g2);
  color:var(--txt2); white-space:nowrap;
}
.stop-chip {
  flex:0 0 auto;
  font-family:var(--font-cond); font-weight:700; font-size:9px; letter-spacing:.14em;
  color:var(--red); background:var(--red-wash); border:1px solid var(--red-wash-bd);
  border-radius:999px; padding:2px 7px;
}
.build-stamp { font-family:var(--font-mono); font-size:9px; color:var(--etch); text-align:center; letter-spacing:.12em; }

/* ============ WORK ============ */
.work-wrap { padding:14px 16px 12px; display:flex; flex-direction:column; gap:12px; flex:1 1 auto; min-height:0; }
.work-hero { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; justify-content:center; gap:12px; }
.ex-name {
  font-family:var(--font-cond); font-weight:700; font-size:30px; line-height:1.05;
  letter-spacing:.05em; text-transform:uppercase; color:var(--txt);
  min-height:32px;
}
/* the working weight rides its own flap tiles — the board "stands by" at this load */
.weight-board { display:flex; align-items:flex-end; gap:8px; min-height:104px; }
.weight-flaps { display:flex; align-items:center; gap:5px; }
.flap.wgt-tile {
  width:clamp(46px,13vw,72px);
  height:clamp(68px,20vw,104px);
  font-size:clamp(50px,15vw,84px); font-weight:700;
}
.flap.wgt-tile .glyph { font-variant-numeric:tabular-nums lining-nums; }
.weight-unit { font-family:var(--font-cond); font-weight:600; font-size:16px; letter-spacing:.2em; color:var(--txt3); padding-bottom:.45em; }
.drop-tag {
  font-family:var(--font-mono); font-size:11px; color:var(--txt2);
  border:1px solid var(--bd); background:var(--ctl-grad); border-radius:var(--r-sm);
  padding:3px 7px; white-space:nowrap; align-self:center;
}
.sub-reg { display:flex; align-items:baseline; gap:10px; min-height:26px; }
.sub-reg .lbl { font-size:11px; }
.srv {
  font-family:var(--font-mono); font-weight:500; font-size:22px; line-height:1;
  font-variant-numeric:tabular-nums lining-nums; color:var(--txt2);
  margin-right:8px;
}
.stop-plate {
  background:var(--red-wash); border:1px solid var(--red-wash-bd); border-radius:var(--r-md);
  color:var(--red);
  font-family:var(--font-cond); font-weight:600; font-size:13px;
  letter-spacing:.14em; text-transform:uppercase;
  padding:10px 12px; line-height:1.35;
}
/* an UNMISSABLE annunciator on injury-armed exercises — a board ALARM strip */
.stop-annun {
  border:1px solid var(--red); border-radius:var(--r-md);
  background:repeating-linear-gradient(135deg,#2a0f0d 0 12px,#350f0c 12px 24px);
  color:var(--red);
  font-family:var(--font-cond); font-weight:700; font-size:13px;
  letter-spacing:.14em; text-transform:uppercase;
  padding:11px 12px; line-height:1.35;
  display:flex; align-items:center; gap:9px;
  animation:annunpulse 1.4s ease-in-out infinite;
}
.stop-annun .bang {
  flex:0 0 auto; font-size:16px; line-height:1;
}
@keyframes annunpulse { 0%,100%{ box-shadow:0 0 0 0 rgba(255,59,48,0);} 50%{ box-shadow:0 0 0 3px rgba(255,59,48,.18);} }
.advice { padding:12px 14px; display:flex; flex-direction:column; gap:6px; }
.advice-text { font-family:var(--font-mono); font-size:13.5px; line-height:1.5; color:var(--txt2); }
.advice-text.clamped { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.advice-more {
  align-self:flex-start; min-height:44px; min-width:44px; padding:0 4px;
  font-family:var(--font-cond); font-weight:600; font-size:11px; letter-spacing:.18em;
  color:var(--txt3); text-transform:uppercase;
}

/* ============ REST ============ */
.rest-wrap { padding:10px 16px 12px; display:flex; flex-direction:column; gap:12px; flex:1 1 auto; min-height:0; }
.rest-top {
  text-align:center;
  flex:1 1 auto; min-height:120px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
}
.rest-cap { text-align:center; margin-top:2px; font-size:11px; }
/* progress strip below the board: a row of flip-flap minute/second pips draining R→L */
.tach { position:relative; height:14px; margin:2px 0; }
.tach-track { position:absolute; left:0; right:0; bottom:5px; height:3px; background:var(--g3); }
.tach-fill {
  position:absolute; left:0; right:0; bottom:5px; height:3px;
  background:var(--etch); transform-origin:left center;
  will-change:transform;
}
.tach-fill.sig { background:var(--red); box-shadow:0 0 12px rgba(255,59,48,.45); }
.tach-tick { position:absolute; bottom:1px; width:1px; height:11px; background:var(--g3); }
.adjust-row { display:flex; gap:8px; min-height:48px; }
.adjust-row button {
  flex:1 1 0; min-height:48px;
  background:var(--ctl-grad); border:1px solid var(--bd); border-radius:var(--r-md);
  box-shadow:inset 0 1px 0 var(--edge);
  font-family:var(--font-mono); font-variant-numeric:tabular-nums;
  font-size:13px; color:var(--txt2); letter-spacing:.06em;
  transition:transform 160ms var(--spring), background 120ms ease;
}
.adjust-row button:active { transform:scale(.94); background:var(--g4); color:var(--txt); }

/* next-set advisor plate — the departure schedule for the upcoming set */
.plate { padding:12px 14px; display:flex; flex-direction:column; gap:6px; }
.plate-kicker { font-size:11px; }
.plate-line { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
.plate-band {
  font-family:var(--font-mono); font-weight:700; font-size:40px; line-height:1;
  font-variant-numeric:tabular-nums lining-nums; letter-spacing:-.02em;
  color:var(--txt); min-height:40px;
}
.plate-band .band-unit { font-family:var(--font-cond); font-weight:600; font-size:14px; letter-spacing:.18em; color:var(--txt3); }
.plate-token {
  font-family:var(--font-mono); font-weight:500; font-size:15px;
  font-variant-numeric:tabular-nums; color:var(--txt2);
  border:1px solid var(--bd); border-radius:var(--r-sm); background:var(--ctl-grad);
  padding:4px 9px; white-space:nowrap;
}
.plate-token.drop { color:var(--red); border-color:var(--red-wash-bd); background:var(--red-wash); }
.plate-status { font-family:var(--font-mono); font-size:12.5px; line-height:1.5; color:var(--txt2); }
.plate-status.alive { color:var(--red); }
.plate-status .rate-prompt { color:var(--etch); display:block; margin-top:3px; font-size:11px; letter-spacing:.06em; }
.flip-stamp {
  border:1px solid var(--red); border-radius:var(--r-md); background:var(--red-wash);
  color:var(--red);
  font-family:var(--font-cond); font-weight:700; font-size:14px; letter-spacing:.14em;
  text-transform:uppercase; text-align:center;
  padding:12px 10px;
  animation:stampdraw 300ms var(--ease-out);
}
.flip-stamp.soft { border-color:var(--hairline); background:var(--g2); color:var(--txt2); }
@keyframes stampdraw { from { opacity:0; transform:scale(.98);} to { opacity:1; transform:none;} }

/* ============ DEPARTURE-BOARD LOGGING ROW ============ */
/* The set logs as a board row. Reps live on flap tiles bumped by up/down flap keys or by
   tapping the rep tile to cycle nearby candidate values. Difficulty = 4 flap tiles that
   flip to a lit face on select. A SCHED marker shows the advisor target. */
.logrow { padding:10px 11px 11px; display:flex; flex-direction:column; gap:9px; animation:dockin 180ms var(--ease-out); }
@keyframes dockin { from { opacity:0; transform:translateY(6px);} to { opacity:1; transform:none;} }
.logrow-head { display:flex; align-items:center; gap:8px; }
.logrow-head .lbl { flex:1 1 auto; font-size:12px; color:var(--txt3); }
.lr-chip {
  min-height:44px; padding:0 12px;
  background:var(--ctl-grad); border:1px solid var(--bd); border-radius:var(--r-md);
  font-family:var(--font-cond); font-weight:600; font-size:11px; letter-spacing:.12em;
  color:var(--txt2); text-transform:uppercase;
  transition:transform 160ms var(--spring), background 120ms ease;
}
.lr-chip:active { transform:scale(.94); background:var(--g4); }
.lr-chip.danger { color:var(--red); border-color:var(--red-wash-bd); background:var(--red-wash); }
/* SCHED marker + rep flap bay */
.rep-bay { display:flex; align-items:stretch; gap:9px; }
.rep-keys { display:flex; flex-direction:column; gap:6px; flex:0 0 60px; }
.rep-key {
  flex:1 1 0; min-height:34px; min-width:60px;
  background:var(--ctl-grad); border:1px solid var(--bd); border-radius:var(--r-md);
  box-shadow:inset 0 1px 0 var(--edge);
  font-family:var(--font-mono); font-size:22px; color:var(--txt2); line-height:1;
  display:flex; align-items:center; justify-content:center;
  transition:transform 130ms var(--spring), background 120ms ease;
}
.rep-key:active { transform:scale(.9); background:var(--g4); color:var(--txt); }
.rep-readout { flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; }
.sched-mark {
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.14em; color:var(--txt3);
  text-transform:uppercase; min-height:13px; display:flex; align-items:center; gap:6px;
}
.sched-mark .sv { color:var(--txt2); font-weight:700; }
.sched-mark.alive { color:var(--red); }
.sched-mark.alive .sv { color:var(--red); }
/* the rep value tiles — tap to cycle candidate values */
.rep-tiles {
  display:flex; align-items:center; gap:5px;
  position:relative;
  padding:2px; border-radius:var(--r-md);
}
.rep-tiles[role="button"]:active { transform:scale(.97); }
.flap.rep-tile {
  width:clamp(40px,12vw,58px);
  height:clamp(58px,17vw,82px);
  font-size:clamp(40px,12vw,62px); font-weight:700;
}
.flap.rep-tile .glyph { font-variant-numeric:tabular-nums lining-nums; }
/* STOP renders as a single wide flap reading STOP */
.flap.rep-stop {
  width:clamp(150px,46vw,232px);
  height:clamp(58px,17vw,82px);
  font-size:clamp(34px,10vw,52px); font-weight:700;
  letter-spacing:.1em;
}
.rep-hint { font-family:var(--font-cond); font-size:9px; letter-spacing:.16em; color:var(--etch); text-transform:uppercase; min-height:11px; }
.gate-cap { font-family:var(--font-mono); font-size:11px; letter-spacing:.05em; color:var(--txt3); text-align:center; min-height:14px; }
.gate-cap.cleared { color:var(--txt2); }
.gate-cap.out { color:var(--red); }
/* difficulty board — 4 flap tiles, the chosen one is lit */
.diff-board { display:flex; gap:6px; }
.diff-flap {
  flex:1 1 0; position:relative;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.flap.diff-tile {
  width:100%;
  height:clamp(48px,13.5vw,62px);
  font-size:18px; font-weight:700;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
}
.flap.diff-tile .dv { font-family:var(--font-mono); font-weight:700; font-size:18px; line-height:1; }
.flap.diff-tile .dl { font-family:var(--font-cond); font-weight:600; font-size:8.5px; letter-spacing:.14em; line-height:1; }
.flap.diff-tile .leaf, .flap.diff-tile .half { /* diff tiles flip the whole face, glyph stack stays centered */ }
.flap.diff-tile:active { transform:scale(.95); }

.receipt {
  width:100%; min-height:52px;
  background:var(--panel-grad); border:1px solid var(--bd); border-radius:var(--r-md);
  box-shadow:var(--elev);
  font-family:var(--font-mono); font-variant-numeric:tabular-nums;
  font-size:15px; color:var(--txt2); letter-spacing:.04em;
  display:flex; align-items:center; justify-content:center; gap:8px;
  animation:receiptin 360ms var(--ease-out);
}
@keyframes receiptin { 0%{opacity:0; transform:translateY(12px) scale(.96);} 60%{transform:translateY(-2px) scale(1.012);} 100%{opacity:1; transform:none;} }
.receipt .pencil { color:var(--txt3); font-size:13px; }

/* browse */
.browse-bar { display:flex; align-items:center; justify-content:center; gap:8px; min-height:44px; }
.mini-board { display:inline-flex; align-items:center; gap:3px; }
.flap.mini-tile {
  width:22px; height:30px; font-size:22px; font-weight:600;
  border-radius:4px;
}
.flap.mini-tile .glyph { font-variant-numeric:tabular-nums lining-nums; }
.mini-board .mc-colon { font-family:var(--font-mono); font-weight:700; font-size:16px; color:var(--flap-char-dim); }
.mini-board.sig .flap.mini-tile { color:var(--red); }
.mini-board.sig .mc-colon { color:var(--red); }
.pill {
  min-height:44px; padding:0 16px;
  border-radius:999px; border:1px solid var(--bd); background:var(--ctl-grad);
  font-family:var(--font-cond); font-weight:600; font-size:11px; letter-spacing:.16em;
  color:var(--txt2); text-transform:uppercase;
  transition:transform 160ms var(--spring), background 120ms ease;
}
.pill:active { transform:scale(.94); background:var(--g4); }
.pill.live { color:var(--red); border-color:var(--red-wash-bd); background:var(--red-wash); }
.browse-wrap { padding:10px 16px; display:flex; flex-direction:column; gap:10px; flex:1 1 auto; min-height:0; }
.browse-ctx { display:flex; flex-direction:column; gap:2px; }
.browse-ctx .ex-name { font-size:24px; min-height:26px; }
.browse-ctx .meta { font-family:var(--font-mono); font-size:12px; color:var(--txt3); font-variant-numeric:tabular-nums; }

/* ============ DONE ============ */
.done-wrap { padding:22px 16px 30px; display:flex; flex-direction:column; gap:14px; }
.done-hero {
  font-family:var(--font-mono); font-weight:700; font-size:78px; line-height:1;
  font-variant-numeric:tabular-nums lining-nums; letter-spacing:-.04em;
  color:var(--txt); text-align:center;
}
.done-sub { text-align:center; font-size:11px; }
.done-block { padding:12px 14px; display:flex; flex-direction:column; gap:7px; }
.done-block .lbl { margin-bottom:2px; }
.trig-row { display:flex; gap:10px; font-family:var(--font-mono); font-size:12.5px; font-variant-numeric:tabular-nums; color:var(--txt2); }
.trig-row .ab { color:var(--txt3); flex:0 0 36px; }
.trig-row.flipped, .trig-row.flipped .ab { color:var(--red); }
.soft-note { font-family:var(--font-mono); font-size:10.5px; color:var(--etch); }
.done-ex {
  display:flex; flex-direction:column; gap:3px;
  padding:11px 14px; border-bottom:1px solid var(--hairline);
  animation:rise 240ms var(--ease-out) backwards;
}
.done-ex:last-child { border-bottom:none; }
.done-ex .top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.done-ex .nm { font-family:var(--font-cond); font-weight:600; font-size:16px; letter-spacing:.04em; text-transform:uppercase; color:var(--txt2); }
.done-ex .tm { font-family:var(--font-mono); font-size:10.5px; color:var(--txt3); font-variant-numeric:tabular-nums; white-space:nowrap; }
.done-ex .wt { font-family:var(--font-mono); font-size:10.5px; color:var(--txt3); }
.done-ex .sets { font-family:var(--font-mono); font-size:13px; color:var(--txt); font-variant-numeric:tabular-nums; line-height:1.6; }
.done-rests { text-align:center; font-family:var(--font-mono); font-size:11px; color:var(--txt3); }

/* ============ SHEETS / TOAST ============ */
#sheet-backdrop {
  position:absolute; inset:0; background:rgba(0,0,0,.7); z-index:100;
  animation:fadein 180ms ease;
}
@keyframes fadein { from{opacity:0;} to{opacity:1;} }
#sheet {
  position:absolute; left:0; right:0; bottom:0; z-index:110;
  background:linear-gradient(180deg,#1a1816,#100f0d); border-top:1px solid var(--bd);
  border-radius:22px 22px 0 0;
  box-shadow:0 -18px 50px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,250,242,.06);
  max-height:72%; display:flex; flex-direction:column;
  padding:14px 16px max(16px,env(safe-area-inset-bottom)) 16px;
  animation:sheetup 300ms var(--spring);
}
@keyframes sheetup { from { transform:translateY(24px); opacity:0; } to { transform:none; opacity:1; } }
#sheet-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
#sheet-title { font-family:var(--font-cond); font-weight:600; font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:#8a8275; }
#sheet-x { min-height:44px; min-width:44px; font-family:var(--font-cond); font-weight:600; font-size:11px; letter-spacing:.18em; color:var(--txt3); }
#sheet-body { overflow-y:auto; -webkit-overflow-scrolling:touch; min-height:0; }
.sheet-note-text { font-family:var(--font-mono); font-size:12.5px; color:var(--txt2); line-height:1.55; white-space:pre-wrap; margin-bottom:10px; }
.sheet-sec { margin-bottom:12px; }
.sheet-sec .lbl { margin-bottom:4px; }
.note-input {
  width:100%; min-height:48px; padding:10px 12px;
  background:#0c0b0a; border:1px solid var(--bd); border-radius:var(--r-md);
  font-family:var(--font-mono); font-size:16px; color:var(--txt);
  outline:none; caret-color:var(--txt2);
  -webkit-user-select:auto; user-select:auto;
}
.note-input:focus { border-color:var(--g4); }
.note-input::placeholder { color:var(--etch); }
.sheet-row {
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:12px 0; border-bottom:1px solid var(--hairline); min-height:56px;
}
.sheet-row:last-child { border-bottom:none; }
.sheet-row .t { font-family:var(--font-cond); font-weight:600; font-size:15px; letter-spacing:.05em; text-transform:uppercase; color:var(--txt2); }
.sheet-row .s { font-family:var(--font-mono); font-size:10px; color:var(--txt3); margin-top:1px; }
.tgl {
  width:52px; height:30px; border-radius:15px; background:var(--g3);
  border:1px solid var(--hairline); position:relative; flex:0 0 auto;
  transition:background 140ms ease;
}
.tgl::before { content:''; position:absolute; inset:-8px; }
.tgl .knob {
  position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%;
  background:var(--txt3); transition:left 140ms ease, background 140ms ease;
}
.tgl.on { background:var(--g4); }
.tgl.on .knob { left:25px; background:var(--txt); }
.sheet-btn {
  width:100%; min-height:52px; margin-top:8px;
  background:var(--ctl-grad); border:1px solid var(--bd); border-radius:var(--r-md);
  font-family:var(--font-cond); font-weight:600; font-size:13px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--txt2);
  transition:transform 160ms var(--spring), background 120ms ease;
}
.sheet-btn:active:not(:disabled) { transform:scale(.98); background:var(--g4); }
.sheet-btn:disabled { opacity:.32; }
.order-row { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--hairline); }
.order-row:last-child { border-bottom:none; }
.order-row .onm { flex:1 1 auto; font-family:var(--font-cond); font-weight:600; font-size:15px; letter-spacing:.04em; text-transform:uppercase; color:var(--txt2); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.order-row .oab { flex:0 0 36px; font-family:var(--font-mono); font-size:11px; color:var(--txt3); }
.order-btn {
  flex:0 0 56px; min-height:56px;
  background:var(--ctl-grad); border:1px solid var(--bd); border-radius:var(--r-md);
  font-size:18px; color:var(--txt2);
  transition:transform 160ms var(--spring), background 120ms ease;
}
.order-btn:active:not(:disabled) { transform:scale(.94); background:var(--g4); }
.order-btn:disabled { opacity:.25; }
#toast {
  position:absolute; left:50%; bottom:120px; transform:translateX(-50%);
  background:var(--ctl-grad); border:1px solid var(--bd); border-radius:999px;
  box-shadow:0 10px 30px rgba(0,0,0,.55);
  font-family:var(--font-mono); font-size:11.5px; color:var(--txt2);
  padding:9px 14px; white-space:nowrap;
  opacity:0; pointer-events:none; z-index:130;
  transition:opacity 300ms ease;
}
#toast.show { opacity:1; }

/* ============ COMPACT VIEWPORTS ============ */
@media (max-height:760px) {
  .flap.clock-tile { width:clamp(50px,15vw,90px); height:clamp(76px,22vw,132px); font-size:clamp(54px,16vw,104px); }
  .rest-top { min-height:96px; }
  .board.roomy { transform:scale(1.03); }
  .flap.wgt-tile { width:clamp(40px,11vw,60px); height:clamp(58px,17vw,86px); font-size:clamp(42px,12vw,70px); }
  .weight-board { min-height:80px; }
  .work-wrap, .rest-wrap, .browse-wrap { gap:7px; padding-top:8px; }
  .plate { padding:9px 12px; gap:4px; }
  .plate-band { font-size:32px; min-height:32px; }
  .logrow { padding:8px 10px; gap:7px; }
  .rep-key { min-height:32px; }
  .flap.rep-tile { width:clamp(36px,11vw,52px); height:clamp(50px,15vw,72px); font-size:clamp(36px,11vw,54px); }
  .flap.diff-tile { height:clamp(44px,12vw,56px); }
  .adjust-row { min-height:44px; }
  .adjust-row button { min-height:44px; }
  .day-hero { font-size:44px; }
  .done-hero { font-size:64px; }
}

/* ============ REDUCED MOTION — flips become crossfades, loops die ============ */
@media (prefers-reduced-motion:reduce) {
  *, *::before, *::after { animation-duration:120ms !important; transition-duration:120ms !important; }
  #wash { display:none; }
  .pip.work, #commit-btn.go { animation:none; }
  .board { transition:none; }
  .board.alertpulse, .stop-annun { animation:none; }
  .board .colon-sep, .mini-board .mc-colon { animation:none; }
  /* crossfade instead of 3D flip: leaves just fade, no rotateX cascade */
  .flap.flip .leaf-fold-top { animation:rmFadeOut 120ms linear forwards; transform:none; }
  .flap.flip .leaf-fold-bot { animation:rmFadeIn 120ms linear forwards; transform:none; }
  @keyframes rmFadeOut { to { opacity:0; } }
  @keyframes rmFadeIn { from { opacity:0; } to { opacity:1; } }
}
</style>
</head>
<body>

<div id="app">
  <div id="wash" aria-hidden="true"></div>

  <header id="hdr">
    <div id="hdr-left"></div>
    <div id="hdr-right">
      <span id="hdr-reg" aria-label="Session registers"></span>
      <span id="pip-wake" class="pip-status" aria-hidden="true"></span>
      <span id="pip-save" class="pip-status" aria-hidden="true"></span>

// ============ SPLIT-FLAP RENDER PRIMITIVE ============
// A flap tile is one character on a Solari board. flapTileHTML builds the static markup
// (two printed halves carrying the current char + a seam). setFlap(el, char) swaps the
// printed char and, if it changed, mounts a one-shot pair of animating leaves (top drops,
// bottom swings down) — the classic cascade. Compositor-only (transform+opacity). The
// flip is fired ONLY by the caller's integer-second / value-change guard, never per tick.
function flapTileHTML(ch, cls) {

    '<span class="half top"><span class="glyph">' + c + '</span></span>' +
    '<span class="half bot"><span class="glyph">' + c + '</span></span>' +

// teardown, and (optionally) plays the soft mechanical tick.
function setFlap(el, ch, opts) {
  if (!el) return;
  const next = (ch == null) ? '' : String(ch);
  const prev = el.dataset.c == null ? '' : el.dataset.c;
  if (prev === next) return; // SAME-VALUE GUARD — no flip, no churn
  el.dataset.c = next;
  const top = el.querySelector('.top .glyph');
  const bot = el.querySelector('.bot .glyph');
  const nE = escapeHtml(next);
  // The static top reveals the NEW upper half only AFTER the outgoing top leaf has
  // dropped past it; to keep the printed value correct at rest, set both halves to the
  // new char now and let the outgoing leaf (which carries the OLD char) cover the top
  // until it clears.
  if (top) top.innerHTML = nE;
  if (bot) bot.innerHTML = nE;
  // remove any in-flight leaves
  el.querySelectorAll('.leaf').forEach(n => n.remove());
  const reduce = reduceMotionOn();
  // outgoing top leaf carries the OLD char; incoming bottom leaf carries the NEW char
  const dur = (opts && opts.dur) || 330;
  const leafTop = document.createElement('span');
  leafTop.className = 'leaf leaf-fold-top';
  leafTop.style.setProperty('--flap-dur', dur + 'ms');
  leafTop.innerHTML = '<span class="glyph">' + escapeHtml(prev) + '</span>';
  const leafBot = document.createElement('span');
  leafBot.className = 'leaf leaf-fold-bot';
  leafBot.style.setProperty('--flap-dur', dur + 'ms');
  leafBot.innerHTML = '<span class="glyph">' + nE + '</span>';
  el.appendChild(leafTop);
  el.appendChild(leafBot);
  const ttl = reduce ? 140 : (dur + 40);
  setTimeout(() => { try { leafTop.remove(); leafBot.remove(); } catch (e) {} }, ttl);

function flapTick() {

    10: '10sec-remaining',

// ============ DURATIONS ============
function getExerciseDuration(exerciseIdx) {
  const logs = setLogs.filter(l => l.exercise === exerciseIdx && l.timestamp);
  if (logs.length === 0) return null;
  if (logs.length === 1) return 0;
  const first = Math.min(...logs.map(l => l.timestamp));
  const last = Math.max(...logs.map(l => l.timestamp));
  return last - first;
}
function firstPerformedExercise() {
  let best = null, bestTs = Infinity;
  setLogs.forEach(l => {
    if (l.timestamp && l.timestamp < bestTs) { bestTs = l.timestamp; best = l.exercise; }
  });
  return best;
}
// First-performed exercise anchors at the Start tap so S1's duration is real; the
// rest keep the legacy span-of-timestamps math.
function exerciseDurationForSummary(i, firstExIdx) {
  const logs = setLogs.filter(l => l.exercise === i && l.timestamp);
  if (!logs.length) return null;
  const last = Math.max(...logs.map(l => l.timestamp));
  if (i === firstExIdx && workoutStartTime) return last - workoutStartTime;
  return getExerciseDuration(i);
}
function getTotalDuration() {
  const ts = setLogs.filter(l => l.timestamp).map(l => l.timestamp);
  if (ts.length === 0) return null;
  const lastTs = Math.max(...ts);
  // Preferred path: the Start tap recorded an explicit workout start — S1 is real.
  if (workoutStartTime) return lastTs - workoutStartTime;
  // Legacy fallback: estimate S1's duration by averaging the gaps between consecutive
  // sets of the first-performed exercise.
  if (ts.length < 2) return null;
  const raw = lastTs - Math.min(...ts);
  const logsWithTs = setLogs.filter(l => l.timestamp).slice().sort((a, b) => a.timestamp - b.timestamp);
  const firstExIdx = logsWithTs[0].exercise;
  const firstExLogs = setLogs
    .filter(l => l.exercise === firstExIdx && l.timestamp)
    .sort((a, b) => a.set - b.set);
  if (firstExLogs.length < 2) return raw;
  let gapSum = 0;
  for (let i = 1; i < firstExLogs.length; i++) {
    gapSum += firstExLogs[i].timestamp - firstExLogs[i - 1].timestamp;
  }
  const avgGap = gapSum / (firstExLogs.length - 1);
  return raw + avgGap;
}

    const ex = workout[currentExercise];
    if (ex) {
      if (currentSet === 0) {
        if (!dailyClipFor(currentExercise, 0)) {
          seq.push(...weightClipsFor(ex));
          const repClip = repRangeClipFor(ex.reps);
          if (repClip) seq.push(repClip);
        }
      } else {
        seq.push(...setPositionCuesFor(currentExercise, currentSet, ex.sets));
      }
    }
    const _dc = dailyClipFor(currentExercise, currentSet);
    if (_dc) seq.push(_dc);
    else maybeAppendTriggerSetCue(seq, currentExercise, currentSet);
    VoiceCue.playSequence(seq);
  }
}
// +30 / −15: mutate restEndTime, clamp ≥ now (expiry handled by the tick), persist
// instantly, renormalize the countdown thresholds (the ONLY non-background mutation
// path that does — pause/resume deliberately do not).
function adjustRest(deltaSec) {
  if (state === 'resting') {
    if (!restEndTime) return;
    restEndTime = Math.max(Date.now(), restEndTime + deltaSec * 1000);
    renormalizeCountdownThresholds();
    if (deltaSec > 0 && !restAdjustedThisRest) { extendedRests++; restAdjustedThisRest = true; }
    paintRestVisuals(Math.max(0, (restEndTime - Date.now()) / 1000));
    saveState();
  } else if (state === 'paused') {
    restRemaining = Math.max(0, restRemaining + deltaSec);
    countdownFiredThresholds = new Set(COUNTDOWN_THRESHOLDS.filter(t => t > Math.ceil(restRemaining)));
    if (deltaSec > 0 && !restAdjustedThisRest) { extendedRests++; restAdjustedThisRest = true; }
    paintRestVisuals(restRemaining);
    saveState();
  }
}
function finishWorkout() {
  pushHistory();
  releaseWakeLock();
  captureLog();
  state = 'finished';
  viewingExercise = currentExercise;
  viewingSet = currentSet;
  estMinutes = null;
  render();
  try { localStorage.removeItem('gtsol-state'); } catch (e) {}
  VoiceCue.cancel();
  VoiceCue.play('workout-complete');
  stopAudioKeepalive();
}
function resetWorkout() {
  // Deliberately single-tap, no confirm — it already sits two taps deep behind the gear.
  VoiceCue.cancel();
  VoiceCue.play('workout-reset');
  setTimeout(() => {
    try { localStorage.removeItem('gtsol-state'); } catch (e) {}
    location.reload();
  }, settings.voice ? 1500 : 200);
}

// ============ BROWSING (two-cursor model) ============
function cycleView(exIdx, setIdx) {
  const oldKey = viewingExercise * 100 + viewingSet;
  viewingExercise = exIdx;
  viewingSet = setIdx;
  const newKey = viewingExercise * 100 + viewingSet;
  render(newKey > oldKey ? 1 : (newKey < oldKey ? -1 : 0));
  saveState();
}
function handleRailTap(target) {
  if (!target) return false;
  if (sheetKind) return false;
  if (state === 'finished') return false;
  const tile = target.closest ? target.closest('.tile') : null;
  if (!tile || tile.dataset.ex == null) return false;
  const exIdx = Number(tile.dataset.ex);
  if (!Number.isFinite(exIdx) || !workout[exIdx]) return false;
  if (exIdx === viewingExercise) {
    cycleView(exIdx, (viewingSet + 1) % workout[exIdx].sets);
  } else {
    cycleView(exIdx, 0);
  }
  return true;
}
function returnToWorking() {
  viewingExercise = currentExercise;
  viewingSet = currentSet;
  render();
  saveState();
}
// ↓SET: repoint the WORKING cursor to the viewed set (pushHistory first) — combined
// with setDone's dedup this is the supported redo-a-set flow.
function setCurrentFromView() {
  if (!isBrowsing()) return;
  pushHistory();
  currentExercise = viewingExercise;
  currentSet = viewingSet;
  // From 'finishing' (all sets logged) the repoint must reopen the set — otherwise the
  // commit bar still says FINISH and the redo-a-set flow dead-ends in the one state
  // where viewing is pinned for editing. Mirrors the ready-state repoint semantics.
  if (state === 'finishing') {
    state = 'ready';
    lastSetStartAt = Date.now();
  }
  recomputeEst();
  render();
  saveState();
}

// ============ SUMMARY ============
function buildSummary() {
  const total = getTotalDuration();
  const durTxt = total ? formatDurCompact(total) : '—';
  let head = '## Workout — ' + dayType + ', ' + summaryDateStr() + ' ✓ DONE (' + durTxt;
  if (softDay) head += ' · ' + SOFT_NOTE;
  head += ')';
  const maxSets = Math.max(...workout.map(e => e.sets));
  let text = head + '\n';
  let hdr = '| Exercise | Weight |';
  let sep = '|---|---|';
  for (let j = 1; j <= maxSets; j++) { hdr += ' S' + j + ' |'; sep += '---|'; }
  hdr += ' Time |'; sep += '---|';
  text += hdr + '\n' + sep + '\n';
  const firstExIdx = firstPerformedExercise();
  workout.forEach((ex, i) => {
    let row = '| ' + ex.name + ' | ' + ex.weight + ' |';
    const drop = structuralDrop(ex);
    for (let j = 0; j < maxSets; j++) {
      if (j >= ex.sets) { row += ' — |'; continue; }       // set doesn't exist
      const log = findLog(i, j);
      if (!log) { row += ' ? |'; continue; }               // exists but unlogged
      let c = String(log.reps);                            // 0 stays plain on stops
      if (log.difficulty) c += ' [' + DIFFICULTY_LABELS[log.difficulty] + ']';
      if (drop && drop.setIdx === j) c += ' @' + drop.w;   // structural-drop set
      row += ' ' + c + ' |';
    }
    const dur = exerciseDurationForSummary(i, firstExIdx);
    row += ' ' + (dur && dur > 0 ? formatDurCompact(dur) : '—') + ' |';
    text += row + '\n';
  });
  const trigBits = [];
  let anySoftStar = false;
  workout.forEach((ex, i) => {
    const oc = triggerOutcome(i);
    if (!oc) return;
    const ab = abbrevFor(ex.name);
    if (oc.st === 'flipped') {
      trigBits.push(ab + ' CLEARED → ' + (ex.triggerWeight || '') + (softDay ? '*' : ''));
      if (softDay) anySoftStar = true;
    } else if (oc.st === 'out') {
      trigBits.push(ab + ' OUT S' + (oc.setIdx + 1) + ' (' + oc.reps + '<' + oc.req + ')');
    } else {
      trigBits.push(ab + ' —');
    }
  });
  if (trigBits.length) text += 'Triggers: ' + trigBits.join(' · ') + '\n';
  if (anySoftStar) text += '*' + SOFT_NOTE + '\n';
  const noteLines = [];
  workout.forEach((ex, i) => {
    for (let j = 0; j < ex.sets; j++) {
      const log = findLog(i, j);
      if (log && log.note) noteLines.push(ex.name + ' S' + (j + 1) + ': ' + log.reps + ' — ' + log.note);
    }
  });
  if (noteLines.length === 1) text += 'Notes: ' + noteLines[0] + '\n';
  else if (noteLines.length > 1) text += 'Notes:\n' + noteLines.join('\n') + '\n';
  if (skippedRests || extendedRests) {
    const bits = [];
    if (skippedRests) bits.push(skippedRests + ' skipped');
    if (extendedRests) bits.push(extendedRests + ' extended');
    text += 'Rests: ' + bits.join(' · ') + '\n';
  }
  // Clipboard payload is ASCII-only (Windows-paste safe — the summary lands in
  // tracker.md / daily logs). On-screen DONE typography keeps its glyphs; only the
  // copied text is sanitized: — → --, → → ->, · → |, ✓ dropped, – → -.
  return text
    .replace(/✓\s*/g, '')
    .replace(/—/g, '--')
    .replace(/–/g, '-')
    .replace(/→/g, '->')
    .replace(/·/g, '|');
}
function legacyCopy(t) {
  try {
    const ta = document.createElement('textarea');
    ta.value = t;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    // body is user-select:none globally; the copy shim needs selection back.
    ta.style.webkitUserSelect = 'text';
    ta.style.userSelect = 'text';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) { return false; }
}
function copySummary() {
  const text = buildSummary();
  const after = () => {
    elCommit.classList.remove('flash');
    void elCommit.offsetWidth;
    elCommit.classList.add('flash');
    elCommit.textContent = 'COPIED';
    setTimeout(() => { if (state === 'finished') elCommit.textContent = 'COPY SUMMARY'; }, 2000);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(after, () => { legacyCopy(text); after(); });
  } else {
    legacyCopy(text);
    after();
  }
}

// ============ INPUT HANDLERS ============
elCommit.addEventListener('click', () => {
  recoverAudioCtx();
  VoiceCue.unlock();
  // 'finished' guard: COPY SUMMARY lands here — must not resurrect the keepalive
  // that finishWorkout just stopped (battery burn on the done screen).
  if (state !== 'finished') startAudioKeepalive();
  if (state !== 'finished' && isBrowsing()) return;
  if (state === 'pre-start') startSession();
  else if (state === 'ready') setDone();
  else if (state === 'alert') acknowledgeAlert();
  else if (state === 'finishing') finishWorkout();
  else if (state === 'finished') copySummary();
});
// Shared rep/difficulty writers — the SAME engine state the donor mutated. Pointer-event
// driven via the board's controls; every one ends in refreshSetNote + saveState so the
// flap tiles flip in place and the advisor recomputes live.
function applyRepDelta(d) {
  const log = getActiveLogForEdit();
  if (!log) return;
  log.reps = Math.max(0, Math.min(40, (Number(log.reps) || 0) + d));
  evaluateTriggerFlip(log.exercise);
  refreshSetNote();
  saveState();
}
function applyRepZero() {
  const log = getActiveLogForEdit();
  if (!log) return;
  log.reps = 0; // difficulty deliberately stays null — injury abort
  evaluateTriggerFlip(log.exercise);
  refreshSetNote();
  saveState();
}
// Tap-the-rep-tiles to advance: cycle +1 through nearby candidate values, wrapping
// 40→0 (and 0/STOP→1, so a fat-tapped STOP is one tap from recovery). The on-theme
// "flip through candidates" gesture.
function cycleRepTile() {
  const log = getActiveLogForEdit();
  if (!log) return;
  let r = (Number(log.reps) || 0) + 1;
  if (r > 40) r = 0;
  log.reps = r;
  evaluateTriggerFlip(log.exercise);
  refreshSetNote();
  saveState();
}
function applyDifficulty(diff) {
  const log = getActiveLogForEdit();
  if (!log) return;
  if (!diff) return;
  log.difficulty = (log.difficulty === diff) ? null : diff; // re-tap clears the grade
  evaluateTriggerFlip(log.exercise);
  if (log.difficulty != null && !isBrowsing()) dockCollapsed = true; // collapse to receipt
  const dz = byId('dock-zone');
  if (dz) dz.innerHTML = dockZoneHTML();
  syncBoardRoomy();
  refreshSetNote();
  saveState();
}
// Pointer-driven control dispatch (rep keys, rep-cycle, difficulty, 0-STOP). Pointer
// Events so a sweaty thumb on the board doesn't scroll the stage; touch-action on the
// controls is manipulation. One handler, capture on pointerup, with a synthetic-click
// swallow so the document click handler below doesn't double-fire the same action.
let _lastBoardPointerAt = 0;
function dispatchBoardControl(el) {
  if (!el || el.disabled) return false;
  if (el.dataset.diff != null) { applyDifficulty(Number(el.dataset.diff)); return true; }
  const a = el.dataset.action;
  if (a === 'rep-plus') { applyRepDelta(1); return true; }
  if (a === 'rep-minus') { applyRepDelta(-1); return true; }
  if (a === 'rep-zero') { applyRepZero(); return true; }
  if (a === 'rep-cycle') { cycleRepTile(); return true; }
  return false;
}
elStageInner.addEventListener('pointerup', (e) => {
  const el = e.target.closest ? e.target.closest('[data-action],[data-diff]') : null;
  if (!el) return;
  const a = el.dataset.action;
  const isBoardCtl = el.dataset.diff != null ||
    a === 'rep-plus' || a === 'rep-minus' || a === 'rep-zero' || a === 'rep-cycle';
  if (!isBoardCtl) return;
  // audio unlock parity — board taps are real gestures too
  recoverAudioCtx(); VoiceCue.unlock(); if (state !== 'finished') startAudioKeepalive();
  if (dispatchBoardControl(el)) {
    _lastBoardPointerAt = Date.now();
    try { e.preventDefault(); } catch (err) {}
  }
});
document.addEventListener('click', (e) => {
  const el = e.target.closest ? e.target.closest('[data-action],[data-diff]') : null;
  if (!el || el.disabled) return;
  // Board controls are handled on pointerup; swallow the trailing synthetic click so we
  // don't apply a rep/difficulty change twice.
  const a0 = el.dataset.action;
  const isBoardCtl = el.dataset.diff != null ||
    a0 === 'rep-plus' || a0 === 'rep-minus' || a0 === 'rep-zero' || a0 === 'rep-cycle';
  if (isBoardCtl) {
    if (Date.now() - _lastBoardPointerAt < 600) return; // pointer path already ran it
    dispatchBoardControl(el);                            // mouse-only fallback (no pointerup ctl)
    return;
  }
  const action = el.dataset.action;
  if (!action) return;
  switch (action) {
    case 'undo': undoStep(); break;
    case 'redo': closeSheet(); redoStep(); break;
    case 'gear': openGearSheet(); break;
    case 'sheet-close': closeSheet(); break;
    case 'order-open': openOrderSheet(); break;
    case 'order-up': {
      const i = Number(el.dataset.idx);
      reorderExercise(i, i - 1);
      if (sheetKind === 'order') elSheetBody.innerHTML = orderSheetBodyHTML();
      break;
    }
    case 'order-down': {
      const i = Number(el.dataset.idx);
      reorderExercise(i, i + 1);
      if (sheetKind === 'order') elSheetBody.innerHTML = orderSheetBodyHTML();
      break;
    }
    case 'toggle-autostart':
      settings.autoStart = !settings.autoStart;
      saveSettings();
      if (sheetKind === 'gear') elSheetBody.innerHTML = gearSheetBodyHTML();
      break;
    case 'toggle-voice':
      settings.voice = !settings.voice;
      if (!settings.voice) VoiceCue.cancel();
      saveSettings();
      if (sheetKind === 'gear') elSheetBody.innerHTML = gearSheetBodyHTML();
      break;
    case 'reset': resetWorkout(); break;
    case 'brief-expand': {
      const bt = byId('brief-text');
      const bm = byId('brief-more');
      if (bt) {
        bt.classList.toggle('clamped');
        if (bm) bm.textContent = bt.classList.contains('clamped') ? 'EXPAND' : 'COLLAPSE';
      }
      break;
    }
    case 'more-advice': openAdviceSheet(); break;
    case 'note-open': openNoteSheet(); break;
    case 'receipt-expand': {
      dockCollapsed = false;
      const dz = byId('dock-zone');
      if (dz) dz.innerHTML = dockZoneHTML();
      syncBoardRoomy();
      saveState(); // dockCollapsed is persisted state — a reload must not re-collapse
      break;
    }
    case 'set-current': setCurrentFromView(); break;
    case 'return-live': returnToWorking(); break;
    case 'adj-minus': adjustRest(-15); break;
    case 'adj-plus': adjustRest(30); break;
    case 'adj-skip': skipRest(); break;
    case 'adj-pause':
      if (state === 'resting') pauseRest();
      else if (state === 'paused') resumeRest();
      break;
  }
});
// The ONLY text input lives in the note sheet; every keystroke writes the active log.
elSheetBody.addEventListener('input', (e) => {
  if (e.target && e.target.id === 'note-input') {
    const log = getActiveLogForEdit();
    if (log) {
      log.note = e.target.value;
      saveState();
    }
  }
});
elSheetBackdrop.addEventListener('click', closeSheet);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && sheetKind) closeSheet();
});

// Rail tap shim: RAW touch events (≤15px slop, ≤700ms tap, 500ms long-press → ORDER
// sheet, 500ms synthetic-click swallow, contextmenu prevented). Click fallback for
// desktop mouse.
let railTapInfo = null;
let railLongPressTimer = null;
let lastRailTouchTap = 0;
elRail.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) { railTapInfo = null; return; }
  const t = e.touches[0];
  railTapInfo = { x: t.clientX, y: t.clientY, time: Date.now(), target: e.target };
  if (railLongPressTimer) clearTimeout(railLongPressTimer);
  railLongPressTimer = setTimeout(() => {
    railLongPressTimer = null;
    if (railTapInfo) {
      railTapInfo = null;
      lastRailTouchTap = Date.now(); // swallow the synthetic click after the long-press
      if (state !== 'finished') openOrderSheet();
    }
  }, 500);
}, { passive: true });
elRail.addEventListener('touchmove', (e) => {
  if (!railTapInfo) return;
  const t = e.touches[0];
  if (!t) return;
  if (Math.abs(t.clientX - railTapInfo.x) > 15 || Math.abs(t.clientY - railTapInfo.y) > 15) {
    railTapInfo = null;
    if (railLongPressTimer) { clearTimeout(railLongPressTimer); railLongPressTimer = null; }
  }
}, { passive: true });
elRail.addEventListener('touchend', (e) => {
  if (railLongPressTimer) { clearTimeout(railLongPressTimer); railLongPressTimer = null; }
  if (!railTapInfo) return;
  const info = railTapInfo;
  railTapInfo = null;
  if (Date.now() - info.time > 700) return;
  if (e.changedTouches && e.changedTouches[0]) {
    const t = e.changedTouches[0];
    if (Math.abs(t.clientX - info.x) > 15 || Math.abs(t.clientY - info.y) > 15) return;
  }
  if (handleRailTap(info.target)) {
    lastRailTouchTap = Date.now();
    try { e.preventDefault(); } catch (err) {}
  }
}, { passive: false });
elRail.addEventListener('touchcancel', () => {
  railTapInfo = null;
  if (railLongPressTimer) { clearTimeout(railLongPressTimer); railLongPressTimer = null; }
}, { passive: true });
elRail.addEventListener('click', (e) => {
  if (Date.now() - lastRailTouchTap < 500) return;
  handleRailTap(e.target);
});
elRail.addEventListener('contextmenu', (e) => e.preventDefault());

// ============ BACKGROUND RETURN ============
// Shared handler for tab-return + BFCache restore (iOS back/forward swipe closes
// AudioContexts). Audio recovery runs FIRST — before any path that fires audio.
function handleResumeFromBackground() {
  recoverAudioCtx();
  if (state === 'resting' && restEndTime) {
    const remaining = Math.ceil((restEndTime - Date.now()) / 1000);
    if (remaining <= 0) {
      // Clear the interval BEFORE restDone — the visibility handler and the 100ms
      // tick used to double-fire it (restDone's state guard is the second net).
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      restDone();
    } else {
      restRemaining = remaining;
      // Threshold catch-up: every threshold already passed while backgrounded is
      // pre-marked so nothing announces late and stale.
      renormalizeCountdownThresholds();
      lastPaintedSec = null;
      paintRestVisuals(Math.max(0, (restEndTime - Date.now()) / 1000));
      startAudioKeepalive();
    }
  }
  // Wake lock re-acquire for ALL active states INCLUDING 'ready'.
  if (isActiveState() && !wakeLock) requestWakeLock();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  handleResumeFromBackground();
});
window.addEventListener('pageshow', (e) => {
  if (e.persisted) handleResumeFromBackground();
});

// ============ INIT ============
// URL reset (?reset=1) wipes saved workout state, then strips itself. The undo stack
// is deliberately NOT named `history` — window.history must stay reachable here.
if (new URLSearchParams(location.search).has('reset')) {
  try { localStorage.removeItem('gtsol-state'); } catch (e) {}
  try { window.history.replaceState(null, '', location.pathname); } catch (e) {}
}
VoiceCue.init();
attachGlobalAudioRecovery();
if (!restoreState()) {
  // Fresh load (no saved state, or TTL expired): IDLE. The START tap unlocks audio,
  // requests the wake lock, records workoutStartTime, and plays the opening chain.
  state = 'pre-start';
  render();
}
// 1Hz header elapsed register (textContent only).
setInterval(() => {
  if (workoutStartTime && state !== 'finished' && state !== 'pre-start') renderHeader();
}, 1000);
</script>
