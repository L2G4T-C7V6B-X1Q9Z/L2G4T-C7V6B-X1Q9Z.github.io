<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>gymboard</title>

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Crect x='12' y='12' width='40' height='19' fill='%23e2e2e2'/%3E%3Crect x='12' y='33' width='40' height='19' fill='%23e0261f'/%3E%3C/svg%3E">

<style>/* gymboard v2 — black ground, one red, grays. Every "how much" is dither density. */
:root{
  --bg:#000;--s1:#0f0f0f;--s2:#171717;--s3:#202020;--line:#262626;--line2:#333;
  --tx:#ededed;--tx2:#9a9a9a;--tx3:#5c5c5c;--red:#e0261f;--red2:#ff453a;--fill:#e2e2e2;--tan:#4a4238;
  --sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable","Segoe UI",Roboto,Inter,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color:var(--tx);font:16px/1.35 var(--font);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;overscroll-behavior:none;color-scheme:dark}
body{margin:0;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:2px}
h1,h2,h3,p,ul{margin:0}ul{padding:0;list-style:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;height:100dvh}
#screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 8px) 16px 24px;scroll-padding-bottom:40px}
#screen>*+*{margin-top:14px}
/* status line */
#net{position:absolute;top:calc(var(--sat) + 6px);right:12px;font-size:11px;color:var(--tx3);pointer-events:none;letter-spacing:.01em;z-index:2;background:rgba(0,0,0,.85);padding:3px 8px;border-radius:999px}
#net::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--tx3);margin-right:6px;vertical-align:1px}
#net[data-state=live]::before{background:var(--fill)}#net[data-state=syncing]::before{background:var(--tx2);animation:blink 1s infinite}
#net[data-state=offline]::before,#net[data-state=error]::before{background:var(--red)}
@keyframes blink{50%{opacity:.2}}
/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:22px 0 4px;min-height:74px}
.top h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.top .sub{color:var(--tx2);font-size:14px;margin-top:6px}
.icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--tx2);font-size:26px;line-height:1;background:var(--s1)}
.icon:active{background:var(--s3)}.icon.dim{color:var(--tx3)}.icon:disabled{opacity:.3}
.nav{display:flex;gap:6px}
.seg{display:flex;background:var(--s1);border-radius:10px;padding:3px}
.seg button{padding:8px 12px;border-radius:8px;font-size:13px;color:var(--tx2)}
.seg button[aria-pressed=true]{background:var(--s3);color:var(--tx)}
/* week strip: the hero */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sq{position:relative;aspect-ratio:1/1.35;border-radius:9px;overflow:hidden;background:var(--s2);display:flex;flex-direction:column}
.sq-w,.sq-n{flex:1;display:block}
.sq-l{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:10px;font-weight:600;color:var(--tx3);mix-blend-mode:difference}
.sq.is-today::after{content:"";position:absolute;inset:0;border-radius:9px;box-shadow:inset 0 0 0 2px var(--red);pointer-events:none}
/* stats row */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stats div{background:var(--s1);border-radius:12px;padding:12px 8px 10px;text-align:center}
.stats b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1}
.stats span{display:block;font-size:11px;color:var(--tx2);margin-top:6px}
/* cards */
.card{background:var(--s1);border-radius:16px;padding:16px}
.card h2{font-size:15px;font-weight:600;color:var(--tx2)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.hint{font-size:13px;color:var(--tx2);text-align:right}
.slab{padding:10px}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.type{height:92px;border-radius:12px;background:var(--s2);font-size:19px;font-weight:700;text-transform:capitalize;letter-spacing:-.01em;position:relative;overflow:hidden;transition:transform .08s}
.type::after{content:"";position:absolute;inset:auto 0 0 0;height:22%;background:var(--fill);opacity:.9;-webkit-mask:var(--d4);mask:var(--d4)}
.type:active{transform:scale(.97);background:var(--s3)}
.big{width:100%;min-height:104px;border-radius:12px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:18px 20px;text-align:left;gap:6px;position:relative;overflow:hidden}
.big-t{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1}
.big-s{font-size:13px;opacity:.7}
.big.done{background:var(--fill);color:#000}
.big.off{background:var(--s2);color:var(--tx)}
.big.todo{background:var(--s2)}
.big.todo::after{content:"";position:absolute;inset:0;background:var(--fill);opacity:.12;-webkit-mask:var(--d2);mask:var(--d2)}
.slab-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 6px 4px;font-size:13px;color:var(--tx2);flex-wrap:wrap}
.link{color:var(--tx);font-size:13px;font-weight:600;padding:6px 0;text-decoration:underline;text-decoration-color:var(--tx3);text-underline-offset:3px}
/* nutrition bars */
.bar+.bar{margin-top:14px}
.bar-h{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--tx2)}
.bar-h b{font-size:22px;font-weight:800;color:var(--tx);letter-spacing:-.02em}
.bar-h i{font-style:normal;font-weight:400;font-size:13px;color:var(--tx2);margin-left:2px}
.bar-t{height:18px;border-radius:5px;background:var(--s2);margin-top:6px;overflow:hidden}
.bar-f{height:100%;background:var(--fill);transition:width .25s ease}
.bar.is-over .bar-f{background:var(--red)}
.nut.is-hit .bar-f{background:var(--fill)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{background:var(--s2);border-radius:10px;padding:9px 12px;font-size:14px;font-weight:600;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:44px;justify-content:center}
.chip small{font-size:11px;color:var(--tx2);font-weight:400}
.chip.add{border:1px dashed var(--line2);background:none;color:var(--tx2)}
.chip:active{background:var(--s3)}
.meals{margin-top:12px;border-top:1px solid var(--line)}
.meals li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.meals li span{flex:1;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meals li b{font-weight:500;color:var(--tx2)}
.x{width:32px;height:32px;border-radius:8px;color:var(--tx3);font-size:20px;line-height:1;display:grid;place-items:center}
.x:active{background:var(--s3);color:var(--tx)}
/* weigh-in */
.inline{display:flex;gap:8px}
.inline input{flex:1;height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--bg);padding:0 14px;font-size:18px;font-weight:600;min-width:0}
.inline button{height:48px;padding:0 20px;border-radius:12px;background:var(--fill);color:#000;font-weight:700}
/* board grid */
.grid{display:grid;grid-template-columns:44px repeat(var(--cols),1fr);gap:4px;align-items:stretch}
.gh{font-size:12px;color:var(--tx2);text-align:center;padding:4px 0 6px;line-height:1.2;overflow:hidden}
.gh b{display:block;color:var(--tx);font-weight:700;font-size:13px}
.gh span{font-size:10px;color:var(--tx3)}
.gh.inactive b{color:var(--tx3)}
.gr{display:flex;flex-direction:column;justify-content:center;padding-left:2px;font-size:12px;color:var(--tx2);line-height:1.1;position:relative}
.gr small{font-size:11px;color:var(--tx3)}
.gr.is-today{color:var(--red2)}.gr.is-today small{color:var(--red2)}
.gr.is-today::before{content:"";position:absolute;left:-6px;top:20%;bottom:20%;width:3px;border-radius:2px;background:var(--red)}
.cell{aspect-ratio:1/1.15;border-radius:6px;overflow:hidden;background:var(--s2);display:flex;flex-direction:column;position:relative}
.cell:active{filter:brightness(1.4)}
.cw,.cn{flex:1;display:block;position:relative}
.cw{font-size:8px;line-height:1;color:var(--tx2);display:grid;place-items:center;font-weight:600}
.gf{font-size:12px;color:var(--tx2);text-align:center;padding-top:6px;line-height:1.25}
.gf b{display:block;color:var(--tx);font-weight:700}
.gf span{font-size:10px;color:var(--tx3)}
/* cell states — workout half */
.w-done{background:var(--fill)}.w-missed{background:var(--red)}
.w-rest,.w-off{background:var(--s2);color:var(--tx3)}
.w-vacation{background:var(--tan);color:#a99}.w-paused{background:#2a2a2a;color:var(--tx3)}
.w-pending{background:var(--s2);box-shadow:inset 0 0 0 1px var(--line2)}
.w-prejoin{background:transparent}
/* nutrition half: solid = hit; otherwise a dithered fill whose density = progress */
.cn,.sq-n{background:var(--s3)}
.n-hit{background:var(--fill)!important}
.n-vacation{background:var(--tan)!important}
.n-prejoin{background:transparent!important}
.n-pending::after,.n-none::after{content:"";position:absolute;inset:0;background:var(--fill);-webkit-mask:var(--dm);mask:var(--dm)}
.n-none::after{opacity:.35}
.n-pending.d0::after,.n-none.d0::after{display:none}
.legend{display:flex;flex-wrap:wrap;gap:12px 16px;font-size:12px;color:var(--tx2);padding:4px 2px}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block;position:relative;overflow:hidden}
.sw.n-pending{background:var(--s3)}
.foot{font-size:12px;color:var(--tx3);line-height:1.45;padding:0 2px}
/* trends */
.chart{background:var(--s1);border-radius:16px;padding:8px 6px 4px}
.chart svg{width:100%;height:auto;display:block;aspect-ratio:360/220}
.chart .grid{stroke:var(--line);stroke-width:1;shape-rendering:crispEdges}
.chart .zero{stroke:var(--line2);stroke-width:1.5;shape-rendering:crispEdges}
.chart .tick{fill:var(--tx3);font-size:10px;text-anchor:end;font-family:var(--font)}
.chart path{fill:none;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.chart path.other{stroke:#6a6a6a;stroke-width:1.5}
.chart path.me{stroke:var(--red2);stroke-width:2.5}
.chart .lbl{fill:var(--tx2);font-size:11px;font-weight:700;font-family:var(--font)}
.chart .lbl.me{fill:var(--red2)}
.empty{color:var(--tx3);text-align:center;padding:60px 0;font-size:14px}
.wlist li{display:flex;gap:10px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);font-size:15px}
.wlist i{width:10px;height:3px;border-radius:2px;background:#6a6a6a;flex:none}
.wlist li.me i{background:var(--red2)}
.wlist div{flex:1;display:flex;flex-direction:column;min-width:0}
.wlist small{color:var(--tx3);font-size:12px}
.wlist b{font-weight:600}
.wlist em{font-style:normal;color:var(--tx2);min-width:44px;text-align:right}
/* tab bar */
.tabs{display:flex;border-top:1px solid var(--line);background:var(--bg);padding-bottom:var(--sab)}
.tab{flex:1;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--tx3);font-weight:600}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected=true]{color:var(--tx)}
.tab[aria-selected=true] svg{stroke:var(--red2)}
/* sheet */
#sheet[hidden],#toast[hidden],#update[hidden]{display:none!important}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:10;backdrop-filter:blur(2px)}
#sheet-body{width:100%;max-height:88dvh;overflow-y:auto;background:var(--s1);border-radius:20px 20px 0 0;padding:14px 18px calc(var(--sab) + 20px);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.sh-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.sh-h h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
.sh-h .sub{color:var(--tx2);font-size:13px;margin-top:2px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.kv span{color:var(--tx2)}.kv b{font-weight:600;text-align:right}
.s-done,.s-hit{color:var(--tx)}.s-missed,.s-none{color:var(--red2)}.s-pending{color:var(--tx2)}
.sh-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.sh-acts button{flex:1 1 auto;min-height:46px;padding:0 14px;border-radius:12px;background:var(--s3);font-weight:600;font-size:14px}
.fields{display:flex;flex-direction:column;gap:12px}
.fields label:not(.chk):not(.pill){display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--tx2)}
.fields input:not([type=checkbox]),.fields select{height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--bg);padding:0 14px;font-size:17px;color:var(--tx);width:100%;-webkit-appearance:none;appearance:none}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--red)}
.lbl{font-size:13px;color:var(--tx2);margin-top:4px}
.days{display:flex;flex-wrap:wrap;gap:8px}
.pill input{position:absolute;opacity:0;width:0;height:0}
.pill span{display:inline-block;padding:9px 12px;border-radius:10px;background:var(--s2);font-size:14px;font-weight:600;min-width:46px;text-align:center;text-transform:capitalize}
.pill input:checked+span{background:var(--fill);color:#000}
.pill input:focus-visible+span{outline:2px solid var(--red)}
.primary{height:50px;border-radius:12px;background:var(--fill);color:#000;font-weight:700;font-size:16px;margin-top:6px}
/* misc */
.gate{padding:80px 8px;text-align:center}.gate h1{font-size:34px;font-weight:800;letter-spacing:-.03em}.gate p{color:var(--tx2);margin-top:12px;font-size:15px}.gate .err{color:var(--red2)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(var(--sab) + 70px);background:var(--s3);color:var(--tx);padding:12px 14px;border-radius:12px;font-size:14px;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#toast[data-bad="1"]{background:#3a1210;color:#ffb4ae}
#update{position:fixed;top:calc(var(--sat) + 30px);left:50%;transform:translateX(-50%);background:var(--fill);color:#000;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;z-index:20}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
