  function hexToBytes(h){var b=new Uint8Array(h.length/2);for(var i=0;i<h.length;i+=2)b[i/2]=parseInt(h.substr(i,2),16);return b;}
  function b64ToBytes(s){var bin=atob(s);var b=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b;}

  async function decrypt(password){
    var salt=hexToBytes(SALT);
    var iv=hexToBytes(IV);
    var tag=hexToBytes(TAG);
    var ct=b64ToBytes(DATA);
    var enc=new TextEncoder();
    var keyMaterial=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:600000,hash:'SHA-256'},keyMaterial,{name:'AES-GCM',length:256},false,['decrypt']);
    var combined=new Uint8Array(ct.length+tag.length);
    combined.set(ct);combined.set(tag,ct.length);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,combined);
    return new TextDecoder().decode(plain);
  }

  var input=document.querySelector('.auth-input');
  var err=document.querySelector('.auth-err');
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter'){
      err.textContent='';
      decrypt(input.value).then(function(html){
        document.open();document.write(html);document.close();
      }).catch(function(){
        err.textContent='Incorrect password';
        input.value='';input.focus();
      });
    }
  });
})();
