  function hex2buf(h){var b=new Uint8Array(h.length/2);for(var i=0;i<b.length;i++)b[i]=parseInt(h.substr(i*2,2),16);return b.buffer;}
  function b642buf(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer;}
  function decrypt(pw){
    var enc=new TextEncoder();
    return crypto.subtle.importKey('raw',enc.encode(pw),{name:'PBKDF2'},false,['deriveKey']).then(function(k){
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:hex2buf(SALT),iterations:600000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);

      var tb=hex2buf(TAG);
      var merged=new Uint8Array(ct.byteLength+tb.byteLength);

      merged.set(new Uint8Array(tb),ct.byteLength);
      return crypto.subtle.decrypt({name:'AES-GCM',iv:hex2buf(IV)},dk,merged.buffer);

        input.value='';
