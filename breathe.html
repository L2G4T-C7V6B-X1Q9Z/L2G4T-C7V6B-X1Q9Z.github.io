<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        /* ============================================
           BASE STYLES
           ============================================ */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            cursor: default;
        }

        body {
            font-family: ui-monospace, 'SF Mono', SFMono-Regular, 'JetBrains Mono',
                         Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
            transition: background-color 0.1s linear;
        }

        /* ============================================
           CLOCK
           ============================================ */
        #clock {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 10;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        #clock.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #time {
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 0.05em;
            color: rgba(255, 255, 255, 0.4);
            line-height: 1.2;
        }

        #date {
            font-size: 16px;
            font-weight: 300;
            letter-spacing: 0.03em;
            color: rgba(255, 255, 255, 0.25);
            line-height: 1.4;
            margin-top: 4px;
        }

        #kaomoji {
            font-size: 14px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.2);
            line-height: 1.4;
            margin-top: 8px;
        }

        /* ============================================
           SETTINGS PANEL
           ============================================ */
        #settings-panel {
            position: fixed;
            bottom: 24px;
            left: 24px;
            width: 300px;
            background: rgba(15, 15, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            z-index: 100;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
        }

        #settings-panel.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        @supports (backdrop-filter: blur(20px)) {
            #settings-panel {
                background: rgba(15, 15, 20, 0.7);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
            }
        }

        .settings-header {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.02em;
        }

        .settings-content {
            padding: 16px 20px;
        }

        .settings-group {
            margin-bottom: 16px;
        }

        .settings-group:last-child {
            margin-bottom: 0;
        }

        .settings-group label {
            display: block;
            font-size: 11px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.02em;
            margin-bottom: 8px;
        }

        /* Theme buttons */
        .theme-options {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .theme-btn {
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.5);
            font-family: inherit;
            font-size: 11px;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .theme-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.7);
        }

        .theme-btn.active {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.9);
        }

        .theme-btn.night-theme {
            background: rgba(180, 83, 40, 0.15);
            border-color: rgba(212, 165, 116, 0.3);
        }

        .theme-btn.night-theme:hover {
            background: rgba(180, 83, 40, 0.25);
        }

        .theme-btn.night-theme.active {
            background: rgba(180, 83, 40, 0.35);
            border-color: rgba(212, 165, 116, 0.5);
        }

        /* Sliders */
        input[type="range"] {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }

        /* Toggle buttons */
        .toggle-options {
            display: flex;
            gap: 8px;
        }

        .toggle-btn {
            flex: 1;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.5);
            font-family: inherit;
            font-size: 11px;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .toggle-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.7);
        }

        .toggle-btn.active {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.9);
        }

        /* Action buttons */
        .action-btn {
            width: 100%;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.6);
            font-family: inherit;
            font-size: 11px;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.8);
        }

        .settings-footer {
            padding: 12px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .hotkey-hint {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.25);
        }

        /* ============================================
           PAUSE INDICATOR
           ============================================ */
        #pause-indicator {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.4);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        #pause-indicator.visible {
            opacity: 1;
        }

        /* ============================================
           REDUCED MOTION
           ============================================ */
        @media (prefers-reduced-motion: reduce) {
            body {
                transition: none;
            }
        }

        /* ============================================
           PRINT
           ============================================ */
        @media print {
            body * {
                display: none !important;
            }
        }
    </style>
</head>

        /* ============================================
           COLOR INTERPOLATION
           ============================================ */
        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        function lerpColor(color1, color2, t) {
            return {
                r: Math.round(lerp(color1.r, color2.r, t)),
                g: Math.round(lerp(color1.g, color2.g, t)),
                b: Math.round(lerp(color1.b, color2.b, t))
            };
        }

        function colorToRgb(color) {
            return `rgb(${color.r}, ${color.g}, ${color.b})`;
        }

        /* ============================================
           BREATHING ANIMATION
           ============================================ */
        function easeInOutSine(t) {
            return -(Math.cos(Math.PI * t) - 1) / 2;
        }

        function animate(timestamp) {
            if (!state.startTime) state.startTime = timestamp;

            if (state.isPaused) {
                state.animationId = requestAnimationFrame(animate);
                return;
            }

            const cycleDuration = (60 / state.breathingRate) * 1000; // ms per breath
            const elapsed = (timestamp - state.startTime) % cycleDuration;
            const progress = elapsed / cycleDuration;

            // 0 to 0.5 = inhale (exhale color -> inhale color)
            // 0.5 to 1 = exhale (inhale color -> exhale color)
            let t;
            if (progress < 0.5) {
                // Inhale phase: 0->1 over first half
                t = easeInOutSine(progress * 2);
            } else {
                // Exhale phase: 1->0 over second half
                t = easeInOutSine(1 - (progress - 0.5) * 2);
            }

            const theme = themes[state.theme];
            const currentColor = lerpColor(theme.exhale, theme.inhale, t);
            elements.body.style.backgroundColor = colorToRgb(currentColor);

            state.animationId = requestAnimationFrame(animate);
        }

        function startAnimation() {
            state.startTime = null;
            if (state.animationId) {
                cancelAnimationFrame(state.animationId);
            }
            state.animationId = requestAnimationFrame(animate);
        }

        /* ============================================
           THEME MANAGEMENT
           ============================================ */
        function setTheme(theme) {
            state.theme = theme;

            // Update active button
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.theme === theme);
            });

            // Save preference
            localStorage.setItem('breathe-theme', theme);
        }

        /* ============================================
           BREATHING RATE
           ============================================ */
        function setBreathingRate(bpm) {
            state.breathingRate = bpm;
            elements.rateDisplay.textContent = bpm.toFixed(1);
            localStorage.setItem('breathe-rate', bpm);
        }

        /* ============================================
           CLOCK
           ============================================ */
        function updateClock() {
            const now = new Date();

            // Time: H:MM AM/PM (12-hour format)
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            elements.time.textContent = `${hours}:${minutes} ${ampm}`;

            // Date: Day, Mon DD, YYYY
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                            'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const day = days[now.getDay()];
            const month = months[now.getMonth()];
            const date = now.getDate();
            const year = now.getFullYear();
            elements.date.textContent = `${day}, ${month} ${date}, ${year}`;
        }

        function toggleClock(visible) {
            state.clockVisible = visible;
            elements.clock.classList.toggle('hidden', !visible);

            document.querySelectorAll('.toggle-btn[data-clock]').forEach(btn => {
                btn.classList.toggle('active', (btn.dataset.clock === 'on') === visible);
            });

            localStorage.setItem('breathe-clock', visible);
        }

        function displayRandomKaomoji() {
            const randomIndex = Math.floor(Math.random() * kaomojis.length);
            elements.kaomoji.textContent = kaomojis[randomIndex];
        }

        /* ============================================
           SETTINGS PANEL
           ============================================ */
        function showSettings() {
            state.settingsVisible = true;
            elements.settingsPanel.classList.add('visible');
            clearTimeout(state.settingsTimeout);
        }

        function hideSettings() {
            state.settingsVisible = false;
            elements.settingsPanel.classList.remove('visible');
        }

        function scheduleSettingsHide() {
            clearTimeout(state.settingsTimeout);
            state.settingsTimeout = setTimeout(() => {
                if (state.settingsVisible) {
                    hideSettings();
                }
            }, 3000);
        }

        /* ============================================
           PAUSE/PLAY
           ============================================ */
        function togglePause() {
            state.isPaused = !state.isPaused;
            elements.pauseIndicator.classList.toggle('visible', state.isPaused);

            if (!state.isPaused) {
                // Reset start time to continue smoothly
                state.startTime = null;
            }
        }

        /* ============================================
           FULLSCREEN
           ============================================ */
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
                elements.fullscreenBtn.textContent = 'Exit Fullscreen';
            } else {
                document.exitFullscreen();
                elements.fullscreenBtn.textContent = 'Enter Fullscreen';
            }
        }

        /* ============================================
           EVENT LISTENERS
           ============================================ */
        function initEventListeners() {
            // Mouse movement shows settings
            document.addEventListener('mousemove', () => {
                showSettings();
                scheduleSettingsHide();
            });

            // Keep settings visible while hovering
            elements.settingsPanel.addEventListener('mouseenter', () => {
                clearTimeout(state.settingsTimeout);
            });

            elements.settingsPanel.addEventListener('mouseleave', () => {
                scheduleSettingsHide();
            });

            // Theme buttons
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    setTheme(btn.dataset.theme);
                });
            });

            // Clock toggle
            document.querySelectorAll('.toggle-btn[data-clock]').forEach(btn => {
                btn.addEventListener('click', () => {
                    toggleClock(btn.dataset.clock === 'on');
                });
            });

            // Rate slider
            elements.rateSlider.addEventListener('input', (e) => {
                setBreathingRate(parseFloat(e.target.value));
            });

            // Fullscreen button
            elements.fullscreenBtn.addEventListener('click', toggleFullscreen);

            // Fullscreen change event
            document.addEventListener('fullscreenchange', () => {
                elements.fullscreenBtn.textContent = document.fullscreenElement
                    ? 'Exit Fullscreen'
                    : 'Enter Fullscreen';
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key.toLowerCase() === 's') {
                    if (state.settingsVisible) {
                        hideSettings();
                    } else {
                        showSettings();
                        scheduleSettingsHide();
                    }
                } else if (e.key.toLowerCase() === 'h') {
                    toggleClock(!state.clockVisible);
                } else if (e.key === ' ') {
                    e.preventDefault();
                    togglePause();
                } else if (e.key.toLowerCase() === 'f') {
                    toggleFullscreen();
                }
            });
        }

        /* ============================================
           INITIALIZATION
           ============================================ */
        function loadSavedSettings() {
            const savedTheme = localStorage.getItem('breathe-theme');
            if (savedTheme && themes[savedTheme]) setTheme(savedTheme);

            const savedRate = localStorage.getItem('breathe-rate');
            if (savedRate) {
                const rate = parseFloat(savedRate);
                setBreathingRate(rate);
                elements.rateSlider.value = rate;
            }

            const savedClock = localStorage.getItem('breathe-clock');
            if (savedClock !== null) {
                toggleClock(savedClock === 'true');
            }
        }

        function init() {
            // Initialize clock
            updateClock();
            setInterval(updateClock, 1000);

            // Display random kaomoji
            displayRandomKaomoji();

            // Load saved settings
            loadSavedSettings();

            // Initialize event listeners
            initEventListeners();

            // Start breathing animation
            startAnimation();

            // Start with settings hidden
            hideSettings();
        }

        // Run on DOM ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
