<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Gym Timer — LIQUID</title>
<!-- The ONLY external resource — loaded NON-BLOCKING (media=print, flipped to all on
     load) so a stalled/captive gym connection can never hang first paint. display=optional
     means the font applies only when ready immediately (HTTP cache after first visit) and
     never swaps in mid-session — no live-countdown re-metric. The tuned system stack below
     (SF Pro on iOS — the native glass look) keeps LIQUID fully styled if this never loads. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=optional" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* ════════════ LIQUID — fluid glass on OLED black ════════════ */
/* ============ TOKENS ============ */
:root {
  --bg:#050505;
  --red:#ff3b30;
  --red-hi:#ff6157;
  --red-soft:rgba(255,59,48,.14);
  --red-line:rgba(255,59,48,.40);
  --red-deep:#2a0f0d;
  --ink:#f4f4f6;
  --ink2:rgba(244,244,246,.62);
  --ink3:rgba(244,244,246,.38);
  --ink4:rgba(244,244,246,.24);
  --glass:rgba(255,255,255,.055);
  --glass-hi:rgba(255,255,255,.085);
  --glass-press:rgba(255,255,255,.16);
  --stroke:rgba(255,255,255,.09);
  --stroke-soft:rgba(255,255,255,.06);
  --font:'Outfit',-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',system-ui,'Segoe UI Variable Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --spring:cubic-bezier(.34,1.45,.4,1);
  --ease:cubic-bezier(.22,.9,.3,1);
  --r-panel:26px;
  --r-cap:999px;
  --shadow-deep:0 18px 44px rgba(0,0,0,.52);
  --inset-hi:inset 0 1px 0 rgba(255,255,255,.08);
}
/* ============ BASE ============ */
* { margin:0; padding:0; box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
html, body { height:100%; background:var(--bg); overscroll-behavior:none; }
body {
  font-family:var(--font);
  font-size:14px; line-height:1.5;
  font-weight:400;
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
  overflow:hidden;
  /* Global selection/zoom block (engine parity): no long-press callout/magnifier on
     stage content, no double-tap smart-zoom. .note-input restores selection. */
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  touch-action:manipulation;
}
::selection { background:rgba(255,255,255,.18); color:var(--ink); }
button {
  font:inherit; color:inherit; background:none; border:none; cursor:pointer;
  touch-action:manipulation;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
button:disabled { cursor:default; }
:focus { outline:none; }
:focus-visible { outline:1px solid var(--ink2); outline-offset:3px; border-radius:999px; }
.num { font-variant-numeric:tabular-nums lining-nums; font-feature-settings:"tnum" 1,"lnum" 1; }
.kicker {
  font-weight:700; font-size:10.5px;
  letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink3);
}
.hidden { display:none !important; }
/* Frosted glass panel. backdrop-filter is granted to a strict few (.frost) — the rail,
   the grading dock, and the sheet — so iOS never composites more than ~3 blur layers. */
.glass {
  background:linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.045));
  border:1px solid var(--stroke);
  border-radius:var(--r-panel);
  box-shadow:var(--shadow-deep), var(--inset-hi);
}
.frost {
  -webkit-backdrop-filter:blur(24px);
  backdrop-filter:blur(24px);
}

/* ============ APP FRAME ============ */
#app {
  position:fixed; inset:0;
  height:100vh; height:100dvh;
  background:var(--bg);
  display:flex; flex-direction:column;
  overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);
}
@media (min-width:500px) {
  #app {
    left:50%; right:auto; transform:translateX(-50%);
    width:430px;
    box-shadow:0 0 0 1px rgba(255,255,255,.07), 0 60px 160px rgba(0,0,0,.7);
  }
}

/* ============ AMBIENT GLOWS (breathing red light) ============ */
#ambient { position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.glow { position:absolute; pointer-events:none; will-change:transform,opacity; }
.glow-top {
  width:165%; aspect-ratio:1/1; left:50%; top:-44%;
  transform:translateX(-50%);
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,59,48,.17) 0%, rgba(255,59,48,.06) 38%, rgba(255,59,48,0) 68%);
  animation:breatheA 8s ease-in-out infinite;
}
.glow-low {
  width:125%; aspect-ratio:1/1; right:-58%; bottom:-50%;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,59,48,.085) 0%, rgba(255,59,48,0) 62%);
  animation:breatheB 8s ease-in-out infinite;
  animation-delay:-4s;
}
@keyframes breatheA {
  0%,100% { opacity:.55; transform:translateX(-50%) scale(1); }
  50%     { opacity:.92; transform:translateX(-50%) scale(1.07); }
}
@keyframes breatheB {
  0%,100% { opacity:.5;  transform:scale(1); }
  50%     { opacity:.85; transform:scale(1.06); }
}
/* Final-10s intensify: the room heats up. Toggled by syncAmbient() (class on #app),
   transform/opacity only. */
#app.glow-hot .glow-top { animation:breatheHotA 1.5s ease-in-out infinite; }
#app.glow-hot .glow-low { animation:breatheHotB 1.5s ease-in-out infinite; }
@keyframes breatheHotA {
  0%,100% { opacity:.85; transform:translateX(-50%) scale(1.03); }
  50%     { opacity:1;   transform:translateX(-50%) scale(1.13); }
}
@keyframes breatheHotB {
  0%,100% { opacity:.75; transform:scale(1.02); }
  50%     { opacity:1;   transform:scale(1.1); }
}

/* ============ GO WASH (red glass flood) ============ */
#wash {
  position:absolute; inset:0; z-index:90;
  opacity:0; pointer-events:none;
  background:
    radial-gradient(120% 90% at 50% 28%, rgba(255,86,74,.6), rgba(255,59,48,.3) 52%, rgba(150,18,11,.16) 100%);
}
#wash.washing { animation:lq-flood 680ms var(--ease) forwards; }
@keyframes lq-flood {
  0%   { opacity:0; }
  14%  { opacity:.9; }
  100% { opacity:0; }
}

/* ============ HEADER (naked — glow shines through) ============ */
#hdr {
  height:54px; flex:0 0 54px;
  display:flex; align-items:center; justify-content:space-between;
  padding:2px 8px 0 18px;
  position:relative; z-index:20;
}
#hdr-left {
  font-weight:700; font-size:12px; letter-spacing:.15em;
  color:var(--ink3); text-transform:uppercase; white-space:nowrap;
}
#hdr-left .day { color:var(--ink2); }
#hdr-right { display:flex; align-items:center; gap:2px; }
#hdr-reg {
  font-variant-numeric:tabular-nums lining-nums; font-feature-settings:"tnum" 1;
  font-weight:500; font-size:10.5px; color:var(--ink3);
  letter-spacing:.03em; white-space:nowrap;
  margin-right:5px;
}
.pip-status { width:5px; height:5px; border-radius:50%; margin:0 3px; flex:0 0 auto; background:rgba(255,255,255,.14); }
#pip-wake.held { background:rgba(255,255,255,.5); }
#pip-wake.lost { background:transparent; border:1px solid var(--red); }
#pip-save { background:transparent; }
#pip-save.fail { background:var(--red); box-shadow:0 0 8px rgba(255,59,48,.6); }
#undo-btn, #gear-btn {
  min-width:44px; min-height:44px;
  display:flex; align-items:center; justify-content:center;
  color:var(--ink3); border-radius:999px;
  transition:transform 240ms var(--spring), color 140ms ease;
}
#undo-btn { font-weight:700; font-size:10px; letter-spacing:.16em; }
#undo-btn:disabled { opacity:.28; }
#undo-btn:active:not(:disabled), #gear-btn:active { color:var(--ink2); transform:scale(.92); }
#gear-btn svg { width:18px; height:18px; display:block; }

/* ============ RAIL (floating frost capsule) ============ */
#rail {
  flex:0 0 auto;
  height:62px;
  margin:2px 12px 6px;
  display:flex; align-items:stretch;
  padding:0 4px;
  border-radius:22px;
  background:var(--glass);
  border:1px solid var(--stroke-soft);
  box-shadow:0 14px 34px rgba(0,0,0,.45), var(--inset-hi);
  position:relative; z-index:15;
  touch-action:manipulation;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
.tile {
  flex:1 1 0; min-width:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:6px; margin:5px 2px; padding:2px 1px;
  border-radius:16px;
  transition:background 220ms ease;
}
.tile .ab {
  font-weight:700; font-size:11.5px;
  letter-spacing:.12em; color:var(--ink3);
}
.tile.cur { background:rgba(255,255,255,.07); box-shadow:inset 0 1px 0 rgba(255,255,255,.07); }
.tile.cur .ab { color:var(--ink); }
.tile.donex .ab { color:var(--ink4); }
.tile .pips { display:flex; gap:5px; align-items:center; justify-content:center; }
.pip { width:9px; height:9px; border-radius:50%; flex:0 0 auto; box-sizing:border-box; }
.pip.fut  { border:1.5px solid rgba(255,255,255,.16); background:transparent; }
.pip.done { background:rgba(255,255,255,.32); }
/* Working set = SOLID red, breathing light. */
.pip.work { background:var(--red); animation:pipbreathe 2.4s ease-in-out infinite; }
@keyframes pipbreathe {
  0%,100% { box-shadow:0 0 3px rgba(255,59,48,.3); }
  50%     { box-shadow:0 0 11px rgba(255,59,48,.85); }
}
/* Browsed set = HOLLOW red ring. */
.pip.view { border:2px solid var(--red); background:transparent; box-shadow:0 0 8px rgba(255,59,48,.3); }

/* ============ STAGE + MOTION SYSTEM ============ */
#stage { flex:1 1 auto; position:relative; overflow:hidden; min-height:0; z-index:5; }
#stage-inner { position:absolute; inset:0; overflow:hidden; display:flex; flex-direction:column; }
#stage-inner.scrolly { overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
/* State entry: panels scale + blur in on a spring, staggered top-to-bottom. */
.stage-enter .lq-stack > * { animation:lq-in 460ms var(--spring) backwards; }
.stage-enter .lq-stack > :nth-child(2) { animation-delay:45ms; }
.stage-enter .lq-stack > :nth-child(3) { animation-delay:90ms; }
.stage-enter .lq-stack > :nth-child(4) { animation-delay:135ms; }
.stage-enter .lq-stack > :nth-child(5) { animation-delay:180ms; }
.stage-enter .lq-stack > :nth-child(6) { animation-delay:225ms; }
.stage-enter .lq-stack > :nth-child(7) { animation-delay:270ms; }
@keyframes lq-in {
  from { opacity:0; transform:translateY(16px) scale(.96); filter:blur(7px); }
  60%  { filter:blur(0); }
  to   { opacity:1; transform:none; filter:none; }
}
.stage-ghost {
  position:absolute; inset:0; z-index:5; pointer-events:none;
  animation:lq-ghost 200ms ease forwards;
  display:flex; flex-direction:column; overflow:hidden;
  background:var(--bg);
}
@keyframes lq-ghost { to { opacity:0; transform:translate(var(--gx,0px),10px) scale(.985); } }

/* ============ COMMIT — the white capsule ============ */
#commit {
  flex:0 0 auto;
  padding:8px 16px max(18px,env(safe-area-inset-bottom)) 16px;
  position:relative; z-index:20;
}
#commit-btn {
  width:100%; height:64px;
  border-radius:999px;
  background:linear-gradient(180deg,#ffffff,#e7e7ea);
  color:#0a0a0c;
  font-weight:800; font-size:16.5px;
  letter-spacing:.16em; text-transform:uppercase;
  box-shadow:0 16px 40px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.75);
  position:relative;
  transition:transform 260ms var(--spring), filter 140ms ease, background 160ms ease, color 160ms ease, box-shadow 160ms ease;
}
#commit-btn:active:not(:disabled) { transform:scale(.96); filter:brightness(.9); }
#commit-btn.inert {
  background:rgba(255,255,255,.05); color:var(--ink3);
  border:1px solid var(--stroke-soft); box-shadow:none;
  font-size:13.5px; letter-spacing:.14em; font-weight:700;
  font-variant-numeric:tabular-nums;
  pointer-events:none;
}
#commit-btn.go {
  background:linear-gradient(180deg,#ff5247,#df2d23); color:#fff; border:none;
  box-shadow:0 0 48px rgba(255,59,48,.45), 0 16px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.32);
  animation:goSpring 460ms var(--spring), goPulse 1.2s ease-in-out 460ms infinite;
}
@keyframes goSpring { 0% { transform:scale(.85); } 60% { transform:scale(1.04); } 100% { transform:scale(1); } }
@keyframes goPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.015); } }
#commit-btn.slash {
  background:rgba(255,255,255,.04); color:var(--ink3);
  border:1px dashed rgba(255,255,255,.18); box-shadow:none;
  font-size:13.5px; letter-spacing:.2em; font-weight:700;
  pointer-events:none;
}
#commit-btn.flash { animation:copyflash 180ms ease; }
@keyframes copyflash {
  0%   { box-shadow:0 0 0 3px rgba(255,255,255,.85), 0 16px 40px rgba(0,0,0,.55); }
  100% { box-shadow:0 16px 40px rgba(0,0,0,.55); }
}

/* ============ SHARED CONTROLS — capsules ============ */
.cap {
  min-height:48px; padding:0 16px;
  border-radius:999px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07);
  color:var(--ink2);
  font-weight:600; font-size:12.5px; letter-spacing:.1em; text-transform:uppercase;
  font-variant-numeric:tabular-nums;
  transition:transform 260ms var(--spring), background 140ms ease, color 140ms ease;
}
.cap:active { transform:scale(.93); background:var(--glass-press); color:var(--ink); }
.cap.live { color:var(--red-hi); border-color:var(--red-line); background:var(--red-soft); }
.chip {
  min-height:44px; padding:0 14px;
  border-radius:999px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.10);
  font-weight:700; font-size:10.5px; letter-spacing:.12em;
  color:var(--ink2); text-transform:uppercase;
  transition:transform 240ms var(--spring), background 140ms ease;
}
.chip:active { transform:scale(.92); background:var(--glass-press); }

/* ============ IDLE ============ */
.idle-wrap { padding:18px 18px 30px; display:flex; flex-direction:column; gap:15px; }
.day-hero {
  font-weight:800; font-size:clamp(54px,16vw,68px); line-height:1.02;
  letter-spacing:-.015em; color:var(--ink);
  text-shadow:0 0 60px rgba(255,59,48,.18);
}
.day-sub { margin-top:-8px; }
.soft-banner {
  border-radius:999px; padding:12px 18px; text-align:center;
  background:linear-gradient(180deg, rgba(255,59,48,.18), rgba(255,59,48,.09));
  border:1px solid var(--red-line);
  color:var(--red-hi);
  font-weight:700; font-size:11.5px; letter-spacing:.16em; text-transform:uppercase;
  box-shadow:0 10px 26px rgba(140,10,5,.22), inset 0 1px 0 rgba(255,130,120,.18);
}
.brief { padding:16px 18px; display:flex; flex-direction:column; gap:6px; }
.brief-text { font-size:12.5px; line-height:1.58; color:var(--ink2); white-space:pre-wrap; }
.brief-text.clamped {
  display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;
}
.brief-more {
  align-self:flex-start;
  min-height:44px; padding:0 4px;
  font-weight:700; font-size:10.5px; letter-spacing:.16em;
  color:var(--ink3); text-transform:uppercase;
}
.manifest { display:flex; flex-direction:column; gap:9px; }
.man-row {
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:14px 18px;
  border-radius:22px;
  background:var(--glass);
  border:1px solid var(--stroke-soft);
  box-shadow:var(--inset-hi);
  animation:lq-in 420ms var(--spring) backwards;
}
.man-name {
  font-weight:600; font-size:14.5px; letter-spacing:.02em;
  color:var(--ink);
  display:flex; align-items:center; gap:8px; min-width:0;
}
.man-name .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.man-spec {
  font-variant-numeric:tabular-nums;
  font-weight:500; font-size:10.5px; color:var(--ink3); text-align:right;
  letter-spacing:.04em;
  /* Wrappable + width-capped: the spec column must never crush .man-name to nothing. */
  white-space:normal; max-width:55%; flex:0 0 auto;
}
.man-spec .man-drop {
  display:inline-block; padding:1px 8px; margin-left:5px;
  border:1px solid rgba(255,255,255,.12); border-radius:999px;
  background:rgba(255,255,255,.06);
  color:var(--ink2); white-space:nowrap;
}
.stop-chip {
  flex:0 0 auto;
  font-weight:700; font-size:8.5px; letter-spacing:.16em;
  color:var(--red-hi); background:var(--red-soft); border:1px solid var(--red-line);
  border-radius:999px; padding:3px 9px;
}
.build-stamp {
  font-size:9px; font-weight:600; color:var(--ink4);
  text-align:center; letter-spacing:.18em; text-transform:uppercase;
}

/* ============ WORK ============ */
.work-wrap { padding:12px 18px 14px; display:flex; flex-direction:column; gap:14px; flex:1 1 auto; min-height:0; }
.work-hero {
  flex:1 1 auto; min-height:0;
  display:flex; flex-direction:column; justify-content:center; gap:10px;
}
.ex-kicker { color:var(--ink3); }
.ex-name {
  font-weight:700; font-size:clamp(22px,6.4vw,27px); line-height:1.12;
  letter-spacing:-.005em; color:var(--ink);
  min-height:28px;
}
.weight-line { display:flex; align-items:baseline; gap:12px; min-height:96px; flex-wrap:wrap; }
.weight-num {
  font-weight:700; font-size:clamp(80px,26vw,112px); line-height:1;
  font-variant-numeric:tabular-nums lining-nums; font-feature-settings:"tnum" 1;
  letter-spacing:-.04em;
  color:var(--ink);
  text-shadow:0 0 70px rgba(255,59,48,.2);
}
.weight-unit { font-weight:600; font-size:14px; letter-spacing:.22em; color:var(--ink3); }
.drop-tag {
  font-variant-numeric:tabular-nums;
  font-weight:600; font-size:11px; color:var(--ink2);
  border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.06);
  border-radius:999px;
  padding:5px 12px; white-space:nowrap;
}
.meta-caps { display:flex; gap:8px; flex-wrap:wrap; }
.meta-cap {
  display:inline-flex; align-items:center;
  min-height:34px; padding:0 14px;
  border-radius:999px;
  background:rgba(255,255,255,.055);
  border:1px solid var(--stroke-soft);
  font-weight:600; font-size:11.5px; letter-spacing:.12em; color:var(--ink2);
  font-variant-numeric:tabular-nums;
}
.stop-plate {
  border-radius:22px;
  padding:13px 18px;
  background:linear-gradient(180deg, rgba(255,59,48,.16), rgba(255,59,48,.085));
  border:1px solid rgba(255,59,48,.38);
  color:var(--red-hi);
  font-weight:700; font-size:12px;
  letter-spacing:.1em; text-transform:uppercase; line-height:1.4;
  box-shadow:0 12px 30px rgba(140,10,5,.22), inset 0 1px 0 rgba(255,130,120,.16);
}
.coach { padding:15px 18px; display:flex; flex-direction:column; gap:6px; }
.advice-text { font-size:13px; line-height:1.55; color:var(--ink2); font-variant-numeric:tabular-nums; }
.advice-text.clamped { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.advice-more {
  align-self:flex-start; min-height:44px; min-width:44px; padding:0 4px;
  font-weight:700; font-size:10.5px; letter-spacing:.16em;
  color:var(--ink3); text-transform:uppercase;
}

/* ============ REST ============ */
.rest-wrap { padding:8px 18px 14px; display:flex; flex-direction:column; gap:12px; flex:1 1 auto; min-height:0; }
.rest-top {
  text-align:center;
  flex:1 1 auto; min-height:118px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
/* Freed-space absorber: when the dock melts to a receipt, the countdown swells. */
.digits-zoom { transition:transform 560ms var(--spring); will-change:transform; }
.digits-zoom.roomy { transform:scale(1.16); }
.rest-digits {
  font-weight:700;
  font-size:clamp(96px,38vw,160px); line-height:.95;
  font-variant-numeric:tabular-nums lining-nums; font-feature-settings:"tnum" 1;
  letter-spacing:-.05em;
  color:var(--ink); display:inline-block; white-space:nowrap;
}
.rest-digits.long { font-size:clamp(76px,29vw,120px); }
.rest-digits.t10 {
  color:var(--red);
  text-shadow:0 0 26px rgba(255,59,48,.45), 0 0 90px rgba(255,59,48,.25);
}
.rest-digits.dimmed { opacity:.38; }
.rest-digits.pulse { animation:digitpulse 200ms var(--ease); }
@keyframes digitpulse { 0%{transform:scale(1);} 50%{transform:scale(1.04);} 100%{transform:scale(1);} }
.rest-digits .colon { display:inline-block; animation:colonfade 1s ease infinite; }
/* Each second crossfade-slides in. */
.rest-digits .ss { display:inline-block; animation:lq-tick 340ms var(--ease); }
.rest-digits.alertpulse { animation:gopulse 1.1s ease-in-out infinite; }
@keyframes colonfade { 0%,100%{opacity:1;} 55%{opacity:.28;} }
@keyframes lq-tick { from { opacity:.22; transform:translateY(.1em); } to { opacity:1; transform:none; } }
@keyframes gopulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }
.rest-cap {
  text-align:center; margin-top:6px;
  font-weight:700; font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink3); font-variant-numeric:tabular-nums;
}
/* Liquid progress capsule (transform-only fill). */
.flow {
  position:relative; height:6px; margin:2px 2px;
  border-radius:999px;
  background:rgba(255,255,255,.07);
  overflow:hidden;
}
.flow-fill {
  position:absolute; inset:0;
  border-radius:999px;
  background:linear-gradient(90deg, rgba(255,255,255,.32), rgba(255,255,255,.6));
  transform-origin:left center;
  will-change:transform;
}
.flow-fill.t10 {
  background:linear-gradient(90deg, var(--red-hi), var(--red));
  box-shadow:0 0 16px rgba(255,59,48,.55);
}
.adjust-row { display:flex; gap:8px; min-height:50px; }
.adjust-row .cap { flex:1 1 0; min-height:50px; padding:0 4px; font-size:12.5px; }

/* solution plate */
.plate { padding:15px 18px; display:flex; flex-direction:column; gap:7px; }
.plate-line { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.plate-band {
  font-weight:700; font-size:38px; line-height:1;
  font-variant-numeric:tabular-nums lining-nums; font-feature-settings:"tnum" 1;
  letter-spacing:-.02em;
  color:var(--ink); min-height:38px;
}
.plate-band .band-unit { font-weight:600; font-size:12px; letter-spacing:.2em; color:var(--ink3); }
.plate-token {
  display:inline-flex; align-items:center;
  min-height:36px; padding:0 14px;
  font-weight:600; font-size:13px;
  font-variant-numeric:tabular-nums; color:var(--ink2);
  border:1px solid rgba(255,255,255,.12); border-radius:999px;
  background:rgba(255,255,255,.065);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07);
  white-space:nowrap;
}
.plate-token.drop { color:var(--red-hi); border-color:var(--red-line); background:var(--red-soft); }
.plate-status { font-size:12.5px; line-height:1.5; color:var(--ink2); font-variant-numeric:tabular-nums; }
.plate-status.alive { color:var(--red-hi); }
.plate-status .rate-prompt {
  color:var(--ink4); display:block; margin-top:3px;
  font-weight:600; font-size:10.5px; letter-spacing:.08em;
}
.flip-stamp {
  border-radius:999px;
  padding:16px 16px; text-align:center;
  background:linear-gradient(180deg, rgba(255,59,48,.22), rgba(255,59,48,.1));
  border:1px solid rgba(255,59,48,.55);
  color:var(--red-hi);
  font-weight:800; font-size:13px; letter-spacing:.12em; text-transform:uppercase;
  box-shadow:0 0 36px rgba(255,59,48,.26), inset 0 1px 0 rgba(255,140,130,.22);
  animation:stampdraw 480ms var(--spring);
}
.flip-stamp.soft {
  background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.14);
  color:var(--ink2); box-shadow:none;
}
@keyframes stampdraw { from { opacity:0; transform:scale(.92); } to { opacity:1; transform:none; } }

/* grading dock (frosted — one of the 3 blur layers) */
.dock { padding:12px; display:flex; flex-direction:column; gap:9px; animation:dockin 240ms var(--ease); }
@keyframes dockin { from { opacity:0; transform:translateY(8px) scale(.985); } to { opacity:1; transform:none; } }
.dock-head { display:flex; align-items:center; gap:8px; }
.dock-head .kicker { flex:1 1 auto; font-size:11px; }
.dock-stepper { display:flex; align-items:stretch; gap:8px; }
.step-btn {
  flex:0 0 68px; min-height:52px;
  border-radius:999px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
  font-size:26px; font-weight:400; color:var(--ink2); line-height:1;
  transition:transform 240ms var(--spring), background 140ms ease;
}
.step-btn:active { transform:scale(.88); background:var(--glass-press); color:var(--ink); }
.dock-reps {
  flex:1 1 auto; display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:42px; line-height:1;
  font-variant-numeric:tabular-nums lining-nums; font-feature-settings:"tnum" 1;
  color:var(--ink);
  background:rgba(0,0,0,.36); border:1px solid rgba(255,255,255,.07); border-radius:999px;
  box-shadow:inset 0 3px 10px rgba(0,0,0,.5);
}
.gate-cap {
  font-weight:600; font-size:10.5px; letter-spacing:.08em;
  color:var(--ink3); text-align:center; min-height:14px;
  font-variant-numeric:tabular-nums;
}
/* difficulty: ONE segmented liquid capsule — selected segment fills white */
.seg {
  display:flex; gap:4px; padding:4px;
  border-radius:999px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}
.seg-btn {
  flex:1 1 0; min-height:48px;
  border-radius:999px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0;
  transition:transform 240ms var(--spring), background 140ms ease;
}
.seg-btn b { font-weight:700; font-size:18px; line-height:1.15; color:var(--ink2); }
.seg-btn i { font-style:normal; font-weight:700; font-size:8px; letter-spacing:.16em; color:var(--ink3); }
.seg-btn:active { transform:scale(.92); }
.seg-btn.sel { background:#fff; box-shadow:0 6px 18px rgba(0,0,0,.5); animation:selpop 300ms var(--spring); }
.seg-btn.sel b, .seg-btn.sel i { color:#0a0a0b; }
@keyframes selpop { 0%{transform:scale(.88);} 60%{transform:scale(1.06);} 100%{transform:scale(1);} }
/* receipt: the melted dock */
.receipt {
  width:100%; min-height:52px;
  border-radius:999px;
  background:linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.05));
  border:1px solid rgba(255,255,255,.11);
  box-shadow:0 12px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.1);
  font-variant-numeric:tabular-nums;
  font-weight:600; font-size:14.5px; color:var(--ink2); letter-spacing:.04em;
  display:flex; align-items:center; justify-content:center; gap:8px;
  animation:receiptin 520ms var(--spring);
}
@keyframes receiptin {
  0%   { opacity:0; transform:translateY(16px) scale(.92); }
  60%  { transform:translateY(-3px) scale(1.02); }
  100% { opacity:1; transform:none; }
}
.receipt .pencil { color:var(--ink3); font-size:13px; }

/* browse */
.browse-bar { display:flex; align-items:center; justify-content:center; gap:8px; min-height:48px; }
.mini-clock {
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
  font-weight:700; font-size:15px; color:var(--ink2);
  border:1px solid rgba(255,255,255,.10); background:rgba(255,255,255,.06);
  border-radius:999px;
  padding:6px 16px; min-height:38px; display:inline-flex; align-items:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07);
}
.mini-clock.t10 { color:var(--red); border-color:var(--red-line); text-shadow:0 0 12px rgba(255,59,48,.5); }
.browse-wrap { padding:10px 18px 14px; display:flex; flex-direction:column; gap:11px; flex:1 1 auto; min-height:0; }
.browse-ctx { display:flex; flex-direction:column; gap:3px; padding:0 2px; }
.browse-ctx .ex-name { font-size:22px; min-height:25px; }
.browse-ctx .meta {
  font-variant-numeric:tabular-nums;
  font-weight:500; font-size:11.5px; color:var(--ink3); letter-spacing:.05em;
}

/* ============ DONE ============ */
.done-wrap { padding:20px 18px 34px; display:flex; flex-direction:column; gap:15px; }
.done-hero {
  font-weight:700; font-size:clamp(56px,19vw,84px); line-height:1;
  font-variant-numeric:tabular-nums lining-nums; font-feature-settings:"tnum" 1;
  letter-spacing:-.04em;
  color:var(--ink); text-align:center;
  text-shadow:0 0 70px rgba(255,59,48,.22);
}
.done-sub { text-align:center; font-size:10.5px; }
.done-block { padding:15px 18px; display:flex; flex-direction:column; gap:7px; }
.done-block .kicker { margin-bottom:2px; }
.trig-row {
  display:flex; gap:10px;
  font-variant-numeric:tabular-nums;
  font-weight:500; font-size:12.5px; color:var(--ink2);
}
.trig-row .ab { color:var(--ink3); flex:0 0 38px; font-weight:700; }
.trig-row.flipped, .trig-row.flipped .ab { color:var(--red-hi); }
.soft-note { font-size:10.5px; color:var(--ink4); }
.done-list { display:flex; flex-direction:column; padding:4px 0; }
.done-ex {
  display:flex; flex-direction:column; gap:3px;
  padding:13px 18px; border-bottom:1px solid rgba(255,255,255,.06);
  animation:lq-in 380ms var(--spring) backwards;
}
.done-ex:last-child { border-bottom:none; }
.done-ex .top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.done-ex .nm { font-weight:600; font-size:14.5px; letter-spacing:.02em; color:var(--ink); }
.done-ex .tm { font-variant-numeric:tabular-nums; font-weight:500; font-size:10.5px; color:var(--ink3); white-space:nowrap; }
.done-ex .wt { font-variant-numeric:tabular-nums; font-weight:500; font-size:10.5px; color:var(--ink3); }
.done-ex .sets { font-variant-numeric:tabular-nums; font-weight:500; font-size:13px; color:var(--ink2); line-height:1.6; }
.done-rests {
  text-align:center; font-variant-numeric:tabular-nums;
  font-weight:600; font-size:10.5px; letter-spacing:.1em; color:var(--ink3); text-transform:uppercase;
}

/* ============ SHEETS / TOAST ============ */
#sheet-backdrop {
  position:absolute; inset:0; background:rgba(0,0,0,.62); z-index:100;
  animation:fadein 200ms ease;
}
@keyframes fadein { from{opacity:0;} to{opacity:1;} }
#sheet {
  position:absolute; left:0; right:0; bottom:0; z-index:110;
  background:rgba(20,20,22,.82);
  -webkit-backdrop-filter:blur(28px); backdrop-filter:blur(28px);
  border-top:1px solid rgba(255,255,255,.13);
  border-radius:30px 30px 0 0;
  box-shadow:0 -24px 70px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.1);
  max-height:74%; display:flex; flex-direction:column;
  padding:10px 18px max(18px,env(safe-area-inset-bottom)) 18px;
  animation:sheetup 420ms var(--spring);
}
#sheet::before {
  content:''; display:block;
  width:38px; height:4px; border-radius:999px;
  background:rgba(255,255,255,.22);
  margin:2px auto 10px;
  flex:0 0 auto;
}
@keyframes sheetup { from { transform:translateY(36px); opacity:0; } to { transform:none; opacity:1; } }
#sheet-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
#sheet-title { font-weight:700; font-size:11.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink3); }
#sheet-x { min-height:44px; min-width:44px; font-weight:700; font-size:10.5px; letter-spacing:.16em; color:var(--ink3); border-radius:999px; }
#sheet-x:active { color:var(--ink2); }
#sheet-body { overflow-y:auto; -webkit-overflow-scrolling:touch; min-height:0; }
.sheet-note-text { font-size:12.5px; color:var(--ink2); line-height:1.55; white-space:pre-wrap; margin-bottom:12px; font-variant-numeric:tabular-nums; }
.sheet-sec { margin-bottom:14px; }
.sheet-sec .kicker { margin-bottom:5px; }
.note-input {
  width:100%; min-height:50px; padding:12px 18px;
  background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.1); border-radius:999px;
  font-family:var(--font); font-size:16px; color:var(--ink);
  outline:none; caret-color:var(--ink2);
  -webkit-user-select:auto; user-select:auto;
}
.note-input:focus { border-color:rgba(255,255,255,.26); }
.note-input::placeholder { color:var(--ink4); }
.sheet-row {
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:12px 2px; border-bottom:1px solid rgba(255,255,255,.06); min-height:58px;
}
.sheet-row:last-child { border-bottom:none; }
.sheet-row .t { font-weight:600; font-size:14.5px; letter-spacing:.02em; color:var(--ink); }
.sheet-row .s { font-size:10.5px; color:var(--ink3); margin-top:1px; }
.tgl {
  width:54px; height:32px; border-radius:999px;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.1);
  position:relative; flex:0 0 auto;
  transition:background 200ms ease, border-color 200ms ease;
}
/* Invisible expanded hit area — keeps the 54x32 look while meeting the 44px floor. */
.tgl::before { content:''; position:absolute; inset:-8px; }
.tgl .knob {
  position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%;
  background:rgba(255,255,255,.5);
  box-shadow:0 2px 6px rgba(0,0,0,.4);
  transition:left 260ms var(--spring), background 200ms ease;
}
.tgl.on { background:rgba(255,59,48,.5); border-color:rgba(255,59,48,.55); }
.tgl.on .knob { left:25px; background:#fff; }
.sheet-btn {
  width:100%; min-height:52px; margin-top:9px;
  border-radius:999px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07);
  font-weight:700; font-size:12px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--ink2);
  transition:transform 240ms var(--spring), background 140ms ease;
}
.sheet-btn:active:not(:disabled) { transform:scale(.97); background:var(--glass-press); }
.sheet-btn:disabled { opacity:.3; }
.order-row { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid rgba(255,255,255,.06); }
.order-row:last-child { border-bottom:none; }
.order-row .onm {
  flex:1 1 auto; font-weight:600; font-size:14.5px; letter-spacing:.02em;
  color:var(--ink); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.order-row .oab { flex:0 0 38px; font-weight:700; font-size:10.5px; letter-spacing:.1em; color:var(--ink3); }
.order-btn {
  flex:0 0 56px; min-height:56px;
  border-radius:999px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);
  font-size:17px; color:var(--ink2);
  transition:transform 240ms var(--spring), background 140ms ease;
}
.order-btn:active:not(:disabled) { transform:scale(.92); background:var(--glass-press); }
.order-btn:disabled { opacity:.22; }
#toast {
  position:absolute; left:50%; bottom:122px; transform:translateX(-50%);
  background:rgba(28,28,30,.85);
  -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.12); border-radius:999px;
  box-shadow:0 12px 36px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.1);
  font-weight:600; font-size:11.5px; color:var(--ink2);
  font-variant-numeric:tabular-nums;
  padding:10px 18px; white-space:nowrap;
  opacity:0; pointer-events:none; z-index:130;
  transition:opacity 300ms ease;
}
#toast.show { opacity:1; }

/* finishing */
.fin-title {
  font-weight:800; font-size:clamp(30px,9vw,38px); letter-spacing:-.01em;
  color:var(--ink); text-align:center;
  text-shadow:0 0 60px rgba(255,59,48,.2);
}

/* ============ COMPACT VIEWPORTS ============ */
/* 760px: Safari-with-toolbars on a 390x844 phone yields ~664px of dvh, and the SE is
   667 — both get the compact ramp. Touch targets stay at the 44px floor. The scrolly
   safety net still backstops any residual overflow. */
@media (max-height:760px) {
  .rest-digits { font-size:clamp(76px,30vw,108px); }
  .rest-digits.long { font-size:clamp(62px,23vw,88px); }
  .rest-top { min-height:92px; }
  .digits-zoom.roomy { transform:scale(1.08); }
  .weight-num { font-size:clamp(62px,21vw,82px); }
  .weight-line { min-height:70px; }
  .work-wrap, .rest-wrap, .browse-wrap { gap:8px; padding-top:6px; }
  .glass { border-radius:22px; }
  .plate { padding:11px 16px; gap:5px; }
  .plate-band { font-size:30px; min-height:30px; }
  .dock { padding:9px; gap:7px; }
  .step-btn { min-height:44px; flex-basis:60px; }
  .seg-btn { min-height:44px; }
  .adjust-row { min-height:44px; }
  .adjust-row .cap { min-height:44px; }
  .day-hero { font-size:44px; }
  .done-hero { font-size:clamp(48px,15vw,64px); }
  #rail { height:56px; margin-bottom:4px; }
  #hdr { height:48px; flex-basis:48px; }
  #commit-btn { height:58px; }
}

/* ============ REDUCED MOTION ============ */
@media (prefers-reduced-motion:reduce) {
  *, *::before, *::after { animation-duration:120ms !important; transition-duration:120ms !important; }
  #wash { display:none; }
  .glow-top, .glow-low,
  #app.glow-hot .glow-top, #app.glow-hot .glow-low { animation:none; opacity:.7; }
  .rest-digits.pulse { animation:none; }
  .rest-digits .colon, .rest-digits .ss, .rest-digits.alertpulse { animation:none; }
  .pip.work, #commit-btn.go { animation:none; }
  .digits-zoom { transition:none; }
  .stage-enter .lq-stack > * { animation:none; }
  .stage-ghost { animation-duration:120ms !important; }
}
</style>

<div id="app">

  <div id="toast" aria-live="polite"></div>
</div>

<script id="app-script">
"use strict";
// ============ CONFIG ============
const dayType = "Upper";

// UPPER session (Wed Jun 10) — PHASE 2 FULL LAUNCH, session 2. Compounds (Chest Press, Cable Rope Row) at 4 sets; isolations (DB Lateral Raise, DB Curls, DB French Press) at 3. Chest Press S4 = standing drop to 90 (autoregulation worked 6/8). Order: Chest Press → Cable Rope Row → DB Lateral Raise → DB Curls (supinated, NO hammer) → DB French Press. Rest: CP/Row/Curls 150s, LR/FP 90s. ⚠️ 6/8 was a 4-hr-sleep SOFT read — the "was X" numbers are soft floors, chase the 6/4 rested marks. Backoffs wired: Chest Press 95 / Cable Row 100 / French Press 40 (reactive drop-calls if reps crater); LR + Curls defer to their structural S3 drops. Dynamic advisor live (commit 4cd7a70) — the static notes below are the first look; the timer recomputes each set's target from your ACTUAL prior-set reps. Voice = ElevenLabs static bank, workout-agnostic — no regen, build id unchanged.
const workout = [
  {

function initAudio() {

// Recover from a dead/suspended AudioContext. iOS Safari closes audio contexts during
// long backgrounding — a 3-min rest with the phone pocketed is well within the iOS
// reclamation window. Once .state is 'closed', the context cannot be reopened, so we
// build a new one and re-decode the voice cue buffers (which are bound to the dead
// context and unusable after it dies).
let _ctxGen = 0;
function recoverAudioCtx() {
  // Path A: missing or dead context — recreate from scratch.
  if (!audioCtx || audioCtx.state === 'closed') {
    if (audioCtx) { try { audioCtx.close(); } catch (e) {} }
    audioCtx = null;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { return; }
    _ctxGen++;
    // Decoded AudioBuffers from the dead context are unusable. Re-decode from the raw
    // ArrayBuffers (those survive context death; AudioBuffers don't).
    if (typeof VoiceCue !== 'undefined' && VoiceCue._afterContextRecreated) {
      VoiceCue._afterContextRecreated();
    }
  }
  // Path B: context is suspended OR interrupted (iOS background) — resume.
  // 'interrupted' is the iOS-specific transitional state when the page is backgrounded;
  // checking only 'suspended' leaves interrupted contexts silent forever. resume()
  // rejects silently if the context just transitioned to closed; the next caller hits
  // Path A and recreates.
  if (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') {
    audioCtx.resume().catch(() => {});
  }
  // Re-assert the ambient session category on EVERY recovery, not just Path A. iOS can
  // revert the category during backgrounding without closing the context; without this,
  // cues would interrupt Spotify on the next play instead of mixing with it.
  try {
    if ('audioSession' in navigator) navigator.audioSession.type = 'ambient';
  } catch (e) {}

// visibilitychange is NOT a user gesture, so its resume() call often silent-fails on
// iOS Safari. Hooking ANY touchend/pointerdown anywhere on the page guarantees the

    // neither branch and first-tap recovery silent-failed after iOS reclaimed the ctx).
    if (!audioCtx || audioCtx.state === 'closed' ||
        audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') {
      recoverAudioCtx();

    // VoiceCue.unlock() is idempotent — bails if already unlocked. Without this call,
    // any non-commit-button gesture restores the context but leaves play() gated.
    if (typeof VoiceCue !== 'undefined' && VoiceCue.unlock) {
      VoiceCue.unlock();

    // Keepalive must also start from non-button gestures: a page reloaded mid-rest
    // (state restored from storage) never fires the commit button, and the fresh
    // context will re-suspend in ~30s of silence without it. Idempotent. Guarded on

    // resurrect a battery-burning interval on its next tap (e.g. COPY SUMMARY).
    if (state !== 'finished') startAudioKeepalive();

    // synchronous state check here used to skip the drain on the exact recovery gesture

    // after a confirmed resume, so a failed resume retries on the next gesture.
    if (pendingPostGestureCues.length && audioCtx) {
      Promise.resolve(audioCtx.resume()).then(() => {
        if (!audioCtx || audioCtx.state !== 'running') return;
        const drained = pendingPostGestureCues.slice();
        pendingPostGestureCues.length = 0;
        drained.forEach(seq => {
          try { VoiceCue.playSequence(seq); } catch (e) {}

    'ex-tricep-pushdown', 'ex-rear-delt-flyes', 'ex-hammer-curls',
    'paused', 'resumed', 'final-set-logged', 'workout-complete', 'workout-reset',
    // weight callouts (each clip = "[N] pounds" full phrase)
    'wgt-10', 'wgt-12-5', 'wgt-15', 'wgt-17-5', 'wgt-20', 'wgt-22-5', 'wgt-25', 'wgt-27-5',
    'wgt-30', 'wgt-32-5', 'wgt-35', 'wgt-40', 'wgt-45', 'wgt-50',
    'wgt-55', 'wgt-60', 'wgt-65', 'wgt-70', 'wgt-75', 'wgt-80', 'wgt-85', 'wgt-90', 'wgt-95',
    'wgt-100', 'wgt-105', 'wgt-110', 'wgt-115', 'wgt-120', 'wgt-125', 'wgt-130',
    'wgt-135', 'wgt-140', 'wgt-145', 'wgt-150',
    'wgt-200', 'wgt-215', 'wgt-220', 'wgt-235', 'wgt-250', 'wgt-265', 'wgt-280', 'wgt-295', 'wgt-310',
    'wgt-plus-modifier',
    // RIR cues
    'cue-rir-zero', 'cue-rir-zero-one', 'cue-rir-one-two', 'cue-rir-two-three', 'cue-rir-three-plus',
    // effort cues
    'cue-go-hard', 'cue-go-mod', 'cue-max-effort', 'cue-save-reps',
    // set context + form cues
    'cue-trigger-set', 'cue-last-set', 'cue-form-check', 'cue-slow-tempo', 'cue-strict-form',
    'cue-no-hammer', 'cue-knee-check', 'cue-modifier-check',
    // rep range targets
    'cue-aim-6-10', 'cue-aim-8-12', 'cue-aim-10-12', 'cue-aim-12-15', 'cue-aim-15-20',
    // batch 2 additions
    'cue-warmup-set', 'cue-watch-knee', 'cue-pacing-fix', 'cue-trigger-hit', 'cue-personal-record', 'cue-full-rom',
    // Daily per-set commentary slots (up to 6 exercises x 5 sets). Unused slots simply
    // 404 on fetch and are skipped (under the static ElevenLabs bank they ALL 404 —
    // by design; generic cues cover every slot).
    'daily-ex1-set1', 'daily-ex1-set2', 'daily-ex1-set3', 'daily-ex1-set4', 'daily-ex1-set5',
    'daily-ex2-set1', 'daily-ex2-set2', 'daily-ex2-set3', 'daily-ex2-set4', 'daily-ex2-set5',
    'daily-ex3-set1', 'daily-ex3-set2', 'daily-ex3-set3', 'daily-ex3-set4', 'daily-ex3-set5',
    'daily-ex4-set1', 'daily-ex4-set2', 'daily-ex4-set3', 'daily-ex4-set4', 'daily-ex4-set5',
    'daily-ex5-set1', 'daily-ex5-set2', 'daily-ex5-set3', 'daily-ex5-set4', 'daily-ex5-set5',
    'daily-ex6-set1', 'daily-ex6-set2', 'daily-ex6-set3', 'daily-ex6-set4', 'daily-ex6-set5'
  ];
  const arrayBuffers = new Map();   // raw, pre-decode
  const decodedBuffers = new Map(); // post-decode, ready to play
  // Per-file fetch status: 'pending' | 'loaded' | 'failed'. Lets play() skip
  // known-404 clips INSTANTLY instead of stalling a whole sequence on the 3s decode
  // poll, while a fetch still in flight keeps the poll (first-cue-after-fast-tap fix).
  const fileStatus = new Map();
  let initialized = false;
  let unlocked = false;
  let currentSources = [];
  let currentChain = null;

  function init() {
    if (initialized) return;
    initialized = true;
    // Pre-fetch all mp3 ArrayBuffers (no audio context needed yet). Decoding happens
    // on first user gesture via unlock(). 404s mark 'failed' and stay silent.
    FILES.forEach(name => {
      fileStatus.set(name, 'pending');
      fetch('audio/' + name + '.mp3' + (name.indexOf('daily-') === 0 ? '?v=' + DAILY_BUILD_ID : ''))
        .then(r => r.ok ? r.arrayBuffer() : Promise.reject())
        .then(ab => { arrayBuffers.set(name, ab); fileStatus.set(name, 'loaded'); decodeIfReady(name); })
        .catch(() => { fileStatus.set(name, 'failed'); });
    });
  }

  function decodeIfReady(name) {
    if (!unlocked || !audioCtx) return;
    if (decodedBuffers.has(name)) return;
    const ab = arrayBuffers.get(name);
    if (!ab) return;
    // .slice(0) creates a copy so the original ArrayBuffer isn't detached (some
    // browsers detach the input buffer after decodeAudioData). Capture the context
    // generation so a decode resolving AFTER the context has been recreated doesn't
    // pollute the new decodedBuffers map.
    const myGen = _ctxGen;
    try {
      audioCtx.decodeAudioData(ab.slice(0))
        .then(buf => {
          if (myGen === _ctxGen) decodedBuffers.set(name, buf);
        })
        .catch(() => {
          // Transient decode failure (iOS rejecting on a closing context, etc).
          // Retry once on the current generation so the cue isn't lost for the
          // session. If the context died again, the next _afterContextRecreated
          // pass picks it up.
          if (myGen === _ctxGen && audioCtx && !decodedBuffers.has(name)) {
            try {
              audioCtx.decodeAudioData(ab.slice(0))
                .then(buf => { if (myGen === _ctxGen) decodedBuffers.set(name, buf); })
                .catch(() => {});
            } catch (e) {}
          }
        });
    } catch (e) {}
  }

  // Call from any user gesture to unlock + decode. recoverAudioCtx() handles
  // context creation + resume + audioSession='ambient'. unlocked stays true forever
  // after — context recreation re-decodes but never re-gates.
  function unlock() {
    if (unlocked) return;
    recoverAudioCtx();
    if (!audioCtx) return;
    unlocked = true;
    arrayBuffers.forEach((ab, name) => decodeIfReady(name));
  }

  async function play(name) {
    if (!settings.voice) return;
    recoverAudioCtx();
    if (!audioCtx || !unlocked) return;
    // Instant skip for clips that are known-missing (404'd) or not in FILES at all.
    // This kills the prior behavior where a missing clip stalled its sequence for the
    // full 3s decode poll.
    const st = fileStatus.get(name);
    if (st === undefined || st === 'failed') return;
    // Wait up to 3s for fetch+decode to finish — a 500ms window was not enough when
    // Start is tapped immediately after page load (fetch/decode race made the first
    // cue silent-fail; Reset-then-reload used to be the only workaround). Bail early
    // the moment the fetch is marked failed.
    let waited = 0;
    while (!decodedBuffers.has(name) && waited < 3000) {
      if (fileStatus.get(name) === 'failed') return;
      await new Promise(r => setTimeout(r, 50));
      waited += 50;
    }
    const buffer = decodedBuffers.get(name);
    if (!buffer) return;
    // Wait for the context to actually be running. resume() is async; without this,
    // source.start(0) can fire into a still-suspended context and emit nothing.
    if (audioCtx.state !== 'running') {
      try { await audioCtx.resume(); } catch (e) {}
    }
    if (audioCtx.state !== 'running') return;
    return new Promise(resolve => {
      try {
        const source = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        gain.gain.value = 1.0;
        // Re-assert the ambient session category right before playback — iOS sometimes
        // resets it between recoverAudioCtx() and source.start(), causing ducking.
        try { if ('audioSession' in navigator) navigator.audioSession.type = 'ambient'; } catch (e) {}
        source.buffer = buffer;
        source.connect(gain);
        gain.connect(audioCtx.destination);
        source.onended = () => {
          const idx = currentSources.indexOf(source);
          if (idx >= 0) currentSources.splice(idx, 1);
          resolve();
        };
        currentSources.push(source);
        source.start(0);
      } catch (e) { resolve(); }
    });
  }

  function playSequence(names, gapMs) {
    if (!settings.voice) return Promise.resolve();
    if (gapMs == null) gapMs = 80;
    cancel();
    const chain = { cancelled: false };
    currentChain = chain;
    return names.reduce((p, name) => p.then(() => {
      if (chain.cancelled) return;
      return play(name).then(() => new Promise(r => setTimeout(r, gapMs)));
    }), Promise.resolve());
  }

  function cancel() {
    if (currentChain) currentChain.cancelled = true;
    currentChain = null;
    currentSources.forEach(s => {
      try { s.stop(); s.disconnect(); } catch (e) {}
    });
    currentSources = [];
  }

  // Called by recoverAudioCtx() after a fresh AudioContext is built. Decoded
  // AudioBuffers are bound to the dead context and unusable, but the raw ArrayBuffers
  // survive — re-decode from those. unlocked stays true: we already had a user
  // gesture, so the new context just needs decoding.
  function _afterContextRecreated() {
    decodedBuffers.clear();
    cancel();
    arrayBuffers.forEach((ab, name) => decodeIfReady(name));
  }

  return { init, unlock, play, playSequence, cancel, _afterContextRecreated,
           has: (name) => decodedBuffers.has(name) || arrayBuffers.has(name) };
})();

function restClipForDuration(seconds) {
  if (seconds === 180) return 'rest-3min';
  if (seconds === 120) return 'rest-2min';
  if (seconds === 90) return 'rest-90sec';
  if (seconds === 60) return 'rest-60sec';
  return null; // 150s deliberately silent
}

// Returns the per-set daily hype clip name for (exIdx,setIdx) IF it actually loaded,
// else null (generic cues play). Daily clips are authored bound to the LOAD-TIME
// exercise order, so key them to the original position via the never-mutated
// originalWorkout snapshot — after a reorder a clip must not play on the WRONG
// exercise nor suppress the wrong slot's generic cue.
function dailyClipFor(exIdx, setIdx) {
  if (!workout[exIdx]) return null;
  const origIdx = originalWorkout.indexOf(workout[exIdx]);
  if (origIdx < 0) return null;
  const n = 'daily-ex' + (origIdx + 1) + '-set' + (setIdx + 1);
  return (typeof VoiceCue !== 'undefined' && VoiceCue.has && VoiceCue.has(n)) ? n : null;
}

// Set-N announcement at end of rest. Null on the first set of a new exercise (the
// up-next chain covered it) and when a daily hype line exists for the slot (it already
// names the set, weight, and target).
function setStartClipFor(exIdx, setIdx) {
  if (!workout[exIdx]) return null;
  if (dailyClipFor(exIdx, setIdx)) return null;
  if (setIdx === 0) return null;
  const isFinal = (setIdx === workout[exIdx].sets - 1);
  if (isFinal) return 'final-set';
  if (setIdx === 1) return 'set-2';
  if (setIdx === 2) return 'set-3';
  if (setIdx === 3) return 'set-4';
  return null;
}

// Map an exercise's weight string to its audio clip names. Returns [] if no usable
// weight. Handles modifier suffix; half-weights use dash-decimal slug ("22.5" → wgt-22-5).
function weightClipsFor(exerciseObj) {
  if (!exerciseObj || !exerciseObj.weight) return [];
  const w = String(exerciseObj.weight).toLowerCase();
  const numMatch = w.match(/(\d+(?:\.\d+)?)/);
  if (!numMatch) return [];
  const slug = numMatch[1].replace('.', '-');
  const result = ['wgt-' + slug];
  if (w.includes('modifier')) result.push('wgt-plus-modifier');
  return result;
}

// Map a rep range string like "8-12" to its rep-range cue clip.
function repRangeClipFor(repsStr) {
  if (!repsStr) return null;
  const m = String(repsStr).match(/(\d+)\s*-\s*(\d+)/);
  if (!m) return null;
  const key = parseInt(m[1], 10) + '-' + parseInt(m[2], 10);
  const map = {
    '6-10':  'cue-aim-6-10',
    '8-12':  'cue-aim-8-12',
    '10-12': 'cue-aim-10-12',
    '12-15': 'cue-aim-12-15',
    '15-20': 'cue-aim-15-20'
  };
  return map[key] || null;
}

// Set-position coaching cues (returns array, may be empty). Takes the exercise index
// explicitly (the prior version read the global working cursor — wrong while the
// chain describes a different exercise).
//   Set 2 (idx=1) of a 3+-set exercise: "Go hard" + "1-2 reps in reserve".
//   Last set of any exercise: "Max effort" + "0-1 in the tank".
// A daily hype line carries its own effort/RIR coaching — skip the generic cues.
function setPositionCuesFor(exIdx, setIdx, totalSetsCount) {
  if (dailyClipFor(exIdx, setIdx)) return [];
  if (totalSetsCount >= 3 && setIdx === 1) return ['cue-go-hard', 'cue-rir-one-two'];
  if (setIdx === totalSetsCount - 1)        return ['cue-max-effort', 'cue-rir-zero-one'];
  return [];
}

// New v4 wiring (existing clip, has()-gated): "Trigger set, send it!" appended to the
// rest-announce chain when the UPCOMING set is the final trigger gate, the trigger is
// still alive on reps, and no daily clip owns the slot.
function maybeAppendTriggerSetCue(seq, exIdx, setIdx) {
  const ex = workout[exIdx];
  if (!ex || !Array.isArray(ex.trigger)) return;
  if (setIdx !== ex.trigger.length - 1) return;
  if (dailyClipFor(exIdx, setIdx)) return;
  if (!isTriggerAliveOnReps(exIdx, setIdx)) return;
  if (!VoiceCue.has('cue-trigger-set')) return;
  seq.push('cue-trigger-set');
}

// Threshold-based countdown announcements (called from the 100ms rest tick). Each
// threshold fires once per rest period; the set is rebuilt by setDone and renormalized
// after any restEndTime mutation.
function maybeFireCountdownCue(secCeil) {
  if (countdownFiredThresholds.has(secCeil)) return;
  const cues = {
    60: '1min-remaining',
    30: '30sec-remaining',
    10: '10sec-remaining',
    5: 'countdown-5',
    4: 'countdown-4',
    3: 'countdown-3',
    2: 'countdown-2',
    1: 'countdown-1'
  };
  const name = cues[secCeil];
  if (!name) return;
  // Skip remaining-N cues when total rest is at/below the threshold (redundant with
  // the rest-start announcement).
  if ((secCeil === 60 && restTotalSeconds <= 60) ||
      (secCeil === 30 && restTotalSeconds <= 30) ||
      (secCeil === 10 && restTotalSeconds <= 10)) {
    countdownFiredThresholds.add(secCeil);
    return;
  }
  // Only mark the threshold fired if audio is actually playable. Otherwise the next
  // 100ms tick retries once the context recovers — without this gate, every
  // silent-fail during the tab-return recovery window would permanently suppress that
  // countdown cue. Countdown clips are played INDIVIDUALLY per second boundary (never
  // as a sequence) — the cadence keys to the dead-air-trimmed clips.
  if (!audioCtx || audioCtx.state !== 'running') return;
  countdownFiredThresholds.add(secCeil);
  VoiceCue.play(name);
}

// After ANY restEndTime mutation (+30 / −15 / background return):
// fired = { t : t > ceil(remaining) }. −15 never announces a stale threshold, +30
// re-arms (and re-fires) everything below the new remaining, and a background return
// pre-marks every passed threshold so nothing announces late. Deliberately NOT run on
// pause/resume.
function renormalizeCountdownThresholds() {
  const remaining = restEndTime ? Math.max(0, (restEndTime - Date.now()) / 1000) : 0;
  const c = Math.ceil(remaining);
  countdownFiredThresholds = new Set(COUNTDOWN_THRESHOLDS.filter(t => t > c));
}

// ============ ADVISOR ============
// Dynamic per-set advice: computes a REALISTIC rep target for the upcoming set from
// the user's ACTUAL last-set reps + effort, and calls a weight drop when reps fall
// below the range. difficulty = stored 1-5 scale (3 MOD, 4 HARD, 5 MAX).
// ex.backoff (optional) = the weight to drop to; ex.dropLastSet = last set is already
// a structural drop (defer to its static note there).
// Structured return: { kind, band:[lo,hi]|null, weightCall:{verb:'HOLD'|'DROP', w}|null,
// prose } — prose is byte-identical to the v3 advisor strings (parity-harness checked).
function dynamicRepAdviceStruct(setIdx, prev, ex) {
  if (!prev || !prev.length || setIdx < 1) return null;
  if (ex.dropLastSet && setIdx === ex.sets - 1) return null;
  var rng = String(ex.reps || "").match(/(\d+)\D+(\d+)/);
  if (!rng) return null;
  var lo = +rng[1], hi = +rng[2];
  var last = prev[prev.length - 1];
  var r = last.reps;
  if (typeof r !== "number" || isNaN(r)) return null;
  var d = +last.difficulty || 0;
  var maxed = d >= 5;
  var roomLeft = d > 0 && d <= 3;
  var wm = String(ex.weight).match(/(\d+(?:\.\d+)?)/);
  var w = wm ? wm[1] : "the weight";
  var bo = ex.backoff || null;
  var L = "S" + setIdx;
  var aimHi = Math.min(lo + 2, hi);
  var pLo, pHi;
  if (maxed) { pLo = Math.max(r - 2, 1); pHi = Math.max(r - 1, 1); }
  else if (roomLeft) { pLo = r; pHi = Math.min(r + 2, hi); }
  else { pLo = Math.max(r - 1, 1); pHi = r; }
  if (r <= 0) {
    return { kind: 'stopped', band: null, weightCall: null,
             prose: L + " stopped early. Reset, go by feel this set." };
  }
  if (r < lo && maxed) {
    return bo
      ? { kind: 'drop', band: [lo, aimHi], weightCall: { verb: 'DROP', w: bo },
          prose: L + " was " + r + ", under " + lo + "-" + hi + ". Drop to " + bo + ", aim " + lo + "-" + aimHi + "." }
      : { kind: 'drop-notch', band: [lo, aimHi], weightCall: null,
          prose: L + " was " + r + ", under " + lo + ". Grind " + lo + "+ or drop a notch." };
  }
  if (r <= lo && maxed) {
    return bo
      ? { kind: 'floor', band: [pLo, pHi], weightCall: { verb: 'HOLD', w: w },
          prose: L + " hit the floor (" + r + " at max). Hold " + w + " for ~" + pLo + "-" + pHi + ", or drop to " + bo + " for " + lo + "-" + aimHi + "." }
      : { kind: 'floor', band: [pLo, pHi], weightCall: { verb: 'HOLD', w: w },
          prose: L + " at the floor (" + r + "). ~" + pLo + "-" + pHi + " here, that's the set." };
  }
  if (r >= hi && roomLeft) {
    return { kind: 'bump', band: [hi - 1, hi], weightCall: { verb: 'HOLD', w: w },
             prose: L + " hit " + r + " (top) with room. Bump the weight next session. Here: " + (hi - 1) + "-" + hi + "." };
  }
  if (roomLeft) {
    return { kind: 'push', band: [pLo, pHi], weightCall: { verb: 'HOLD', w: w },
             prose: L + " was " + r + " with room. Push " + pLo + "-" + pHi + ", hold " + w + "." };
  }
  return { kind: 'default', band: [pLo, pHi], weightCall: { verb: 'HOLD', w: w },
           prose: L + " was " + r + (maxed ? " at max" : "") + ". Aim " + pLo + "-" + pHi + ", hold " + w + "."
                + (bo ? " Under " + lo + "? Drop to " + bo + "." : "") };
}
function dynamicRepAdvice(setIdx, prev, ex) {
  const s = dynamicRepAdviceStruct(setIdx, prev, ex);
  return s ? s.prose : null;
}

function defaultAdvice(setIdx, prev, ex) {
  if (!Array.isArray(ex.trigger) || setIdx === 0) return null;
  if (setIdx >= ex.trigger.length) return null;
  const reqHere = ex.trigger[setIdx];
  const passingPrior = prev.every((log, i) => log.reps >= ex.trigger[i]);
  const weightTag = ex.triggerWeight ? " for " + ex.triggerWeight : "";
  if (passingPrior) {
    if (setIdx === ex.trigger.length - 1) {
      return "TRIGGER ALIVE -- " + reqHere + "+ here flips" + weightTag + " next session. Push, form first.";
    }
    return "On track for trigger" + weightTag + " -- push " + reqHere + "+ here.";
  }
  const failedAt = prev.findIndex((log, i) => log.reps < ex.trigger[i]);
  return "Trigger out (S" + (failedAt + 1) + "=" + prev[failedAt].reps + ", needed " + ex.trigger[failedAt] + "). Match " + reqHere + " here, build for next session.";
}

// Build prev-set logs in order. Only count a prior set as "logged" when BOTH reps and
// difficulty are committed — dynamic advice must not fire off default reps before the
// user has actually graded the set.
function gradedPrevLogs(exIdx, setIdx) {
  const prevLogs = [];
  for (let i = 0; i < setIdx; i++) {
    const log = findLog(exIdx, i);
    if (log && log.difficulty != null) {
      prevLogs.push({ reps: log.reps, difficulty: log.difficulty });
    } else {
      return null;
    }
  }
  return prevLogs;
}

// Advice precedence per set: adviceFor hook → dynamicRepAdvice → defaultAdvice →
// setNotes[setIdx] → ex.note → ''. S1 and any-ungraded-prior always static.
function computeSetNote(exIdx, setIdx) {
  const ex = workout[exIdx];
  if (!ex) return "";
  const prevLogs = gradedPrevLogs(exIdx, setIdx);
  if (prevLogs && prevLogs.length === setIdx && setIdx > 0) {
    if (typeof ex.adviceFor === 'function') {
      const dynamic = ex.adviceFor(setIdx, prevLogs, ex);
      if (dynamic) return dynamic;
    }
    const reactive = dynamicRepAdvice(setIdx, prevLogs, ex);
    if (reactive) return reactive;
    const generic = defaultAdvice(setIdx, prevLogs, ex);
    if (generic) return generic;
  }
  if (Array.isArray(ex.setNotes) && ex.setNotes[setIdx]) return ex.setNotes[setIdx];
  return ex.note || "";
}

// Structured advice for the solution plate (band + HOLD/DROP token). Mirrors the
// computeSetNote gating exactly; null when the advisor can't fire.
function computeStructuredAdvice(exIdx, setIdx) {
  const ex = workout[exIdx];
  if (!ex || setIdx === 0) return null;
  const prevLogs = gradedPrevLogs(exIdx, setIdx);
  if (!prevLogs || prevLogs.length !== setIdx) return null;
  return dynamicRepAdviceStruct(setIdx, prevLogs, ex);
}

// ============ TRIGGER TRACKING ============
// Reps-only alive check for sets 0..uptoSetIdx-1 (used by the cue-trigger-set wiring
// and the DONE/summary outcome recompute).
function isTriggerAliveOnReps(exIdx, uptoSetIdx) {
  const ex = workout[exIdx];
  if (!ex || !Array.isArray(ex.trigger)) return false;
  const n = Math.min(uptoSetIdx, ex.trigger.length);
  for (let i = 0; i < n; i++) {
    const log = findLog(exIdx, i);
    if (!log || typeof log.reps !== 'number' || log.reps < ex.trigger[i]) return false;
  }
  return true;
}
// Full latch condition: ALL trigger-covered sets logged AND graded AND reps >= trigger[i].
function triggerConditionMet(exIdx) {
  const ex = workout[exIdx];
  if (!ex || !Array.isArray(ex.trigger) || !ex.trigger.length) return false;
  for (let i = 0; i < ex.trigger.length; i++) {
    const log = findLog(exIdx, i);
    if (!log || typeof log.reps !== 'number' || log.difficulty == null) return false;
    if (log.reps < ex.trigger[i]) return false;
  }

// ============ SUMMARY ============
function buildSummary() {
  const total = getTotalDuration();
  const durTxt = total ? formatDurCompact(total) : '—';
  let head = '## Workout — ' + dayType + ', ' + summaryDateStr() + ' ✓ DONE (' + durTxt;
  if (softDay) head += ' · ' + SOFT_NOTE;
  head += ')';
  const maxSets = Math.max(...workout.map(e => e.sets));
  let text = head + '\n';
  let hdr = '| Exercise | Weight |';
  let sep = '|---|---|';
  for (let j = 1; j <= maxSets; j++) { hdr += ' S' + j + ' |'; sep += '---|'; }
  hdr += ' Time |'; sep += '---|';
  text += hdr + '\n' + sep + '\n';
  const firstExIdx = firstPerformedExercise();
  workout.forEach((ex, i) => {
    let row = '| ' + ex.name + ' | ' + ex.weight + ' |';
    const drop = structuralDrop(ex);
    for (let j = 0; j < maxSets; j++) {
      if (j >= ex.sets) { row += ' — |'; continue; }       // set doesn't exist
      const log = findLog(i, j);
      if (!log) { row += ' ? |'; continue; }               // exists but unlogged
      let c = String(log.reps);                            // 0 stays plain on stops
      if (log.difficulty) c += ' [' + DIFFICULTY_LABELS[log.difficulty] + ']';
      if (drop && drop.setIdx === j) c += ' @' + drop.w;   // structural-drop set
      row += ' ' + c + ' |';
    }
    const dur = exerciseDurationForSummary(i, firstExIdx);
    row += ' ' + (dur && dur > 0 ? formatDurCompact(dur) : '—') + ' |';
    text += row + '\n';
  });
  const trigBits = [];
  let anySoftStar = false;
  workout.forEach((ex, i) => {
    const oc = triggerOutcome(i);
    if (!oc) return;
    const ab = abbrevFor(ex.name);
    if (oc.st === 'flipped') {
      trigBits.push(ab + ' CLEARED → ' + (ex.triggerWeight || '') + (softDay ? '*' : ''));
      if (softDay) anySoftStar = true;
    } else if (oc.st === 'out') {
      trigBits.push(ab + ' OUT S' + (oc.setIdx + 1) + ' (' + oc.reps + '<' + oc.req + ')');
    } else {
      trigBits.push(ab + ' —');
    }
  });
  if (trigBits.length) text += 'Triggers: ' + trigBits.join(' · ') + '\n';
  if (anySoftStar) text += '*' + SOFT_NOTE + '\n';
  const noteLines = [];
  workout.forEach((ex, i) => {
    for (let j = 0; j < ex.sets; j++) {
      const log = findLog(i, j);
      if (log && log.note) noteLines.push(ex.name + ' S' + (j + 1) + ': ' + log.reps + ' — ' + log.note);
    }
  });
  if (noteLines.length === 1) text += 'Notes: ' + noteLines[0] + '\n';
  else if (noteLines.length > 1) text += 'Notes:\n' + noteLines.join('\n') + '\n';
  if (skippedRests || extendedRests) {
    const bits = [];
    if (skippedRests) bits.push(skippedRests + ' skipped');
    if (extendedRests) bits.push(extendedRests + ' extended');
    text += 'Rests: ' + bits.join(' · ') + '\n';
  }
  // Clipboard payload is ASCII-only (Windows-paste safe — the summary lands in
  // tracker.md / daily logs). On-screen DONE typography keeps its glyphs; only the
  // copied text is sanitized: — → --, → → ->, · → |, ✓ dropped, – → -.
  return text
    .replace(/✓\s*/g, '')
    .replace(/—/g, '--')
    .replace(/–/g, '-')
    .replace(/→/g, '->')
    .replace(/·/g, '|');
}
function legacyCopy(t) {

    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    // body is user-select:none globally; the copy shim needs selection back.
    ta.style.webkitUserSelect = 'text';
    ta.style.userSelect = 'text';
    document.body.appendChild(ta);
    ta.focus();

  } catch (e) { return false; }
}
function copySummary() {
  const text = buildSummary();
  const after = () => {
    elCommit.classList.remove('flash');
    void elCommit.offsetWidth;
    elCommit.classList.add('flash');
    elCommit.textContent = 'COPIED';
    setTimeout(() => { if (state === 'finished') elCommit.textContent = 'COPY SUMMARY'; }, 2000);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(after, () => { legacyCopy(text); after(); });
  } else {
    legacyCopy(text);
    after();
  }
}

// ============ INPUT HANDLERS ============
elCommit.addEventListener('click', () => {

  // that finishWorkout just stopped (battery burn on the done screen).

  if (state === 'pre-start') startSession();

document.addEventListener('click', (e) => {
  const el = e.target.closest ? e.target.closest('[data-action],[data-diff]') : null;
  if (!el || el.disabled) return;
  // Difficulty chips (numeric 1-5 scale; UI exposes 2-5, EASY=1 stays legacy-only).
  if (el.dataset.diff != null) {
    const log = getActiveLogForEdit();
    if (!log) return;
    const diff = Number(el.dataset.diff);
    if (!diff) return;
    log.difficulty = (log.difficulty === diff) ? null : diff; // re-tap clears the grade
    evaluateTriggerFlip(log.exercise);

    const dz = byId('dock-zone');

    saveState();
    return;
  }
  const action = el.dataset.action;
  if (!action) return;
  switch (action) {
    case 'undo': undoStep(); break;
    case 'redo': closeSheet(); redoStep(); break;
    case 'gear': openGearSheet(); break;
    case 'sheet-close': closeSheet(); break;
    case 'order-open': openOrderSheet(); break;
    case 'order-up': {
      const i = Number(el.dataset.idx);
      reorderExercise(i, i - 1);
      if (sheetKind === 'order') elSheetBody.innerHTML = orderSheetBodyHTML();
      break;
    }
    case 'order-down': {
      const i = Number(el.dataset.idx);

      break;
    }
    case 'toggle-autostart':

      saveSettings();

      break;
    case 'toggle-voice':
      settings.voice = !settings.voice;

      saveSettings();
      if (sheetKind === 'gear') elSheetBody.innerHTML = gearSheetBodyHTML();
      break;
    case 'reset': resetWorkout(); break;
    case 'brief-expand': {

      const bm = byId('brief-more');

      }

    case 'note-open': openNoteSheet(); break;
    case 'rep-minus':

      const log = getActiveLogForEdit();
      if (!log) return;
      const d = (action === 'rep-plus') ? 1 : -1;
      log.reps = Math.max(0, Math.min(40, (Number(log.reps) || 0) + d));
      evaluateTriggerFlip(log.exercise);
      refreshSetNote();
      saveState();
      break;
    }
    case 'rep-zero': {
      const log = getActiveLogForEdit();
      if (!log) return;
      log.reps = 0; // difficulty deliberately stays null — injury abort
      evaluateTriggerFlip(log.exercise);
      refreshSetNote();
      saveState();
      break;
    }
    case 'receipt-expand': {
      dockCollapsed = false;
      const dz = byId('dock-zone');
      if (dz) dz.innerHTML = dockZoneHTML();
      const zm = byId('digits-zoom');
      if (zm) zm.classList.remove('roomy');
      saveState(); // dockCollapsed is persisted state — a reload must not re-collapse
      break;
    }
    case 'set-current': setCurrentFromView(); break;
    case 'return-live': returnToWorking(); break;
    case 'adj-minus': adjustRest(-15); break;
    case 'adj-plus': adjustRest(30); break;

  if (railLongPressTimer) { clearTimeout(railLongPressTimer); railLongPressTimer = null; }
}, { passive: true });
elRail.addEventListener('click', (e) => {
  if (Date.now() - lastRailTouchTap < 500) return;
  handleRailTap(e.target);
});
elRail.addEventListener('contextmenu', (e) => e.preventDefault());

// ============ BACKGROUND RETURN ============
// Shared handler for tab-return + BFCache restore (iOS back/forward swipe closes
// AudioContexts). Audio recovery runs FIRST — before any path that fires audio.
function handleResumeFromBackground() {
  recoverAudioCtx();
  if (state === 'resting' && restEndTime) {
    const remaining = Math.ceil((restEndTime - Date.now()) / 1000);
    if (remaining <= 0) {
      // Clear the interval BEFORE restDone — the visibility handler and the 100ms
      // tick used to double-fire it (restDone's state guard is the second net).
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      restDone();
    } else {
      restRemaining = remaining;
      // Threshold catch-up: every threshold already passed while backgrounded is
      // pre-marked so nothing announces late and stale.
      renormalizeCountdownThresholds();
      paintRestVisuals(Math.max(0, (restEndTime - Date.now()) / 1000));
      startAudioKeepalive();
    }
  }
  // Wake lock re-acquire for ALL active states INCLUDING 'ready'.
  if (isActiveState() && !wakeLock) requestWakeLock();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  handleResumeFromBackground();
});
window.addEventListener('pageshow', (e) => {
  if (e.persisted) handleResumeFromBackground();
});

// ============ INIT ============
// URL reset (?reset=1) wipes saved workout state, then strips itself. The undo stack
// is deliberately NOT named `history` — window.history must stay reachable here.
if (new URLSearchParams(location.search).has('reset')) {
  try { localStorage.removeItem('gtliq-state'); } catch (e) {}
  try { window.history.replaceState(null, '', location.pathname); } catch (e) {}
}
VoiceCue.init();
attachGlobalAudioRecovery();
if (!restoreState()) {
  // Fresh load (no saved state, or TTL expired): IDLE. The START tap unlocks audio,
  // requests the wake lock, records workoutStartTime, and plays the opening chain.
  state = 'pre-start';
  render();
}
// 1Hz header elapsed register (textContent only).
setInterval(() => {
  if (workoutStartTime && state !== 'finished' && state !== 'pre-start') renderHeader();
}, 1000);
</script>
