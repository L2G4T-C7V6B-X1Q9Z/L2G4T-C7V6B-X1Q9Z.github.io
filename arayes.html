<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="darkreader-lock">
<meta name="theme-color" content="#151515">
<title>Arayes</title>
<!-- build: arayes-2-oven -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { color-scheme: dark only; }
  body {
    font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', 'Cascadia Mono', 'Consolas', monospace;
    font-size: 15px; line-height: 1.45; background: #151515; color: #d4d4d4;
    -webkit-tap-highlight-color: transparent;
    padding-bottom: calc(40px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 14px; }
  b { color: #ececec; }

  header { padding: calc(18px + env(safe-area-inset-top)) 0 10px; }
  .top { display: flex; align-items: baseline; justify-content: space-between; }
  h1 { font-size: 28px; letter-spacing: -1px; color: #ececec; }
  .meta { font-size: 12px; color: #777; }

  .seg { display: flex; margin-top: 10px; border: 1px solid #333; }
  .seg button { flex: 1; background: none; border: none; color: #888; font: inherit; font-size: 13px; padding: 8px 4px; cursor: pointer; }
  .seg button.on { background: #c41e1e; color: #fff; font-weight: 700; }

  nav { position: sticky; top: 0; z-index: 5; background: #151515; display: flex; border-bottom: 1px solid #2e2e2e; margin: 12px -14px 0; padding: 0 14px; }
  nav button { flex: 1; background: none; border: none; border-bottom: 2px solid transparent; color: #777; font: inherit; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; padding: 12px 0 10px; cursor: pointer; }
  nav button.on { color: #ececec; border-bottom-color: #c41e1e; }
  nav .n { color: #e04848; font-size: 11px; margin-left: 3px; }

  .tab { display: none; padding-top: 6px; }
  .tab.on { display: block; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #777; margin: 16px 0 6px; }

  /* check rows */
  .chk { display: flex; align-items: center; gap: 11px; padding: 9px 2px; border-bottom: 1px solid #242424; cursor: pointer; user-select: none; }
  .box { flex: none; width: 20px; height: 20px; border: 1.5px solid #4a4a4a; display: grid; place-items: center; }
  .chk.done .box { background: #c41e1e; border-color: #c41e1e; }
  .chk.done .box::after { content: ''; width: 10px; height: 5px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: translateY(-1px) rotate(-45deg); }
  .emo { font-size: 22px; width: 26px; text-align: center; flex: none; }
  .txt { flex: 1; min-width: 0; }
  .nm { color: #e6e6e6; font-weight: 700; }
  .tip { font-size: 12px; color: #7d7d7d; }
  .qty { color: #e04848; font-weight: 700; font-size: 14px; text-align: right; white-space: nowrap; }
  .chk.done .nm, .chk.done .qty { color: #555; text-decoration: line-through; }
  .chk.done .emo, .chk.done .tip { opacity: .35; }

  /* steps */
  .step { border-bottom: 1px solid #242424; padding: 12px 0; }
  .sh { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
  .num { flex: none; width: 26px; height: 26px; display: grid; place-items: center; background: #c41e1e; color: #fff; font-weight: 700; font-size: 14px; }
  .st { flex: 1; color: #ececec; font-weight: 700; font-size: 16px; }
  .tm { font-size: 11px; color: #777; white-space: nowrap; }
  .sb { margin: 6px 0 0 36px; color: #a0a0a0; font-size: 14px; }
  .step.done .num { background: #333; color: #777; }
  .step.done .st { color: #555; text-decoration: line-through; }
  .step.done .sb { display: none; }
  .step.next { }
  .step.next .num { box-shadow: 0 0 0 3px #151515, 0 0 0 4px #c41e1e; }

  .ing { margin-top: 8px; background: #1d1d1d; border: 1px solid #2a2a2a; padding: 2px 10px; font-size: 13.5px; }
  .ing div { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed #2c2c2c; }
  .ing div:last-child { border-bottom: none; }
  .ing span:first-child { color: #ccc; }
  .ing span:last-child { color: #e04848; font-weight: 700; }

  .viz { margin-top: 8px; background: #1d1d1d; border: 1px solid #2a2a2a; padding: 10px; }
  .viz svg { display: block; width: 100%; height: auto; }
  .balls { display: grid; grid-template-columns: repeat(8, 18px); gap: 6px; margin-top: 8px; }
  .balls i { width: 18px; height: 18px; border-radius: 50%; background: #c41e1e; display: block; }
  .balls i.b { background: #555; }

  .timer { margin-top: 10px; display: flex; gap: 8px; align-items: center; }
  .tbtn { flex: 1; background: #1d1d1d; border: 1.5px solid #c41e1e; color: #ececec; font: inherit; font-weight: 700; font-size: 20px; padding: 10px; cursor: pointer; letter-spacing: 1px; }
  .tbtn.run { background: #c41e1e; color: #fff; }
  .tbtn.ring { animation: ring .5s steps(2) infinite; }
  @keyframes ring { 50% { background: #151515; color: #e04848; } }
  .treset { background: none; border: 1px solid #333; color: #777; font: inherit; font-size: 12px; padding: 13px 10px; cursor: pointer; }
  .thint { font-size: 11.5px; color: #777; margin-top: 5px; }

  .note { margin-top: 14px; border-left: 3px solid #555; background: #1d1d1d; padding: 10px 12px; font-size: 13.5px; color: #a0a0a0; }
  .macro { margin-top: 14px; display: flex; gap: 8px; }
  .macro div { flex: 1; background: #1d1d1d; border: 1px solid #2a2a2a; padding: 8px; text-align: center; font-size: 12px; color: #777; }
  .macro b { display: block; font-size: 20px; }
  .fine { font-size: 11px; color: #5e5e5e; margin-top: 6px; }

  .reheat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 4px; }
  .reheat div { background: #1d1d1d; border: 1px solid #2a2a2a; padding: 10px 4px; text-align: center; font-size: 12px; color: #999; }
  .reheat .e { display: block; font-size: 24px; }
  .reheat b { display: block; font-size: 14px; }
  .reheat .best { border: 1.5px solid #c41e1e; }
  .warn { margin-top: 8px; border: 1.5px solid #c41e1e; color: #e04848; font-weight: 700; text-align: center; padding: 9px; font-size: 14px; }

  .bar { display: flex; gap: 3px; margin: 8px 0 2px; }
  .bar i { flex: 1; height: 8px; background: #c41e1e; display: block; }
  .bar i.b { background: #555; }
  .barkey { display: flex; justify-content: space-between; font-size: 11px; color: #777; }

  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; }
  .reset { background: none; border: 1px solid #333; color: #777; font: inherit; font-size: 12px; padding: 7px 10px; cursor: pointer; }
  .wl { font-size: 11px; color: #555; }
  .wl.on { color: #e04848; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top"><h1>Arayes</h1><span class="meta" id="meta"></span></div>
    <div class="seg" id="seg">
      <button data-b="8">8 halves · 1 lb</button>
      <button data-b="16">16 halves · 2 lb</button>
    </div>
  </header>

  <nav id="nav">
    <button data-t="buy">Buy<span class="n" id="nBuy"></span></button>
    <button data-t="cook">Cook<span class="n" id="nCook"></span></button>
    <button data-t="left">Leftovers</button>
  </nav>

  <section class="tab" id="t-buy"></section>
  <section class="tab" id="t-cook"></section>
  <section class="tab" id="t-left"></section>

  <div class="foot">
    <button class="reset" id="reset">Reset checks</button>
    <span class="wl" id="wl"></span>
  </div>
</div>

<script>
const BATCH = {
  8:  { beef: '1 lb', pita: '4 rounds', onion: '1 small', yog: '8 oz cup', sauceYog: '1 cup', sauceGar: '1 clove', lemon: '1/2 lemon', sauceSalt: '1/4 tsp',
        meatOnion: '1 small', gar: '2 cloves', spice: '1 tsp', pep: '1/4 tsp', pars: 'small handful', balls: 8, mine: 4, total: '~35 min', pans: 1 },
  16: { beef: '2 lb', pita: '8 rounds', onion: '1 big', yog: '16 oz tub', sauceYog: 'whole tub', sauceGar: '2 cloves', lemon: '1 lemon', sauceSalt: '1/2 tsp',
        meatOnion: '1 big', gar: '4 cloves', spice: '2 tsp', pep: '1/2 tsp', pars: 'a handful', balls: 16, mine: 8, total: '~40 min', pans: 2 }
};

const KEY = 'arayes-v1', STEPS_V = 2;  // STEPS_V: bump when step numbering changes, so old step checks don't land on the wrong steps
const S = Object.assign({ batch: 16, tab: 'buy', buy: [], steps: [] }, JSON.parse(localStorage.getItem(KEY) || '{}'));
if (S.sv !== STEPS_V) { S.steps = []; S.sv = STEPS_V; }
const save = () => localStorage.setItem(KEY, JSON.stringify(S));
const $ = s => document.querySelector(s);

function buyHTML(b) {
  const row = (k, e, n, q, t) => `<div class="chk" data-buy="${k}"><span class="box"></span><span class="emo">${e}</span><span class="txt"><div class="nm">${n}</div>${t ? `<div class="tip">${t}</div>` : ''}</span><span class="qty">${q}</span></div>`;
  return `
    <h2>From the store</h2>
    ${row('beef', '🥩', 'Ground beef', b.beef, '80/20')}
    ${row('pita', '🫓', 'Pita', b.pita, 'Pocket kind, not naan')}
    ${row('onion', '🧅', 'Onion', b.onion, 'Yellow or white')}
    ${row('garlic', '🧄', 'Garlic', '1 head', '')}
    ${row('yogurt', '🥣', 'Plain yogurt', b.yog, 'Plain, not vanilla')}
    ${row('lemon', '🍋', 'Lemon', '1', '')}
    <h2>Spices · check the cabinet</h2>
    ${row('cumin', '🫙', 'Ground cumin', '', 'The main flavor')}
    ${row('paprika', '🌶️', 'Paprika', '', 'Any kind, not spicy')}
    <h2>Probably have</h2>
    ${row('salt', '🧂', 'Salt + pepper', '', '')}
    ${row('oil', '🫒', 'Cooking oil', '', 'Canola is fine')}
    ${row('sheet', '🍪', b.pans === 1 ? 'Sheet pan' : '2 sheet pans', '', 'Plus foil or parchment')}
    ${row('box', '📦', 'Container with lid', '', 'For your brother')}
    ${row('parsley', '🌿', 'Parsley', 'optional', '')}`;
}

function cookHTML(b) {
  const ing = rows => `<div class="ing">${rows.map(([a, c]) => `<div><span>${a}</span><span>${c}</span></div>`).join('')}</div>`;
  let n = 0;
  const step = (_, title, tm, body, i = ++n) => `<div class="step" data-step="${i}"><div class="sh"><span class="num">${i}</span><span class="st">${title}</span><span class="tm">${tm}</span></div><div class="sb">${body}</div></div>`;
  const balls = Array.from({ length: b.balls }, (_, i) => `<i class="${i >= b.mine ? 'b' : ''}"></i>`).join('');
  return `
    <p class="fine" style="margin:10px 0 2px">Tap a step's title to mark it done.</p>
    ${step(0, '🔥 Preheat oven to 425°F', 'now', `Do it first, it takes ~15 min. ${b.pans === 1 ? 'Rack in the <b>middle</b>.' : 'Racks in the <b>upper and lower thirds</b>.'}`)}
    ${step(1, '🥣 Sauce', '5 min', `Stir together, then into the <b>fridge</b>.` + ing([['Plain yogurt', b.sauceYog], ['Garlic, grated', b.sauceGar], ['Lemon juice', b.lemon], ['Salt', b.sauceSalt]]))}
    ${step(2, '🧅 Grate + squeeze onion', '5 min', `Grate on the big holes, then <b>squeeze the juice out</b> over the sink. Skip it and the bread goes soggy.`)}
    ${step(3, '🥩 Mix the meat', '5 min', `One bowl, hands, <b>just until combined</b>.` + ing([['Ground beef', b.beef], ['Squeezed onion', b.meatOnion], ['Garlic, minced', b.gar], ['Cumin', b.spice], ['Paprika', b.spice], ['Salt', b.spice], ['Black pepper', b.pep], ['Parsley (opt.)', b.pars]]))}
    ${step(4, '⚪ Roll ' + b.balls + ' equal balls', '', `Halve, halve again, until ${b.balls}. Each about a <b>golf ball</b>.<div class="balls">${balls}</div><div class="fine">red = you · gray = your brother</div>`)}
    ${step(5, '🔪 Cut + stuff pitas', '10 min', `Halve each pita, open the pocket, push in a ball and <b>press it flat to the edges</b>.
      <div class="viz"><svg viewBox="0 0 320 84" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
        <text x="80" y="12" fill="#e04848" font-size="12" font-weight="700" text-anchor="middle">✓ THIN, 1/4 in</text>
        <rect x="20" y="26" width="120" height="9" fill="#8a8a8a"/><rect x="20" y="35" width="120" height="9" fill="#c41e1e"/><rect x="20" y="44" width="120" height="9" fill="#8a8a8a"/>
        <text x="240" y="12" fill="#777" font-size="12" font-weight="700" text-anchor="middle">✗ TOO THICK</text>
        <rect x="180" y="20" width="120" height="9" fill="#8a8a8a"/><rect x="194" y="29" width="92" height="30" fill="#c41e1e"/><rect x="180" y="59" width="120" height="9" fill="#8a8a8a"/>
        <text x="240" y="82" fill="#777" font-size="10" text-anchor="middle">bread burns, middle raw</text>
      </svg></div>`)}
    ${step(6, '🫒 Oil + onto the pan', '', `Line ${b.pans === 1 ? 'the sheet pan' : 'both sheet pans'} with foil. Rub a little oil on <b>both sides</b> of each pita and lay them flat, <b>not touching</b>.`)}
    ${step(7, '♨️ Bake', '15 min', `<b>8 min</b>, then flip every one${b.pans === 2 ? ' and <b>swap the pans</b> top/bottom' : ''}. Then <b>7-8 min</b> more, until deep golden and crispy.
      <div class="timer"><button class="tbtn" data-sec="480" data-end="FLIP">▶ 8:00</button><button class="tbtn" data-sec="450" data-end="DONE">▶ 7:30</button></div>
      <div class="thint">Beeps at 0. Tap the first, flip when it beeps, then tap the second. Tap a running timer to stop it.</div>
      <div class="thint">Want extra crunch? Broil 1-2 min at the end and watch it.</div>`)}
    ${step(8, '✅ Check + eat', '', `Cut edge shows <b>no pink</b> (160°F if you have a thermometer). Cut into triangles, dip in the sauce.`)}
    <div class="macro"><div><b>~225</b>cal / half</div><div><b>~12 g</b>protein / half</div></div>
    <p class="fine">Estimate with 80/20 beef + typical pita. Sauce not included.</p>`;
}

function leftHTML(b) {
  const bar = Array.from({ length: b.balls }, (_, i) => `<i class="${i >= b.mine ? 'b' : ''}"></i>`).join('');
  return `
    <div class="bar">${bar}</div>
    <div class="barkey"><span style="color:#e04848">■ ${b.mine} tonight</span><span>■ ${b.balls - b.mine} for your brother</span></div>
    <h2>Tonight</h2>
    <div class="chk" data-buy="l1"><span class="box"></span><span class="txt">Cook his ${b.balls - b.mine} with yours</span></div>
    <div class="chk" data-buy="l2"><span class="box"></span><span class="txt">Cool ~30 min on a plate</span></div>
    <div class="chk" data-buy="l3"><span class="box"></span><span class="txt">Lidded container → <b>fridge</b>, sauce separate</span></div>
    <h2>Tomorrow, he reheats</h2>
    <div class="reheat">
      <div class="best"><span class="e">💨</span><b>Air fryer</b>375°F<br>4-5 min</div>
      <div><span class="e">🍳</span><b>Pan</b>medium<br>3 min/side</div>
      <div><span class="e">♨️</span><b>Oven</b>400°F<br>8-10 min</div>
    </div>
    <div class="warn">✗ No microwave. Soggy bread.</div>
    <p class="fine">Good in the fridge for 3 days.</p>`;
}

function render() {
  const b = BATCH[S.batch];
  $('#meta').textContent = b.total;
  document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', +x.dataset.b === S.batch));
  $('#t-buy').innerHTML = buyHTML(b);
  $('#t-cook').innerHTML = cookHTML(b);
  $('#t-left').innerHTML = leftHTML(b);
  document.querySelectorAll('[data-buy]').forEach(el => el.classList.toggle('done', S.buy.includes(el.dataset.buy)));
  document.querySelectorAll('[data-step]').forEach(el => el.classList.toggle('done', S.steps.includes(+el.dataset.step)));
  wireTimers();
  refresh();
}

function refresh() {
  const buyRows = [...document.querySelectorAll('#t-buy [data-buy]')];
  const got = buyRows.filter(r => r.classList.contains('done')).length;
  $('#nBuy').textContent = got ? `${got}/${buyRows.length}` : '';
  const steps = [...document.querySelectorAll('[data-step]')];
  const done = steps.filter(s => s.classList.contains('done')).length;
  $('#nCook').textContent = done ? `${done}/${steps.length}` : '';
  steps.forEach(s => s.classList.remove('next'));
  const nxt = steps.find(s => !s.classList.contains('done'));
  if (nxt) nxt.classList.add('next');
  document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('on', x.dataset.t === S.tab));
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.id === 't-' + S.tab));
}

document.addEventListener('click', e => {
  const seg = e.target.closest('#seg button');
  if (seg) { S.batch = +seg.dataset.b; save(); render(); return; }
  const nav = e.target.closest('#nav button');
  if (nav) { S.tab = nav.dataset.t; save(); refresh(); window.scrollTo(0, 0); if (S.tab === 'cook') wake(); return; }
  const chk = e.target.closest('[data-buy]');
  if (chk) {
    const k = chk.dataset.buy;
    S.buy = chk.classList.toggle('done') ? [...S.buy, k] : S.buy.filter(x => x !== k);
    save(); refresh(); return;
  }
  const sh = e.target.closest('.sh');
  if (sh) {
    const st = sh.parentElement, n = +st.dataset.step;
    S.steps = st.classList.toggle('done') ? [...S.steps, n] : S.steps.filter(x => x !== n);
    save(); refresh(); wake(); return;
  }
});
$('#reset').addEventListener('click', () => { S.buy = []; S.steps = []; save(); render(); });

/* ---------- timers ---------- */
let ac = null;
function beep() {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    [0, 0.35, 0.7].forEach(t => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0.0001, ac.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.4, ac.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t + 0.25);
      o.start(ac.currentTime + t); o.stop(ac.currentTime + t + 0.3);
    });
  } catch (_) {}
  if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]);
}
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const timers = [];
function wireTimers() {
  timers.forEach(t => clearInterval(t.iv)); timers.length = 0;
  document.querySelectorAll('.tbtn').forEach(btn => {
    const sec = +btn.dataset.sec, t = { btn, sec, end: 0, iv: 0 };
    timers.push(t);
    const idle = () => { clearInterval(t.iv); t.end = 0; btn.className = 'tbtn'; btn.textContent = '▶ ' + fmt(sec); };
    btn.onclick = () => {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();  // unlock audio inside the tap
      if (ac.state === 'suspended') ac.resume();
      wake();
      if (t.end) { idle(); return; }  // running -> stop; idle or ringing -> start a fresh countdown
      t.end = Date.now() + sec * 1000; btn.className = 'tbtn run';
      const tick = () => {
        const left = Math.max(0, Math.round((t.end - Date.now()) / 1000));
        btn.textContent = '■ ' + fmt(left);
        if (left === 0) { clearInterval(t.iv); t.end = 0; btn.className = 'tbtn ring'; btn.textContent = btn.dataset.end || 'DONE'; beep(); }
      };
      tick(); t.iv = setInterval(tick, 250);
    };
    const rs = btn.nextElementSibling;
    if (rs && rs.hasAttribute('data-reset')) rs.onclick = idle;
  });
}

/* ---------- keep screen on while cooking ---------- */
let lock = null;
async function wake() {
  if (!('wakeLock' in navigator) || lock) return;
  try {
    lock = await navigator.wakeLock.request('screen');
    $('#wl').textContent = 'screen stays on'; $('#wl').classList.add('on');
    lock.addEventListener('release', () => { lock = null; $('#wl').textContent = ''; $('#wl').classList.remove('on'); });
  } catch (_) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.tab === 'cook') wake(); });

render();
</script>
</body>
</html>
