<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Gym Timer</title>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@200;400;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'JetBrains Mono', monospace;
    background: #111;
    color: #ccc;
    min-height: 100vh;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 20px 170px;
    -webkit-user-select: none;
    user-select: none;
  }
  h1 {
    font-size: 11px;
    color: #888;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 14px;
    font-weight: 400;
    text-align: center;
  }
  #exercise-name {
    font-size: 22px;
    font-weight: 700;
    color: #eee;
    text-align: center;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
  }
  #set-info {
    font-size: 13px;
    color: #aaa;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
    text-align: center;
  }
  #exercise-note {
    font-size: 13px;
    color: #cfcfcf;
    margin-bottom: 10px;
    text-align: left;
    width: 100%;
    max-width: 340px;
    line-height: 1.32;
    /* Contained note panel — smaller text in a bordered card so the coach note
       reads as a tidy box, not big italics floating over the timer. Fixed height
       keeps the layout under it from shifting between 1/2/3-line notes. */
    height: 66px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding: 8px 14px;
    background: #151515;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    box-sizing: border-box;
  }
  #set-info .wt-now { color: #e0584a; font-weight: 700; }
  #set-info .wt-was { color: #777; font-size: 0.85em; margin-left: 4px; }
  #timer-display {
    font-size: 76px;
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    color: #eee;
    margin-bottom: 4px;
    line-height: 1;
    letter-spacing: -2px;
    text-align: center;
  }
  #timer-label {
    font-size: 11px;
    color: #999;
    margin-bottom: 24px;
    height: 16px;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-align: center;
  }

  /* Main button + progress ring wrapper */
  .btn-wrap {
    /* Positioned by JS (centerMainButton) so its vertical center sits exactly
       at the midpoint of the timer-display bottom and the difficulty-row top,
       ignoring timer-label / padding slop. Inline styles from JS override
       these initial values. */
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 184px;
    height: 184px;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #main-btn {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 2px solid #333;
    background: #1a1a1a;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #bbb;
    cursor: pointer;
    transition: transform 0.2s, color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  #main-btn:active { transform: scale(0.96); }
  #main-btn.resting,
  #main-btn.paused {
    border-color: transparent;
    color: #c0392b;
  }
  #main-btn.paused { color: #777; }
  #main-btn.go {
    border-color: #c0392b;
    background: #c0392b;
    color: #fff;
  }

  /* Progress ring (drains as rest counts down) */
  #rest-ring {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: none;
    transform: rotate(-90deg);
  }
  .btn-wrap.show-ring #rest-ring { display: block; }
  #rest-ring-track {
    fill: none;
    stroke: rgba(192, 57, 43, 0.12);
    stroke-width: 3;
  }
  #rest-ring-bar {
    fill: none;
    stroke: #c0392b;
    stroke-width: 3;
    stroke-linecap: round;
    /* No CSS transition -- updates are driven directly by timer interval */
  }
  .btn-wrap.paused #rest-ring-bar {
    stroke: #777;
  }

  /* Skip button: small circular button positioned to the right of the main button,
     vertically aligned with its center. Fast-forward icon. */
  #skip-btn {
    position: absolute;
    left: calc(100% + 18px);
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #1a1a1a;
    border: 1px solid #333;
    color: #999;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: transform 0.12s ease, color 0.2s, border-color 0.2s, background 0.2s;
  }
  #skip-btn:active {
    transform: translateY(-50%) scale(0.85);
    color: #c0392b;
    border-color: #c0392b;
    background: rgba(192, 57, 43, 0.12);
  }
  #skip-btn svg {
    width: 18px;
    height: 18px;
    transition: transform 0.18s ease;
  }
  /* Subtle "skipping forward" cue: icon slides right + fades on press */
  @keyframes skip-icon-fly {
    0%   { transform: translateX(0);  opacity: 1; }
    100% { transform: translateX(8px); opacity: 0; }
  }
  #skip-btn.pressed svg {
    animation: skip-icon-fly 0.18s ease-out forwards;
  }

  /* Top corner buttons (back / forward / settings) — SVG icons, perfectly centered */
  .top-btn {
    position: fixed;
    top: 16px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid #333;
    background: #1a1a1a;
    color: #aaa;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 0;
    transition: opacity 0.2s, color 0.2s, border-color 0.2s, transform 0.1s;
  }
  .top-btn svg { width: 18px; height: 18px; display: block; }
  .top-btn:active { transform: scale(0.92); }
  #settings-btn { right: 16px; }
  #settings-btn svg { width: 20px; height: 20px; }
  .top-btn.disabled { opacity: 0.22; pointer-events: none; }

  /* Bottom logging area */
  #log-area {
    display: none;
    flex-direction: row;
    align-items: stretch;
    justify-content: center;
    gap: 8px;
    margin-top: auto;
    padding: 10px 20px 12px;
    width: 100%;
    max-width: 400px;
  }
  #set-label-col {
    display: flex;
    align-items: center;
    justify-content: center;
    padding-right: 8px;
    border-right: 1px solid #333;
    min-width: 22px;
    flex-shrink: 0;
  }
  #set-label-text {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
    font-size: 11px;
    font-weight: 700;
    color: #888;
    letter-spacing: 2px;
    white-space: nowrap;
  }
  #log-content {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }
  .log-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    column-gap: 12px;
    width: 100%;
  }
  .log-row > #rep-label { justify-self: end; }
  .log-row > #notes-input { justify-self: stretch; }
  #difficulty-row {
    display: flex;
    flex-direction: row;
    gap: 4px;
    width: 100%;
  }
  /* Main button gets a 45deg diagonal slash while browsing a past set —
     signals "Set Done" (and related actions) are inaccessible in view mode.
     Timer text stays readable. Main-btn is given position:relative so the
     pseudo-element anchors to it. */
  #main-btn { position: relative; }
  #main-btn.browsing::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 12%;
    right: 12%;
    height: 2px;
    background: rgba(192, 57, 43, 0.7);
    transform: translateY(-50%) rotate(-45deg);
    pointer-events: none;
    z-index: 2;
  }
  /* Container for return-pill + progress, so return-pill can absolute-position
     relative to the progress row (left side) without displacing dots. */
  .progress-area {
    position: relative;
    width: 100%;
    display: flex;
    justify-content: center;
  }
  .diff-btn {
    flex: 1;
    background: transparent;
    color: #777;
    border: 1px solid #333;
    border-radius: 4px;
    padding: 6px 2px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .diff-btn:active { background: #1e1e1e; }
  .diff-btn.selected {
    background: #c0392b;
    color: #fff;
    border-color: #c0392b;
  }
  /* Rep picker — horizontal scroll-snap wheel. Replaces +/- buttons.
     Cells: 40px wide. Picker visible width: 160px (4 cells visible at edges, ~3 readable).
     Center cell (snapped) gets is-active (red, big, bold). ±1 gets is-near (gray, medium).
     Beyond that, dim + small. Edge fade via mask-image. */
  .rep-picker {
    position: relative;
    width: 160px;
    height: 56px;
    flex-shrink: 0;
    -webkit-mask-image: linear-gradient(to right, transparent 0%, black 22%, black 78%, transparent 100%);
            mask-image: linear-gradient(to right, transparent 0%, black 22%, black 78%, transparent 100%);
  }
  .rep-picker__strip {
    display: flex;
    align-items: center;
    height: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    -ms-overflow-style: none;
    -webkit-overflow-scrolling: touch;
    padding: 0 calc(50% - 20px); /* 20 = half of cell width 40, lets endpoints center */
    overscroll-behavior-x: contain;
  }
  .rep-picker__strip::-webkit-scrollbar { display: none; }
  .rep-picker__num {
    flex: 0 0 40px;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    scroll-snap-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    font-weight: 400;
    color: #444;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: color 0.18s, font-size 0.18s, font-weight 0.18s;
  }
  .rep-picker__num.is-near {
    color: #888;
    font-size: 17px;
  }
  .rep-picker__num.is-active {
    color: #c0392b;
    font-size: 26px;
    font-weight: 700;
  }
  .rep-picker__indicator {
    position: absolute;
    bottom: 4px;
    left: 50%;
    transform: translateX(-50%);
    width: 24px;
    height: 2px;
    background: #c0392b;
    border-radius: 1px;
    pointer-events: none;
    opacity: 0.55;
  }
  #rep-label {
    font-size: 9px;
    color: #666;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  #notes-input {
    flex: 1;
    min-width: 0;
    padding: 8px 12px;
    border: 1px solid #333;
    border-radius: 6px;
    background: #1a1a1a;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #ddd;
    text-align: center;
    outline: none;
    transition: border-color 0.2s;
    cursor: pointer;                 /* read-only field; tap opens the note textbox */
    text-overflow: ellipsis;
    white-space: nowrap;
    overflow: hidden;
  }
  #notes-input:focus { border-color: #c0392b; }
  #notes-input::placeholder { color: #555; font-size: 11px; }

  /* Bottom fixed bar — transparent so body bg flashes through */
  #bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: transparent;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #progress {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 20px;
    padding: 12px 24px 16px;
    width: 100%;
  }
  /* NOW + SET pills stacked vertically on the LEFT side of the progress row,
     next to the exercise-name labels. Fade + slide-in from the left. */
  .pills-stack {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: flex-start;
    z-index: 40;
    pointer-events: none;
  }
  #return-pill, #set-current-btn {
    font-size: 10px;
    letter-spacing: 1.5px;
    color: #c0392b;
    background: rgba(26, 26, 26, 0.94);
    border: 1px solid rgba(192, 57, 43, 0.55);
    border-radius: 999px;
    text-transform: uppercase;
    padding: 6px 10px;
    cursor: pointer;
    text-align: center;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    opacity: 0;
    pointer-events: none;
    transform: translateX(-8px);
    transition: opacity 0.28s cubic-bezier(0.4, 0, 0.2, 1), transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #return-pill.visible, #set-current-btn.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(0);
  }
  .exercise-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  /* SortableJS classes */
  /* .sortable-chosen = the item held via long-press (stays in list, scales up) */
  .exercise-group.sortable-chosen {
    transform: scale(1.04);
  }
  /* .sortable-drag = floating clone. Hidden entirely — the visible drag cue
     is the ghost placeholder and the other items animating around it. */
  .exercise-group.sortable-drag {
    opacity: 0 !important;
    pointer-events: none;
  }
  /* .sortable-ghost = the placeholder slot in the original list */
  .exercise-group.sortable-ghost {
    opacity: 0.25;
    background: #2a2a2a;
    border-radius: 4px;
  }
  .exercise-group.sortable-ghost > * { visibility: hidden; }
  /* Lock scroll + kill iOS pull-to-refresh + text selection during drag */
  body.dragging-exercise {
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  .exercise-dots {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .exercise-label {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
    font-size: 9px;
    letter-spacing: 1px;
    color: #555;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .exercise-label.active { color: #c0392b; }
  .exercise-label.completed { color: #777; }

  /* Dots */
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #2a2a2a;
    transition: background 0.3s;
    flex-shrink: 0;
    position: relative;
    box-sizing: border-box;
  }
  .dot.active { background: #c0392b; }
  .dot.completed { background: #fafafa; cursor: pointer; }
  .dot.cursor {
    border: 2px solid #c0392b;
    background: transparent;
  }

  /* Active dot blinking — hollow circle, red edge only, Mazda turn signal pattern.
     Same 8px diameter, just border, no fill. Snap on then gradual fade off. */
  @keyframes mazda-edge {
    0%   { border-color: #c0392b; }
    100% { border-color: rgba(192, 57, 43, 0); }
  }
  .dot.active.blinking {
    background: transparent;
    border: 1.5px solid #c0392b;
    animation: mazda-edge 0.7s ease-out infinite;
  }

  /* Just-completed dot echoes a white ghost rightward toward the next dot.
     Positioned via 50% + translate so it stays aligned with the dot's visual
     center even when the dot has a border (e.g. .dot.cursor while browsing). */
  @keyframes echo-travel {
    0%   { transform: translate(-50%, -50%) translateX(0);    opacity: 0.85; }
    80%  { transform: translate(-50%, -50%) translateX(8px);  opacity: 0; }
    100% { transform: translate(-50%, -50%) translateX(13px); opacity: 0; }
  }
  .dot.completed.echoing::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #fafafa;
    animation: echo-travel 1.4s ease-out infinite;
    pointer-events: none;
  }

  /* Body alert flash — Mazda turn signal pattern, 700ms cycle. */
  @keyframes mazda-bg {
    0%   { background: #4a1410; }
    100% { background: #111; }
  }
  @keyframes mazda-timer {
    0%   { color: #c0392b; }
    100% { color: #eee; }
  }
  body.alert-flashing {
    animation: mazda-bg 0.7s ease-out 6;
  }
  body.alert-flashing #timer-display {
    animation: mazda-timer 0.7s ease-out 6;
  }

  /* Settings modal */
  #settings-modal, #edit-modal, #note-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  #settings-modal.show, #edit-modal.show, #note-modal.show { display: flex; }
  .modal-card {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    max-width: 320px;
  }
  .modal-title {
    font-size: 11px;
    color: #888;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 20px;
    font-weight: 400;
  }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid #252525;
  }
  .setting-row:last-child { border-bottom: none; }
  .setting-label {
    font-size: 13px;
    color: #ddd;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .setting-sub {
    font-size: 10px;
    color: #777;
    margin-top: 2px;
    letter-spacing: 0.5px;
  }
  .toggle {
    width: 44px;
    height: 24px;
    background: #333;
    border-radius: 12px;
    position: relative;
    cursor: pointer;
    transition: background 0.18s;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .toggle.on { background: #c0392b; }
  .toggle::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 20px;
    height: 20px;
    background: #f0f0f0;
    border-radius: 50%;
    transition: left 0.18s;
  }
  .toggle.on::after { left: 22px; }
  .modal-close {
    width: 100%;
    margin-top: 12px;
    padding: 10px;
    border: 1px solid #333;
    background: transparent;
    color: #aaa;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 8px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .modal-close.danger {
    border-color: #5a2a25;
    color: #c0392b;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .modal-close.danger:active {
    background: rgba(192, 57, 43, 0.1);
  }
  .modal-close.danger.confirming {
    background: #c0392b;
    color: #fff;
    border-color: #c0392b;
  }

  /* Edit modal-specific */
  .edit-title {
    font-size: 16px;
    color: #eee;
    font-weight: 700;
    margin-bottom: 4px;
    letter-spacing: -0.3px;
  }
  .edit-subtitle {
    font-size: 11px;
    color: #888;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .edit-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .edit-label {
    font-size: 9px;
    color: #666;
    letter-spacing: 2px;
    text-transform: uppercase;
    width: 40px;
  }
  /* #edit-reps removed — edit modal uses .rep-picker (see above). */
  #edit-notes {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid #333;
    border-radius: 6px;
    background: #111;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #ddd;
    outline: none;
    -webkit-user-select: auto;
    user-select: auto;
  }
  #edit-notes:focus { border-color: #c0392b; }
  #note-modal-text {
    width: 100%;
    min-height: 108px;
    padding: 12px 14px;
    border: 1px solid #333;
    border-radius: 8px;
    background: #111;
    color: #eee;
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;            /* >=16px so iOS Safari doesn't zoom on focus */
    line-height: 1.4;
    resize: vertical;
    outline: none;
    margin-bottom: 14px;
    box-sizing: border-box;
    -webkit-user-select: auto;
    user-select: auto;
  }
  #note-modal-text:focus { border-color: #c0392b; }
  #note-modal-text::placeholder { color: #555; }
  .edit-actions {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  .edit-btn {
    flex: 1;
    padding: 12px;
    border: 1px solid #333;
    background: #111;
    color: #aaa;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 8px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

// instantly without firing onChange (suppressChange flag prevents re-entry).
function createRepPicker(stripEl, opts) {
  const min = (opts && typeof opts.min === 'number') ? opts.min : 0;
  const max = (opts && typeof opts.max === 'number') ? opts.max : 50;
  const onChange = (opts && opts.onChange) || function() {};

    const cell = document.createElement('div');
    cell.className = 'rep-picker__num';

// v2 expansion: map an exercise's weight string to its audio clip names.
// Returns [] if no usable weight. Handles modifier suffix (e.g., "115 lbs + modifier").
// Half-weights use dash-decimal slug: "22.5 lbs" → "wgt-22-5".
function weightClipsFor(exerciseObj) {
  if (!exerciseObj || !exerciseObj.weight) return [];
  const w = String(exerciseObj.weight).toLowerCase();
  const numMatch = w.match(/(\d+(?:\.\d+)?)/);
  if (!numMatch) return [];
  const slug = numMatch[1].replace('.', '-');
  const result = ['wgt-' + slug];
  if (w.includes('modifier')) result.push('wgt-plus-modifier');
  return result;
}

// v2 expansion: map a rep range string like "8-12" to its rep-range cue clip.
function repRangeClipFor(repsStr) {
  if (!repsStr) return null;
  const m = String(repsStr).match(/(\d+)\s*-\s*(\d+)/);
  if (!m) return null;
  const key = parseInt(m[1], 10) + '-' + parseInt(m[2], 10);
  const map = {
    '6-10':  'cue-aim-6-10',
    '8-12':  'cue-aim-8-12',
    '10-12': 'cue-aim-10-12',
    '12-15': 'cue-aim-12-15',
    '15-20': 'cue-aim-15-20'
  };
  return map[key] || null;
}

// Set-position effort/RIR cues — DISABLED per Soren (2026-06-13: "get rid of the audio
// cues of 'go hard, 1-2 reps in reserve' — that type of shit is useless to me").
// Kept as a no-op so the 3 call sites (rest-start announcements) stay wired; always
// returns [] so no effort/RIR line is ever spoken. The countdown, rest-duration,
// exercise-name, and rep-range cues are untouched.
// (Old behavior: S2 → "Go hard" + "1-2 in reserve"; last set → "Max effort" + "0-1 in the tank".)
function setPositionCuesFor(setIdx, totalSets) {
  return [];
}

// Threshold-based countdown announcements (called from startCountdown).
// Each threshold fires once per rest period; reset by setDone when new rest begins.
function maybeFireCountdownCue(secCeil) {
  if (countdownFiredThresholds.has(secCeil)) return;
  const cues = {
    60: '1min-remaining',
    30: '30sec-remaining',
    10: '10sec-remaining',
    5: 'countdown-5',
    4: 'countdown-4',
    3: 'countdown-3',
    2: 'countdown-2',
    1: 'countdown-1'
  };
  const name = cues[secCeil];
  if (!name) return;
  // Skip remaining-N cues if total rest is at/below threshold (redundant with rest-start announcement)
  if ((secCeil === 60 && restTotalSeconds <= 60) ||
      (secCeil === 30 && restTotalSeconds <= 30) ||
      (secCeil === 10 && restTotalSeconds <= 10)) {
    countdownFiredThresholds.add(secCeil);
    return;
  }
  // Only mark the threshold fired if audio is actually playable. Otherwise the
  // next tick (100ms) gets another chance once the context recovers. Without
  // this gate, every silent-fail during the tab-return recovery window would
  // permanently suppress that countdown cue.
  if (!audioCtx || audioCtx.state !== 'running') return;
  countdownFiredThresholds.add(secCeil);
  VoiceCue.play(name);
}

// ============ HELPERS ============
function getMaxReps(repsStr) {
  const m = repsStr.match(/(\d+)\s*-\s*(\d+)/);
  return m ? parseInt(m[2], 10) : (parseInt(repsStr, 10) || 10);
}
function formatDuration(ms) {
  const totalSec = Math.max(0, Math.floor(ms / 1000));
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return m + "m " + s.toString().padStart(2, "0") + "s";
}
function getExerciseDuration(exerciseIdx) {
  const logs = setLogs.filter(l => l.exercise === exerciseIdx && l.timestamp);
  if (logs.length === 0) return null;
  if (logs.length === 1) return 0;
  const first = Math.min(...logs.map(l => l.timestamp));
  const last  = Math.max(...logs.map(l => l.timestamp));
  return last - first;
}

// ============ RENDERING ============
function getGlobalSetIndex() {
  let idx = 0;
  for (let i = 0; i < currentExercise; i++) idx += workout[i].sets;
  return idx + currentSet;
}

function renderProgress() {
  elProgress.innerHTML = "";
  const globalCurrent = getGlobalSetIndex();
  const isResting = (state === "resting" || state === "paused");
  const isDoingSet = (state === "ready" || state === "alert" || state === "finishing");
  let idx = 0;
  for (let i = 0; i < workout.length; i++) {
    const group = document.createElement("div");
    group.className = "exercise-group";
    group.dataset.exerciseIdx = i;
    const dotsRow = document.createElement("div");
    dotsRow.className = "exercise-dots";
    for (let j = 0; j < workout[i].sets; j++) {
      const dot = document.createElement("div");
      dot.className = "dot";
      const exIdx = i, setIdx = j;
      // Dataset drives the unified pointer-up tap handler on #progress.
      dot.dataset.exerciseIdx = exIdx;
      dot.dataset.setIdx = setIdx;
      if (idx < globalCurrent) {
        dot.classList.add("completed");
        if (idx === globalCurrent - 1 && isResting) {
          dot.classList.add("echoing");
        }
        dot.setAttribute("role", "button");
        dot.setAttribute("aria-label", "View " + workout[i].name + " set " + (j + 1));
      } else if (idx === globalCurrent) {
        dot.classList.add("active");
        if (isDoingSet) dot.classList.add("blinking");
      }
      if (exIdx === viewingExercise && setIdx === viewingSet && isBrowsing()) {
        dot.classList.add("cursor");
      }
      dotsRow.appendChild(dot);
      idx++;
    }
    const label = document.createElement("div");
    label.className = "exercise-label";
    if (i < currentExercise) label.classList.add("completed");
    else if (i === currentExercise) label.classList.add("active");
    label.textContent = workout[i].name;
    group.appendChild(label);
    group.appendChild(dotsRow);
    elProgress.appendChild(group);
  }
}

// Dynamic set advice: returns a string tailored to the user's prior-set
// performance in this exercise, or null to fall back to static setNotes.
// Gated on previous sets being FULLY logged (reps + difficulty) so the
// advice only appears once the user has actually committed a result, not
// based on default reps. ex.adviceFor(setIdx, prevLogs, ex) is called when
// defined; otherwise defaultAdvice() handles the generic trigger case
// for any exercise that declares a `trigger` array + `triggerWeight`.
// Dynamic per-set advice: computes a REALISTIC rep target for the upcoming set
// from the user's ACTUAL last-set reps + effort, and calls a weight drop when
// reps fall below the range. Replaces the old static "chase 12"-after-a-9 notes.
// difficulty = stored 1-5 scale (3 MOD, 4 HARD, 5 MAX). ex.backoff (optional) =
// the weight to drop to; ex.dropLastSet = last set is already a structural drop
// (defer to its static note there).
function dynamicRepAdvice(setIdx, prev, ex) {
  if (!prev || !prev.length || setIdx < 1) return null;
  if (ex.dropLastSet && setIdx === ex.sets - 1) return null;
  var rng = String(ex.reps || "").match(/(\d+)\D+(\d+)/);
  if (!rng) return null;
  var lo = +rng[1], hi = +rng[2];
  var last = prev[prev.length - 1];
  var r = Number(last.reps);
  if (isNaN(r)) return null;
  var d = +last.difficulty || 0;
  var maxed = d >= 5;
  var roomLeft = d > 0 && d <= 3;
  var wm = String(ex.weight).match(/(\d+(?:\.\d+)?)/);
  var w = wm ? wm[1] : "the weight";
  var bo = ex.backoff || null;
  var L = "S" + setIdx;
  var aimHi = Math.min(lo + 2, hi);
  var pLo, pHi;
  if (maxed) { pLo = Math.max(r - 2, 1); pHi = Math.max(r - 1, 1); }
  else if (roomLeft) { pLo = r; pHi = Math.min(r + 2, hi); }
  else { pLo = Math.max(r - 1, 1); pHi = r; }
  // Downtrend autoregulation (Soren's rule, 6/10): if reps are sliding across
  // max-effort sets and the NEXT set projects under the floor, LEAD with a
  // decisive weight drop -- never chase a number he's fading away from.
  if (bo && maxed && prev.length >= 2) {
    var firstR = Number(prev[0].reps);
    if (!isNaN(firstR)) {
      var lostPerSet = (firstR - r) / (prev.length - 1);
      if (lostPerSet >= 1 && (r - Math.round(lostPerSet)) < lo) {
        return "Fading " + firstR + "->" + r + " at max, next lands under " + lo + " at " + w + ". DROP to " + bo + ", aim " + lo + "-" + aimHi + ".";
      }
    }
  }
  if (r <= 0) return L + " stopped early. Reset, go by feel this set.";
  if (r < lo && maxed) {
    return bo ? L + " was " + r + ", under " + lo + "-" + hi + ". Drop to " + bo + ", aim " + lo + "-" + aimHi + "."
              : L + " was " + r + ", under " + lo + ". Grind " + lo + "+ or drop a notch.";
  }
  if (r <= lo && maxed) {
    return bo ? L + " hit the floor (" + r + " at max). Hold " + w + " for ~" + pLo + "-" + pHi + ", or drop to " + bo + " for " + lo + "-" + aimHi + "."
              : L + " at the floor (" + r + "). ~" + pLo + "-" + pHi + " here, that's the set.";
  }
  if (r >= hi && roomLeft) {
    return L + " hit " + r + " (top) with room. Bump the weight next session. Here: " + (hi - 1) + "-" + hi + ".";
  }
  if (roomLeft) {
    return L + " was " + r + " with room. Push " + pLo + "-" + pHi + ", hold " + w + ".";
  }
  return L + " was " + r + (maxed ? " at max" : "") + ". Aim " + pLo + "-" + pHi + ", hold " + w + "."
       + (bo ? " Under " + lo + "? Drop to " + bo + "." : "");
}

function defaultAdvice(setIdx, prev, ex) {
  if (!Array.isArray(ex.trigger) || setIdx === 0) return null;
  if (setIdx >= ex.trigger.length) return null;
  const reqHere = ex.trigger[setIdx];
  const passingPrior = prev.every((log, i) => log.reps >= ex.trigger[i]);
  const weightTag = ex.triggerWeight ? " for " + ex.triggerWeight : "";
  if (passingPrior) {
    if (setIdx === ex.trigger.length - 1) {
      return "TRIGGER ALIVE -- " + reqHere + "+ here flips" + weightTag + " next session. Push, form first.";
    }
    return "On track for trigger" + weightTag + " -- push " + reqHere + "+ here.";
  }
  // Trigger already out: say nothing here. Never tell Soren to "match" a
  // trigger number he's failing -- the rep/drop advisor or static note owns
  // the failing case (Soren's 6/10 call).
  return null;
}

function computeSetNote(exIdx, setIdx) {
  const ex = workout[exIdx];
  if (!ex) return "";
  // Build prev-set logs in order. Only count a prior set as "logged" if BOTH
  // reps and difficulty are committed -- prevents dynamic advice from firing
  // off default reps before the user has actually graded the set.
  const prevLogs = [];
  let allLogged = true;
  for (let i = 0; i < setIdx; i++) {
    const log = setLogs.find(l => l.exercise === exIdx && l.set === i);
    if (log && log.difficulty != null) {
      prevLogs.push({ reps: log.reps, difficulty: log.difficulty });
    } else {
      allLogged = false;
      break;
    }
  }
  if (allLogged && prevLogs.length === setIdx && setIdx > 0) {
    if (typeof ex.adviceFor === 'function') {
      const dynamic = ex.adviceFor(setIdx, prevLogs, ex);
      if (dynamic) return dynamic;
    }
    const reactive = dynamicRepAdvice(setIdx, prevLogs, ex);
    if (reactive) return reactive;
    const generic = defaultAdvice(setIdx, prevLogs, ex);
    if (generic) return generic;
  }
  // Static fallback (S1 always lands here; later sets land here pre-grading).
  if (Array.isArray(ex.setNotes) && ex.setNotes[setIdx]) return ex.setNotes[setIdx];
  return ex.note || "";
}

// The weight to actually load THIS set. Reflects (a) a structural drop set
// (dropLastSet, e.g. "110 lbs (S4 -> 90)") and (b) a reactive drop the advisor
// calls after a sub-range max-effort set (ex.backoff). So the number on screen
// is what to put on the machine, not the stale top-of-session prescription.
function effectiveWeight(exIdx, setIdx) {
  const ex = workout[exIdx];
  const baseStr = String(ex.weight || "");
  const baseNum = (baseStr.match(/(\d+(?:\.\d+)?)/) || [])[1] || null;
  const clean = baseStr.replace(/\s*\([^)]*\)\s*/g, "").trim() || baseStr;
  let dropNum = null;
  // (a) structural drop set: the last set of a dropLastSet exercise.
  if (ex.dropLastSet && setIdx === ex.sets - 1) {
    const m = baseStr.match(/(?:→|->|drop to)\s*(\d+(?:\.\d+)?)/i);
    if (m) dropNum = m[1];
  }
  // (b) reactive drop: prior set landed under range at max effort + a backoff exists.
  if (dropNum == null && setIdx >= 1 && ex.backoff) {
    const prevLogs = [];
    let allLogged = true;
    for (let i = 0; i < setIdx; i++) {
      const lg = setLogs.find(l => l.exercise === exIdx && l.set === i);
      if (lg && lg.difficulty != null) prevLogs.push({ reps: lg.reps, difficulty: lg.difficulty });
      else { allLogged = false; break; }
    }
    if (allLogged && prevLogs.length === setIdx) {
      const rng = String(ex.reps || "").match(/(\d+)\D+(\d+)/);
      const last = prevLogs[prevLogs.length - 1];
      if (rng && last && typeof last.reps === "number" && !isNaN(last.reps)) {
        const lo = +rng[1];
        const maxed = (+last.difficulty || 0) >= 5;
        if (last.reps < lo && maxed) {
          dropNum = (String(ex.backoff).match(/(\d+(?:\.\d+)?)/) || [])[1] || null;
        }
      }
    }
  }
  if (dropNum != null && dropNum !== baseNum) {
    return { dropped: true, html: '<span class="wt-now">▼ ' + dropNum + ' lbs</span><span class="wt-was">from ' + baseNum + '</span>' };
  }
  return { dropped: false, html: clean };
}
function setInfoHTML(exIdx, setIdx) {
  const ex = workout[exIdx];
  return effectiveWeight(exIdx, setIdx).html + "  ·  Set " + (setIdx + 1) + "/" + ex.sets + "  ·  " + ex.reps + " reps";
}

// Re-render JUST the exercise note. Cheaper than renderExercise() and
// non-disruptive to layout (no centerMainButton churn). Called from rep
// picker onChange + difficulty handler so set N's advice updates live as
// the user grades set N-1 during rest.
function refreshSetNote() {
  const exIdx = isBrowsing() ? viewingExercise : currentExercise;
  const setIdx = isBrowsing() ? viewingSet : currentSet;
  // Refresh the weight too: grading the prior set can flip the upcoming set to
  // a reactive drop, and the loaded weight must track that live.
  elSet.innerHTML = setInfoHTML(exIdx, setIdx);
  elNote.textContent = computeSetNote(exIdx, setIdx);
  fitNoteToBox();
}

function renderExercise() {
  // When browsing, show the viewed set's context; otherwise current working.
  const exIdx = isBrowsing() ? viewingExercise : currentExercise;
  const setIdx = isBrowsing() ? viewingSet : currentSet;
  const ex = workout[exIdx];
  elName.textContent = ex.name;
  // Weight is adaptive: reflects drop sets + reactive drops so it shows the
  // load to actually put on (not the stale prescription). Then Set X/Y, reps.
  elSet.innerHTML = setInfoHTML(exIdx, setIdx);
  // Compute set-specific note (dynamic advice when prev sets are graded,
  // static setNotes[] otherwise).
  let noteText = computeSetNote(exIdx, setIdx);
  elNote.textContent = noteText;
  fitNoteToBox();
  renderProgress();
  requestAnimationFrame(centerMainButton);
}

// Auto-shrink long exercise notes to fit the note box (CSS height:70px).
// Bug (fixed): this targeted 34px while the box is 70px, so the fit condition was never
// satisfied and EVERY note — even one-liners — fell through to the 8px floor. Now fits to
// the ACTUAL box height; 1-2 line notes keep their default size, only true 3+ line
// overflow shrinks (and steps down gently from near the default).
function fitNoteToBox() {
  if (!elNote) return;
  // Reset to CSS defaults so each render starts fresh
  elNote.style.fontSize = '';
  elNote.style.lineHeight = '';
  if (!elNote.textContent) return;
  const maxHeight = elNote.clientHeight || 70;
  // Reading scrollHeight forces synchronous reflow / accurate measurement
  if (elNote.scrollHeight <= maxHeight) return;
  // Progressively shrink font + tighten line-height until the note fits
  for (let fs = 18; fs >= 8; fs -= 0.5) {
    elNote.style.fontSize = fs + 'px';
    elNote.style.lineHeight = '1.22';
    if (elNote.scrollHeight <= maxHeight) return;
  }
  // Worst case: leave at 8px / 1.15 line-height; clipping minor at this size
  elNote.style.fontSize = '8px';
  elNote.style.lineHeight = '1.15';
}

function formatTime(seconds) {
  // Always ceil (handles floats from precise pause/resume math)
  const total = Math.max(0, Math.ceil(seconds));
  const m = Math.floor(total / 60);
  const s = total % 60;
  return `${m}:${s.toString().padStart(2, "0")}`;
}

// ============ FLASH (Mazda) ============
function startFlash() {
  document.body.classList.remove('alert-flashing');
  void document.body.offsetWidth;
  document.body.classList.add('alert-flashing');
}
function stopFlash() {
  document.body.classList.remove('alert-flashing');
}

// ============ REST RING ============
function updateRestRing() {
  if (!restEndTime || !restTotalSeconds) {
    elRingBar.setAttribute("stroke-dashoffset", RING_CIRCUMFERENCE);
    return;
  }
  const remaining = Math.max(0, (restEndTime - Date.now()) / 1000);
  const fraction = Math.max(0, Math.min(1, remaining / restTotalSeconds));
  const offset = RING_CIRCUMFERENCE * (1 - fraction);
  elRingBar.setAttribute("stroke-dashoffset", offset);
}
function showRestRing(show, paused) {
  elBtnWrap.classList.toggle("show-ring", !!show);
  elBtnWrap.classList.toggle("paused", !!paused);
}

// ============ LOG AREA ============
function showLogArea(exerciseIdx) {
  logExerciseIndex = exerciseIdx;
  elNotesInput.placeholder = "notes...";
  elLogArea.style.display = "flex";
  syncLogArea();
}
function hideLogArea() {
  elLogArea.style.display = "none";
}
function captureLog() {
  // Reps/notes/difficulty are saved in real-time via input handlers.
  // This just clears the active log reference at transition points.
  currentLogEntry = null;
}

// ============ TIMER LOOP ============
function startCountdown() {
  if (timerInterval) clearInterval(timerInterval);
  updateRestRing();
  // 100ms updates = smooth ring without CSS transition
  timerInterval = setInterval(() => {
    const remaining = Math.max(0, (restEndTime - Date.now()) / 1000);
    if (remaining <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      updateRestRing();
      restDone();
    } else {
      restRemaining = remaining;
      const secCeil = Math.ceil(remaining);
      maybeFireCountdownCue(secCeil);
      elTimer.textContent = formatTime(secCeil);
      updateRestRing();
    }
  }, 100);
}

// ============ HISTORY (back/forward) ============
function snapshot() {
  return {
    currentExercise, currentSet, state,
    workoutStartTime,
    restEndTime, restRemaining, restTotalSeconds,
    setLogs: setLogs.map(l => ({...l})),
    repCount, logExerciseIndex,
    notes: elNotesInput.value,
    currentLogEntryIdx: currentLogEntry ? setLogs.indexOf(currentLogEntry) : -1,
    countdownFiredThresholds: [...countdownFiredThresholds]
  };
}
function applySnapshot(s) {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  cancelRestNotif();
  stopFlash();
  VoiceCue.cancel();

  currentExercise = s.currentExercise;
  currentSet = s.currentSet;
  viewingExercise = currentExercise;
  viewingSet = currentSet;
  state = s.state;
  workoutStartTime = (typeof s.workoutStartTime === 'number') ? s.workoutStartTime : null;
  restEndTime = s.restEndTime;
  restRemaining = s.restRemaining;
  restTotalSeconds = s.restTotalSeconds || s.restRemaining || 0;
  setLogs.length = 0;
  s.setLogs.forEach(l => setLogs.push(l));
  repCount = s.repCount;
  logExerciseIndex = s.logExerciseIndex;
  currentLogEntry = s.currentLogEntryIdx >= 0 ? setLogs[s.currentLogEntryIdx] : null;
  countdownFiredThresholds = new Set(s.countdownFiredThresholds || []);

  // If restoring an expired resting state, restart the countdown with full rest period
  // (otherwise back from alert just bounces right back to alert)
  if (state === "resting" && restEndTime && restEndTime < Date.now()) {
    restEndTime = Date.now() + restRemaining * 1000;
    // Fresh rest needs fresh countdown cues. Without this clear, the snapshot's
    // already-fired thresholds (60/30/10/5/4/3/2/1) carry over and silence
    // every cue during the restarted countdown.
    countdownFiredThresholds = new Set();
  }

  applyState(s.notes || "");
  saveState();
}
function applyState(notesValue) {
  showRestRing(false, false);

  if (state === "resting" && restEndTime) {
    const remaining = Math.ceil((restEndTime - Date.now()) / 1000);
    if (remaining <= 0) {
      state = "alert";
      restEndTime = null;
      renderExercise();
      elTimer.textContent = "0:00";
      elTimerLabel.textContent = "GO";
      elBtn.textContent = "Start Set";
      elBtn.className = "go";
      elSkip.style.display = "none";
      elLogArea.style.display = "flex";
      startFlash();
      triggerAlertFeedback();
      {
        const setStart = setStartClipFor(currentExercise, currentSet);
        let seq;
        if (settings.autoStart) {
          seq = ['rest-complete', setStart].filter(Boolean);
          // v2: weight NOT re-announced — same weight across all sets within an exercise
          const ex = workout[currentExercise];
          if (ex) seq.push(...setPositionCuesFor(currentSet, ex.sets));
        } else {
          seq = ['rest-complete', 'tap-to-start'];
        }
        const _dc = dailyClipFor(currentExercise, currentSet);
        if (_dc) seq.push(_dc);
        VoiceCue.playSequence(seq);
      }
    } else {
      restRemaining = remaining;
      renderExercise();
      elTimer.textContent = formatTime(remaining);
      elTimerLabel.textContent = "REST";
      elBtn.textContent = "Pause";
      elBtn.className = "resting";
      elSkip.style.display = "flex";
      elLogArea.style.display = "flex";
      repPicker.setValue(repCount);
      elNotesInput.value = notesValue;
      showRestRing(true, false);
      requestWakeLock();
      scheduleRestNotif(remaining * 1000);
      startCountdown();
    }
  } else if (state === "alert") {
    renderExercise();
    elTimer.textContent = "0:00";
    elTimerLabel.textContent = "GO";
    elBtn.textContent = "Start Set";
    elBtn.className = "go";
    elSkip.style.display = "none";
    elLogArea.style.display = "flex";
    elNotesInput.value = notesValue;
    startFlash();
    triggerAlertFeedback();
  } else if (state === "paused") {
    renderExercise();
    elTimer.textContent = formatTime(restRemaining);
    elTimerLabel.textContent = "PAUSED";
    elBtn.textContent = "Resume";
    elBtn.className = "paused";
    elSkip.style.display = "flex";
    elLogArea.style.display = "flex";
    repPicker.setValue(repCount);
    elNotesInput.value = notesValue;
    showRestRing(true, true);
    updateRestRing();
  } else if (state === "finishing") {
    renderExercise();
    elBtn.textContent = "Finish";
    elBtn.className = "go";
    elTimer.textContent = "-:--";
    elTimerLabel.textContent = "LOG YOUR LAST SET";
    elSkip.style.display = "none";
    elLogArea.style.display = "flex";
    repPicker.setValue(repCount);
    elNotesInput.value = notesValue;
  } else if (state === "ready") {
    renderExercise();
    elTimer.textContent = "-:--";
    elTimerLabel.textContent = "";
    elBtn.textContent = "Set Done";
    elBtn.className = "";
    elSkip.style.display = "none";
    elLogArea.style.display = "flex";
    elNotesInput.value = notesValue;
  } else if (state === "pre-start") {
    // Initial state: workout hasn't begun. User taps "Start Workout" to play
    // the day-name + first-exercise audio, record workoutStartTime, and
    // transition to "ready". Log area hidden — there's nothing to log yet.
    renderExercise();
    elTimer.textContent = "-:--";
    elTimerLabel.textContent = "";
    elBtn.textContent = "Start Workout";
    elBtn.className = "go";
    elSkip.style.display = "none";
    elLogArea.style.display = "none";
  } else {
    renderExercise();
  }
  // Disable main button + show return/here pills while browsing
  if (isBrowsing()) {
    elBtn.style.opacity = '0.35';
    elBtn.style.pointerEvents = 'none';
    elReturnPill.classList.add('visible');
    elSetCurrentBtn.classList.add('visible');
    elBtn.classList.add('browsing');
    elLogArea.style.display = 'flex';
  } else {
    elBtn.style.opacity = '';
    elBtn.style.pointerEvents = '';
    elReturnPill.classList.remove('visible');
    elSetCurrentBtn.classList.remove('visible');
    elBtn.classList.remove('browsing');
    // Keep log area visible in non-finished states (user can always see/edit notes)
    if (state !== 'finished') elLogArea.style.display = 'flex';
  }
  // Sync log area UI (reps/notes/difficulty) with the active log entry.
  // Overrides per-branch repPicker/elNotesInput values set above, ensuring
  // UI matches whichever log is being edited (current working or viewed).
  if (elLogArea.style.display === 'flex') syncLogArea();
  updateNavButtons();
}
function pushHistory() {
  history.push(snapshot());
  if (history.length > HISTORY_MAX) history.shift();
  future.length = 0;
  updateNavButtons();
}
function back() {
  if (history.length === 0) return;
  future.push(snapshot());
  if (future.length > HISTORY_MAX) future.shift();
  const s = history.pop();
  applySnapshot(s);
}
function forward() {
  if (future.length === 0) return;
  history.push(snapshot());
  if (history.length > HISTORY_MAX) history.shift();
  const s = future.pop();
  applySnapshot(s);
}
function updateNavButtons() {}

// ============ STATE TRANSITIONS ============
// Pre-start → ready transition. Records workout start time so set 1's
// duration is real (not extrapolated from later-set gaps) and plays the
// day-type + first-exercise audio cue (user gesture unlocks audio on iOS).
function startWorkout() {
  workoutStartTime = Date.now();
  state = "ready";
  applyState("");
  saveState();
  const startClip = dayType.toLowerCase().includes("upper") ? 'start-upper' : 'start-lower';
  const firstExClip = exerciseClipName(workout[0] && workout[0].name);
  const seq = [startClip, firstExClip].filter(Boolean);
  const _dcStart = dailyClipFor(0, 0);
  if (_dcStart) {
    // Daily hype line states the weight + target itself.
    seq.push(_dcStart);
  } else if (workout[0]) {
    // v2: append weight + rep range for the first exercise of the workout
    seq.push(...weightClipsFor(workout[0]));
    const repClip = repRangeClipFor(workout[0].reps);
    if (repClip) seq.push(repClip);
  }
  if (seq.length) VoiceCue.playSequence(seq);
}

function setDone() {
  pushHistory();
  stopFlash();
  // Read the user's in-progress inputs BEFORE creating the new log entry,
  // so reps/difficulty/notes typed DURING the set (before Set Done) carry
  // over instead of getting clobbered by defaults. (Old code created the
  // entry with default reps + empty note + null difficulty, and the
  // user's edits, which had been writing to the PREVIOUS set's log via
  // the active-log handlers, looked "erased" the moment Set Done fired.)
  const draftReps = repCount;
  const draftNote = elNotesInput.value || "";
  const selectedDiffBtn = elDifficultyRow.querySelector('.diff-btn.selected');
  const draftDiff = selectedDiffBtn ? Number(selectedDiffBtn.dataset.diff) : null;
  captureLog();

  // Dedup: re-logging an already-logged (exercise,set) — e.g. after browsing back to a
  // past set via the ↓SET pill — must UPDATE that log, not push a second one. Reads use
  // setLogs.find (first match), so a duplicate would shadow the correction: the summary
  // keeps the stale reps/difficulty while the fresh edit is unreachable (silent data loss).
  let logEntry = setLogs.find(l => l.exercise === currentExercise && l.set === currentSet);
  if (logEntry) {
    logEntry.reps = draftReps;
    logEntry.note = draftNote;
    logEntry.difficulty = draftDiff;
    logEntry.timestamp = Date.now();
  } else {
    logEntry = {
      exercise: currentExercise,
      set: currentSet,
      reps: draftReps,
      note: draftNote,
      difficulty: draftDiff,
      timestamp: Date.now()
    };
    setLogs.push(logEntry);
  }
  currentLogEntry = logEntry;

  const finishedExercise = currentExercise;
  currentSet++;

  showLogArea(finishedExercise);

  const isLastSet = finishedExercise >= workout.length - 1 && currentSet >= workout[finishedExercise].sets;
  if (isLastSet) {
    viewingExercise = currentExercise;
    viewingSet = currentSet - 1;
    elBtn.textContent = "Finish";
    elBtn.className = "go";
    state = "finishing";
    elTimer.textContent = "-:--";
    elTimerLabel.textContent = "LOG YOUR LAST SET";
    elSkip.style.display = "none";
    showRestRing(false);
    renderProgress();
    VoiceCue.playSequence(['received', 'final-set-logged']);
    requestAnimationFrame(() => { saveState(); });
    return;
  }

  if (currentSet >= workout[currentExercise].sets) {
    currentExercise++;
    currentSet = 0;
  }

  // Keep viewing cursor pinned to working position after advancement
  viewingExercise = currentExercise;
  viewingSet = currentSet;

  elSkip.style.display = "flex";
  elSkip.style.pointerEvents = "auto";
  state = "resting";
  const switchingExercise = (finishedExercise !== currentExercise);
  restRemaining = switchingExercise ? 60 : workout[finishedExercise].rest;
  restTotalSeconds = restRemaining;
  restEndTime = Date.now() + restRemaining * 1000;
  elTimer.textContent = formatTime(restRemaining);
  elTimerLabel.textContent = switchingExercise ? "UP NEXT" : "REST";
  elBtn.textContent = "Pause";
  elBtn.className = "resting";
  renderExercise();
  showRestRing(true, false);
  countdownFiredThresholds = new Set();
  startCountdown();

  // Voice cue: "Received" then branch (exercise switch vs normal in-exercise rest)
  {
    let seq;
    if (switchingExercise) {
      const isFinalExercise = (currentExercise === workout.length - 1);
      const exClip = exerciseClipName(workout[currentExercise].name);
      seq = ['received', 'exercise-complete'];
      seq.push(isFinalExercise ? 'final-exercise' : 'up-next');
      if (exClip) seq.push(exClip);
      // v2: append weight + rep range for upcoming exercise — but skip when a set-1 daily
      // clip exists for it (the daily hype states the weight/target itself; mirrors
      // startWorkout's guard, else the weight double-announces with the daily clip).
      if (!dailyClipFor(currentExercise, 0)) {
        seq.push(...weightClipsFor(workout[currentExercise]));
        const repClipSwitch = repRangeClipFor(workout[currentExercise].reps);
        if (repClipSwitch) seq.push(repClipSwitch);
      }
      const switchRestClip = restClipForDuration(restRemaining);
      if (switchRestClip) seq.push(switchRestClip);
    } else {
      const restClip = restClipForDuration(workout[finishedExercise].rest);
      seq = restClip ? ['received', restClip] : ['received'];
    }
    VoiceCue.playSequence(seq);
  }

  // Defer all expensive non-critical work to next frame so the UI updates immediately
  requestAnimationFrame(() => {
    initAudio();
    requestWakeLock();
    ensureNotifPermission();
    scheduleRestNotif(restRemaining * 1000);
    saveState();
  });
}

function restDone() {
  if (state !== "resting") return;
  pushHistory();
  cancelRestNotif();
  captureLog();
  // Log area stays visible across rest->ready/alert transition so user always
  // has access to notes/reps/diff, even on the Start Set / Set Done screens.
  showRestRing(false);

  if (settings.autoStart) {
    state = "ready";
    elTimer.textContent = "-:--";
    elTimerLabel.textContent = "GO";
    elBtn.textContent = "Set Done";
    elBtn.className = "";
    elSkip.style.display = "none";
    renderExercise();
  } else {
    state = "alert";
    elTimer.textContent = "0:00";
    elTimerLabel.textContent = "GO";
    elBtn.textContent = "Start Set";
    elBtn.className = "go";
    elSkip.style.display = "none";
    renderExercise();
  }
  elLogArea.style.display = "flex";
  syncLogArea();
  startFlash();
  updateNavButtons();
  // Voice cue: "Rest complete" + (set-N + position cue if autoStart, "Tap to start" if alert mode)
  // v2: weight is NOT re-announced — same weight all sets of an exercise. Exercise transition handled it.
  {
    const seq = ['rest-complete'];
    if (settings.autoStart) {
      const setStart = setStartClipFor(currentExercise, currentSet);
      if (setStart) seq.push(setStart);
      const ex = workout[currentExercise];
      if (ex) seq.push(...setPositionCuesFor(currentSet, ex.sets));
    } else {
      seq.push('tap-to-start');
    }
    const _dc = dailyClipFor(currentExercise, currentSet);
    if (_dc) seq.push(_dc);
    // If we landed here from visibilitychange while the audio context is still
    // suspended (no user gesture since tab return), playSequence would silent-fail
    // and the cue would be lost. Queue it instead; the global gesture-recovery
    // handler drains the queue once a real touch unlocks audio.
    if (audioCtx && audioCtx.state === 'running') {
      VoiceCue.playSequence(seq);
    } else {
      pendingPostGestureCues.push(seq);
    }
  }
  // Defer audio/save so UI updates first (no perceptible lag)
  requestAnimationFrame(() => {
    triggerAlertFeedback();
    saveState();
  });
}

function pauseRest() {
  captureLog();
  cancelRestNotif();
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  // Capture EXACT remaining time (float seconds) so resume doesn't round-up jump
  restRemaining = Math.max(0, (restEndTime - Date.now()) / 1000);
  state = "paused";
  elBtn.textContent = "Resume";
  elBtn.className = "paused";
  elTimerLabel.textContent = "PAUSED";
  showRestRing(true, true);
  renderProgress();
  saveState();
  VoiceCue.cancel();
  VoiceCue.play('paused');
}

function resumeRest() {
  captureLog();
  state = "resting";
  elBtn.textContent = "Pause";
  elBtn.className = "resting";
  elTimerLabel.textContent = "REST";
  showRestRing(true, false);
  renderProgress();

  // Defer timer restart until the 'resumed' cue finishes playing.
  // If voice is OFF, playSequence resolves immediately so timer restart is synchronous.
  // If user pauses/skips during the cue, the state-check bails out cleanly.
  VoiceCue.cancel();
  VoiceCue.playSequence(['resumed']).then(() => {
    if (state !== "resting") return;
    restEndTime = Date.now() + restRemaining * 1000;
    scheduleRestNotif(restRemaining * 1000);
    saveState();
    startCountdown();
  });
}

function skipRest() {
  pushHistory();
  VoiceCue.cancel();
  cancelRestNotif();
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  captureLog();
  // Log area stays visible across skip (user still has notes/reps/diff UI)
  showRestRing(false);
  state = "ready";
  elTimer.textContent = "-:--";
  elTimerLabel.textContent = "";
  elBtn.textContent = "Set Done";
  elBtn.className = "";
  elSkip.style.display = "none";
  renderExercise();
  elLogArea.style.display = "flex";
  syncLogArea();
  saveState();

  // Voice cue: same shape as restDone autoStart path. If skipping inter-exercise rest
  // (currentSet === 0 of a freshly-advanced exercise), re-announce the upcoming exercise
  // since the original "up-next + ex-name" chain was cancelled mid-flight.
  {
    const seq = ['rest-complete'];
    const setStart = setStartClipFor(currentExercise, currentSet);
    if (setStart) {
      seq.push(setStart);
    } else if (currentSet === 0) {
      const isFinalExercise = (currentExercise === workout.length - 1);
      const exClip = exerciseClipName(workout[currentExercise] && workout[currentExercise].name);
      // v2: ALWAYS push up-next (or final-exercise) before the exercise name on inter-exercise skip.
      // Previously this was omitted, leaving "Rest complete. [ExName]..." without the transition cue.
      seq.push(isFinalExercise ? 'final-exercise' : 'up-next');
      if (exClip) seq.push(exClip);
    }
    // v2: announce weight + rep range ONLY when re-entering an exercise at set 0 (skipped inter-exercise rest);
    // for in-exercise sets (set 1+), weight is already known from prior announcement — just play position cue.
    const ex = workout[currentExercise];
    if (ex) {
      if (currentSet === 0) {
        if (!dailyClipFor(currentExercise, 0)) {
          seq.push(...weightClipsFor(ex));
          const repClip = repRangeClipFor(ex.reps);
          if (repClip) seq.push(repClip);
        }
      } else {
        seq.push(...setPositionCuesFor(currentSet, ex.sets));
      }
    }
    const _dc = dailyClipFor(currentExercise, currentSet);
    if (_dc) seq.push(_dc);
    VoiceCue.playSequence(seq);
  }
}

function acknowledgeAlert() {
  pushHistory();
  captureLog();  // Safety: ensure any pending reps/notes are pinned to the log entry
  stopFlash();
  state = "ready";
  elTimer.textContent = "-:--";
  elTimerLabel.textContent = "";
  elBtn.textContent = "Set Done";
  elBtn.className = "";
  renderExercise();
  saveState();
}

// ============ DRAG REORDER ============
// Long-press on an exercise-group (label + dots area) to grab it.
// Drag to target position, release to commit.
// Short tap on a completed dot still opens the edit modal (handled by skipping drag init when target is a completed dot).

// Transform an exercise index according to a splice(fromIdx,1) + splice(toIdx,0,moved) reorder.
function transformExerciseIdx(ei, fromIdx, toIdx) {
  if (ei === fromIdx) return toIdx;
  if (fromIdx < ei && ei <= toIdx) return ei - 1;
  if (toIdx <= ei && ei < fromIdx) return ei + 1;
  return ei;
}

function reorderExercise(fromIdx, toIdx) {
  if (fromIdx === toIdx) return;
  if (fromIdx < 0 || fromIdx >= workout.length) return;
  if (toIdx < 0 || toIdx >= workout.length) return;

  VoiceCue.cancel();
  pushHistory();

  // If the edit modal is open on a log, its editingLog reference survives
  // (setLogs array isn't reordered, only log.exercise values get remapped),
  // but any displayed exercise NAME in the modal could go stale. Close to be safe.
  if (elEditModal.classList.contains("show")) closeEditModal();

  // Shuffle the workout array
  const moved = workout.splice(fromIdx, 1)[0];
  workout.splice(toIdx, 0, moved);

  // Remap every live exercise-index reference
  const remap = (ei) => transformExerciseIdx(ei, fromIdx, toIdx);

  currentExercise = remap(currentExercise);
  logExerciseIndex = remap(logExerciseIndex);
  viewingExercise = remap(viewingExercise);
  setLogs.forEach(l => { l.exercise = remap(l.exercise); });

  // Remap history and future snapshots too, so back/forward stay correct
  const remapSnapshot = (snap) => {
    if (typeof snap.currentExercise === 'number') snap.currentExercise = remap(snap.currentExercise);
    if (typeof snap.logExerciseIndex === 'number') snap.logExerciseIndex = remap(snap.logExerciseIndex);
    if (Array.isArray(snap.setLogs)) {
      snap.setLogs.forEach(l => { l.exercise = remap(l.exercise); });
    }
  };
  history.forEach(remapSnapshot);
  future.forEach(remapSnapshot);

  renderExercise();  // rerenders name/weight/reps + calls renderProgress()
  saveState();

}

// ============ VIEWING CURSOR (tap-to-cycle) ============
function cycleView(exIdx, setIdx) {
  // Second tap on the already-viewed completed set opens edit modal
  if (viewingExercise === exIdx && viewingSet === setIdx && isBrowsing()) {
    const log = setLogs.find(l => l.exercise === exIdx && l.set === setIdx);
    if (log) { openEditModal(exIdx, setIdx); return; }
  }
  viewingExercise = exIdx;
  viewingSet = setIdx;
  renderExercise();
  elReturnPill.classList.toggle('visible', isBrowsing());
  elSetCurrentBtn.classList.toggle('visible', isBrowsing());
  if (isBrowsing()) {
    elBtn.style.opacity = '0.35';
    elBtn.style.pointerEvents = 'none';
    // Force log area visible so user can see/edit the viewed set's reps+notes+diff
    elLogArea.style.display = 'flex';
    // Diagonal slash across the main button signals "Set Done" is inaccessible
    // in view mode. Rest-timer continues running internally.
    elBtn.classList.add('browsing');
  } else {
    elBtn.style.opacity = '';
    elBtn.style.pointerEvents = '';
    elBtn.classList.remove('browsing');
  }
  syncLogArea();
  saveState();
}

function returnToWorking() {
  viewingExercise = currentExercise;
  viewingSet = currentSet;
  renderExercise();
  elReturnPill.classList.remove('visible');
  elSetCurrentBtn.classList.remove('visible');
  elBtn.style.opacity = '';
  elBtn.style.pointerEvents = '';
  elBtn.classList.remove('browsing');
  // Log area is always visible except when workout is finished.
  if (state !== 'finished') {
    elLogArea.style.display = 'flex';
  } else {
    elLogArea.style.display = 'none';
  }

  saveState();
}

// ============ SUMMARY ============
function summaryDateStr() {
  return new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
}
function getTotalDuration() {
  const ts = setLogs.filter(l => l.timestamp).map(l => l.timestamp);
  if (ts.length === 0) return null;
  const lastTs = Math.max(...ts);
  // Preferred path: pre-start → ready tap recorded an explicit workout start.
  // No extrapolation needed — set 1's duration is real.
  if (workoutStartTime) return lastTs - workoutStartTime;
  // Fallback for sessions started before pre-start existed (no workoutStartTime
  // saved). S1 of the first-performed exercise has no "start" timestamp — only
  // the Set Done press when it finished. Estimate it by averaging the gaps
  // between consecutive sets in that same exercise.
  if (ts.length < 2) return null;
  const raw = lastTs - Math.min(...ts);
  const logsWithTs = setLogs.filter(l => l.timestamp).slice().sort((a, b) => a.timestamp - b.timestamp);
  const firstExIdx = logsWithTs[0].exercise;
  const firstExLogs = setLogs
    .filter(l => l.exercise === firstExIdx && l.timestamp)
    .sort((a, b) => a.set - b.set);
  if (firstExLogs.length < 2) return raw;
  let gapSum = 0;
  for (let i = 1; i < firstExLogs.length; i++) {
    gapSum += firstExLogs[i].timestamp - firstExLogs[i - 1].timestamp;
  }
  const avgGap = gapSum / (firstExLogs.length - 1);
  return raw + avgGap;
}
const DIFFICULTY_LABELS = ['', 'EASY', 'LIGHT', 'MOD', 'HARD', 'MAX'];
function formatDifficulty(log) {
  return (log && log.difficulty) ? ' [' + DIFFICULTY_LABELS[log.difficulty] + ']' : '';
}
function buildSummary() {
  let text = dayType + " -- " + summaryDateStr() + "\n\n";
  for (let i = 0; i < workout.length; i++) {
    const ex = workout[i];
    const dur = getExerciseDuration(i);
    text += ex.name + " @ " + ex.weight;
    if (dur && dur > 0) text += "  (" + formatDuration(dur) + ")";
    text += "\n";
    for (let j = 0; j < ex.sets; j++) {
      const log = setLogs.find(l => l.exercise === i && l.set === j);
      if (log) {
        const diff = formatDifficulty(log);
        const note = log.note ? " -- " + log.note : "";
        text += "  S" + (j + 1) + ": " + log.reps + " reps" + diff + note + "\n";
      } else {
        text += "  S" + (j + 1) + ": -\n";
      }
    }
    if (i < workout.length - 1) text += "\n";
  }
  const total = getTotalDuration();
  if (total) text += "\nTotal: " + formatDuration(total) + "\n";
  return text;
}
function buildSummaryHTML() {
  let html = '<div class="exercise-header">' + dayType + ' -- ' + summaryDateStr() + '</div><br>';
  for (let i = 0; i < workout.length; i++) {
    const ex = workout[i];
    const dur = getExerciseDuration(i);
    let header = ex.name + ' @ ' + ex.weight;
    let durTag = (dur && dur > 0) ? ' <span class="duration-tag">(' + formatDuration(dur) + ')</span>' : '';
    html += '<div class="exercise-header">' + header + durTag + '</div>';
    for (let j = 0; j < ex.sets; j++) {
      const log = setLogs.find(l => l.exercise === i && l.set === j);
      if (log) {
        const diff = formatDifficulty(log);
        const note = log.note ? ' -- ' + log.note : '';
        html += '<div class="set-line">S' + (j + 1) + ': <span class="set-note">' + log.reps + ' reps' + diff + note + '</span></div>';
      } else {
        html += '<div class="set-line">S' + (j + 1) + ': -</div>';
      }
    }
    if (i < workout.length - 1) html += '<br>';
  }
  const total = getTotalDuration();
  if (total) html += '<div class="total-line">Total: ' + formatDuration(total) + '</div>';
  return html;
}

function finishWorkout() {

});
elSettingsModal.addEventListener("click", (e) => {
  if (e.target === elSettingsModal) closeSettings();
});
elToggleAutoStart.addEventListener("click", () => {
  settings.autoStart = !settings.autoStart; saveSettings(); applySettingsToggles();
});
elToggleVoice.addEventListener("click", () => {
  settings.voice = !settings.voice;
  if (!settings.voice) VoiceCue.cancel();
  saveSettings();
  applySettingsToggles();
});

// ============ INPUT HANDLERS ============
elBtn.addEventListener("click", () => {
  recoverAudioCtx();
  VoiceCue.unlock();
  startAudioKeepalive();
  if (state === "pre-start") startWorkout();
  else if (state === "ready") setDone();
  else if (state === "alert") acknowledgeAlert();
  else if (state === "resting") pauseRest();
  else if (state === "paused") resumeRest();
  else if (state === "finishing") finishWorkout();
});
elSkip.addEventListener("click", (e) => {
  e.stopPropagation();
  if (state !== "resting" && state !== "paused") return;
  // Subtle press animation: icon flies right while we transition state
  elSkip.classList.add("pressed");
  setTimeout(() => {
    skipRest();
    elSkip.classList.remove("pressed");
  }, 160);
});
elNotesInput.addEventListener("input", () => {
  const log = getActiveLogForEdit();
  if (log) log.note = elNotesInput.value;
  saveState();
});
// Note textbox modal — the inline field is read-only; tapping it opens a real
// textarea so the note is actually visible while typing. Save funnels back
// through the inline field's input handler above (keeps log.note + saveState).
function openNoteModal() {
  if (elLogArea.style.display === "none") return;
  elNoteModalText.value = elNotesInput.value || "";
  elNoteModal.classList.add("show");
  // Focus synchronously inside the tap gesture (iOS only pops the keyboard for
  // gesture-stack focus), with a rAF backup once layout has flushed.
  try { elNoteModalText.focus(); } catch (e) {}
  requestAnimationFrame(() => { try { elNoteModalText.focus(); } catch (e) {} });
}
function closeNoteModal() { elNoteModal.classList.remove("show"); }
elNotesInput.addEventListener("click", openNoteModal);
elNotesInput.addEventListener("focus", openNoteModal);
elNoteCancel.addEventListener("click", closeNoteModal);
elNoteSave.addEventListener("click", () => {
  elNotesInput.value = elNoteModalText.value;
  elNotesInput.dispatchEvent(new Event("input"));
  closeNoteModal();
});
elNoteModal.addEventListener("click", (e) => { if (e.target === elNoteModal) closeNoteModal(); });
elDifficultyRow.addEventListener("click", (e) => {
  const btn = e.target.closest('.diff-btn');
  if (!btn) return;
  const diff = Number(btn.dataset.diff);
  if (!diff) return;
  const log = getActiveLogForEdit();
  if (!log) return;
  log.difficulty = (log.difficulty === diff) ? null : diff;
  renderDifficulty(log);
  // Refresh next set's advice — difficulty grade is the gate that triggers
  // dynamic notes (computeSetNote requires diff != null on prior sets).
  refreshSetNote();
  saveState();
});
elReturnPill.addEventListener("click", returnToWorking);
elSetCurrentBtn.addEventListener("click", () => {
  // Set the currently-viewed set as the new working position.
  // Only functional while browsing (viewing != working).
  if (!isBrowsing()) return;
  pushHistory();
  currentExercise = viewingExercise;
  currentSet = viewingSet;
  // viewing now equals working, so isBrowsing() is false.
  elReturnPill.classList.remove('visible');
  elSetCurrentBtn.classList.remove('visible');
  elBtn.classList.remove('browsing');
  elBtn.style.opacity = '';
  elBtn.style.pointerEvents = '';
  renderExercise();
  syncLogArea();
  saveState();
});

// ============ DRAG REORDER (SortableJS) + TAP-TO-JUMP ============
// Long-press threshold (600ms) + wide touchStartThreshold (15px) keeps
// taps from accidentally triggering drag. fallbackOnBody:false anchors
// the clone inside #progress so drag position matches the finger.
// direction:'horizontal' matches the actual row layout.
const sortable = Sortable.create(elProgress, {
  animation: 180,
  easing: "cubic-bezier(0.2, 0, 0, 1)",
  delay: 600,
  delayOnTouchOnly: true,
  touchStartThreshold: 15,
  forceFallback: true,
  fallbackTolerance: 6,
  fallbackOnBody: false,
  direction: 'horizontal',
  draggable: '.exercise-group',
  ghostClass: "sortable-ghost",
  chosenClass: "sortable-chosen",
  dragClass: "sortable-drag",

  onChoose() {
    if (elEditModal.classList.contains("show") || elSettingsModal.classList.contains("show")) {
      sortable.option("disabled", true);
      queueMicrotask(() => sortable.option("disabled", false));
      return;
    }
    document.body.classList.add("dragging-exercise");
  },
  onEnd(evt) {
    setTimeout(() => document.body.classList.remove("dragging-exercise"), 50);
    const from = evt.oldIndex;
    const to = evt.newIndex;
    if (from == null || to == null || from === to) return;
    reorderExercise(from, to);
  },
});

// Tap-to-cycle via RAW touch events (bypasses SortableJS's click suppression
// on iOS). Click fallback for desktop mouse. Dedupe with lastTapTime so we
// don't double-fire when iOS generates a synthetic click after touchend.
let tapStart = null;
let lastTouchTapTime = 0;

function handleTap(target) {
  if (!target) return false;
  if (document.body.classList.contains("dragging-exercise")) return false;
  if (elEditModal.classList.contains("show") || elSettingsModal.classList.contains("show")) return false;

  // Dot tap? Jump to that exact set (or return to working if tapping the
  // active dot while browsing).
  const dotEl = (target.classList && target.classList.contains("dot"))
    ? target
    : (target.closest ? target.closest(".dot") : null);
  if (dotEl && dotEl.dataset && dotEl.dataset.exerciseIdx != null) {
    const exIdx = Number(dotEl.dataset.exerciseIdx);
    const setIdx = Number(dotEl.dataset.setIdx);
    if (!Number.isFinite(exIdx) || !Number.isFinite(setIdx)) return false;
    if (exIdx === currentExercise && setIdx === currentSet && isBrowsing()) {
      returnToWorking();
    } else {
      cycleView(exIdx, setIdx);
    }
    return true;
  }

  const group = target.closest ? target.closest(".exercise-group") : null;
  if (!group || !elProgress.contains(group)) return false;
  const exIdx = Number(group.dataset.exerciseIdx);
  if (!Number.isFinite(exIdx)) return false;
  if (exIdx === viewingExercise) {
    const ex = workout[exIdx];
    const nextSet = (viewingSet + 1) % ex.sets;
    cycleView(exIdx, nextSet);
  } else {
    cycleView(exIdx, 0);
  }
  return true;
}

elProgress.addEventListener("touchstart", (e) => {
  if (e.touches.length !== 1) { tapStart = null; return; }
  const t = e.touches[0];
  tapStart = { x: t.clientX, y: t.clientY, time: Date.now(), target: e.target };
}, { passive: true });

elProgress.addEventListener("touchmove", (e) => {
  if (!tapStart) return;
  const t = e.touches[0];
  if (!t) return;
  if (Math.abs(t.clientX - tapStart.x) > 15 || Math.abs(t.clientY - tapStart.y) > 15) {
    tapStart = null;  // scrolling/dragging, not a tap
  }
}, { passive: true });

elProgress.addEventListener("touchend", (e) => {
  if (!tapStart) return;
  const info = tapStart;
  tapStart = null;
  if (Date.now() - info.time > 700) return;
  if (e.changedTouches && e.changedTouches[0]) {
    const t = e.changedTouches[0];
    if (Math.abs(t.clientX - info.x) > 15 || Math.abs(t.clientY - info.y) > 15) return;
  }
  if (handleTap(info.target)) {
    lastTouchTapTime = Date.now();
    // Best-effort: suppress the synthetic click iOS generates next.
    try { e.preventDefault(); } catch (_) {}
  }
}, { passive: false });

elProgress.addEventListener("touchcancel", () => { tapStart = null; }, { passive: true });

// Desktop mouse fallback. Skip if this click is the synthetic one following
// a touch tap we already processed.
elProgress.addEventListener("click", (e) => {
  if (Date.now() - lastTouchTapTime < 500) return;
  handleTap(e.target);
});

// iOS may show the native text-selection callout on long-press. Preventing
// contextmenu blocks it without affecting taps or drags.
elProgress.addEventListener("contextmenu", (e) => e.preventDefault());
elCopy.addEventListener("click", () => {
  const text = buildSummary();
  navigator.clipboard.writeText(text).then(() => {
    elCopy.textContent = "Copied";
    elCopy.className = "copied";
    setTimeout(() => {
      elCopy.textContent = "Copy Summary";
      elCopy.className = "";
    }, 2000);
  });
});

// ============ STATE PERSISTENCE ============
function saveState() {
  const s = {
    savedAt: Date.now(),
    currentExercise, currentSet, state, workoutStartTime, restEndTime, restRemaining, restTotalSeconds,
    viewingExercise, viewingSet,
    setLogs: setLogs.map(l => ({...l})),
    repCount,
    notes: elNotesInput.value,
    logExerciseIndex,
    countdownFiredThresholds: [...countdownFiredThresholds],
    // Persist any mid-session reorder so refreshes/background kills don't snap back
    workoutOrder: workout.map(ex => ex.name),
    history: history.map(h => ({...h, setLogs: h.setLogs.map(l => ({...l}))})),
    future:  future.map(f => ({...f, setLogs: f.setLogs.map(l => ({...l}))}))
  };
  try { localStorage.setItem("gym-timer-state", JSON.stringify(s)); } catch(e) {}
}
function restoreState() {
  try {
    const raw = localStorage.getItem("gym-timer-state");
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (s.savedAt && (Date.now() - s.savedAt > STATE_TTL_MS)) {
      try { localStorage.removeItem("gym-timer-state"); } catch(e) {}
      return false;
    }

    // Reapply saved reorder BEFORE anything else reads workout[].
    // If saved order has same names as current workout, rebuild workout to match.
    if (Array.isArray(s.workoutOrder) && s.workoutOrder.length === workout.length) {
      const byName = new Map(originalWorkout.map(ex => [ex.name, ex]));
      const reordered = s.workoutOrder.map(name => byName.get(name));
      if (reordered.every(ex => ex)) {
        workout.length = 0;
        reordered.forEach(ex => workout.push(ex));
      }
    }

    currentExercise = s.currentExercise;
    currentSet = s.currentSet;
    viewingExercise = (typeof s.viewingExercise === 'number') ? s.viewingExercise : currentExercise;
    viewingSet = (typeof s.viewingSet === 'number') ? s.viewingSet : currentSet;
    workoutStartTime = (typeof s.workoutStartTime === 'number') ? s.workoutStartTime : null;
    repCount = s.repCount || 10;
    if (typeof s.logExerciseIndex === 'number') logExerciseIndex = s.logExerciseIndex;
    setLogs.length = 0;
    s.setLogs.forEach(l => setLogs.push(l));
    state = s.state;
    restEndTime = s.restEndTime;
    restRemaining = s.restRemaining;
    restTotalSeconds = s.restTotalSeconds || s.restRemaining || 0;
    countdownFiredThresholds = new Set(s.countdownFiredThresholds || []);

    history.length = 0;
    if (Array.isArray(s.history)) s.history.forEach(h => history.push(h));
    future.length = 0;
    if (Array.isArray(s.future)) s.future.forEach(f => future.push(f));

    if (state === "resting" || state === "paused" || state === "finishing") {
      const lastLog = setLogs[setLogs.length - 1];
      if (lastLog) currentLogEntry = lastLog;
    }
    applyState(s.notes || "");
    return true;
  } catch(e) { return false; }
}

// ============ VISIBILITY HANDLER ============
// Shared handler for tab-return + BFCache restore. iOS may have closed the
// AudioContext during backgrounding. Recover BEFORE any path below that fires
// audio (e.g. the expired-rest restDone() call). Recovery kicks off async
// re-decoding of voice buffers; by the time the user looks at the timer +
// decides to tap, decoding is usually done.
function handleResumeFromBackground() {
  recoverAudioCtx();
  if (state === "resting" && restEndTime) {
    const remaining = Math.ceil((restEndTime - Date.now()) / 1000);
    if (remaining <= 0) {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      restDone();
    } else {
      restRemaining = remaining;
      elTimer.textContent = formatTime(remaining);
      updateRestRing();
      // Threshold catch-up: any cue whose trigger second has already passed while backgrounded
      // is suppressed, so it doesn't fire late as a stale announcement.
      [60, 30, 10, 5, 4, 3, 2, 1].forEach(t => {
        if (t > remaining) countdownFiredThresholds.add(t);
      });
      // Re-arm the keepalive in case it never started (page reload mid-rest)
      // or was lost to a context recreation. Idempotent.
      startAudioKeepalive();
    }
  }
  if (state !== "ready" && state !== "finished" && !wakeLock) {
    requestWakeLock();
  }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  handleResumeFromBackground();
});

// pageshow fires when the page is restored from BFCache (iOS back/forward
// nav, or Safari swiping back to the timer tab). AudioContexts get closed in
// BFCache, so this is the canonical recovery point alongside visibilitychange.
// Without the rest-expiry catch-up here, a BFCache restore during an expired
// rest would leave the timer stuck at the pre-cache REST display until tap.
window.addEventListener("pageshow", (e) => {
  if (e.persisted) handleResumeFromBackground();
});

// ============ INIT ============
// Allow URL reset (e.g. ?reset=1) to wipe saved workout state
if (new URLSearchParams(location.search).has('reset')) {
  try { localStorage.removeItem("gym-timer-state"); } catch(e) {}
  // Strip ?reset from URL so refreshes don't keep resetting.
  // NOTE: the local `history` const above shadows window.history inside this script,
  // so we have to reach for the real thing explicitly.
  try { window.history.replaceState(null, '', location.pathname); } catch(e) {}
}

elSkip.style.display = "none";
showRestRing(false);
updateNavButtons();
applySettingsToggles();
VoiceCue.init();
attachGlobalAudioRecovery();
if (!restoreState()) {
  // Fresh load (no saved state, or state TTL expired): enter pre-start.
  // The user taps "Start Workout" to begin — that gesture unlocks audio
  // on iOS, plays the day-type + first-exercise cue, and records
  // workoutStartTime so set 1's duration is real (not extrapolated).
  state = "pre-start";
  applyState("");
}
// Center main button after initial layout settles, and on any resize.
requestAnimationFrame(centerMainButton);
setTimeout(centerMainButton, 50);
window.addEventListener("resize", centerMainButton);
window.addEventListener("orientationchange", () => setTimeout(centerMainButton, 100));
</script>
