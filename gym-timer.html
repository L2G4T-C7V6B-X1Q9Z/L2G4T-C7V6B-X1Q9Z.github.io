<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0e0e0f">
<title>Gym Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@200;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
/* ============================================================
   GYM TIMER v7 — one CSS pass (v5 base + v5 overrides + v6
   deltas consolidated 2026-07-10; no layered generations).
   1 TOKENS        2 BASE          3 MASTHEAD + SPEC
   4 NOTE CARD     5 CHRONOGRAPH   6 DIAL (main button)
   7 TOP BUTTONS   8 LOG DECK      9 BOARD
   10 MODALS       11 DONE SCREEN  12 STATE + FX
   13 MOTION       14 COMPACT      15 REDUCED MOTION
   ============================================================ */

/* ---- 1 TOKENS ---- */
:root {
  color-scheme: dark;
  /* surfaces: page → panel → control face; hairlines over shadows */
  --bg: #0e0e0f;
  --panel: #151517;
  --face: #1a1a1d;
  --line: #26262a;
  --line-hi: #35353a;
  /* ink: warm off-white ramp (sterile pure white reads harsh on OLED) */
  --ink: #f0efec;
  --ink-2: #9b9b97;
  --ink-3: #6d6d70;
  --ink-4: #47474b;
  /* the single accent */
  --red: #c0392b;
  --red-hot: #e0584a;
  --red-deep: #8f2b21;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  /* micro-label spec: every zone label in the app uses this one voice */
  --label-size: 9px;
  --label-track: 2.5px;
}

/* ---- 2 BASE ---- */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'JetBrains Mono', monospace;
  background:
    radial-gradient(120% 66% at 50% 34%, #131315 0%, var(--bg) 62%);
  background-color: var(--bg);
  color: #c9c9c6;
  min-height: 100vh;
  height: 100vh;
  overflow: hidden;
  overscroll-behavior: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 28px 20px 170px;
  -webkit-user-select: none;
  user-select: none;
}

/* ---- 3 MASTHEAD + SPEC LINE ---- */
h1 {
  width: 100%;
  max-width: 340px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 10px;
  font-weight: 600;
  color: var(--ink-3);
  letter-spacing: 4.8px;
  text-transform: uppercase;
  margin-bottom: 12px;
  text-align: center;
  justify-content: center;
}
/* flanking hairlines: the masthead reads as an engraved panel label */
h1::before, h1::after {
  content: "";
  height: 1px;
  flex: 1;
  background: linear-gradient(90deg, transparent, var(--line-hi));
}
h1::after { background: linear-gradient(90deg, var(--line-hi), transparent); }
h1:empty { display: none; }
#exercise-name {
  font-size: 24px;
  font-weight: 700;
  color: var(--ink);
  text-align: center;
  margin-bottom: 7px;
  letter-spacing: -0.8px;
  text-shadow: 0 1px 0 var(--bg);
}
#set-info {
  font-size: 11px;
  color: var(--ink-2);
  margin-bottom: 8px;
  letter-spacing: 0.8px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
#set-info .wt-now { color: var(--red-hot); font-weight: 700; letter-spacing: 0.35px; }
#set-info .wt-was { color: var(--ink-3); font-size: 0.85em; margin-left: 4px; }

/* ---- 4 NOTE CARD (coach voice) ---- */
#exercise-note {
  font-size: 12px;
  color: #c6c6c2;
  margin-bottom: 10px;
  text-align: left;
  width: 100%;
  max-width: 340px;
  line-height: 1.38;
  /* fixed-height card so 1/2/3-line notes never shift the layout below;
     fitNoteToBox() reads clientHeight and shrinks only true overflow */
  height: 66px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  padding: 9px 13px;
  background: linear-gradient(180deg, #17171a, var(--panel));
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: inset 0 1px 0 rgba(240, 239, 236, 0.03);
}
/* live computed call (drop/hold/aim) vs canned form cue: red spine */
#exercise-note.advisor {
  border-left: 2px solid var(--red);
  color: #d6d6d3;
}

/* ---- 5 CHRONOGRAPH DISPLAY ---- */
#timer-display {
  font-size: 82px;
  font-weight: 200;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  margin-bottom: 5px;
  line-height: 1;
  letter-spacing: -3px;
  text-align: center;
  text-shadow: 0 0 24px rgba(240, 239, 236, 0.035);
  will-change: transform, opacity;
}
#timer-display.t-final { color: var(--red-hot); text-shadow: 0 0 22px rgba(224, 88, 74, 0.22); }
#timer-display.t-elapsed { color: #4d4d51; text-shadow: none; }
#timer-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--ink-3);
  margin-bottom: 24px;
  height: 16px;
  letter-spacing: 3.6px;
  text-transform: uppercase;
  text-align: center;
}

/* ---- 6 DIAL: main button + bezel ring ---- */
.btn-wrap {
  /* positioned by centerMainButton() from live geometry; these are
     first-paint defaults the JS immediately overrides */
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 184px;
  height: 184px;
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
#main-btn {
  position: relative;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  border: 1px solid var(--line-hi);
  background: radial-gradient(circle at 50% 30%, #1d1d21 0%, #17171a 56%, #121214 100%);
  box-shadow:
    inset 0 1px 0 rgba(240, 239, 236, 0.05),
    inset 0 -16px 26px rgba(0, 0, 0, 0.32),
    0 14px 34px rgba(0, 0, 0, 0.5);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: #c4c4c0;
  cursor: pointer;
  transition: transform 160ms var(--ease), opacity 160ms var(--ease);
  will-change: transform, opacity;
  -webkit-tap-highlight-color: transparent;
}
#main-btn:active { transform: scale(0.972); }
#main-btn.resting,
#main-btn.paused {
  background: radial-gradient(circle at 50% 30%, #1b1b1e 0%, #151518 60%, #111113 100%);
  border-color: rgba(192, 57, 43, 0.38);
  color: var(--red);
}
#main-btn.paused { border-color: var(--line-hi); color: #7c7c80; }
#main-btn.go {
  background: radial-gradient(circle at 50% 28%, #d64a3b 0%, var(--red) 58%, #a52f22 100%);
  border-color: var(--red);
  box-shadow:
    inset 0 1px 0 rgba(240, 239, 236, 0.18),
    0 10px 26px rgba(192, 57, 43, 0.22),
    0 0 0 0 rgba(192, 57, 43, 0.2);
  color: #fff;
  animation: go-breathe 1.8s var(--ease) infinite;
}
/* browsing a past set: diagonal slash = Set Done inaccessible here */
#main-btn.browsing::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 12%;
  right: 12%;
  height: 2px;
  background: rgba(192, 57, 43, 0.7);
  transform: translateY(-50%) rotate(-45deg);
  pointer-events: none;
  z-index: 2;
}

/* bezel ring: always mounted — the tick track is the app's signature.
   Idle it's a ghost bezel; during rest the red arc drains over it. */
#rest-ring {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  display: block;
  transform: rotate(-90deg);
  filter: drop-shadow(0 0 1px rgba(192, 57, 43, 0.2));
}
.ring-tick { stroke: rgba(240, 239, 236, 0.055); stroke-width: 1; }
.ring-tick-major { stroke: rgba(240, 239, 236, 0.13); stroke-width: 1.5; }
#rest-ring-track {
  fill: none;
  stroke: rgba(240, 239, 236, 0.04);
  stroke-width: 3.25;
  transition: stroke 300ms var(--ease);
}
.btn-wrap.show-ring #rest-ring-track { stroke: rgba(192, 57, 43, 0.16); }
#rest-ring-bar {
  fill: none;
  stroke: var(--red);
  stroke-width: 3.25;
  stroke-linecap: round;
  /* no CSS transition — driven directly by the 100ms timer interval */
}
.btn-wrap.paused #rest-ring-bar { stroke: #6d6d70; }
#rest-ring-head {
  fill: var(--red);
  filter: drop-shadow(0 0 2px rgba(224, 88, 74, 0.6));
}
.btn-wrap.paused #rest-ring-head { fill: #6d6d70; filter: none; }
.btn-wrap.fx-final10 #rest-ring-bar {
  filter: drop-shadow(0 0 2.5px rgba(224, 88, 74, 0.72));
  animation: ring-breathe 900ms var(--ease) infinite;
}

/* skip: small satellite control beside the dial */
#skip-btn {
  position: absolute;
  left: calc(100% + 18px);
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--face);
  border: 1px solid var(--line-hi);
  box-shadow: inset 0 1px 0 rgba(240, 239, 236, 0.04);
  color: var(--ink-2);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 0;
  transition: transform 150ms var(--ease), color 200ms, border-color 200ms, background 200ms;
}
#skip-btn:active {
  transform: translateY(-50%) scale(0.9);
  color: var(--red);
  border-color: var(--red);
  background: rgba(192, 57, 43, 0.12);
}
#skip-btn svg { width: 18px; height: 18px; transition: transform 180ms ease; }
#skip-btn.pressed svg { animation: skip-icon-fly 180ms ease-out forwards; }

/* ---- 7 TOP CORNER BUTTONS ---- */
.top-btn {
  position: fixed;
  top: 16px;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid var(--line-hi);
  background: var(--face);
  box-shadow: inset 0 1px 0 rgba(240, 239, 236, 0.04);
  color: var(--ink-2);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  padding: 0;
  transition: transform 150ms var(--ease), opacity 150ms var(--ease);
}
.top-btn svg { width: 18px; height: 18px; display: block; }
.top-btn:active { transform: scale(0.94); }
#settings-btn { right: 16px; }
#settings-btn svg { width: 20px; height: 20px; }

/* ---- 8 LOG DECK (grade the set) ---- */
#log-area {
  display: none;
  flex-direction: row;
  align-items: stretch;
  justify-content: center;
  gap: 10px;
  margin-top: auto;
  padding: 12px 20px 12px;
  width: 100%;
  max-width: 400px;
}
#set-label-col {
  display: flex;
  align-items: center;
  justify-content: center;
  padding-right: 8px;
  border-right: 1px solid var(--line);
  min-width: 22px;
  flex-shrink: 0;
}
#set-label-text {
  writing-mode: vertical-rl;
  text-orientation: mixed;
  transform: rotate(180deg);
  font-size: 10px;
  font-weight: 700;
  color: #84847f;
  letter-spacing: 2.2px;
  white-space: nowrap;
}
/* superset context tag ("CALVES S2") — tighter so it never outgrows the col */
#set-label-text.ctx { font-size: 9px; letter-spacing: 1.4px; }
#log-content {
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
  min-width: 0;
}
.log-row {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  column-gap: 12px;
  width: 100%;
}
.log-row > #rep-label { justify-self: end; }
.log-row > #notes-input { justify-self: stretch; }
#difficulty-row { display: flex; flex-direction: row; gap: 6px; width: 100%; }
.diff-btn {
  flex: 1;
  background: #161619;
  color: #84847f;
  border: 1px solid #2c2c30;
  border-radius: 7px;
  padding: 6px 2px;
  min-height: 36px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform 150ms var(--ease), background 150ms, color 150ms, border-color 150ms;
}
.diff-btn:active { transform: scale(0.96); }
/* selected fill ramps with the grade — LIGHT quiet, MAX hot. One accent,
   intensity encodes meaning. (data-diff 4 = HARD takes the base red.) */
.diff-btn.selected {
  background: var(--red);
  color: var(--ink);
  border-color: var(--red);
  box-shadow: inset 0 1px 0 rgba(240, 239, 236, 0.12);
}
.diff-btn.selected[data-diff="2"] { background: var(--red-deep); border-color: var(--red-deep); }
.diff-btn.selected[data-diff="3"] { background: #a83227; border-color: #a83227; }
.diff-btn.selected[data-diff="5"] {
  background: #d84a3c;
  border-color: #d84a3c;
  box-shadow: inset 0 1px 0 rgba(240, 239, 236, 0.2), 0 0 14px rgba(216, 74, 60, 0.18);
}

/* rep picker: horizontal scroll-snap wheel (replaced +/- buttons in v3) */
.rep-picker {
  position: relative;
  width: 160px;
  height: 56px;
  flex-shrink: 0;
  -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 22%, #000 78%, transparent 100%);
          mask-image: linear-gradient(to right, transparent 0%, #000 22%, #000 78%, transparent 100%);
}
.rep-picker__strip {
  display: flex;
  align-items: center;
  height: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  -ms-overflow-style: none;
  -webkit-overflow-scrolling: touch;
  padding: 0 calc(50% - 20px); /* 20 = half cell width, lets endpoints center */
  overscroll-behavior-x: contain;
}
.rep-picker__strip::-webkit-scrollbar { display: none; }
.rep-picker__num {
  flex: 0 0 40px;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  scroll-snap-align: center;
  font-family: 'JetBrains Mono', monospace;
  font-variant-numeric: tabular-nums;
  font-size: 13px;
  font-weight: 400;
  color: var(--ink-4);
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: color 180ms var(--ease), font-size 180ms var(--ease), font-weight 180ms var(--ease);
}
.rep-picker__num.is-near { color: #8b8b87; font-size: 17px; }
.rep-picker__num.is-active {
  color: var(--red);
  font-size: 27px;
  font-weight: 700;
  text-shadow: 0 0 16px rgba(192, 57, 43, 0.18);
}
.rep-picker__indicator {
  position: absolute;
  bottom: 4px;
  left: 50%;
  transform: translateX(-50%);
  width: 24px;
  height: 2px;
  background: var(--red);
  border-radius: 1px;
  pointer-events: none;
  opacity: 0.55;
}
#rep-label {
  font-size: var(--label-size);
  color: var(--ink-3);
  font-weight: 600;
  letter-spacing: var(--label-track);
  text-transform: uppercase;
}
#notes-input {
  flex: 1;
  min-width: 0;
  padding: 8px 12px;
  border: 1px solid #2c2c30;
  border-radius: 7px;
  background: #17171a;
  box-shadow: inset 0 1px 0 rgba(240, 239, 236, 0.02);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: #dddad4;
  text-align: center;
  outline: none;
  transition: border-color 200ms;
  cursor: pointer;                 /* read-only field; tap opens the note modal */
  text-overflow: ellipsis;
  white-space: nowrap;
  overflow: hidden;
}
#notes-input:focus { border-color: rgba(192, 57, 43, 0.76); }
#notes-input::placeholder { color: #55555a; font-size: 11px; }

/* ---- 9 BOARD (bottom bar: dots + labels + pills) ---- */
#bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  /* scrim so the board floats over a fade, never raw over content */
  background: linear-gradient(180deg, rgba(14, 14, 15, 0) 0%, rgba(14, 14, 15, 0.9) 42%, var(--bg) 100%);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
#progress {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 10px;
  padding: 12px 12px 16px;
  width: 100%;
  max-width: 100%;
  overflow-x: auto;            /* safety valve: scroll inside, never spill onto fixed UI */
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
#progress::-webkit-scrollbar { display: none; }
/* NOW + SET pills float in the guaranteed-empty band left of the dial
   (fixed; centerMainButton pins them to the dial's vertical center) */
.pills-stack {
  position: fixed;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 4px;
  align-items: flex-start;
  z-index: 40;
  pointer-events: none;
}
#return-pill, #set-current-btn {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.5px;
  color: var(--red);
  background: rgba(21, 21, 23, 0.94);
  border: 1px solid rgba(192, 57, 43, 0.55);
  border-radius: 999px;
  text-transform: uppercase;
  padding: 6px 10px;
  cursor: pointer;
  text-align: center;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
  opacity: 0;
  pointer-events: none;
  transform: translateX(-8px);
  transition: opacity 280ms var(--ease), transform 280ms var(--ease);
}
#return-pill.visible, #set-current-btn.visible {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(0);
}
.exercise-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
  transition: transform 150ms var(--ease), opacity 150ms var(--ease);
}
/* live superset members: red linkage rail; first member carries the unlink */
.exercise-group.ss-linked {
  border-bottom: 2px solid rgba(192, 57, 43, 0.55);
  padding-bottom: 3px;
}
.ss-unlink {
  font-size: 7px;
  letter-spacing: 0.5px;
  color: var(--ink-3);
  background: none;
  border: 1px solid var(--line-hi);
  border-radius: 3px;
  padding: 2px 5px;
  margin-top: 2px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
/* SortableJS: .sortable-chosen = held item; .sortable-drag = hidden clone
   (the ghost placeholder + items animating around it are the drag cue) */
.exercise-group.sortable-chosen { transform: scale(1.04); }
.exercise-group.sortable-drag { opacity: 0 !important; pointer-events: none; }
.exercise-group.sortable-ghost {
  opacity: 0.25;
  background: #2a2a2e;
  border-radius: 4px;
}
.exercise-group.sortable-ghost > * { visibility: hidden; }
body.dragging-exercise {
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  touch-action: none;
}
.exercise-dots { display: flex; gap: 6px; align-items: center; }
.exercise-label {
  writing-mode: vertical-rl;
  text-orientation: mixed;
  transform: rotate(180deg);
  font-size: var(--label-size);
  font-weight: 600;
  letter-spacing: 1px;
  color: #55555a;
  text-transform: uppercase;
  white-space: nowrap;
}
.exercise-label.active { color: var(--red); }
.exercise-label.completed { color: #7c7c80; }
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #2b2b2f;
  box-shadow: inset 0 1px 0 rgba(240, 239, 236, 0.04);
  transition: transform 160ms var(--ease), opacity 160ms var(--ease), background 300ms;
  flex-shrink: 0;
  position: relative;
  box-sizing: border-box;
  will-change: transform, opacity;
}
/* fat-finger pad: invisible ~20px hit area per 8px dot (::after is the echo) */
.dot::before {
  content: "";
  position: absolute;
  inset: -6px;
  border-radius: 50%;
}
.dot.active {
  background: var(--red);
  box-shadow: 0 0 0 3px rgba(192, 57, 43, 0.12);
}
.dot.completed { background: #ece9e2; cursor: pointer; }
.dot.cursor { border: 2px solid var(--red); background: transparent; }
/* active dot blinking — hollow red edge, snap on / fade off (Mazda pattern) */
.dot.active.blinking {
  background: transparent;
  border: 1.5px solid var(--red);
  animation: blink-edge 0.7s ease-out infinite;
}
/* just-completed dot echoes a ghost toward the next dot during rest */
.dot.completed.echoing::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ece9e2;
  animation: dot-echo 280ms var(--ease) 1 both;
  pointer-events: none;
}
/* one-shot celebration on the dots row when the final set banks a trigger */
.exercise-dots.trigger-hit .dot.completed {
  animation: trigger-pulse 0.5s var(--ease) 2;
}

/* ---- 10 MODALS ---- */
#settings-modal, #edit-modal, #note-modal {
  position: fixed;
  inset: 0;
  background: rgba(14, 14, 15, 0.94);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 20px;
}
#settings-modal.show, #edit-modal.show, #note-modal.show { display: flex; }
.modal-card {
  background: linear-gradient(180deg, #1b1b1e, #18181b);
  border: 1px solid var(--line-hi);
  border-radius: 14px;
  padding: 24px;
  width: 100%;
  max-width: 320px;
  box-shadow: 0 18px 44px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(240, 239, 236, 0.04);
}
#settings-modal.show .modal-card,
#edit-modal.show .modal-card,
#note-modal.show .modal-card { animation: modal-arrive 220ms var(--ease) both; }
.modal-title {
  font-size: 11px;
  color: #8b8b87;
  letter-spacing: 4.4px;
  text-transform: uppercase;
  margin-bottom: 20px;
  font-weight: 600;
}
.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0;
  border-bottom: 1px solid #232327;
}
.setting-row:last-child { border-bottom: none; }
.setting-label { font-size: 13px; color: #dddad4; font-weight: 600; letter-spacing: 0.3px; }
.setting-sub { font-size: 10px; color: var(--ink-3); margin-top: 2px; letter-spacing: 0.5px; }
.toggle {
  width: 44px;
  height: 24px;
  background: #303034;
  border-radius: 12px;
  position: relative;
  cursor: pointer;
  transition: background 180ms;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}
.toggle.on { background: var(--red); }
.toggle::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 20px;
  height: 20px;
  background: #ece9e2;
  border-radius: 50%;
  transform: translateX(0);
  transition: transform 180ms var(--ease);
}
.toggle.on::after { transform: translateX(20px); }
.modal-close {
  width: 100%;
  margin-top: 12px;
  padding: 10px;
  border: 1px solid var(--line-hi);
  background: transparent;
  color: var(--ink-2);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  border-radius: 8px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.modal-close.danger {
  border-color: #5a2a25;
  color: var(--red);
  transition: background 200ms, color 200ms, border-color 200ms;
}
.modal-close.danger:active { background: rgba(192, 57, 43, 0.1); }
.edit-title {
  font-size: 16px;
  color: var(--ink);
  font-weight: 700;
  margin-bottom: 4px;
  letter-spacing: -0.3px;
}
.edit-subtitle {
  font-size: 11px;
  color: #8b8b87;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 20px;
}
.edit-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.edit-label {
  font-size: var(--label-size);
  color: var(--ink-3);
  font-weight: 600;
  letter-spacing: var(--label-track);
  text-transform: uppercase;
  width: 40px;
}
#edit-notes {
  flex: 1;
  padding: 8px 12px;
  border: 1px solid #2c2c30;
  border-radius: 7px;
  background: var(--bg);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: #dddad4;
  outline: none;
  -webkit-user-select: auto;
  user-select: auto;
}
#edit-notes:focus { border-color: rgba(192, 57, 43, 0.76); }
#note-modal-text {
  width: 100%;
  min-height: 108px;
  padding: 12px 14px;
  border: 1px solid #2c2c30;
  border-radius: 8px;
  background: var(--bg);
  color: var(--ink);
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px;            /* >=16px so iOS Safari doesn't zoom on focus */
  line-height: 1.4;
  resize: vertical;
  outline: none;
  margin-bottom: 14px;
  box-sizing: border-box;
  -webkit-user-select: auto;
  user-select: auto;
}
#note-modal-text:focus { border-color: rgba(192, 57, 43, 0.76); }
#note-modal-text::placeholder { color: #55555a; }
.edit-actions { display: flex; gap: 10px; margin-top: 8px; }
.edit-btn {
  flex: 1;
  padding: 12px;
  border: 1px solid var(--line-hi);
  background: #17171a;
  color: #b3b3af;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  border-radius: 8px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform 160ms var(--ease);
}
.edit-btn:active { transform: scale(0.975); }
.edit-btn.primary {
  border-color: var(--red);
  background: var(--red);
  box-shadow: inset 0 1px 0 rgba(240, 239, 236, 0.14);
  color: var(--ink);
}

/* ---- 11 DONE SCREEN ---- */
/* release the viewport lock so the summary scrolls; pin the copy button */
body.finished {
  height: auto;
  min-height: auto;
  overflow: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 90px;
}
#workout-done { display: none; text-align: center; width: 100%; max-width: 340px; }
body.finished #workout-done { animation: done-arrive 260ms var(--ease) both; }
#workout-done h2 {
  font-size: 30px;
  color: var(--ink);
  font-weight: 700;
  margin-bottom: 18px;
  letter-spacing: -1.4px;
}
#summary {
  text-align: left;
  background: linear-gradient(180deg, #18181b, #151518);
  border: 1px solid #2c2c30;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
  font-size: 12px;
  line-height: 1.8;
  color: #9b9b97;
  white-space: pre-wrap;
  box-shadow: inset 0 1px 0 rgba(240, 239, 236, 0.03);
}
#summary .exercise-header { color: var(--ink); font-weight: 700; font-size: 13px; }
#summary .duration-tag { color: var(--ink-3); font-weight: 400; font-size: 11px; }
#summary .set-line { color: var(--ink-3); padding-left: 8px; }
#summary .set-note { color: var(--red); }
#summary .sum-reps { color: var(--ink-3); padding-left: 8px; }
#summary .sum-trigger { color: var(--red-hot); padding-left: 8px; font-weight: 700; }
#summary .total-line { color: var(--ink); font-weight: 700; margin-top: 12px; }
#copy-btn {
  width: 100%;
  padding: 14px;
  border: 2px solid var(--red);
  background: var(--red);
  color: var(--ink);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  border-radius: 10px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  box-shadow: inset 0 1px 0 rgba(240, 239, 236, 0.14);
  transition: transform 160ms var(--ease), background 200ms, color 200ms;
}
#copy-btn:active { transform: scale(0.97); }
#copy-btn.copied { background: var(--face); color: var(--red); }
body.finished #copy-btn {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 40px);
  max-width: 340px;
  z-index: 10;
  box-shadow: 0 -10px 24px rgba(14, 14, 15, 0.9);
}
body.finished #copy-btn:active { transform: translateX(-50%) scale(0.97); }
body.finished #copy-btn.copied { background: var(--face); color: var(--red); }

/* ---- 12 STATE + FX (behavior-coupled; toggled by JS) ---- */
/* GO alert: a single settle nudge on the digits (the old 6-blink bg flash
   was retired in v5 — startFlash() still restarts this via class re-add) */
body.alert-flashing #timer-display { animation: alert-nudge 280ms var(--ease) both; }
#timer-display.fx-tick { animation: digit-settle 180ms var(--ease) both; }
.btn-wrap.fx-shift #main-btn { animation: control-settle 180ms var(--ease) both; }
#progress.fx-rail .dot.active:not(.blinking) { animation: dot-arrive 180ms var(--ease) both; }
#progress.fx-rail .dot.active.blinking {
  animation: dot-arrive 180ms var(--ease) both, blink-edge 0.7s ease-out infinite;
}

/* ---- 13 MOTION ---- */
@keyframes blink-edge {
  0%   { border-color: var(--red); }
  100% { border-color: rgba(192, 57, 43, 0); }
}
@keyframes skip-icon-fly {
  0%   { transform: translateX(0);   opacity: 1; }
  100% { transform: translateX(8px); opacity: 0; }
}
@keyframes go-breathe {
  0%, 100% { box-shadow: inset 0 1px 0 rgba(240, 239, 236, 0.18), 0 10px 26px rgba(192, 57, 43, 0.22), 0 0 0 0 rgba(192, 57, 43, 0.18); }
  50%      { box-shadow: inset 0 1px 0 rgba(240, 239, 236, 0.18), 0 10px 26px rgba(192, 57, 43, 0.26), 0 0 22px 2px rgba(192, 57, 43, 0.16); }
}
@keyframes ring-breathe { 0%, 100% { opacity: 0.9; } 50% { opacity: 1; } }
@keyframes digit-settle {
  0%   { opacity: 0.68; transform: translateY(-2px); }
  100% { opacity: 1;    transform: translateY(0); }
}
@keyframes control-settle {
  0%   { opacity: 0.82; transform: scale(0.978); }
  100% { opacity: 1;    transform: scale(1); }
}
@keyframes dot-arrive {
  0%   { opacity: 0.42; transform: scale(0.66); }
  100% { opacity: 1;    transform: scale(1); }
}
@keyframes dot-echo {
  0%   { opacity: 0.66; transform: translate(-50%, -50%) translateX(0); }
  100% { opacity: 0;    transform: translate(-50%, -50%) translateX(8px); }
}
@keyframes trigger-pulse {
  0%   { transform: scale(1); }
  30%  { transform: scale(1.28); }
  100% { transform: scale(1); }
}
@keyframes modal-arrive {
  0%   { opacity: 0; transform: translateY(8px) scale(0.985); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
/* Opacity ONLY — a retained transform (fill:both) would make #workout-done
   the containing block for the position:fixed copy button and silently
   un-pin it from the viewport (this bug shipped in v5/v6; found in the v7
   harness pass). */
@keyframes done-arrive {
  0%   { opacity: 0; }
  100% { opacity: 1; }
}
@keyframes alert-nudge {
  0%   { opacity: 0.74; transform: scale(0.988); }
  100% { opacity: 1;    transform: scale(1); }
}

/* ---- 14 COMPACT HEIGHT (SE-class, or Safari URL bar never collapsing) ----
   The fixed stack + bottom bar left a <104px dial slot at 667px; tighten
   ~70px so the dial gets a real slot. fitNoteToBox + centerMainButton read
   live geometry and adapt on their own. */
@media (max-height: 740px) {
  body { padding-top: 12px; }
  h1 { margin-bottom: 8px; }
  #exercise-name { font-size: 19px; }
  #exercise-note { height: 58px; }
  #timer-display { font-size: 58px; letter-spacing: -2px; }
  #timer-label { margin-bottom: 10px; }
  #progress { padding: 8px 12px 10px; }
  .diff-btn { min-height: 31px; }
}

/* ---- 15 REDUCED MOTION (single consolidated opt-out) ---- */
@media (prefers-reduced-motion: reduce) {
  #timer-display.fx-tick,
  .btn-wrap.fx-shift #main-btn,
  .btn-wrap.fx-final10 #rest-ring-bar,
  #main-btn.go,
  #progress.fx-rail .dot.active,
  #progress.fx-rail .dot.active.blinking,
  .dot.completed.echoing::after,
  .exercise-dots.trigger-hit .dot.completed,
  #settings-modal.show .modal-card,
  #edit-modal.show .modal-card,
  #note-modal.show .modal-card,
  body.finished #workout-done,
  body.alert-flashing #timer-display,
  #skip-btn.pressed svg {
    animation: none !important;
  }
  #main-btn, #skip-btn, #skip-btn svg, .top-btn, .diff-btn,
  .rep-picker__num, #notes-input, #edit-notes, #note-modal-text,
  .toggle, .toggle::after, .modal-close.danger, #copy-btn, .dot,
  #rest-ring-head { transition: none !important; filter: none !important; }
}

.build-stamp {
  position: fixed;
  left: 8px;
  top: calc(env(safe-area-inset-top, 0px) + 5px);
  font-size: 9px;
  color: rgba(240, 239, 236, 0.26);
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  pointer-events: none;
  user-select: none;
  z-index: 1;
  letter-spacing: 0.5px;
}
</style>
</head>
<body>

<button id="settings-btn" class="top-btn" aria-label="Settings">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
</button>

<!-- Filled by JS from dayType. Kept empty in the markup so static text can
     never contradict the config (it drifted once: said "Lower" under an
     Upper build). One less surface for the daily flip to touch. -->
<h1 id="day-title"></h1>
<div id="exercise-name"></div>
<div id="set-info"></div>
<div id="exercise-note"></div>
<div id="timer-display" role="timer" aria-live="polite" aria-atomic="true"></div>

<div class="btn-wrap" id="btn-wrap">

  <svg id="rest-ring" viewBox="0 0 184 184" aria-hidden="true">

  </button>
</div>

<div id="bottom-bar">

      <div id="set-label-text">S1</div>
    </div>
    <div id="log-content">

        <button class="diff-btn" data-diff="2" aria-label="Light">LIGHT</button>
        <button class="diff-btn" data-diff="3" aria-label="Moderate">MOD</button>

<div id="settings-modal" role="dialog" aria-modal="true" aria-label="Settings">

    <div class="setting-row">
      <div>
        <div class="setting-label">Voice cues</div>

<div id="edit-modal" role="dialog" aria-modal="true" aria-labelledby="edit-exercise">

        <div class="rep-picker__strip" id="edit-rep-picker-strip" role="listbox"></div>

<div id="workout-done">

<script>
/* ==============================================================
   GYM TIMER v7 — 2026-07-10 architecture pass
   One script, one table of contents. v6 behavior preserved;
   removed in v7 (all dead since ≤6/1, confirmed by the 6/1 review):
   the unreachable undo engine (back/forward had no UI), the retired
   daily-hype clip system (ElevenLabs static bank is Option A standing),
   the disabled effort/RIR position cues, logExerciseIndex, and the
   reset-confirm remnants.

   §1  CONFIG (fenced — daily flips replace ONLY this block)
   §2  CONSTANTS + SETTINGS      §3  STATE
   §4  SUPERSET SEQUENCE ENGINE  §5  DOM REFS
   §6  REP PICKER                §7  AUDIO CORE
   §8  VOICE CUES                §9  ADVISOR (drops/triggers/notes)
   §10 RENDERING                 §11 STATE MACHINE
   §12 BROWSING CURSOR           §13 REORDER + BOARD TAPS
   §14 MODALS                    §15 SUMMARY
   §16 PERSISTENCE               §17 LIFECYCLE + INIT
   §18 VISUAL FX OBSERVER (presentation-only)
   ============================================================== */

// ======================= CONFIG START =======================
// The daily flip splices ONLY the fenced block (dayType + build note +
// workout array). Everything below CONFIG END is the workout-agnostic engine.
const dayType = "Upper";

// *** DELOAD UPPER -- 11 SETS, NOT 21. HALF VOLUME, SAME WEIGHTS. ***
// Companion to the 2026-07-30 Lower deload. Same rationale: ~16 weeks of
// training with zero deloads, 8 consecutive contaminated reads, nothing
// advanced in ~3 weeks. Set counts halved per exercise; every weight held.
//
// WHY THIS BUILD EXISTS EVEN THOUGH THE 7/30 LOWER ABORTED:
// The 7/30 Lower stopped at 8m18s on NEW left knee pain (sharp, infra-medial,
// medial to the patellar tendon, on the loaded descent). That is a knee
// problem, not a fatigue problem, and it PARKS the Lower side entirely --
// no loaded deep knee flexion until it is evaluated. UPPER LOADS THE KNEE
// NOWHERE, so the Upper side continues untouched. The rotation advanced
// (Lower was performed, however briefly), so next is Upper.
//
// (1) EVERY `trigger` IS DELIBERATELY STRIPPED. A deload must not be able to
//     fire an advance -- rebasing off an intentionally easy session is the
//     same error as rebasing off a contaminated one.
// (2) BACKOFFS ARE KEPT. If a weight genuinely cannot be held, dropping is
//     still correct. Nothing rebases off this session in either direction.
// (3) EFFORT IS THE OTHER HALF OF THE DELOAD. Every setNote says stop ~3-4
//     reps shy. The LOAD stays to preserve the strength signal; FATIGUE is
//     what is being shed.
// (4) TRUE-FAILURE RIR ANCHOR: STILL DEFERRED. It is Upper-only and therefore
//     eligible on paper, but the gate is a RESTED read and a deload session is
//     by construction not a maximal one. Run it on the first NORMAL-volume
//     Upper after a real night of sleep, on a MACHINE COMPOUND (chest press or
//     row), never on curls.
// (5) CHEST PRESS RUNS SLOT 1. A crowded gym bumped it to 4th on 7/10 and it
//     ran pre-fatigued. Protect the first slot.
// (6) If the cable station is taken, French Press 40 is the proven pushdown
//     fallback (7/10: 16/11/10, zero cuff pain).
//
// AUTO-DROP v5 + sticky (Soren 7/5): reactive = below floor at HARD/MAX, or AT
// floor while MAXED; predictive = three MAX sets, two declining steps,
// projecting under the floor. Once a drop materializes, every later set stays
// at the backoff. MOD/LIGHT never drop. An UNGRADED set now defaults to MAX
// (DEFAULT_DIFF, shipped 7/29) -- it fails safe, but it also means drops fire
// more readily on sets he forgets to grade.
// setNotes = FORM/LOAD cues ONLY, never echo prior reps, never name a weight
// the auto-drop could contradict. Voice = ElevenLabs static bank, no regen.
// SUPERSETS: CP + Incline (A1) <-> Row (A2); Pushdown + Curls (B1) <-> LR (B2).
const workout = [
  {
    name: "Chest Press Machine",
    ss: "A1",
    short: "PRESS",
    sets: 2,
    reps: "8-12",
    weight: "120 lbs",
    backoff: "100 lbs",
    rest: 150,
    note: "DELOAD -- 2 sets, not 4. Same 120. Take this machine the moment you walk in; it runs first for a reason. Stop 3-4 reps short of failure on BOTH sets. Controlled tempo, full range, no bouncing off the chest. Backoff is 100.",
    setNotes: [
      "S1: deload -- full range, controlled, stop 3-4 reps shy of failure.",
      "S2: last press set. Same tempo. Leave reps in the tank."
    ]
  },
  {
    name: "Cable Rope Row",
    ss: "A2",
    short: "ROW",
    sets: 2,
    reps: "8-12",
    weight: "120 lbs",

// ============ §4 SUPERSET SEQUENCE ENGINE (2026-07-06) ============
// The working cursor walks `sequence` (the interleaved set order) instead of
// (exercise, set++). Logs, dots, advice, and auto-drop still key on
// (exercise, set) -- per-exercise set order is preserved inside the
// interleave, so none of that machinery changes. `dissolvedGroups` holds
// groups unlinked mid-session (machine taken); members fall back to straight sets.
let dissolvedGroups = new Set();

function parseSS(ex) {
  if (!ex || !ex.ss) return null;
  const m = String(ex.ss).match(/^([A-Za-z])([12])$/);
  if (!m) return null;
  if (dissolvedGroups.has(m[1])) return null;
  return { g: m[1], slot: +m[2] };
}
function groupIdOf(exIdx) {
  const t = parseSS(workout[exIdx]);
  return t ? t.g : null;
}
function slotOf(exIdx) {
  const t = parseSS(workout[exIdx]);
  return t ? t.slot : null;
}
function firstMemberOfGroup(g) {
  for (let i = 0; i < workout.length; i++) if (groupIdOf(i) === g) return i;
  return -1;
}
function buildSequence() {
  const seq = [];
  const emitted = new Set();
  for (let i = 0; i < workout.length; i++) {
    if (emitted.has(i)) continue;
    const tag = parseSS(workout[i]);
    if (!tag) {
      for (let s = 0; s < workout[i].sets; s++) seq.push({ ex: i, set: s });
      emitted.add(i);
      continue;
    }
    // Whole group emits at its first member's board position: build both slot
    // queues in array order, interleave anchor-first; an unequal queue drains
    // its remainder linearly (6 presses vs 5 rows ends ...I1 R5 I2).
    const q1 = [], q2 = [];
    for (let k = 0; k < workout.length; k++) {
      const tk = parseSS(workout[k]);
      if (!tk || tk.g !== tag.g) continue;
      const dst = (tk.slot === 1) ? q1 : q2;
      for (let s = 0; s < workout[k].sets; s++) dst.push({ ex: k, set: s });
      emitted.add(k);
    }
    let a = 0, b = 0;
    while (a < q1.length || b < q2.length) {
      if (a < q1.length) seq.push(q1[a++]);
      if (b < q2.length) seq.push(q2[b++]);
    }
  }
  return seq;
}
let sequence = buildSequence();
let seqIndex = 0;
function seqPosOf(exIdx, setIdx) {
  const p = sequence.findIndex(e => e.ex === exIdx && e.set === setIdx);
  return p >= 0 ? p : 0;
}
function syncSeqIndex() { seqIndex = seqPosOf(currentExercise, currentSet); }
function rebuildSequence() {
  sequence = buildSequence();
  syncSeqIndex();
}
function dissolveGroup(g) {
  dissolvedGroups.add(g);
  rebuildSequence();
  renderExercise(); // rerenders the board (rail + unlink drop off)
  saveState();
}

}

// ============ §6 REP PICKER ============
// Horizontal scroll-snap wheel (replaced the +/- rep buttons in v3).
// Cells 0..50; the cell closest to the strip's center is the selected value.
// Tap any visible cell to smooth-scroll it to center. setValue(n) jumps
// instantly without firing onChange (suppressChange prevents re-entry).
function createRepPicker(stripEl, opts) {
  const min = (opts && typeof opts.min === 'number') ? opts.min : 0;
  const max = (opts && typeof opts.max === 'number') ? opts.max : 50;
  const onChange = (opts && opts.onChange) || function() {};
  for (let i = min; i <= max; i++) {
    const cell = document.createElement('div');
    cell.className = 'rep-picker__num';
    cell.dataset.value = String(i);
    cell.textContent = i;
    cell.setAttribute('role', 'option');
    stripEl.appendChild(cell);
  }
  const cells = Array.from(stripEl.querySelectorAll('.rep-picker__num'));
  let currentValue = min;
  let suppressChange = false;
  function findClosestValue() {
    const stripRect = stripEl.getBoundingClientRect();
    // Hidden container (display:none modal) → rect is 0. Bail; the caller
    // re-fires after the container becomes visible.
    if (stripRect.width === 0) return currentValue;
    const centerX = stripRect.left + stripRect.width / 2;
    let closest = null;
    let closestDist = Infinity;
    for (const cell of cells) {
      const r = cell.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const d = Math.abs(cx - centerX);
      if (d < closestDist) { closestDist = d; closest = cell; }
    }
    return closest ? parseInt(closest.dataset.value, 10) : min;
  }
  function refreshActive() {
    const newVal = findClosestValue();
    for (const cell of cells) {
      const v = parseInt(cell.dataset.value, 10);
      cell.classList.toggle('is-active', v === newVal);
      cell.classList.toggle('is-near', Math.abs(v - newVal) === 1);
    }
    if (newVal !== currentValue) {
      currentValue = newVal;
      if (!suppressChange) onChange(newVal);
    }
  }
  let raf = null;
  stripEl.addEventListener('scroll', () => {
    if (raf) return;
    raf = requestAnimationFrame(() => { raf = null; refreshActive(); });
  }, { passive: true });
  stripEl.addEventListener('click', (e) => {
    e.stopPropagation();
    const cell = e.target.closest('.rep-picker__num');
    if (!cell) return;
    const target = cell.offsetLeft + cell.offsetWidth / 2 - stripEl.clientWidth / 2;
    stripEl.scrollTo({ left: target, behavior: 'smooth' });
  });
  function setValue(n) {
    n = Math.max(min, Math.min(max, n | 0));
    const cell = cells[n - min];
    if (!cell) return;
    suppressChange = true;
    // Direct scrollLeft assignment is instant + reliable on hidden→shown
    // transitions (modal open). scrollIntoView quirks avoided.
    const target = cell.offsetLeft + cell.offsetWidth / 2 - stripEl.clientWidth / 2;
    stripEl.scrollLeft = target;
    currentValue = n;
    refreshActive();
    requestAnimationFrame(() => { suppressChange = false; });
  }
  function getValue() { return currentValue; }
  setValue(min);
  return { setValue, getValue, refreshActive };
}

// Chronograph bezel: 60 machined minute-ticks (every 5th brighter) inside the
// ring + a comet head riding the arc's draining edge. The bezel is mounted
// permanently (idle = ghost track); position math: the stroke path starts at
// (cx+r, cy) and sweeps clockwise; with dashoffset = C*(1-fraction) the
// visible arc runs 0 → C*fraction, so the moving end sits at 2π*fraction.
// The svg's rotate(-90deg) puts the fixed end at 12 o'clock. Guarded: a
// failure degrades to the plain ring.
let elRingHead = null;
try {
  const svgNS = "http://www.w3.org/2000/svg";
  const ringSvg = document.getElementById("rest-ring");
  for (let k = 0; k < 60; k++) {
    const a = k * Math.PI / 30;
    const major = (k % 5 === 0);
    const r0 = major ? 83.5 : 85.5;
    const tick = document.createElementNS(svgNS, "line");
    tick.setAttribute("class", major ? "ring-tick ring-tick-major" : "ring-tick");
    tick.setAttribute("x1", (92 + r0 * Math.cos(a)).toFixed(2));
    tick.setAttribute("y1", (92 + r0 * Math.sin(a)).toFixed(2));
    tick.setAttribute("x2", (92 + 88 * Math.cos(a)).toFixed(2));
    tick.setAttribute("y2", (92 + 88 * Math.sin(a)).toFixed(2));
    ringSvg.insertBefore(tick, ringSvg.firstChild);
  }
  elRingHead = document.createElementNS(svgNS, "circle");
  elRingHead.setAttribute("id", "rest-ring-head");
  elRingHead.setAttribute("r", "0");
  elRingHead.setAttribute("cx", "180");
  elRingHead.setAttribute("cy", "92");
  ringSvg.appendChild(elRingHead);
} catch (e) {}

// ============ §7 AUDIO CORE ============
function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch(e) {}
}
// Recover from a dead/suspended AudioContext. iOS Safari closes audio
// contexts during long backgrounding -- 3-min rests with the phone in a
// pocket are well within the reclamation window. Once .state is 'closed' the
// context cannot be reopened: build a new one and re-decode the voice buffers
// (decoded AudioBuffers are bound to the dead context; raw ArrayBuffers survive).
let _ctxGen = 0;
function recoverAudioCtx() {
  // Path A: missing or dead context -- recreate from scratch.
  if (!audioCtx || audioCtx.state === 'closed') {
    if (audioCtx) { try { audioCtx.close(); } catch(e) {} }
    audioCtx = null;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) { return; }
    _ctxGen++;
    if (typeof VoiceCue !== 'undefined' && VoiceCue._afterContextRecreated) {
      VoiceCue._afterContextRecreated();
    }
  }
  // Path B: suspended OR interrupted (the iOS-specific backgrounded state --
  // older code only checked 'suspended' and left interrupted contexts silent
  // forever) -- resume. resume() rejects silently if the context just closed;
  // the next caller hits Path A and recreates.
  if (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') {
    audioCtx.resume().catch(() => {});
  }
  // Re-assert ambient session category on EVERY recovery, not just Path A.
  // iOS can revert the category during backgrounding without closing the
  // context; unrecovered, voice cues would interrupt Spotify instead of
  // mixing with it.
  try {
    if ('audioSession' in navigator) navigator.audioSession.type = 'ambient';
  } catch(e) {}
}

// iOS requires a REAL user gesture to resume an interrupted/suspended
// context -- visibilitychange is not one, so its resume() often silent-fails
// and audio stays dead for the rest of the workout. Hooking any touchend/
// pointerdown guarantees the first real interaction after returning to the
// tab unlocks audio. (touchend > touchstart: iOS autoplay-unlock criteria are
// met when the finger LEAVES the screen.)
let _audioGestureRecoveryAttached = false;
// Cues queued by code paths that fired pre-gesture (e.g. restDone from
// visibilitychange). Drained on the next real user gesture, after the
// context is recovered AND VoiceCue is unlocked.
let pendingPostGestureCues = [];
function attachGlobalAudioRecovery() {
  if (_audioGestureRecoveryAttached) return;
  _audioGestureRecoveryAttached = true;
  const recover = () => {
    if (!audioCtx || audioCtx.state === 'closed' ||
        audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') {
      recoverAudioCtx();
    }
    // Idempotent -- bails if already unlocked. Without this, a non-main-button
    // gesture restores the context but leaves VoiceCue.play() gated silent.
    if (typeof VoiceCue !== 'undefined' && VoiceCue.unlock) {
      VoiceCue.unlock();
    }
    // Keepalive previously only started from the main-button click. If the
    // page reloaded mid-rest (state restored), that click never fired and the
    // new context re-suspends in ~30s of silence. Idempotent.
    startAudioKeepalive();
    // Drain queued cues. Resume FIRST, then drain once actually running --
    // iOS resolves resume() on a later task, so a synchronous state check
    // here would skip the drain on the exact gesture meant to flush it.
    // Only clear the queue after a confirmed resume (failed resume retries
    // on the next gesture).
    if (pendingPostGestureCues.length && audioCtx) {
      Promise.resolve(audioCtx.resume()).then(() => {
        if (!audioCtx || audioCtx.state !== 'running') return;
        const drained = pendingPostGestureCues.slice();
        pendingPostGestureCues.length = 0;
        // Play ONLY the newest queued announcement -- it describes the
        // current state (each playSequence cancels the previous anyway).
        const lastSeq = drained[drained.length - 1];
        if (lastSeq) { try { VoiceCue.playSequence(lastSeq); } catch(e) {} }
      }).catch(() => {});
    }
  };
  ['touchend', 'pointerdown', 'mousedown', 'click', 'keydown'].forEach(ev => {
    document.addEventListener(ev, recover, { capture: true, passive: true });
  });
}

// iOS Safari auto-suspends inactive AudioContexts after ~30s of silence; a
// 3-minute rest is well past that. A silent oscillator every 15s counts as
// activity and keeps the context running through the rest.
let _audioKeepaliveInterval = null;
function startAudioKeepalive() {
  if (_audioKeepaliveInterval) return;
  _audioKeepaliveInterval = setInterval(() => {
    if (!audioCtx || audioCtx.state !== 'running') return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      gain.gain.value = 0;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.01);
    } catch(e) {}
  }, 15000);
}
function playAlertSound() {
  try {
    recoverAudioCtx();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    [0, 0.22].forEach(offset => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now + offset);
      gain.gain.setValueAtTime(0.0001, now + offset);
      gain.gain.exponentialRampToValueAtTime(0.4, now + offset + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.18);
      osc.start(now + offset);
      osc.stop(now + offset + 0.2);
    });
  } catch (e) {}
}
function triggerAlertFeedback() {
  playAlertSound();
}

    'wgt-200', 'wgt-215', 'wgt-220', 'wgt-235', 'wgt-250', 'wgt-265', 'wgt-280', 'wgt-295', 'wgt-310',
    'wgt-plus-modifier',
    // set context + form cues
    'cue-trigger-set', 'cue-last-set', 'cue-form-check', 'cue-slow-tempo', 'cue-strict-form',
    'cue-no-hammer', 'cue-knee-check', 'cue-modifier-check',
    // rep-range targets
    'cue-aim-6-10', 'cue-aim-8-12', 'cue-aim-10-12', 'cue-aim-12-15', 'cue-aim-15-20',
    // batch-2 additions
    'cue-warmup-set', 'cue-watch-knee', 'cue-pacing-fix', 'cue-trigger-hit', 'cue-personal-record', 'cue-full-rom'
  ];
  const arrayBuffers = new Map();   // raw, pre-decode
  const decodedBuffers = new Map(); // post-decode, ready to play
  const fetchFailed = new Set();    // 404/offline clips: play() skips instantly (no dead gap)
  let initialized = false;
  let unlocked = false;
  let currentSources = [];
  let currentChain = null;
  // Bumped by cancel(). An in-flight play() awaiting decode/resume captures
  // the generation at entry and bails if it changed -- without this, a clip
  // whose decode-wait straddled a cancel() would fire seconds later, playing
  // a STALE announcement over the sequence that superseded it.
  let playGen = 0;

  function init() {
    if (initialized) return;
    initialized = true;
    FILES.forEach(name => {
      fetch('audio/' + name + '.mp3')
        .then(r => r.ok ? r.arrayBuffer() : Promise.reject())
        .then(ab => { arrayBuffers.set(name, ab); decodeIfReady(name); })
        .catch(() => { fetchFailed.add(name); });
    });
  }

  function decodeIfReady(name) {
    if (!unlocked || !audioCtx) return;
    if (decodedBuffers.has(name)) return;
    const ab = arrayBuffers.get(name);
    if (!ab) return;
    // .slice(0) copies so the original ArrayBuffer isn't detached (some
    // browsers detach the input to decodeAudioData). Capture the context
    // generation so a decode resolving AFTER a context recreation doesn't
    // pollute the new decodedBuffers map.
    const myGen = _ctxGen;
    try {
      audioCtx.decodeAudioData(ab.slice(0))
        .then(buf => {
          if (myGen === _ctxGen) decodedBuffers.set(name, buf);
        })
        .catch(() => {
          // Transient decode failure (iOS rejecting on a closing context).
          // Retry once on the current generation; if the context died again,
          // the next _afterContextRecreated pass picks it up.
          if (myGen === _ctxGen && audioCtx && !decodedBuffers.has(name)) {
            try {
              audioCtx.decodeAudioData(ab.slice(0))
                .then(buf => { if (myGen === _ctxGen) decodedBuffers.set(name, buf); })
                .catch(() => {});
            } catch(e) {}
          }
        });
    } catch(e) {}
  }

  // Call from any user gesture to unlock + decode. recoverAudioCtx() handles
  // initAudio + resume + audioSession='ambient'.
  function unlock() {
    if (unlocked) return;
    recoverAudioCtx();
    if (!audioCtx) return;
    unlocked = true;
    arrayBuffers.forEach((ab, name) => decodeIfReady(name));
  }

  async function play(name) {
    if (!settings.voice) return;
    recoverAudioCtx();
    if (!audioCtx || !unlocked) return;
    const myPlayGen = playGen;
    // Wait up to 3s for the buffer to finish decoding -- a play() racing the
    // post-unlock decode pass (first cue right after page load + immediate
    // Start tap) silent-fails on anything shorter.
    let waited = 0;
    while (!decodedBuffers.has(name) && waited < 3000) {
      // Never-fetched clip (404: not yet recorded, or offline): it will never
      // decode -- bail NOW instead of stalling the sequence 3s per clip.
      if (fetchFailed.has(name) && !arrayBuffers.has(name)) return;
      // Superseded (cancel() ran) or voice toggled off while waiting: silent.
      if (playGen !== myPlayGen || !settings.voice) return;
      await new Promise(r => setTimeout(r, 50));
      waited += 50;
    }
    const buffer = decodedBuffers.get(name);
    if (!buffer) return;
    // Wait for the context to actually run. resume() is async; source.start()
    // into a still-suspended context emits nothing (the post-backgrounding
    // silent-fail).
    if (audioCtx.state !== 'running') {
      try { await audioCtx.resume(); } catch(e) {}
    }
    if (audioCtx.state !== 'running') return;
    if (playGen !== myPlayGen || !settings.voice) return;
    return new Promise(resolve => {
      try {
        const source = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        gain.gain.value = 1.0;
        // Re-assert ambient right before playback -- iOS sometimes resets the
        // category between recovery and source.start(), causing ducking.
        try { if ('audioSession' in navigator) navigator.audioSession.type = 'ambient'; } catch(e) {}
        source.buffer = buffer;
        source.connect(gain);
        gain.connect(audioCtx.destination);
        source.onended = () => {
          const idx = currentSources.indexOf(source);
          if (idx >= 0) currentSources.splice(idx, 1);
          resolve();
        };
        currentSources.push(source);
        source.start(0);
      } catch(e) { resolve(); }
    });
  }

  function playSequence(names, gapMs) {
    if (!settings.voice) return Promise.resolve();
    if (gapMs == null) gapMs = 80;
    cancel();
    const chain = { cancelled: false };
    currentChain = chain;
    return names.reduce((p, name) => p.then(() => {
      if (chain.cancelled) return;
      return play(name).then(() => new Promise(r => setTimeout(r, gapMs)));
    }), Promise.resolve());
  }

  function cancel() {
    playGen++;
    if (currentChain) currentChain.cancelled = true;
    currentChain = null;
    currentSources.forEach(s => {
      try { s.stop(); s.disconnect(); } catch(e) {}
    });
    currentSources = [];
  }

  // Called by recoverAudioCtx() after a fresh AudioContext is built. Decoded
  // buffers died with the old context; raw ArrayBuffers survive -- re-decode.
  // unlocked stays true (the user gesture already happened).
  function _afterContextRecreated() {
    decodedBuffers.clear();
    cancel();
    arrayBuffers.forEach((ab, name) => decodeIfReady(name));
  }

  return { init, unlock, play, playSequence, cancel, _afterContextRecreated,
           has: (name) => decodedBuffers.has(name) || arrayBuffers.has(name) };
})();

// Map workout exercise names → audio clip names. Tolerant to naming variants;
// every name a config might use MUST have a row here or its cue is silent
// (the missing "DB Curls (supinated)" alias cost the curls announcement on
// every Upper build 7/6-7/9 -- caught in the v7 audit).
function exerciseClipName(name) {
  if (!name) return null;
  const map = {
    "Chest Press Machine": "ex-chest-press",
    "Chest Press": "ex-chest-press",
    "Lat Pulldown": "ex-lat-pulldown",
    "DB Lateral Raise": "ex-db-lat-raise",
    "Dumbbell Lateral Raise": "ex-db-lat-raise",
    "DB Curls": "ex-db-curls",
    "DB Curls (supinated)": "ex-db-curls",
    "DB Curls (REGULAR/supinated)": "ex-db-curls",
    "Dumbbell Curls": "ex-db-curls",
    "Leg Press": "ex-leg-press",
    "Leg Curl": "ex-leg-curl",
    "Leg Curl Machine": "ex-leg-curl",
    "Leg Press Calf Raises": "ex-calf-raises",
    "Calf Raises": "ex-calf-raises",
    "Cable Face Pulls": "ex-face-pulls",
    "Face Pulls": "ex-face-pulls",
    "Cable Row": "ex-cable-row",
    "Cable Rope Row": "ex-cable-row",
    "Cable Tricep Pushdown": "ex-tricep-pushdown",
    "Single-Arm DB Row": "ex-single-arm-db-row",
    "DB Romanian Deadlift": "ex-db-rdl",
    "DB RDL": "ex-db-rdl",
    "Romanian Deadlift": "ex-db-rdl",
    "Leg Extension": "ex-leg-extension",
    "Leg Extension Machine": "ex-leg-extension",
    "Incline Press": "ex-incline-press",
    "Incline DB Press": "ex-incline-press",
    "Overhead Press": "ex-overhead-press",
    "Tricep Pushdown": "ex-tricep-pushdown",
    "Rear Delt Flyes": "ex-rear-delt-flyes",
    "Hammer Curls": "ex-hammer-curls",
    "DB Curls (HAMMER variant)": "ex-hammer-curls"
  };
  return map[name] || null;
}

function restClipForDuration(seconds) {
  if (seconds === 180) return 'rest-3min';
  if (seconds === 150) return 'rest-150sec'; // clip not recorded yet; fetchFailed guard skips it gap-free
  if (seconds === 120) return 'rest-2min';
  if (seconds === 90) return 'rest-90sec';
  if (seconds === 60) return 'rest-60sec';
  return null;
}

// Set-position announcement at the end of a rest. Null on a first set (the
// up-next + exercise-name cue covered it).
function setStartClipFor(exIdx, setIdx) {
  if (!workout[exIdx]) return null;
  if (setIdx === 0) return null;
  const isFinal = (setIdx === workout[exIdx].sets - 1);
  if (isFinal) return 'final-set';
  if (setIdx === 1) return 'set-2';
  if (setIdx === 2) return 'set-3';
  if (setIdx === 3) return 'set-4';
  return null;
}

// Map an exercise's weight string to its callout clips. [] if no usable
// weight. Handles the modifier suffix ("115 lbs + modifier"); half-weights
// use the dash-decimal slug ("22.5" → "wgt-22-5").
function weightClipsFor(exerciseObj) {
  if (!exerciseObj || !exerciseObj.weight) return [];
  const w = String(exerciseObj.weight).toLowerCase();
  const numMatch = w.match(/(\d+(?:\.\d+)?)/);
  if (!numMatch) return [];
  const slug = numMatch[1].replace('.', '-');
  const result = ['wgt-' + slug];
  if (w.includes('modifier')) result.push('wgt-plus-modifier');
  return result;
}

// The weight callout for a freshly-materialized auto-drop. Announced once, at
// the start of the rest before the set that loads the backoff (that's when
// he's re-pinning the stack). Sticky continuation sets stay silent; a missing
// wgt clip skips gap-free via the fetchFailed guard.
function dropAnnounceClips(exIdx, setIdx) {
  const ex = workout[exIdx];
  if (!ex || !ex.backoff || setIdx < 1) return [];
  const st = stickyDropState(exIdx, setIdx);
  if (!st.dropped || st.firedAt !== setIdx) return [];
  const m = String(ex.backoff).match(/(\d+(?:\.\d+)?)/);
  if (!m) return [];
  return ['wgt-' + m[1].replace('.', '-')];
}

// Map a rep-range string like "8-12" to its aim cue.
function repRangeClipFor(repsStr) {
  if (!repsStr) return null;
  const m = String(repsStr).match(/(\d+)\s*-\s*(\d+)/);
  if (!m) return null;
  const key = parseInt(m[1], 10) + '-' + parseInt(m[2], 10);
  const map = {
    '6-10':  'cue-aim-6-10',
    '8-12':  'cue-aim-8-12',
    '10-12': 'cue-aim-10-12',
    '12-15': 'cue-aim-12-15',
    '15-20': 'cue-aim-15-20'
  };
  return map[key] || null;
}

// Threshold-based countdown announcements (from startCountdown). Each
// threshold fires once per rest; reset when a new rest begins.
function maybeFireCountdownCue(secCeil) {
  if (countdownFiredThresholds.has(secCeil)) return;
  const cues = {
    60: '1min-remaining',
    30: '30sec-remaining',
    10: '10sec-remaining',
    5: 'countdown-5',
    4: 'countdown-4',
    3: 'countdown-3',
    2: 'countdown-2',
    1: 'countdown-1'
  };
  const name = cues[secCeil];
  if (!name) return;
  // Skip remaining-N cues when total rest is at/below the threshold
  // (redundant with the rest-start announcement).
  if ((secCeil === 60 && restTotalSeconds <= 60) ||
      (secCeil === 30 && restTotalSeconds <= 30) ||
      (secCeil === 10 && restTotalSeconds <= 10)) {
    countdownFiredThresholds.add(secCeil);
    return;
  }
  // Only mark the threshold fired if audio is actually playable -- otherwise
  // the next 100ms tick retries once the context recovers. Without this gate,
  // every silent-fail during tab-return recovery permanently ate that cue.
  if (!audioCtx || audioCtx.state !== 'running') return;
  countdownFiredThresholds.add(secCeil);
  VoiceCue.play(name);
}

// The rest-expiry announcement (restDone + the expired-restore path share it).
function restEndCueSeq() {
  const seq = ['rest-complete'];
  if (settings.autoStart) {
    const setStart = setStartClipFor(currentExercise, currentSet);
    if (setStart) seq.push(setStart);
  } else {
    seq.push('tap-to-start');
  }
  return seq;
}
// Play now if audio is live, else queue for the first real gesture (a cue
// fired with no user gesture since tab-return would silent-fail and be lost).
function playOrQueue(seq) {
  if (audioCtx && audioCtx.state === 'running') {
    VoiceCue.playSequence(seq);
  } else {
    pendingPostGestureCues.push(seq);
  }
}

// ============ §9 ADVISOR (drops, triggers, set notes) ============
// AUTO-DROP PREDICATE (v5, Soren OK'd 7/5) -- THE single source of truth for
// "should the next set load the backoff?". The advice text (dynamicRepAdvice)
// and the on-screen weight (effectiveWeight via stickyDropState) both route
// through this one function, so note and loaded weight can never disagree.
// Given graded logs so far (prevLogs = sets 0..n-1), decide for set n:
//   (1) REACTIVE: last set BELOW the floor at HARD/MAX, or exactly AT the
//       floor while MAXED (a HARD set at the floor HOLDS -- reserve left).
//   (2) PREDICTIVE: the last THREE sets all MAX with TWO declining steps, and
//       the last step's slope projects the next set under the floor.
//       History: v3 projected off ANY downtrend (misfired on Row 7/2 -- a
//       paced HARD 12 falling to a MAX 9 is pacing, not fatigue); v4 required
//       two MAX sets + one declining step (still fired on LP 7/4's 11->9, a
//       normal early-set fade). One declining step is ordinary; TWO at MAX is
//       a real crater forming. 13->11->9 fires; 11->9 never does.
//   MOD/LIGHT never drop. A zero-rep set reads as "stopped early", never a
//   weight failure.
function dropPredicate(prevLogs, lo) {
  const last = prevLogs[prevLogs.length - 1];
  if (!last) return false;
  const r = Number(last.reps);
  if (isNaN(r) || r <= 0) return false;
  const d = +last.difficulty || 0;
  const hardOrMax = d >= 4;
  const maxed = d >= 5;
  if (!hardOrMax) return false;
  if (r < lo || (r === lo && maxed)) return true;
  if (r > lo && maxed && prevLogs.length >= 3) {
    const p2 = prevLogs[prevLogs.length - 2];
    const p3 = prevLogs[prevLogs.length - 3];
    const r2 = Number(p2.reps), r3 = Number(p3.reps);
    const d2 = +p2.difficulty || 0, d3 = +p3.difficulty || 0;
    if (!isNaN(r2) && !isNaN(r3) && d2 >= 5 && d3 >= 5 && r3 > r2 && r2 > r) {
      if ((r - (r2 - r)) < lo) return true;
    }
  }
  return false;
}

// STICKY DROP (Soren 7/5): once the drop materializes for a set, every later
// set of that exercise stays at the backoff. A recovered set no longer flips
// the display back to the prescription -- that produced the 7/4 incoherence
// ("Hold 235" note over a 205 display). Walks the graded sets in order and
// latches at the FIRST set the predicate fires for; an ungraded set before
// any latch means we can't evaluate (no drop); an ungraded set after the
// latch changes nothing (the drop already happened on the machine).
// Returns { dropped, firedAt } -- firedAt = first set index loaded at the backoff.
function stickyDropState(exIdx, setIdx) {
  const ex = workout[exIdx];
  if (!ex || !ex.backoff || setIdx < 1) return { dropped: false, firedAt: null };
  const rng = String(ex.reps || "").match(/(\d+)\D+(\d+)/);
  if (!rng) return { dropped: false, firedAt: null };
  const lo = +rng[1];
  const prevLogs = [];
  for (let i = 0; i < setIdx; i++) {
    const lg = setLogs.find(l => l.exercise === exIdx && l.set === i);
    if (!lg || lg.difficulty == null) break; // ungraded gap: can't evaluate further
    prevLogs.push({ reps: lg.reps, difficulty: lg.difficulty });
    if (dropPredicate(prevLogs, lo)) return { dropped: true, firedAt: i + 1 };
  }
  return { dropped: false, firedAt: null };
}

// Dynamic per-set advice: a REALISTIC rep target for the upcoming set from
// the ACTUAL last-set reps + effort, plus the drop calls. difficulty = 1-5
// (3 MOD, 4 HARD, 5 MAX). ex.backoff = the drop target; ex.dropLastSet =
// last set is already a structural drop (defer to its static note there);
// ex.noDropAdvice = pain-limited slot (a short set means pain stopped it,
// not the weight -- never advise a drop, fall through to the static cues).
function dynamicRepAdvice(setIdx, prev, ex) {
  if (!prev || !prev.length || setIdx < 1) return null;
  if (ex.dropLastSet && setIdx === ex.sets - 1) return null;
  var rng = String(ex.reps || "").match(/(\d+)\D+(\d+)/);
  if (!rng) return null;
  var lo = +rng[1], hi = +rng[2];
  var last = prev[prev.length - 1];
  var r = Number(last.reps);
  if (isNaN(r)) return null;
  var d = +last.difficulty || 0;
  var hardOrMax = d >= 4;
  var maxed = d >= 5;
  var roomLeft = d > 0 && d <= 3;
  var wm = String(ex.weight).match(/(\d+(?:\.\d+)?)/);
  var w = wm ? wm[1] : "the weight";
  var bo = ex.backoff || null;
  var L = "S" + (setIdx + 1);
  // P = the COMPLETED set the numbers describe. Facts get P; instructions get
  // "here"/L. (The old texts hung the prior set's reps on the upcoming set's
  // label -- "S2 was 12 at max" shown before S2 happened; 7/5 hunt.)
  var P = "S" + setIdx;
  var aimHi = Math.min(lo + 2, hi);
  var pLo, pHi;
  if (hardOrMax) { pLo = Math.max(r - 2, 1); pHi = Math.max(r - 1, 1); }
  else if (roomLeft) { pLo = r; pHi = Math.min(r + 2, hi); }
  else { pLo = Math.max(r - 1, 1); pHi = r; }

  if (r <= 0) return P + " stopped early. Reset, go by feel this set.";

  // All drop decisions route through dropPredicate -- the same function
  // effectiveWeight consults -- so advice and on-screen weight share one brain.
  if (bo) {
    // Sticky-continues: the drop materialized for an EARLIER set. This set
    // stays at the backoff -- never bounce back off one recovered set.
    var earlierFired = false;
    for (var k = 1; k < prev.length; k++) {
      if (dropPredicate(prev.slice(0, k), lo)) { earlierFired = true; break; }
    }
    if (earlierFired) {
      var boNum = (String(bo).match(/(\d+(?:\.\d+)?)/) || [])[1] || String(bo);
      return L + " stays at " + boNum + " (dropped from " + w + "). Aim " + pLo + "-" + pHi + ".";
    }
    // Drop materializes on THIS set: message by which rule fired.
    if (hardOrMax && dropPredicate(prev, lo)) {
      if (r < lo || (r === lo && maxed)) {
        var why = (r < lo) ? (" was " + r + ", under " + lo) : (" was " + r + " at the floor, maxed");
        return P + why + ". Dropping to " + bo + " -- aim " + lo + "-" + aimHi + ".";
      }
      // Predictive: predicate guarantees three MAX sets, two declining steps.
      var pv2 = prev[prev.length - 2];
      var pv3 = prev[prev.length - 3];
      var projNext = r - (Number(pv2.reps) - r);
      return "Three MAX sets fading (" + Number(pv3.reps) + " to " + Number(pv2.reps) + " to " + r + ", proj ~" + projNext + " next). Dropping to " + bo + " -- aim " + lo + "-" + aimHi + ".";
    }
  }

  // Pain-limited slots: never advise a drop -- static form/STOP cues own it.
  if (ex.noDropAdvice && hardOrMax && r <= lo) return null;

  // No backoff defined (groovers like Face Pulls): advise only, never auto-drop.
  if (r < lo && hardOrMax) {
    return P + " was " + r + ", under " + lo + ". Drop a notch here.";
  }
  if (r === lo && hardOrMax) {
    return maxed
      ? P + " at the floor (" + r + "), maxed. Drop a notch here."
      : P + " at the floor (" + r + ") with a little left. Hold " + w + ", push for more.";
  }
  if (r >= hi && roomLeft) {
    return P + " hit " + r + " (top) with room. Bump the weight next session. Here: " + (hi - 1) + "-" + hi + ".";
  }
  if (roomLeft) {
    return P + " was " + r + " with room. Push " + pLo + "-" + pHi + " here, hold " + w + ".";
  }
  return P + " was " + r + (hardOrMax ? " at max" : "") + ". Aim " + pLo + "-" + pHi + " here, hold " + w + ".";
}

function defaultAdvice(setIdx, prev, ex) {
  if (!Array.isArray(ex.trigger) || setIdx === 0) return null;
  if (setIdx >= ex.trigger.length) return null;
  const reqHere = ex.trigger[setIdx];
  const passingPrior = prev.every((log, i) => log.reps >= ex.trigger[i]);
  const weightTag = ex.triggerWeight ? " for " + ex.triggerWeight : "";
  if (passingPrior) {
    if (setIdx === ex.trigger.length - 1) {
      return "TRIGGER ALIVE -- " + reqHere + "+ here flips" + weightTag + " next session. Push, form first.";
    }
    return "On track for trigger" + weightTag + " -- push " + reqHere + "+ here.";
  }
  // Trigger already out: say nothing -- never tell him to "match" a trigger
  // number he's failing; the rep/drop advisor or static note owns that case
  // (Soren's 6/10 call).
  return null;
}

// Returns { text, advisor } -- advisor=true when the note is a LIVE computed
// call (adviceFor / dynamicRepAdvice / trigger advice), false for the canned
// setNotes/note fallback. The note card styles the two differently.
function computeSetNoteInfo(exIdx, setIdx) {
  const ex = workout[exIdx];
  if (!ex) return { text: "", advisor: false };
  // Build prev-set logs in order. A prior set counts as "logged" only when
  // BOTH reps and difficulty are committed -- keeps dynamic advice from
  // firing off default reps before the user actually graded the set.
  const prevLogs = [];
  let allLogged = true;
  for (let i = 0; i < setIdx; i++) {
    const log = setLogs.find(l => l.exercise === exIdx && l.set === i);
    if (log && log.difficulty != null) {
      prevLogs.push({ reps: log.reps, difficulty: log.difficulty });
    } else {
      allLogged = false;
      break;
    }
  }
  if (allLogged && prevLogs.length === setIdx && setIdx > 0) {
    if (typeof ex.adviceFor === 'function') {
      const dynamic = ex.adviceFor(setIdx, prevLogs, ex);
      if (dynamic) return { text: dynamic, advisor: true };
    }
    const reactive = dynamicRepAdvice(setIdx, prevLogs, ex);
    if (reactive) return { text: reactive, advisor: true };
    const generic = defaultAdvice(setIdx, prevLogs, ex);
    if (generic) return { text: generic, advisor: true };
  }
  // Static fallback (S1 always lands here; later sets land here pre-grading).
  if (Array.isArray(ex.setNotes) && ex.setNotes[setIdx]) return { text: ex.setNotes[setIdx], advisor: false };
  return { text: ex.note || "", advisor: false };
}
function computeSetNote(exIdx, setIdx) {
  return computeSetNoteInfo(exIdx, setIdx).text;
}

// Did this exercise bank its advance trigger? Every set's logged reps must
// meet the trigger row AT THE PRESCRIBED WEIGHT -- a materialized auto-drop
// voids the bank (numbers hit at the backoff aren't the trigger).
function exerciseTriggerHit(exIdx) {
  const ex = workout[exIdx];
  if (!ex || !Array.isArray(ex.trigger) || ex.trigger.length !== ex.sets) return false;
  if (ex.backoff && stickyDropState(exIdx, ex.sets - 1).dropped) return false;
  for (let i = 0; i < ex.sets; i++) {
    const log = setLogs.find(l => l.exercise === exIdx && l.set === i);
    if (!log || Number(log.reps) < ex.trigger[i]) return false;
  }
  return true;
}

// One-shot celebration pulse on the exercise's dots row when its final set
// banks the trigger. Re-renders during the window simply drop the class early.
function pulseTriggerHit(exIdx) {
  requestAnimationFrame(() => {
    const row = elProgress.querySelector('.exercise-group[data-exercise-idx="' + exIdx + '"] .exercise-dots');
    if (!row) return;
    row.classList.add('trigger-hit');
    setTimeout(() => row.classList.remove('trigger-hit'), 1200);
  });
}

// The weight to actually load THIS set: reflects (a) a structural drop set
// (ex.dropLastSet, weight like "110 lbs (S4 -> 90)") and (b) a reactive
// advisor drop (ex.backoff). The number on screen is what goes on the
// machine, never the stale top-of-session prescription.
function effectiveWeight(exIdx, setIdx) {
  const ex = workout[exIdx];
  const baseStr = String(ex.weight || "");
  const baseNum = (baseStr.match(/(\d+(?:\.\d+)?)/) || [])[1] || null;
  const clean = baseStr.replace(/\s*\([^)]*\)\s*/g, "").trim() || baseStr;
  let dropNum = null;
  // (a) structural drop set: the last set of a dropLastSet exercise.
  if (ex.dropLastSet && setIdx === ex.sets - 1) {
    const m = baseStr.match(/(?:→|->|drop to)\s*(\d+(?:\.\d+)?)/i);
    if (m) dropNum = m[1];
  }
  // (b) auto-drop (sticky): from set 2 on, load the backoff whenever
  // stickyDropState says a drop materialized for this or any earlier set.
  if (dropNum == null && setIdx >= 1 && ex.backoff) {
    if (stickyDropState(exIdx, setIdx).dropped) {
      dropNum = (String(ex.backoff).match(/(\d+(?:\.\d+)?)/) || [])[1] || null;
    }
  }
  if (dropNum != null && dropNum !== baseNum) {
    return { dropped: true, num: dropNum, html: '<span class="wt-now">▼ ' + dropNum + ' lbs</span><span class="wt-was">from ' + baseNum + '</span>' };
  }
  return { dropped: false, num: baseNum, html: clean };
}
function setInfoHTML(exIdx, setIdx) {
  const ex = workout[exIdx];
  return effectiveWeight(exIdx, setIdx).html + "  ·  Set " + (setIdx + 1) + "/" + ex.sets + "  ·  " + ex.reps + " reps";
}

// ============ §10 RENDERING ============
// Returns the log entry the log area is displaying/editing:
// browsing → the viewed set's log (may be null for future sets);
// working during rest → the just-completed set's log.
function getActiveLogForEdit() {
  if (isBrowsing()) {
    return setLogs.find(l => l.exercise === viewingExercise && l.set === viewingSet) || null;
  }
  return currentLogEntry || null;
}
function renderDifficulty(log) {
  if (!elDifficultyRow) return;
  const currentDiff = log ? log.difficulty : null;
  elDifficultyRow.querySelectorAll('.diff-btn').forEach(btn => {
    btn.classList.toggle('selected', Number(btn.dataset.diff) === currentDiff);
  });
}
function renderSetLabel() {
  if (!elSetLabelText) return;
  // Show the set# of whatever log is actively being edited, not the cursor
  // position: during rest the cursor already points at the upcoming set while
  // the log-area fields hold the set just completed.
  const activeLog = getActiveLogForEdit();
  const setIdx = activeLog
    ? activeLog.set
    : (isBrowsing() ? viewingSet : currentSet);
  // Superset ambiguity: mid-pair rest, the header shows the UPCOMING exercise
  // while the log area edits the partner's just-done set -- a bare "S2" reads
  // as the wrong exercise's set. Name the exercise when they differ.
  const shownEx = isBrowsing() ? viewingExercise : currentExercise;
  if (activeLog && activeLog.exercise !== shownEx && workout[activeLog.exercise]) {
    const tag = workout[activeLog.exercise].short || workout[activeLog.exercise].name;
    elSetLabelText.textContent = tag + " S" + (setIdx + 1);
    elSetLabelText.classList.add("ctx");
  } else {
    elSetLabelText.textContent = "S" + (setIdx + 1);
    elSetLabelText.classList.remove("ctx");
  }
}
function syncLogArea() {
  const log = getActiveLogForEdit();
  if (log) {
    repCount = log.reps;
    repPicker.setValue(log.reps);
    elNotesInput.value = log.note || "";
  } else {
    // No active log (pre-first-Set-Done, or browsing a future set) — show
    // the displayed exercise's default reps so the row isn't empty.
    const exIdx = isBrowsing() ? viewingExercise : currentExercise;
    const ex = workout[exIdx];
    repCount = ex ? getMaxReps(ex.reps) : 0;
    repPicker.setValue(repCount);
    elNotesInput.value = "";
  }
  renderDifficulty(log);
  renderSetLabel();
}
function showLogArea() {
  elNotesInput.placeholder = "+ note";
  elLogArea.style.display = "flex";
  syncLogArea();
}
function hideLogArea() {
  elLogArea.style.display = "none";
}
function captureLog() {
  // Reps/notes/difficulty save in real time via input handlers; this just
  // clears the active-log reference at transition points.
  currentLogEntry = null;
}

// Sequence position of every (exercise,set) — dot completed/active semantics
// follow PERFORMED order (the interleave), not linear order, so a finished
// row S1 reads completed while press S2-S4 are still pending.
function seqPosMap() {
  const m = new Map();
  sequence.forEach((e, i) => m.set(e.ex + ":" + e.set, i));
  return m;
}
function renderProgress() {
  elProgress.innerHTML = "";
  const pos = seqPosMap();
  const isResting = (state === "resting" || state === "paused");
  const isDoingSet = (state === "ready" || state === "alert" || state === "finishing");
  for (let i = 0; i < workout.length; i++) {
    const group = document.createElement("div");
    group.className = "exercise-group";
    group.dataset.exerciseIdx = i;
    const gid = groupIdOf(i);
    if (gid) {
      group.classList.add("ss-linked");
      group.dataset.ssGroup = gid;
    }
    const dotsRow = document.createElement("div");
    dotsRow.className = "exercise-dots";
    let maxPos = -1;
    for (let j = 0; j < workout[i].sets; j++) {
      const dot = document.createElement("div");
      dot.className = "dot";
      const exIdx = i, setIdx = j;
      // Dataset drives the unified tap handler on #progress.
      dot.dataset.exerciseIdx = exIdx;
      dot.dataset.setIdx = setIdx;
      const key = exIdx + ":" + setIdx;
      const p = pos.has(key) ? pos.get(key) : 0;
      if (p > maxPos) maxPos = p;
      if (p < seqIndex) {
        dot.classList.add("completed");
        if (p === seqIndex - 1 && isResting) {
          dot.classList.add("echoing");
        }
        dot.setAttribute("role", "button");
        dot.setAttribute("aria-label", "View " + workout[i].name + " set " + (j + 1));
      } else if (p === seqIndex) {
        dot.classList.add("active");
        if (isDoingSet) dot.classList.add("blinking");
      }
      if (exIdx === viewingExercise && setIdx === viewingSet && isBrowsing()) {
