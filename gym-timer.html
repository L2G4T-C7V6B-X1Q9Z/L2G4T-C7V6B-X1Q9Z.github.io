// ============ §15 SUMMARY ============
function getMaxReps(repsStr) {
  const m = repsStr.match(/(\d+)\s*-\s*(\d+)/);
  return m ? parseInt(m[2], 10) : (parseInt(repsStr, 10) || 10);
}
function formatDuration(ms) {
  const totalSec = Math.max(0, Math.floor(ms / 1000));
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return m + "m " + s.toString().padStart(2, "0") + "s";
}
function getExerciseDuration(exerciseIdx) {
  const logs = performedOf(exIdAt(exerciseIdx)).filter(e => e.at);
  if (logs.length === 0) return null;
  if (logs.length === 1) return 0;
  const first = Math.min(...logs.map(e => e.at));
  const last  = Math.max(...logs.map(e => e.at));
  return last - first;
}
function summaryDateStr() {
  return new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
}
function getTotalDuration() {
  const perf = ledger.filter(e => e.kind === "set" && e.at);
  if (perf.length === 0) return null;
  const lastTs = Math.max(...perf.map(e => e.at));
  // Preferred: the Start Workout tap recorded the real session start.
  if (workoutStartTime) return lastTs - workoutStartTime;
  // Fallback for sessions restored from before pre-start existed: estimate
  // set 1's duration from the average gap between that exercise's sets.
  if (perf.length < 2) return null;
  const raw = lastTs - Math.min(...perf.map(e => e.at));
  const chron = perf.slice().sort((a, b) => a.at - b.at);
  const firstExId = chron[0].exId;
  const firstExLogs = perf.filter(e => e.exId === firstExId).sort((a, b) => a.set - b.set);
  if (firstExLogs.length < 2) return raw;
  let gapSum = 0;
  for (let i = 1; i < firstExLogs.length; i++) {
    gapSum += firstExLogs[i].at - firstExLogs[i - 1].at;
  }
  const avgGap = gapSum / (firstExLogs.length - 1);
  return raw + avgGap;
}
const DIFFICULTY_LABELS = ['', 'EASY', 'LIGHT', 'MOD', 'HARD', 'MAX'];
function formatDifficulty(log) {
  return (log && log.difficulty) ? ' [' + DIFFICULTY_LABELS[log.difficulty] + ']' : '';
}
// User-typed notes go into innerHTML -- a note with "<" (e.g. "<10 clean")
// swallowed the rest of the summary as a bogus tag.
function escapeHTML(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
// Weight tag for a set whose load differed from the header prescription
// (auto-drop or structural drop) -- without it the summary claimed every set
// was at the header weight (7/2's "were S3/S4 at 120 or 100?" ambiguity).
// Weight tag for a set whose load differed from the header prescription. Reads
// the FROZEN ledger value, so the tag reports the weight that set was actually
// performed at and nothing he types afterwards can move it.
function setDropTag(exIdx, setIdx) {
  const e = logAt(exIdx, setIdx);
  return (e && e.dropped && e.weightLbs != null) ? " @ " + e.weightLbs : "";
}
// Session totals: logged sets + tonnage at the weights actually lifted -- the
// two numbers a hypertrophy block trends session-over-session. Tonnage is
// summed from frozen per-entry weights, NOT recomputed: the old version called
// effectiveWeight() per log, which re-ran the drop predicate over the editable
// reps, so correcting one set's rep count could silently rewrite an earlier
// set's weight and change a total for work already done.
function sessionTotals() {
  let volume = 0;
  let anyWeight = false;
  const perf = ledger.filter(e => e.kind === "set");
  perf.forEach(e => {
    const reps = Number(e.reps) || 0;
    const w = Number(e.weightLbs);
    if (reps > 0 && isFinite(w) && w > 0) { volume += reps * w; anyWeight = true; }
  });
  return { sets: perf.length, volume: anyWeight ? Math.round(volume) : null };
}
// The ledger in performance order. The per-exercise block below is the shape
// the tracker parses and it prints PRESCRIPTION order -- which after a reorder
// (and, from commit D, after free navigation) is not the order he trained in.
// One line fixes that without touching the parsed format.
function chronologyLine() {
  const perf = ledger.filter(e => e.kind === "set").slice().sort((a, b) => a.n - b.n);
  if (perf.length < 2) return "";
  return "Order: " + perf.map(e => {
    const ex = exById(e.exId);
    const tag = ex ? (ex.short || ex.name) : e.exId;
    return String(tag).toUpperCase().replace(/\s+/g, "") + e.set;
  }).join(" ");
}
function totalLineText() {
  const parts = [];
  const total = getTotalDuration();
  if (total) parts.push(formatDuration(total));
  const t = sessionTotals();
  if (t.sets) parts.push(t.sets + " sets");
  if (t.volume) parts.push(t.volume.toLocaleString('en-US') + " lb");
  return parts.length ? "Total: " + parts.join(" · ") : "";
}
function buildSummary() {
  let text = dayType + " -- " + summaryDateStr() + "\n";
  const chron = chronologyLine();
  if (chron) text += chron + "\n";
  text += "\n";
  for (let i = 0; i < workout.length; i++) {
    const ex = workout[i];
    const dur = getExerciseDuration(i);
    text += ex.name + " @ " + ex.weight;
    if (dur && dur > 0) text += "  (" + formatDuration(dur) + ")";
    text += "\n";
    for (let j = 0; j < ex.sets; j++) {
      const log = logAt(i, j);
      if (log) {
        const diff = formatDifficulty(log);
        const note = log.note ? " -- " + log.note : "";
        text += "  S" + (j + 1) + ": " + log.reps + " reps" + setDropTag(i, j) + diff + note + "\n";
      } else {
        text += "  S" + (j + 1) + ": -\n";
      }
    }
    // Total-rep volume (the tracker's volume-PR currency) + a banked trigger
    // called out explicitly so the advance never rests on recall.
    const exLogs = performedOf(ex.id);
    if (exLogs.length) {
      text += "  total " + exLogs.reduce((a, l) => a + (Number(l.reps) || 0), 0) + " reps\n";
    }
    if (exerciseTriggerHit(i)) {
      text += "  TRIGGER HIT -> " + (ex.triggerWeight || "advance") + " next session\n";
    }
    if (i < workout.length - 1) text += "\n";
  }
  const totalLine = totalLineText();
  if (totalLine) text += "\n" + totalLine + "\n";
  return text;
}
function buildSummaryHTML() {
  let html = '<div class="exercise-header">' + dayType + ' -- ' + summaryDateStr() + '</div>';
  const chron = chronologyLine();
  if (chron) html += '<div class="set-line">' + escapeHTML(chron) + '</div>';
  html += '<br>';
  for (let i = 0; i < workout.length; i++) {
    const ex = workout[i];
    const dur = getExerciseDuration(i);
    let header = ex.name + ' @ ' + ex.weight;
    let durTag = (dur && dur > 0) ? ' <span class="duration-tag">(' + formatDuration(dur) + ')</span>' : '';
    html += '<div class="exercise-header">' + header + durTag + '</div>';
    for (let j = 0; j < ex.sets; j++) {
      const log = logAt(i, j);
      if (log) {
        const diff = formatDifficulty(log);
        const note = log.note ? ' -- ' + escapeHTML(log.note) : '';
        html += '<div class="set-line">S' + (j + 1) + ': <span class="set-note">' + log.reps + ' reps' + setDropTag(i, j) + diff + note + '</span></div>';
      } else {
        html += '<div class="set-line">S' + (j + 1) + ': -</div>';
      }
    }
    const exLogs = performedOf(ex.id);
    if (exLogs.length) {
      html += '<div class="sum-reps">total ' + exLogs.reduce((a, l) => a + (Number(l.reps) || 0), 0) + ' reps</div>';
    }
    if (exerciseTriggerHit(i)) {
      html += '<div class="sum-trigger">TRIGGER HIT &rarr; ' + escapeHTML(ex.triggerWeight || 'advance') + ' next session</div>';
    }
    if (i < workout.length - 1) html += '<br>';
  }
  const totalLine = totalLineText();
  if (totalLine) html += '<div class="total-line">' + escapeHTML(totalLine) + '</div>';
  return html;
}

// ============ §16 PERSISTENCE ============
function saveState() {
  // A finished session must never persist: a save deferred past
  // finishWorkout's wipe (rAF race) would resurrect a dead state on reload.
  if (state === "finished") {
    try { localStorage.removeItem("gym-timer-state"); } catch(e) {}
    return;
  }
  const s = {
    v: 8,
    savedAt: Date.now(),
    // planHash is the tier-1 guard: it changes whenever any field a restored
    // ledger depends on changes (sets, weight, reps, rest, backoff, ids). dayKey
    // only ever caught a Lower->Upper flip, so a nightly weight tweak restored
    // silently into a plan that no longer matched.
    planHash: planHash(),
    dayType: dayType,
    ledger: ledger.map(e => ({ ...e })),
    ledgerSeq: ledgerSeq,
    pausedCumMs: pausedCumMs,
    pauseStartedAt: pauseStartedAt,
    workoutStartTime: workoutStartTime,
    // --- cursor engine: retired by commit D, still the nav model in A ---
    currentExercise, currentSet, viewingExercise, viewingSet,
    state, restEndTime, restRemaining, restTotalSeconds,
    repCount,
    notes: elNotesInput.value,
    countdownFiredThresholds: [...countdownFiredThresholds],
    dissolvedGroups: [...dissolvedGroups],
    // Persist any mid-session reorder so refreshes don't snap it back. By id
    // now; restore still accepts the v7 name list.
    workoutOrder: workout.map(ex => ex.id)
  };
  try { localStorage.setItem("gym-timer-state", JSON.stringify(s)); } catch(e) {}
}

// Tier 3. NEVER silently destroy a mid-session log: park the raw blob where it
// can be recovered by hand, then start clean. A workout that cannot be restored
// is still a workout that happened.
function stashOrphanState(raw) {
  try { localStorage.setItem("gym-timer-orphan-state", raw); } catch(e) {}
  try { localStorage.removeItem("gym-timer-state"); } catch(e) {}
}

// Reapply a saved drag-reorder BEFORE anything reads workout[]. Accepts the v8
// id list and the v7 name list.
function applySavedOrder(order) {
  if (!Array.isArray(order) || order.length !== workout.length) return;
  const byId = new Map(originalWorkout.map(ex => [ex.id, ex]));
  const byName = new Map(originalWorkout.map(ex => [ex.name, ex]));
  const reordered = order.map(k => byId.get(k) || byName.get(k));
  if (!reordered.every(ex => ex)) return;
  if (new Set(reordered).size !== reordered.length) return;
  workout.length = 0;
  reordered.forEach(ex => workout.push(ex));
}

// v7 -> v8 migration. v7 stored (exerciseIndex, 0-based set, reps, difficulty,
// note, timestamp) and no weight at all, so the weights are reconstructed ONCE,
// here, by replaying effectiveWeight() in set order exactly as the v7 build
// would have -- and then they are frozen like any other entry.
// This exists because the alternative is orphaning a live workout the moment
// this build lands on his phone mid-session, which is the one failure that
// actually costs him something.
function migrateV7Logs(oldLogs) {
  ledger.length = 0;
  ledgerSeq = 0;
  const chronRank = new Map();
  oldLogs.slice()
    .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0))
    .forEach((l, i) => chronRank.set(l, i + 1));
  for (let i = 0; i < workout.length; i++) {
    const ex = workout[i];
    let prev = null;
    for (let j = 0; j < ex.sets; j++) {
      const old = oldLogs.find(l => l.exercise === i && l.set === j);
      if (!old) continue;
      // effectiveWeight reads the ledger for sets 0..j-1, which are already
      // pushed, so the sticky-drop replay sees exactly the history v7 saw.
      const eff = effectiveWeight(i, j);
      const effNum = (eff.num == null) ? NaN : parseFloat(eff.num);
      const prescribed = parseFloat((String(ex.weight || "").match(/(\d+(?:\.\d+)?)/) || [])[1]);
      const at = old.timestamp || Date.now();
      const entry = {
        kind: "set",
        n: chronRank.get(old) || (ledger.length + 1),
        exId: ex.id,
        set: j + 1,
        reps: old.reps,
        difficulty: (old.difficulty == null ? null : old.difficulty),
        note: old.note || "",
        weightLbs: isFinite(effNum) ? effNum : null,
        prescribedLbs: isFinite(prescribed) ? prescribed : null,
        dropped: !!eff.dropped,
        pairId: null,
        restPlannedSec: ex.rest || null,
        restActualSec: (prev && prev.at && at) ? Math.max(0, Math.round((at - prev.at) / 1000)) : null,
        pausedCumMs: 0,
        at: at,
        editedAt: null,
        migratedFrom: "v7"
      };
      ledger.push(entry);
      prev = entry;
    }
  }
  ledgerSeq = ledger.reduce((m, e) => Math.max(m, e.n || 0), 0);
}

// Every entry must name an exercise this build has, at an ordinal this build
// allows. Fails closed: a ledger that does not fit the plan is not restored.
function ledgerFitsPlan() {
  return ledger.every(e => {
    const ex = exById(e.exId);
    return !!ex && Number.isFinite(e.set) && e.set >= 1 && e.set <= ex.sets;
  });
}
// THREE TIERS, fail-closed in order:
//   1. v8 blob whose planHash matches -> full restore.
//   2. Same dayType, ledger fits this plan -> LEDGER-ONLY restore. Safe
//      precisely BECAUSE weights are frozen per entry: a nightly weight tweak
//      cannot corrupt history, and identity keys mean order changes don't
//      matter. Session furniture (rest clock, unlinks) is dropped.
//   3. Anything else -> stash the raw blob and start fresh.
// A legacy v7 blob for the same day is a special case of tier 1: its config is
// this config (v8 only added ids), so it gets a full restore after migration.
function restoreState() {
  let raw = null;
  try { raw = localStorage.getItem("gym-timer-state"); } catch(e) { return false; }
  if (!raw) return false;

  let s;
  try { s = JSON.parse(raw); } catch(e) { stashOrphanState(raw); return false; }

  if (s.savedAt && (Date.now() - s.savedAt > STATE_TTL_MS)) {
    try { localStorage.removeItem("gym-timer-state"); } catch(e) {}
    return false;
  }
  if (s.state === "finished") {
    try { localStorage.removeItem("gym-timer-state"); } catch(e) {}
    return false;
  }

  const isV8 = (s.v === 8);
  const isLegacyV7 = !isV8 && Array.isArray(s.setLogs) && s.dayKey === dayType;

  // Tier 3 gate: this blob does not belong to today's plan at all.
  if (!isV8 && !isLegacyV7) { stashOrphanState(raw); return false; }
  if (isV8 && s.dayType !== dayType) { stashOrphanState(raw); return false; }

  try {
    applySavedOrder(s.workoutOrder);

    if (isV8) {
      if (!Array.isArray(s.ledger)) { stashOrphanState(raw); return false; }
      ledger.length = 0;
      s.ledger.forEach(e => ledger.push({ ...e }));
      ledgerSeq = (typeof s.ledgerSeq === 'number')
        ? s.ledgerSeq
        : ledger.reduce((m, e) => Math.max(m, e.n || 0), 0);
      pausedCumMs = (typeof s.pausedCumMs === 'number') ? s.pausedCumMs : 0;
      pauseStartedAt = (typeof s.pauseStartedAt === 'number') ? s.pauseStartedAt : null;
    } else {
      migrateV7Logs(s.setLogs);
      pausedCumMs = 0;
      pauseStartedAt = null;
    }

    if (!ledgerFitsPlan()) { ledger.length = 0; stashOrphanState(raw); return false; }

    workoutStartTime = (typeof s.workoutStartTime === 'number') ? s.workoutStartTime : null;

    const cursorOK =
      typeof s.currentExercise === 'number' && s.currentExercise >= 0 &&
      s.currentExercise < workout.length &&
      typeof s.currentSet === 'number' && s.currentSet >= 0 &&
      s.currentSet <= workout[s.currentExercise].sets;

    const fullRestore = cursorOK && (isLegacyV7 || s.planHash === planHash());

    if (fullRestore) {
      currentExercise = s.currentExercise;
      currentSet = s.currentSet;
      viewingExercise = (typeof s.viewingExercise === 'number') ? s.viewingExercise : currentExercise;
      viewingSet = (typeof s.viewingSet === 'number') ? s.viewingSet : currentSet;
      repCount = s.repCount || 10;
      state = s.state;
      restEndTime = s.restEndTime;
      restRemaining = s.restRemaining;
      restTotalSeconds = s.restTotalSeconds || s.restRemaining || 0;
      countdownFiredThresholds = new Set(s.countdownFiredThresholds || []);
      dissolvedGroups = new Set(Array.isArray(s.dissolvedGroups) ? s.dissolvedGroups : []);
      rebuildSequence();
      if (state === "resting" || state === "paused" || state === "finishing") {
        const lastLog = ledger.filter(e => e.kind === "set").slice(-1)[0];
        if (lastLog) currentLogEntry = lastLog;
      }
      applyState(s.notes || "");
      return true;
    }

    // TIER 2 -- the plan moved under a live session. Keep every logged set,
    // drop the session furniture, and put him back on the first machine that
    // still owes work.
    let landIdx = workout.findIndex(ex => remainingOf(ex.id) > 0);
    const noneLeft = (landIdx < 0);
    if (noneLeft) landIdx = workout.length - 1;
    currentExercise = landIdx;
    currentSet = noneLeft ? workout[landIdx].sets : entriesOf(workout[landIdx].id).length;
    viewingExercise = currentExercise;
    viewingSet = currentSet;
    repCount = getMaxReps(workout[landIdx].reps);
    state = noneLeft ? "finishing" : "ready";
    restEndTime = null;
    restRemaining = 0;
    restTotalSeconds = 0;
    countdownFiredThresholds = new Set();
    dissolvedGroups = new Set();
    pauseStartedAt = null;
    currentLogEntry = null;
    rebuildSequence();
    applyState("");
    try { console.warn("gym-timer: plan changed under a saved session - ledger restored, timer state reset"); } catch(e) {}
    return true;
  } catch(e) {
    ledger.length = 0;
    stashOrphanState(raw);
    return false;
  }
}

// ============ §17 LIFECYCLE + INIT ============
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) {}
}
function releaseWakeLock() {
  try { if (wakeLock) wakeLock.release(); } catch(e) {}
  wakeLock = null;
}

async function ensureNotifPermission() {
  if (!('Notification' in window)) return false;
  if (Notification.permission === 'granted') return true;
  if (Notification.permission === 'denied') return false;
  try {
    const r = await Notification.requestPermission();
    return r === 'granted';
  } catch (e) { return false; }
}
function scheduleRestNotif(ms) {
  cancelRestNotif();
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  restNotifTimer = setTimeout(() => {
    restNotifTimer = null;
    if (document.visibilityState !== 'visible') {
      try {
        new Notification("Rest done -- GO!", {
          body: workout[currentExercise].name + " set " + (currentSet + 1),
          tag: "gym-rest"
        });
      } catch(e) {}
    }
  }, ms);
}
function cancelRestNotif() {
  if (restNotifTimer) { clearTimeout(restNotifTimer); restNotifTimer = null; }
}

// Shared handler for tab-return + BFCache restore. iOS may have closed the
// AudioContext while backgrounded -- recover BEFORE any path below fires
// audio (the expired-rest restDone() call). Recovery kicks off async
// re-decoding; by the time the user looks at the timer and taps, it's done.
function handleResumeFromBackground() {
  recoverAudioCtx();
  if (state === "resting" && restEndTime) {
    const remaining = Math.ceil((restEndTime - Date.now()) / 1000);
    if (remaining <= 0) {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      restDone();
    } else {
      restRemaining = remaining;
      elTimer.textContent = formatTime(remaining);
      updateRestRing();
      // Threshold catch-up: cues whose trigger second passed while
      // backgrounded are suppressed (a late fire is a stale announcement).
      [60, 30, 10, 5, 4, 3, 2, 1].forEach(t => {
        if (t > remaining) countdownFiredThresholds.add(t);
      });
      // Re-arm the OS notification for the true remaining window -- iOS
      // clamps backgrounded setTimeout, so the one armed at setDone may have
      // fired into nothing or never fire (6/1 review finding).
      scheduleRestNotif(remaining * 1000);
      // Re-arm the keepalive (page reload mid-rest, or lost to a context
      // recreation). Idempotent.
      startAudioKeepalive();
    }
  }
  // Re-acquire in every ACTIVE state -- "ready" means he's mid-set with Set
  // Done pending; backgrounding released the lock and the screen would sleep.
  if (state !== "finished" && state !== "pre-start" && !wakeLock) {
    requestWakeLock();
  }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  handleResumeFromBackground();
});
// pageshow fires on BFCache restore (iOS back/forward, tab swipe-back).
// AudioContexts get closed in BFCache; without the rest-expiry catch-up here
// a restore during an expired rest left the timer stuck at the stale REST
// display until a tap.
window.addEventListener("pageshow", (e) => {
  if (e.persisted) handleResumeFromBackground();
});

// URL reset (?reset=1) wipes saved workout state, then strips the param so
// refreshes don't keep resetting.
if (new URLSearchParams(location.search).has('reset')) {
  try { localStorage.removeItem("gym-timer-state"); } catch(e) {}
  try { window.history.replaceState(null, '', location.pathname); } catch(e) {}
}

elSkip.style.display = "none";
showRestRing(false);
applySettingsToggles();
VoiceCue.init();
attachGlobalAudioRecovery();
if (!restoreState()) {
  // Fresh load (no saved state, or TTL expired): pre-start. The Start tap
  // unlocks audio on iOS, plays the day cue, and records workoutStartTime.
  state = "pre-start";
  applyState("");
}
// Center the dial after initial layout settles, and on any resize.
requestAnimationFrame(centerMainButton);
setTimeout(centerMainButton, 50);
window.addEventListener("resize", centerMainButton);
window.addEventListener("orientationchange", () => setTimeout(centerMainButton, 100));

// ============ §17.5 SELFTEST (?selftest=1) ============
// WHY THIS EXISTS AND WHY IT ASSERTS THE DOM.
// The standing guard for injury constraints (CLAUDE.md Obs 389) greps the built
// file for the safety text. That check PASSED for the entire life of the bug it
// was written to catch: the text was present in setNotes the whole time. The
// failure was at RENDER time -- advisor output outranked the static note once
// the prior set was graded -- and a file-level grep is structurally blind to
// that. So this renders into the LIVE DOM, with the advisor branches actually
// firing, and reads back what is on the screen.
//
// It restores whatever it disturbed and never writes localStorage.
const SAFETY_REQUIRED = ["leg-press", "lying-leg-curl", "leg-press-calf-raises"];

function runSelfTest() {
  const failures = [];
  const checks = [];
  function assert(ok, label) { checks.push(label); if (!ok) failures.push(label); }

  // Snapshot everything the run mutates.
  const savedLedger = ledger.map(e => ({ ...e }));
  const savedSeq = ledgerSeq;
  const saved = { currentExercise, currentSet, viewingExercise, viewingSet, state };

  function seedFakeLedger(exId, count, grade) {
    ledger.length = 0;
    const ex = exById(exId);
    const lo = parseInt((String(ex.reps || "").match(/(\d+)/) || [])[1], 10) || 8;
    for (let i = 0; i < count; i++) {
      ledger.push({
        kind: "set", n: i + 1, exId: exId, set: i + 1, reps: lo, difficulty: grade,
        note: "", weightLbs: 100, prescribedLbs: 100, dropped: false, pairId: null,
        restPlannedSec: ex.rest || null, restActualSec: null, pausedCumMs: 0,
        at: 1000 * (i + 1), editedAt: null
      });
    }
  }

  try {
    state = "ready";
    // --- 1. SAFETY SURVIVES EVERY ADVISOR BRANCH, IN THE DOM ---
    // grade 5 = MAX at the rep floor -> the drop branch fires.
    // grade 2 = LIGHT -> the room-left branch fires.
    // Both make the advisor own #exercise-note, which is the state the bug lived in.
    for (const ex of workout) {
      const exIdx = exIdxOf(ex.id);
      for (let s = 1; s <= ex.sets; s++) {
        for (const grade of [5, 2]) {
          seedFakeLedger(ex.id, s - 1, grade);
          currentExercise = exIdx; currentSet = s - 1;
          viewingExercise = exIdx; viewingSet = s - 1;
          renderExercise();
          const bannerTxt = elSafety ? elSafety.textContent : "";
          const noteTxt = elNote ? elNote.textContent : "";
          if (ex.safety) {
            assert(bannerTxt.indexOf(ex.safety) >= 0,
                   ex.id + " S" + s + " grade=" + grade + ": safety missing from DOM");
            // Double-print check: the v7b prefix must be gone, or he reads the
            // same hard stop twice and the note card shrinks to fit it.
            assert(noteTxt.indexOf(ex.safety) < 0,
                   ex.id + " S" + s + " grade=" + grade + ": safety duplicated into note card");
          } else {
            assert(bannerTxt === "", ex.id + " S" + s + ": banner not cleared for a safety-free exercise");
          }
        }
      }
    }

    // --- 2. THE CONSTRAINTS THAT MUST EXIST AT ALL ---
    // A build that quietly drops the 90-degree cap or the medial-thigh hard
    // stop passes every render assert above, because there is nothing to render.
    for (const id of SAFETY_REQUIRED) {
      const ex = exById(id);
      if (!ex) continue;   // not in today's config (e.g. an Upper day)
      assert(!!ex.safety && String(ex.safety).trim().length > 0,
             id + ": is in SAFETY_REQUIRED but has an empty safety field");
    }

    // --- 3. IDENTITY + PLAN HASH ---
    const ids = workout.map(ex => ex.id);
    assert(ids.every(Boolean), "every exercise has an id");
    assert(new Set(ids).size === ids.length, "exercise ids are unique: " + ids.join(","));
    assert(planHashGoldenOK === true, "planHash golden vector drifted");

    // --- 4. AUDIO CLIP RESOLUTION ---
    // A missing alias fails SILENTLY by design (null clip, cue skipped), which
    // is how the ONE exercise with a nerve history went unannounced for ~10
    // builds. Silence is fine; unnoticed silence is not.
    for (const ex of workout) {
      assert(!!(ex.clip || exerciseClipName(ex.name)),
             ex.id + ': no audio clip resolves for "' + ex.name + '"');
    }

    // --- 5. LEDGER INVARIANTS ---
    ledger.length = 0;
    ledgerSeq = 0;
    const a = workout[0];
    ledger.push({ kind: "set", n: 1, exId: a.id, set: 1, reps: 10, difficulty: 5, note: "",
      weightLbs: 190, prescribedLbs: 190, dropped: false, pairId: null,
      restPlannedSec: a.rest, restActualSec: null, pausedCumMs: 0, at: 1, editedAt: null });
    ledger.push({ kind: "set", n: 2, exId: a.id, set: 2, reps: 8, difficulty: 5, note: "",
      weightLbs: 175, prescribedLbs: 190, dropped: true, pairId: null,
      restPlannedSec: a.rest, restActualSec: 160, pausedCumMs: 0, at: 2, editedAt: null });
    const handSum = 10 * 190 + 8 * 175;
    assert(sessionTotals().volume === handSum,
           "sessionTotals tonnage " + sessionTotals().volume + " != hand sum " + handSum);
    assert(sessionTotals().sets === 2, "sessionTotals set count");
    // The freeze itself: editing reps must not move the weight the set was done at.
    ledger[0].reps = 20;
    assert(setDropTag(0, 1) === " @ 175",
           "frozen weight moved under a rep edit (got '" + setDropTag(0, 1) + "')");
    assert(chronologyLine().indexOf("Order:") === 0, "chronology line renders");

  } catch (e) {
    failures.push("selftest threw: " + (e && e.message ? e.message : String(e)));
  }

  // Restore. The selftest must leave no trace -- he may be mid-workout.
  ledger.length = 0;
  savedLedger.forEach(e => ledger.push(e));
  ledgerSeq = savedSeq;
  currentExercise = saved.currentExercise; currentSet = saved.currentSet;
  viewingExercise = saved.viewingExercise; viewingSet = saved.viewingSet;
  state = saved.state;
  try { renderExercise(); } catch (e) {}

  showSelfTestOverlay(failures, checks.length);
}

function showSelfTestOverlay(failures, total) {
  const pass = (failures.length === 0);
  const box = document.createElement("div");
  box.id = "selftest-overlay";
  box.setAttribute("data-selftest", pass ? "PASS" : "FAIL");
  box.style.cssText =
    "position:fixed;inset:0;z-index:9999;overflow:auto;padding:16px;" +
    "background:rgba(11,11,12,0.97);color:#f0efec;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;";
  const head = document.createElement("div");
  head.style.cssText = "font-size:15px;font-weight:700;margin-bottom:10px;letter-spacing:1px;color:" +
    (pass ? "#f0efec" : "#e0584a") + ";";
  head.textContent = pass ? ("SELFTEST PASS  (" + total + " asserts)")
                          : ("SELFTEST FAIL  " + failures.length + "/" + total);
  box.appendChild(head);
  (pass ? ["all asserts green"] : failures).forEach(line => {
    const d = document.createElement("div");
    d.style.cssText = "margin-bottom:5px;padding-left:10px;border-left:2px solid " +
      (pass ? "#2a2a2e" : "#e0584a") + ";";
    d.textContent = line;
    box.appendChild(d);
  });
  const hint = document.createElement("div");
  hint.style.cssText = "margin-top:14px;color:#6a6a6e;";
  hint.textContent = "tap to dismiss";
  box.appendChild(hint);
  box.addEventListener("click", () => { try { box.remove(); } catch (e) {} });
  document.body.appendChild(box);
}

try {
  if (new URLSearchParams(location.search).has('selftest')) runSelfTest();
} catch (e) {}

// ============ §18 VISUAL FX OBSERVER ============
// Presentation only: watches text/class changes and pulses fx-* classes.
// Never reads or changes workout state, timing, audio, storage, or controls.
(function () {
  const timer = document.getElementById("timer-display");
  const mainButton = document.getElementById("main-btn");
  const buttonWrap = document.getElementById("btn-wrap");
  const progress = document.getElementById("progress");
  if (!timer || !mainButton || !buttonWrap || !progress) return;

  const cleanupTimers = new WeakMap();
  function pulse(node, className, duration) {
    const oldTimer = cleanupTimers.get(node);
    if (oldTimer) clearTimeout(oldTimer);
    node.classList.remove(className);
    node.classList.add(className);
    cleanupTimers.set(node, setTimeout(function () {
      node.classList.remove(className);
      cleanupTimers.delete(node);
    }, duration));
  }

  let timerText = timer.textContent;
  function syncTimer() {
    const nextText = timer.textContent;
    if (nextText !== timerText) {
      if (timerText) pulse(timer, "fx-tick", 180);
      timerText = nextText;
    }
    const parts = /^(\d+):(\d{2})$/.exec(nextText);
    const seconds = parts ? (Number(parts[1]) * 60 + Number(parts[2])) : NaN;
    const finalCountdown = buttonWrap.classList.contains("show-ring") &&
      Number.isFinite(seconds) && seconds > 0 && seconds <= 10;
    buttonWrap.classList.toggle("fx-final10", finalCountdown);
  }

  let controlKey = "";
  function syncControl() {
    const nextKey = mainButton.className + "|" + mainButton.textContent + "|" +
      String(buttonWrap.classList.contains("show-ring")) + "|" +
      String(buttonWrap.classList.contains("paused"));
    if (controlKey && nextKey !== controlKey) pulse(buttonWrap, "fx-shift", 180);
    controlKey = nextKey;
  }

  new MutationObserver(syncTimer).observe(timer, {
    childList: true,
    characterData: true,
    subtree: true
  });

  new MutationObserver(syncControl).observe(mainButton, {
    attributes: true,
    childList: true,
    characterData: true,
    subtree: true
  });

  new MutationObserver(syncControl).observe(buttonWrap, {
    attributes: true,
    attributeFilter: ["class"]
  });

  new MutationObserver(function () {
    pulse(progress, "fx-rail", 220);
  }).observe(progress, { childList: true });

  syncTimer();
  syncControl();
}());
</script>
