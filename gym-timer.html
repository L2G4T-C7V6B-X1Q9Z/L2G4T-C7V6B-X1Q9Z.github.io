        dot.classList.add("cursor");
      }
      dotsRow.appendChild(dot);
    }
    const label = document.createElement("div");
    label.className = "exercise-label";
    if (i === currentExercise) label.classList.add("active");
    else if (maxPos < seqIndex) label.classList.add("completed");
    label.textContent = workout[i].name;
    group.appendChild(label);
    group.appendChild(dotsRow);
    if (gid) {
      if (firstMemberOfGroup(gid) === i) {
        const un = document.createElement("button");
        un.className = "ss-unlink";
        un.type = "button";
        un.textContent = "unlink";
        un.setAttribute("aria-label", "Dissolve superset " + gid);
        // Keep the tap out of the drag-reorder + dot-tap delegation.
        un.addEventListener("pointerdown", ev => ev.stopPropagation());
        un.addEventListener("pointerup", ev => ev.stopPropagation());
        un.addEventListener("click", ev => { ev.stopPropagation(); dissolveGroup(gid); });
        group.appendChild(un);
      }
    }
    elProgress.appendChild(group);
  }
}

// Re-render JUST the note + weight line. Cheaper than renderExercise() and
// non-disruptive to layout. Called from rep-picker onChange + the difficulty
// handler so set N's advice updates live as the user grades set N-1.
function refreshSetNote() {
  const exIdx = isBrowsing() ? viewingExercise : currentExercise;
  const setIdx = isBrowsing() ? viewingSet : currentSet;
  // Weight refreshes too: grading the prior set can flip the upcoming set to
  // a reactive drop, and the loaded weight must track that live.
  elSet.innerHTML = setInfoHTML(exIdx, setIdx);
  const info = computeSetNoteInfo(exIdx, setIdx);
  elNote.textContent = info.text;
  elNote.classList.toggle("advisor", info.advisor);
  fitNoteToBox();
}

function renderExercise() {
  // Browsing shows the viewed set's context; otherwise the working set's.
  const exIdx = isBrowsing() ? viewingExercise : currentExercise;
  let setIdx = isBrowsing() ? viewingSet : currentSet;
  const ex = workout[exIdx];
  // Finishing state: currentSet already ran past the last index (setDone
  // increments before detecting the end) -- unclamped, a browse-and-return
  // on the finish screen renders "Set 5/4".
  if (state === "finishing" && setIdx >= ex.sets) setIdx = ex.sets - 1;
  elName.textContent = ex.name;
  elSet.innerHTML = setInfoHTML(exIdx, setIdx);
  const noteInfo = computeSetNoteInfo(exIdx, setIdx);
  elNote.textContent = noteInfo.text;
  elNote.classList.toggle("advisor", noteInfo.advisor);
  fitNoteToBox();
  renderProgress();
  requestAnimationFrame(centerMainButton);
}

// Auto-shrink long notes to the note card's ACTUAL height; 1-2 line notes
// keep the default size, only true 3+ line overflow steps down.
function fitNoteToBox() {
  if (!elNote) return;
  elNote.style.fontSize = '';
  elNote.style.lineHeight = '';
  if (!elNote.textContent) return;
  const maxHeight = elNote.clientHeight || 70;
  if (elNote.scrollHeight <= maxHeight) return;
  for (let fs = 18; fs >= 8; fs -= 0.5) {
    elNote.style.fontSize = fs + 'px';
    elNote.style.lineHeight = '1.22';
    if (elNote.scrollHeight <= maxHeight) return;
  }
  elNote.style.fontSize = '8px';
  elNote.style.lineHeight = '1.15';
}

function formatTime(seconds) {
  // Always ceil (handles floats from precise pause/resume math).
  const total = Math.max(0, Math.ceil(seconds));
  const m = Math.floor(total / 60);
  const s = total % 60;
  return `${m}:${s.toString().padStart(2, "0")}`;
}

// GO alert: restart the digit-nudge animation via class re-add.
function startFlash() {
  document.body.classList.remove('alert-flashing');
  void document.body.offsetWidth;
  document.body.classList.add('alert-flashing');
}
function stopFlash() {
  document.body.classList.remove('alert-flashing');
}

// Rest ring: arc + comet head track the remaining fraction.
function updateRestRing() {
  // While paused, restEndTime is frozen in the past -- the live value is the
  // captured restRemaining. Without this branch, a reload while paused
  // rendered the ring EMPTY instead of the paused fraction.
  let remaining;
  if (state === "paused" && restTotalSeconds) {
    remaining = Math.max(0, restRemaining);
  } else if (restEndTime && restTotalSeconds) {
    remaining = Math.max(0, (restEndTime - Date.now()) / 1000);
  } else {
    elRingBar.setAttribute("stroke-dashoffset", RING_CIRCUMFERENCE);
    if (elRingHead) elRingHead.setAttribute("r", "0");
    return;
  }
  const fraction = Math.max(0, Math.min(1, remaining / restTotalSeconds));
  const offset = RING_CIRCUMFERENCE * (1 - fraction);
  elRingBar.setAttribute("stroke-dashoffset", offset);
  if (elRingHead) {
    const a = 2 * Math.PI * fraction;
    elRingHead.setAttribute("r", fraction > 0 ? "3.4" : "0");
    elRingHead.setAttribute("cx", (92 + 88 * Math.cos(a)).toFixed(2));
    elRingHead.setAttribute("cy", (92 + 88 * Math.sin(a)).toFixed(2));
  }
}
function showRestRing(show, paused) {
  elBtnWrap.classList.toggle("show-ring", !!show);
  elBtnWrap.classList.toggle("paused", !!paused);
}

// Timer display modes: t-final (red digits, last 10s of a rest) and
// t-elapsed (dim session chronograph). Countdown/transition writers clear
// them; the tickers re-apply what their state warrants.
function clearTimerModes() {
  elTimer.classList.remove("t-final");
  elTimer.classList.remove("t-elapsed");
}

// Session chronograph: under the bar (ready) and while logging the last set
// (finishing), the big display shows dim elapsed time instead of a dead
// "-:--". Countdown states own the display otherwise.
function updateElapsedDisplay() {
  if ((state === "ready" || state === "finishing") && workoutStartTime) {
    elTimer.textContent = formatTime((Date.now() - workoutStartTime) / 1000);
    elTimer.classList.add("t-elapsed");
    if (state === "ready" && !elTimerLabel.textContent) {
      elTimerLabel.textContent = "ELAPSED";
    }
  }
}
setInterval(updateElapsedDisplay, 1000);

// Pre-start footer: "21 SETS · ~35 MIN" -- walks the interleaved sequence and
// prices each transition the way the engine will run it (superset GO = free,
// filler→anchor = pair rest, boundary = 0/60s by the skip-rest setting).
function sessionPlanLabel() {
  const setCount = sequence.length;
  let restSum = 0;
  for (let i = 0; i < sequence.length - 1; i++) {
    const cur = sequence[i], nxt = sequence[i + 1];
    if (cur.ex === nxt.ex) { restSum += workout[cur.ex].rest || 0; continue; }
    const g = groupIdOf(cur.ex);
    const hop = g && groupIdOf(nxt.ex) === g;
    if (hop && slotOf(cur.ex) === 1) continue;
    if (hop) { restSum += workout[nxt.ex].rest || 0; continue; }
    if (!settings.skipExerciseRest) restSum += 60;
  }
  const est = Math.round((setCount * 45 + restSum) / 60);
  return setCount + " SETS · ~" + est + " MIN";
}

// Position the main dial so its vertical center sits at the midpoint of
// (timer-display bottom, difficulty-row top), from real rendered coordinates.
// Adaptive size: 184 down to a 104px tap-target floor -- at 375x667 the slot
// is smaller than any fixed size, so the dial shrinks to fit (7/5 layout
// hunt), stepping the label font down when compact.
function centerMainButton() {
  if (!elTimer || !elTimerLabel || !elDifficultyRow || !elBtnWrap || !elBtn) return;
  const labelRect = elTimerLabel.getBoundingClientRect();
  const diffRect = elDifficultyRow.getBoundingClientRect();
  // Anchor the slot bottom on the difficulty row when the log area is shown,
  // else on the bottom bar (pre-start hides the log area).
  const barRect = elBottomBar ? elBottomBar.getBoundingClientRect() : null;
  const anchorTop = (diffRect.height > 0) ? diffRect.top : (barRect ? barRect.top : 0);
  if (!anchorTop) return;
  const CLEAR_ABOVE = 24;
  const CLEAR_BELOW = 24;
  const MAX_BTN = 184;
  const MIN_BTN = 104;
  const slotTop = labelRect.bottom + CLEAR_ABOVE;
  const slotBottom = anchorTop - CLEAR_BELOW;
  const slotHeight = Math.max(0, slotBottom - slotTop);
  const btnH = Math.max(MIN_BTN, Math.min(MAX_BTN, slotHeight));
  if (btnH < 140) {
    elBtn.style.fontSize = "11px";
    elBtn.style.letterSpacing = "1px";
  } else {
    elBtn.style.fontSize = "";
    elBtn.style.letterSpacing = "";
  }
  elBtnWrap.style.width = btnH + "px";
  elBtnWrap.style.height = btnH + "px";
  elBtn.style.width = (btnH - 4) + "px";
  elBtn.style.height = (btnH - 4) + "px";
  const top = slotTop + (slotHeight - btnH) / 2;
  elBtnWrap.style.top = top + "px";
  elBtnWrap.style.transform = "translateX(-50%)";
  // Keep the NOW/SET pills centered on the dial (they float at its left).
  if (elPillsStack) elPillsStack.style.top = (top + btnH / 2) + "px";
}

// ============ §11 STATE MACHINE ============
function startCountdown() {
  if (timerInterval) clearInterval(timerInterval);
  updateRestRing();
  // 100ms updates = smooth ring without CSS transitions.
  timerInterval = setInterval(() => {
    const remaining = Math.max(0, (restEndTime - Date.now()) / 1000);
    if (remaining <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      updateRestRing();
      restDone();
    } else {
      restRemaining = remaining;
      const secCeil = Math.ceil(remaining);
      maybeFireCountdownCue(secCeil);
      elTimer.textContent = formatTime(secCeil);
      elTimer.classList.toggle("t-final", secCeil <= 10);
      updateRestRing();
    }
  }, 100);
}

// Render the UI for the current state. notesValue seeds the notes field
// (restore path); syncLogArea overrides per-branch values with the active
// log's data at the end.
function applyState(notesValue) {
  showRestRing(false, false);
  clearTimerModes();

  if (state === "resting" && restEndTime) {
    const remaining = Math.ceil((restEndTime - Date.now()) / 1000);
    if (remaining <= 0) {
      state = "alert";
      restEndTime = null;
      renderExercise();
      elTimer.textContent = "0:00";
      elTimerLabel.textContent = "GO";
      elBtn.textContent = "Start Set";
      elBtn.className = "go";
      elSkip.style.display = "none";
      elLogArea.style.display = "flex";
      startFlash();
      triggerAlertFeedback();
      // Restored into an already-expired rest: no user gesture yet, so a
      // play now would silent-fail -- queue for the first real tap.
      playOrQueue(restEndCueSeq());
    } else {
      restRemaining = remaining;
      renderExercise();
      elTimer.textContent = formatTime(remaining);
      elTimerLabel.textContent = "REST";
      elBtn.textContent = "Pause";
      elBtn.className = "resting";
      elSkip.style.display = "flex";
      elLogArea.style.display = "flex";
      repPicker.setValue(repCount);
      elNotesInput.value = notesValue;
      showRestRing(true, false);
      requestWakeLock();
      scheduleRestNotif(remaining * 1000);
      startCountdown();
    }
  } else if (state === "alert") {
    renderExercise();
    elTimer.textContent = "0:00";
    elTimerLabel.textContent = "GO";
    elBtn.textContent = "Start Set";
    elBtn.className = "go";
    elSkip.style.display = "none";
    elLogArea.style.display = "flex";
    elNotesInput.value = notesValue;
    startFlash();
    triggerAlertFeedback();
  } else if (state === "paused") {
    renderExercise();
    elTimer.textContent = formatTime(restRemaining);
    elTimerLabel.textContent = "PAUSED";
    elBtn.textContent = "Resume";
    elBtn.className = "paused";
    elSkip.style.display = "flex";
    elLogArea.style.display = "flex";
    repPicker.setValue(repCount);
    elNotesInput.value = notesValue;
    showRestRing(true, true);
    updateRestRing();
  } else if (state === "finishing") {
    renderExercise();
    elBtn.textContent = "Finish";
    elBtn.className = "go";
    elTimer.textContent = "-:--";
    elTimerLabel.textContent = "LOG YOUR LAST SET";
    elSkip.style.display = "none";
    elLogArea.style.display = "flex";
    repPicker.setValue(repCount);
    elNotesInput.value = notesValue;
  } else if (state === "ready") {
    renderExercise();
    elTimer.textContent = "-:--";
    elTimerLabel.textContent = "";
    elBtn.textContent = "Set Done";
    elBtn.className = "";
    elSkip.style.display = "none";
    elLogArea.style.display = "flex";
    elNotesInput.value = notesValue;
  } else if (state === "pre-start") {
    // Workout hasn't begun. The Start tap plays the day-name + first-exercise
    // audio, records workoutStartTime, and transitions to "ready".
    renderExercise();
    // Chronograph at zero + the session plan (set count, honest time estimate
    // priced off the interleave + rest config).
    elTimer.textContent = "0:00";
    elTimer.classList.add("t-elapsed");
    elTimerLabel.textContent = sessionPlanLabel();
    elBtn.textContent = "Start Workout";
    elBtn.className = "go";
    elSkip.style.display = "none";
    elLogArea.style.display = "none";
  } else {
    renderExercise();
  }
  // Disable the dial + show the return pills while browsing.
  if (isBrowsing()) {
    elBtn.style.opacity = '0.35';
    elBtn.style.pointerEvents = 'none';
    elReturnPill.classList.add('visible');
    elSetCurrentBtn.classList.add('visible');
    elBtn.classList.add('browsing');
    elLogArea.style.display = 'flex';
  } else {
    elBtn.style.opacity = '';
    elBtn.style.pointerEvents = '';
    elReturnPill.classList.remove('visible');
    elSetCurrentBtn.classList.remove('visible');
    elBtn.classList.remove('browsing');
    // Log area stays visible in non-finished states. Pre-start is excluded:
    // nothing exists to log yet, and an unconditional re-show would override
    // the pre-start branch's hide (7/5 layout hunt).
    if (state !== 'finished' && state !== 'pre-start') elLogArea.style.display = 'flex';
  }
  // Sync the log area with the active log entry (overrides the per-branch
  // repPicker/notes seeds above).
  if (elLogArea.style.display === 'flex') syncLogArea();
  updateElapsedDisplay();
}

// Pre-start → ready. Records the workout start (real set-1 duration, session
// chronograph anchor) and plays the day-type + first-exercise cue (the tap
// is the audio-unlock gesture on iOS).
function startWorkout() {
  workoutStartTime = Date.now();
  pendingPostGestureCues.length = 0;
  state = "ready";
  applyState("");
  saveState();
  const startClip = dayType.toLowerCase().includes("upper") ? 'start-upper' : 'start-lower';
  // First exercise = the sequence head (with supersets still the first
  // anchor, but a slot-2-first config would start elsewhere than workout[0]).
  const first = sequence[0] || { ex: 0, set: 0 };
  const firstEx = workout[first.ex];
  const firstExClip = exerciseClipName(firstEx && firstEx.name);
  const seq = [startClip, firstExClip].filter(Boolean);
  if (firstEx) {
    seq.push(...weightClipsFor(firstEx));
    const repClip = repRangeClipFor(firstEx.reps);
    if (repClip) seq.push(repClip);
  }
  if (seq.length) VoiceCue.playSequence(seq);
}

function setDone() {
  stopFlash();
  // Any announcement queued while audio was suspended (e.g. the rest-expiry
  // cue from a phone-in-pocket rest) is STALE -- the user just acted on the
  // state it described. Without this clear, the first tap after returning to
  // the tab replayed "rest complete, set N..." over the new "received" cue.
  pendingPostGestureCues.length = 0;
  // Read in-progress inputs BEFORE creating the new log entry so reps/
  // difficulty/notes set DURING the set carry over instead of getting
  // clobbered by defaults.
  const draftReps = repCount;
  const draftNote = elNotesInput.value || "";
  const selectedDiffBtn = elDifficultyRow.querySelector('.diff-btn.selected');
  // No difficulty tapped => MAX (5). Soren's call 2026-07-29. An UNGRADED set was
  // not neutral -- it silently DISABLED the load logic: the auto-drop predicate
  // reads `+last.difficulty || 0` (never HARD/MAX, so it cannot fire) and
  // computeSetNote's history walk BREAKS on `difficulty == null`. So a set he
  // simply forgot to grade turned off the very mechanism meant to protect him.
  // Defaulting to MAX fails SAFE: it assumes the set was maximal, so the drop
  // fires rather than leaving him grinding a load he can no longer hold.
  // The grade stays fully editable after the fact via the set pill.
  const DEFAULT_DIFF = 5;
  const draftDiff = selectedDiffBtn ? Number(selectedDiffBtn.dataset.diff) : DEFAULT_DIFF;
  captureLog();

  // Dedup: re-logging an already-logged (exercise,set) — e.g. after browsing
  // back via the ↓SET pill — must UPDATE that log, not push a second one.
  // Reads use setLogs.find (first match), so a duplicate would shadow the
  // correction: stale reps in the summary, the fresh edit unreachable.
  let logEntry = setLogs.find(l => l.exercise === currentExercise && l.set === currentSet);
  if (logEntry) {
    logEntry.reps = draftReps;
    logEntry.note = draftNote;
    logEntry.difficulty = draftDiff;
    logEntry.timestamp = Date.now();
  } else {
    logEntry = {
      exercise: currentExercise,
      set: currentSet,
      reps: draftReps,
      note: draftNote,
      difficulty: draftDiff,
      timestamp: Date.now()
    };
    setLogs.push(logEntry);
  }
  currentLogEntry = logEntry;

  const finishedExercise = currentExercise;
  const finishedSet = currentSet;
  // Exercise just completed its final set with the advance trigger banked →
  // celebrate (voice + dots pulse); the summary flags the advance.
  const bankedTrigger = (finishedSet === workout[finishedExercise].sets - 1) &&
    exerciseTriggerHit(finishedExercise);
  clearTimerModes();
  // SUPERSET ENGINE: advancement walks `sequence` (interleaved order), not
  // (exercise, set++). Sync first in case an external path (jump-to-set,
  // restore) moved the cursor without updating seqIndex.
  if (!sequence[seqIndex] || sequence[seqIndex].ex !== finishedExercise || sequence[seqIndex].set !== finishedSet) {
    syncSeqIndex();
  }
  const nextEntry = sequence[seqIndex + 1] || null;
  currentSet++;

  showLogArea();

  const isLastSet = !nextEntry;
  if (isLastSet) {
    viewingExercise = currentExercise;
    viewingSet = currentSet - 1;
    elBtn.textContent = "Finish";
    elBtn.className = "go";
    state = "finishing";
    elTimer.textContent = "-:--";
    elTimerLabel.textContent = "LOG YOUR LAST SET";
    elSkip.style.display = "none";
    showRestRing(false);
    renderProgress();
    if (bankedTrigger) pulseTriggerHit(finishedExercise);
    updateElapsedDisplay();
    VoiceCue.playSequence(bankedTrigger
      ? ['received', 'cue-trigger-hit', 'final-set-logged']
      : ['received', 'final-set-logged']);
    requestAnimationFrame(() => { saveState(); });
    return;
  }

  // Advance along the interleaved sequence.
  seqIndex++;
  currentExercise = nextEntry.ex;
  currentSet = nextEntry.set;

  // Keep the viewing cursor pinned to the working position.
  viewingExercise = currentExercise;
  viewingSet = currentSet;

  const switchingExercise = (finishedExercise !== currentExercise);
  const gFin = groupIdOf(finishedExercise);
  const supersetHop = switchingExercise && !!gFin && groupIdOf(currentExercise) === gFin;
  // Anchor (slot 1) → filler (slot 2): GO immediately -- the walk between
  // machines IS the transition (Soren's superset spec 7/6).
  const supersetGo = supersetHop && slotOf(finishedExercise) === 1;
  // Filler → anchor: the REAL pair rest (the upcoming anchor's full rest).
  const supersetReturn = supersetHop && !supersetGo;

  // IMMEDIATE hops: a superset GO (always), or an exercise boundary with the
  // skip-rest setting ON (Soren 7/5): no countdown, the voice announces the walk.
  if (supersetGo || (switchingExercise && !supersetHop && settings.skipExerciseRest)) {
    state = "ready";
    restEndTime = null;
    restRemaining = 0;
    restTotalSeconds = 0;
    // The old UP NEXT rest was an accidental double-tap guard at exercise
    // boundaries. Without it, a bounce-tap on Set Done would instantly log a
    // phantom S1 -- brief lockout instead.
    setDoneLockUntil = Date.now() + 900;
    elTimer.textContent = "-:--";
    elTimerLabel.textContent = supersetGo
      ? ("SUPERSET → " + (workout[currentExercise].short || workout[currentExercise].name).toUpperCase())
      : "";
    elBtn.textContent = "Set Done";
    elBtn.className = "";
    elSkip.style.display = "none";
    renderExercise();
    showRestRing(false);
    // Reset the log area to the NEW exercise's upcoming-set defaults (the
    // rested path does this at rest-end) -- otherwise the previous exercise's
    // just-logged set carried onto the next machine's screen (7/5 hunt).
    // Last-set corrections still work via the progress-dot edit modal.
    captureLog();
    syncLogArea();
    {
      const isFinalExercise = !sequence.slice(seqIndex + 1).some(e => e.ex !== currentExercise);
      const exClip = exerciseClipName(workout[currentExercise].name);
      // supersetGo: the finished exercise is NOT complete (more of its sets
      // pend in the interleave) -- no 'exercise-complete', keep the cue tight.
      const seq = supersetGo ? ['received'] : ['received', 'exercise-complete'];
      if (bankedTrigger) seq.splice(1, 0, 'cue-trigger-hit');
      seq.push(isFinalExercise ? 'final-exercise' : 'up-next');
      if (exClip) seq.push(exClip);
      // Weight/reps announce only on the exercise's FIRST set; re-announcing
      // every superset hop is noise.
      if (currentSet === 0) {
        seq.push(...weightClipsFor(workout[currentExercise]));
        const repClipSkip = repRangeClipFor(workout[currentExercise].reps);
        if (repClipSkip) seq.push(repClipSkip);
      }
      // A drop that just materialized for the upcoming set: state the new
      // weight now, while he's at the machine setting the pin.
      seq.push(...dropAnnounceClips(currentExercise, currentSet));
      VoiceCue.playSequence(seq);
    }
    if (bankedTrigger) pulseTriggerHit(finishedExercise);
    updateElapsedDisplay();
    requestAnimationFrame(() => {
      initAudio();
      requestWakeLock();
      saveState();
    });
    return;
  }

  elSkip.style.display = "flex";
  elSkip.style.pointerEvents = "auto";
  state = "resting";
  restRemaining = supersetReturn ? workout[currentExercise].rest
                : switchingExercise ? 60
                : workout[finishedExercise].rest;
  restTotalSeconds = restRemaining;
  restEndTime = Date.now() + restRemaining * 1000;
  elTimer.textContent = formatTime(restRemaining);
  elTimerLabel.textContent = (switchingExercise && !supersetReturn) ? "UP NEXT" : "REST";
  elBtn.textContent = "Pause";
  elBtn.className = "resting";
  renderExercise();
  // Re-render the set label AFTER the cursor advanced: the pre-advancement
  // showLogArea render can't know the header now shows a different exercise
  // than the log being edited (the superset-return "CALVES S1" tag case).
  renderSetLabel();
  showRestRing(true, false);
  countdownFiredThresholds = new Set();
  startCountdown();

  if (bankedTrigger) pulseTriggerHit(finishedExercise);

  // Voice: "Received" then branch (superset return / exercise switch / in-exercise rest).
  {
    let seq;
    if (supersetReturn) {
      // Back to the anchor after the filler set: where we're headed + the
      // pair rest. No 'exercise-complete' (the pair is mid-flight), no weight
      // re-announce (same weight all sets; announced at the anchor's S1).
      const exClip = exerciseClipName(workout[currentExercise].name);
      seq = ['received', 'up-next'];
      if (exClip) seq.push(exClip);
      seq.push(...dropAnnounceClips(currentExercise, currentSet));
      const pairRestClip = restClipForDuration(restRemaining);
      if (pairRestClip) seq.push(pairRestClip);
    } else if (switchingExercise) {
      const isFinalExercise = !sequence.slice(seqIndex + 1).some(e => e.ex !== currentExercise);
      const exClip = exerciseClipName(workout[currentExercise].name);
      seq = ['received', 'exercise-complete'];
      seq.push(isFinalExercise ? 'final-exercise' : 'up-next');
      if (exClip) seq.push(exClip);
      seq.push(...weightClipsFor(workout[currentExercise]));
      const repClipSwitch = repRangeClipFor(workout[currentExercise].reps);
      if (repClipSwitch) seq.push(repClipSwitch);
      const switchRestClip = restClipForDuration(restRemaining);
      if (switchRestClip) seq.push(switchRestClip);
    } else {
      const restClip = restClipForDuration(workout[finishedExercise].rest);
      seq = restClip ? ['received', restClip] : ['received'];
      // In-exercise rest: the drop the just-logged set may have triggered
      // applies to the very next set -- announce the backoff weight once.
      seq.push(...dropAnnounceClips(currentExercise, currentSet));
    }
    if (bankedTrigger) seq.splice(1, 0, 'cue-trigger-hit');
    VoiceCue.playSequence(seq);
  }

  // Defer non-critical work a frame so the UI updates immediately.
  requestAnimationFrame(() => {
    initAudio();
    requestWakeLock();
    ensureNotifPermission();
    scheduleRestNotif(Math.max(0, restEndTime - Date.now()));
    saveState();
  });
}

function restDone() {
  if (state !== "resting") return;
  cancelRestNotif();
  captureLog();
  clearTimerModes();
  showRestRing(false);

  if (settings.autoStart) {
    state = "ready";
    elTimer.textContent = "-:--";
    elTimerLabel.textContent = "GO";
    elBtn.textContent = "Set Done";
    elBtn.className = "";
    elSkip.style.display = "none";
    renderExercise();
  } else {
    state = "alert";
    elTimer.textContent = "0:00";
    elTimerLabel.textContent = "GO";
    elBtn.textContent = "Start Set";
    elBtn.className = "go";
    elSkip.style.display = "none";
    renderExercise();
  }
  elLogArea.style.display = "flex";
  syncLogArea();
  startFlash();
  updateElapsedDisplay();
  // If we landed here from visibilitychange with the context still suspended
  // (no gesture since tab-return), a play now would silent-fail and the cue
  // would be lost -- queue for the gesture-recovery drain instead.
  playOrQueue(restEndCueSeq());
  requestAnimationFrame(() => {
    triggerAlertFeedback();
    saveState();
  });
}

function pauseRest() {
  captureLog();
  pendingPostGestureCues.length = 0;
  cancelRestNotif();
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  // Capture EXACT remaining (float seconds) so resume doesn't round-up jump.
  restRemaining = Math.max(0, (restEndTime - Date.now()) / 1000);
  state = "paused";
  clearTimerModes();
  elBtn.textContent = "Resume";
  elBtn.className = "paused";
  elTimerLabel.textContent = "PAUSED";
  showRestRing(true, true);
  renderProgress();
  saveState();
  VoiceCue.cancel();
  VoiceCue.play('paused');
}

function resumeRest() {
  captureLog();
  state = "resting";
  elBtn.textContent = "Pause";
  elBtn.className = "resting";
  elTimerLabel.textContent = "REST";
  showRestRing(true, false);
  renderProgress();
  // Restart the clock IMMEDIATELY -- the old code deferred restEndTime until
  // the 'resumed' cue finished, and pausing again inside that window read the
  // stale (expired) restEndTime and zeroed the rest. The cue plays over the
  // running countdown.
  restEndTime = Date.now() + restRemaining * 1000;
  scheduleRestNotif(restRemaining * 1000);
  saveState();
  startCountdown();
  VoiceCue.cancel();
  VoiceCue.play('resumed');
}

function skipRest() {
  // Re-entry guard: the skip button defers this 160ms for its press
  // animation, so a rapid double-tap queued TWO calls -- the second re-ran
  // the whole transition. State has already moved on; bail.
  if (state !== "resting" && state !== "paused") return;
  VoiceCue.cancel();
  // A queued rest-expiry announcement is stale the moment he skips.
  pendingPostGestureCues.length = 0;
  cancelRestNotif();
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  captureLog();
  showRestRing(false);
  state = "ready";
  clearTimerModes();
  elTimer.textContent = "-:--";
  elTimerLabel.textContent = "";
  elBtn.textContent = "Set Done";
  elBtn.className = "";
  elSkip.style.display = "none";
  renderExercise();
  elLogArea.style.display = "flex";
  syncLogArea();
  updateElapsedDisplay();
  saveState();
  // Voice (Soren 7/4): a skip plays NOTHING. He tapped it -- he knows the
  // rest is over and the screen already shows what's next. User-initiated
  // actions get silence, not announcements.
}

function acknowledgeAlert() {
  captureLog();  // pin any pending reps/notes to the log entry
  stopFlash();
  // The queued cue (if any) IS this alert's announcement -- acting on it
  // makes it stale.
  pendingPostGestureCues.length = 0;
  state = "ready";
  clearTimerModes();
  elTimer.textContent = "-:--";
  elTimerLabel.textContent = "";
  elBtn.textContent = "Set Done";
  elBtn.className = "";
  renderExercise();
  updateElapsedDisplay();
  saveState();
}

function finishWorkout() {
  cancelRestNotif();
  releaseWakeLock();
  captureLog();
  hideLogArea();
  showRestRing(false);
  state = "finished";
  elDayTitle.style.display = "none";
  elName.style.display = "none";
  elSet.style.display = "none";
  elNote.style.display = "none";
  elTimer.style.display = "none";
  elTimerLabel.style.display = "none";
  elBtnWrap.style.display = "none";
  elSkip.style.display = "none";
  elProgress.style.display = "none";
  elReturnPill.classList.remove('visible');
  elSetCurrentBtn.classList.remove('visible');
  elSettingsBtn.style.display = "none";
  elDone.style.display = "block";
  document.body.classList.add('finished');
  elSummary.innerHTML = buildSummaryHTML();
  // Auto-copy the summary on finish (runs inside the Set-Done tap gesture, so
  // writeText has transient activation). The button stays as a fallback.
  try {
    navigator.clipboard.writeText(buildSummary()).then(() => {
      elCopy.textContent = "Copied ✓ (auto)";
      elCopy.className = "copied";
      setTimeout(() => { elCopy.textContent = "Copy Summary"; elCopy.className = ""; }, 2500);
    }).catch(() => {});
  } catch(e) {}
  // Insurance: the finished summary survives a closed tab (state is wiped
  // below, clipboard writes can fail). Retrievable from localStorage.
  try {
    localStorage.setItem("gym-timer-last-summary",
      JSON.stringify({ at: Date.now(), text: buildSummary() }));
  } catch(e) {}
  try { localStorage.removeItem("gym-timer-state"); } catch(e) {}
  VoiceCue.cancel();
  pendingPostGestureCues.length = 0;
  VoiceCue.play('workout-complete');
  if (_audioKeepaliveInterval) {
    clearInterval(_audioKeepaliveInterval);
    _audioKeepaliveInterval = null;
  }
}

// ============ §12 BROWSING CURSOR (tap-to-cycle) ============
function cycleView(exIdx, setIdx) {
  // Second tap on the already-viewed completed set opens the edit modal.
  if (viewingExercise === exIdx && viewingSet === setIdx && isBrowsing()) {
    const log = setLogs.find(l => l.exercise === exIdx && l.set === setIdx);
    if (log) { openEditModal(exIdx, setIdx); return; }
  }
  viewingExercise = exIdx;
  viewingSet = setIdx;
  renderExercise();
  elReturnPill.classList.toggle('visible', isBrowsing());
  elSetCurrentBtn.classList.toggle('visible', isBrowsing());
  if (isBrowsing()) {
    elBtn.style.opacity = '0.35';
    elBtn.style.pointerEvents = 'none';
    // Log area stays visible so the viewed set's reps/notes/diff are editable.
    elLogArea.style.display = 'flex';
    // Diagonal slash signals Set Done is inaccessible in view mode; the rest
    // timer keeps running internally.
    elBtn.classList.add('browsing');
  } else {
    elBtn.style.opacity = '';
    elBtn.style.pointerEvents = '';
    elBtn.classList.remove('browsing');
  }
  syncLogArea();
  saveState();
}

function returnToWorking() {
  viewingExercise = currentExercise;
  viewingSet = currentSet;
  renderExercise();
  elReturnPill.classList.remove('visible');
  elSetCurrentBtn.classList.remove('visible');
  elBtn.style.opacity = '';
  elBtn.style.pointerEvents = '';
  elBtn.classList.remove('browsing');
  if (state !== 'finished') {
    elLogArea.style.display = 'flex';
  } else {
    elLogArea.style.display = 'none';
  }
  syncLogArea();
  saveState();
}

// ============ §13 REORDER + BOARD TAPS ============
// Transform an exercise index across a splice(from,1) + splice(to,0,moved).
function transformExerciseIdx(ei, fromIdx, toIdx) {
  if (ei === fromIdx) return toIdx;
  if (fromIdx < ei && ei <= toIdx) return ei - 1;
  if (toIdx <= ei && ei < fromIdx) return ei + 1;
  return ei;
}

function reorderExercise(fromIdx, toIdx) {
  if (fromIdx === toIdx) return;
  if (fromIdx < 0 || fromIdx >= workout.length) return;
  if (toIdx < 0 || toIdx >= workout.length) return;

  VoiceCue.cancel();

  // The edit modal's editingLog reference survives a reorder (setLogs isn't
  // reordered, only log.exercise values remap), but a displayed exercise NAME
  // could go stale. Close to be safe.
  if (elEditModal.classList.contains("show")) closeEditModal();

  const moved = workout.splice(fromIdx, 1)[0];
  workout.splice(toIdx, 0, moved);

  // Remap every live exercise-index reference.
  const remap = (ei) => transformExerciseIdx(ei, fromIdx, toIdx);
  currentExercise = remap(currentExercise);
  viewingExercise = remap(viewingExercise);
  setLogs.forEach(l => { l.exercise = remap(l.exercise); });

  // Superset groups ride on the exercise objects (ss tags), which just moved:
  // re-derive the interleaved sequence and re-locate the working cursor.
  rebuildSequence();

  renderExercise();  // rerenders name/weight/reps + board
  saveState();
}

// Long-press (600ms) + wide touchStartThreshold keeps taps from triggering
// drag. GUARD: Sortable comes from a CDN -- at the gym (spotty signal /
// offline reload) that fetch can fail, and an unguarded Sortable.create THREW
// here, killing every statement below it: VoiceCue.init (zero audio all
// session), restoreState (lost mid-workout state), and the tap handlers.
// Degrade to "no drag-reorder" instead.
let sortable = null;
try {
  if (typeof Sortable !== 'undefined') {
    sortable = Sortable.create(elProgress, {
      animation: 180,
      easing: "cubic-bezier(0.2, 0, 0, 1)",
      delay: 600,
      delayOnTouchOnly: true,
      touchStartThreshold: 15,
      forceFallback: true,
      fallbackTolerance: 6,
      fallbackOnBody: false,
      direction: 'horizontal',
      draggable: '.exercise-group',
      ghostClass: "sortable-ghost",
      chosenClass: "sortable-chosen",
      dragClass: "sortable-drag",
      onChoose() {
        if (elEditModal.classList.contains("show") || elSettingsModal.classList.contains("show")) {
          sortable.option("disabled", true);
          queueMicrotask(() => sortable.option("disabled", false));
          return;
        }
        document.body.classList.add("dragging-exercise");
      },
      onEnd(evt) {
        setTimeout(() => document.body.classList.remove("dragging-exercise"), 50);
        const from = evt.oldIndex;
        const to = evt.newIndex;
        if (from == null || to == null || from === to) return;
        reorderExercise(from, to);
      },
    });
  }
} catch (e) {}

// Tap-to-cycle via RAW touch events (bypasses SortableJS's click suppression
// on iOS). Click fallback for desktop. lastTouchTapTime dedupes the synthetic
// click iOS generates after touchend.
let tapStart = null;
let lastTouchTapTime = 0;

function handleTap(target) {
  if (!target) return false;
  if (document.body.classList.contains("dragging-exercise")) return false;
  if (elEditModal.classList.contains("show") || elSettingsModal.classList.contains("show")) return false;

  // Dot tap → jump to that exact set (or return to working when tapping the
  // active dot while browsing).
  const dotEl = (target.classList && target.classList.contains("dot"))
    ? target
    : (target.closest ? target.closest(".dot") : null);
  if (dotEl && dotEl.dataset && dotEl.dataset.exerciseIdx != null) {
    const exIdx = Number(dotEl.dataset.exerciseIdx);
    const setIdx = Number(dotEl.dataset.setIdx);
    if (!Number.isFinite(exIdx) || !Number.isFinite(setIdx)) return false;
    if (exIdx === currentExercise && setIdx === currentSet && isBrowsing()) {
      returnToWorking();
    } else {
      cycleView(exIdx, setIdx);
    }
    return true;
  }

  const group = target.closest ? target.closest(".exercise-group") : null;
  if (!group || !elProgress.contains(group)) return false;
  const exIdx = Number(group.dataset.exerciseIdx);
  if (!Number.isFinite(exIdx)) return false;
  if (exIdx === viewingExercise) {
    const ex = workout[exIdx];
    const nextSet = (viewingSet + 1) % ex.sets;
    cycleView(exIdx, nextSet);
  } else {
    cycleView(exIdx, 0);
  }
  return true;
}

elProgress.addEventListener("touchstart", (e) => {
  if (e.touches.length !== 1) { tapStart = null; return; }
  const t = e.touches[0];
  tapStart = { x: t.clientX, y: t.clientY, time: Date.now(), target: e.target };
}, { passive: true });

elProgress.addEventListener("touchmove", (e) => {
  if (!tapStart) return;
  const t = e.touches[0];
  if (!t) return;
  if (Math.abs(t.clientX - tapStart.x) > 15 || Math.abs(t.clientY - tapStart.y) > 15) {
    tapStart = null;  // scrolling/dragging, not a tap
  }
}, { passive: true });

elProgress.addEventListener("touchend", (e) => {
  if (!tapStart) return;
  const info = tapStart;
  tapStart = null;
  if (Date.now() - info.time > 700) return;
  if (e.changedTouches && e.changedTouches[0]) {
    const t = e.changedTouches[0];
    if (Math.abs(t.clientX - info.x) > 15 || Math.abs(t.clientY - info.y) > 15) return;
  }
  if (handleTap(info.target)) {
    lastTouchTapTime = Date.now();
    // Best-effort: suppress the synthetic click iOS generates next.
    try { e.preventDefault(); } catch (_) {}
  }
}, { passive: false });

elProgress.addEventListener("touchcancel", () => { tapStart = null; }, { passive: true });

// Desktop mouse fallback; skip the synthetic click after a processed touch tap.
elProgress.addEventListener("click", (e) => {
  if (Date.now() - lastTouchTapTime < 500) return;
  handleTap(e.target);
});

// Block the iOS long-press text-selection callout without affecting taps/drags.
elProgress.addEventListener("contextmenu", (e) => e.preventDefault());

// ============ §14 MODALS + INPUT HANDLERS ============
function openEditModal(exerciseIdx, setIdx) {
  const log = setLogs.find(l => l.exercise === exerciseIdx && l.set === setIdx);
  if (!log) return;
  editingLog = log;
  editRepCount = log.reps;
  elEditExercise.textContent = workout[exerciseIdx].name;
  // Show the weight THIS set was actually done at -- a set done at the
  // backoff used to display the header prescription here.
  const editEff = effectiveWeight(exerciseIdx, setIdx);
  elEditSet.textContent = "Set " + (setIdx + 1) + " · " +
    (editEff.dropped ? editEff.num + " lbs (dropped)" : workout[exerciseIdx].weight);
  elEditNotes.value = log.note || "";
  elEditModal.classList.add("show");
  // Picker scrollLeft only behaves once the modal is laid out (display:none →
  // visible). Defer one frame so rects are real before positioning the strip.
  requestAnimationFrame(() => editRepPicker.setValue(editRepCount));
}
function closeEditModal() {
  elEditModal.classList.remove("show");
  editingLog = null;
}
elEditCancel.addEventListener("click", closeEditModal);
elEditSave.addEventListener("click", () => {
  if (editingLog) {
    editingLog.reps = editRepCount;
    editingLog.note = elEditNotes.value.trim();
    saveState();
  }
  closeEditModal();
});
elEditModal.addEventListener("click", (e) => {
  if (e.target === elEditModal) closeEditModal();
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (elNoteModal.classList.contains("show")) closeNoteModal();
  else if (elEditModal.classList.contains("show")) closeEditModal();
  else if (elSettingsModal.classList.contains("show")) closeSettings();
});

function applySettingsToggles() {
  elToggleAutoStart.classList.toggle("on", !!settings.autoStart);
  elToggleAutoStart.setAttribute("aria-checked", !!settings.autoStart);
  elToggleSkipRest.classList.toggle("on", !!settings.skipExerciseRest);
  elToggleSkipRest.setAttribute("aria-checked", !!settings.skipExerciseRest);
  elToggleVoice.classList.toggle("on", !!settings.voice);
  elToggleVoice.setAttribute("aria-checked", !!settings.voice);
}
function openSettings() {
  applySettingsToggles();
  elSettingsModal.classList.add("show");
}
function closeSettings() {
  elSettingsModal.classList.remove("show");
}
elSettingsBtn.addEventListener("click", openSettings);
elSettingsClose.addEventListener("click", closeSettings);
elSettingsReset.addEventListener("click", () => {
  // Single-tap reset -- no confirm step. The modal is buried behind the gear
  // icon, so an accidental tap is already two clicks deep.
  VoiceCue.cancel();
  pendingPostGestureCues.length = 0;
  VoiceCue.play('workout-reset');
  setTimeout(() => {
    try { localStorage.removeItem("gym-timer-state"); } catch(e) {}
    location.reload();
  }, settings.voice ? 1500 : 200);
});
elSettingsModal.addEventListener("click", (e) => {
  if (e.target === elSettingsModal) closeSettings();
});
elToggleAutoStart.addEventListener("click", () => {
  settings.autoStart = !settings.autoStart; saveSettings(); applySettingsToggles();
});
elToggleSkipRest.addEventListener("click", () => {
  settings.skipExerciseRest = !settings.skipExerciseRest; saveSettings(); applySettingsToggles();
});
elToggleVoice.addEventListener("click", () => {
  settings.voice = !settings.voice;
  if (!settings.voice) VoiceCue.cancel();
  saveSettings();
  applySettingsToggles();
});

elBtn.addEventListener("click", () => {
  recoverAudioCtx();
  VoiceCue.unlock();
  startAudioKeepalive();
  if (state === "pre-start") startWorkout();
  else if (state === "ready") {
    if (Date.now() < setDoneLockUntil) return; // bounce-tap after a skip-rest transition
    setDone();
  }
  else if (state === "alert") acknowledgeAlert();
  else if (state === "resting") pauseRest();
  else if (state === "paused") resumeRest();
  else if (state === "finishing") finishWorkout();
});
elSkip.addEventListener("click", (e) => {
  e.stopPropagation();
  if (state !== "resting" && state !== "paused") return;
  // Press animation: icon flies right while the state transitions.
  elSkip.classList.add("pressed");
  setTimeout(() => {
    skipRest();
    elSkip.classList.remove("pressed");
  }, 160);
});
elNotesInput.addEventListener("input", () => {
  const log = getActiveLogForEdit();
  if (log) log.note = elNotesInput.value;
  saveState();
});
// Note modal — the inline field is read-only; tapping opens a real textarea
// so the note is visible while typing. Save funnels back through the inline
// field's input handler (keeps log.note + saveState in one path).
function openNoteModal() {
  if (elLogArea.style.display === "none") return;
  elNoteModalText.value = elNotesInput.value || "";
  elNoteModal.classList.add("show");
  // Focus synchronously inside the tap gesture (iOS only pops the keyboard
  // for gesture-stack focus), with a rAF backup once layout has flushed.
  try { elNoteModalText.focus(); } catch (e) {}
  requestAnimationFrame(() => { try { elNoteModalText.focus(); } catch (e) {} });
}
function closeNoteModal() { elNoteModal.classList.remove("show"); }
elNotesInput.addEventListener("click", openNoteModal);
elNotesInput.addEventListener("focus", openNoteModal);
elNoteCancel.addEventListener("click", closeNoteModal);
elNoteSave.addEventListener("click", () => {
  elNotesInput.value = elNoteModalText.value;
  elNotesInput.dispatchEvent(new Event("input"));
  closeNoteModal();
});
elNoteModal.addEventListener("click", (e) => { if (e.target === elNoteModal) closeNoteModal(); });
elDifficultyRow.addEventListener("click", (e) => {
  const btn = e.target.closest('.diff-btn');
  if (!btn) return;
  const diff = Number(btn.dataset.diff);
  if (!diff) return;
  const log = getActiveLogForEdit();
  if (log) {
    log.difficulty = (log.difficulty === diff) ? null : diff;
    renderDifficulty(log);
  } else if (!isBrowsing()) {
    // Mid-set (no log entry yet): keep the tap as a visual DRAFT selection;
    // setDone() reads the .selected button into the new log.
    const wasSelected = btn.classList.contains('selected');
    elDifficultyRow.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected'));
    if (!wasSelected) btn.classList.add('selected');
  } else {
    return; // browsing a future set: nothing to grade
  }
  // Difficulty is the gate for dynamic notes -- refresh the advice live.
  refreshSetNote();
  saveState();
});
elReturnPill.addEventListener("click", returnToWorking);
elSetCurrentBtn.addEventListener("click", () => {
  // Repoint the working position to the viewed set (browsing only).
  if (!isBrowsing()) return;
  currentExercise = viewingExercise;
  currentSet = viewingSet;
  syncSeqIndex();
  elReturnPill.classList.remove('visible');
  elSetCurrentBtn.classList.remove('visible');
  elBtn.classList.remove('browsing');
  elBtn.style.opacity = '';
  elBtn.style.pointerEvents = '';
  renderExercise();
  syncLogArea();
  saveState();
});
elCopy.addEventListener("click", () => {
  const text = buildSummary();
  const revert = () => setTimeout(() => {
    elCopy.textContent = "Copy Summary";
    elCopy.className = "";
  }, 2000);
  // Clipboard API can be missing (file:// testing) or reject -- say so
  // instead of dying silently.
  try {
    navigator.clipboard.writeText(text).then(() => {
      elCopy.textContent = "Copied";
      elCopy.className = "copied";
      revert();
    }).catch(() => { elCopy.textContent = "Copy failed"; revert(); });
  } catch (e) {
    elCopy.textContent = "Copy failed";
    revert();
  }
});

// ============ §15 SUMMARY ============
function getMaxReps(repsStr) {
  const m = repsStr.match(/(\d+)\s*-\s*(\d+)/);
  return m ? parseInt(m[2], 10) : (parseInt(repsStr, 10) || 10);
}
function formatDuration(ms) {
  const totalSec = Math.max(0, Math.floor(ms / 1000));
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return m + "m " + s.toString().padStart(2, "0") + "s";
}
function getExerciseDuration(exerciseIdx) {
  const logs = setLogs.filter(l => l.exercise === exerciseIdx && l.timestamp);
  if (logs.length === 0) return null;
  if (logs.length === 1) return 0;
  const first = Math.min(...logs.map(l => l.timestamp));
  const last  = Math.max(...logs.map(l => l.timestamp));
  return last - first;
}
function summaryDateStr() {
  return new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
}
function getTotalDuration() {
  const ts = setLogs.filter(l => l.timestamp).map(l => l.timestamp);
  if (ts.length === 0) return null;
  const lastTs = Math.max(...ts);
  // Preferred: the Start Workout tap recorded the real session start.
  if (workoutStartTime) return lastTs - workoutStartTime;
  // Fallback for sessions restored from before pre-start existed: estimate
  // set 1's duration from the average gap between that exercise's sets.
  if (ts.length < 2) return null;
  const raw = lastTs - Math.min(...ts);
  const logsWithTs = setLogs.filter(l => l.timestamp).slice().sort((a, b) => a.timestamp - b.timestamp);
  const firstExIdx = logsWithTs[0].exercise;
  const firstExLogs = setLogs
    .filter(l => l.exercise === firstExIdx && l.timestamp)
    .sort((a, b) => a.set - b.set);
  if (firstExLogs.length < 2) return raw;
  let gapSum = 0;
  for (let i = 1; i < firstExLogs.length; i++) {
    gapSum += firstExLogs[i].timestamp - firstExLogs[i - 1].timestamp;
  }
  const avgGap = gapSum / (firstExLogs.length - 1);
  return raw + avgGap;
}
const DIFFICULTY_LABELS = ['', 'EASY', 'LIGHT', 'MOD', 'HARD', 'MAX'];
function formatDifficulty(log) {
  return (log && log.difficulty) ? ' [' + DIFFICULTY_LABELS[log.difficulty] + ']' : '';
}
// User-typed notes go into innerHTML -- a note with "<" (e.g. "<10 clean")
// swallowed the rest of the summary as a bogus tag.
function escapeHTML(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
// Weight tag for a set whose load differed from the header prescription
// (auto-drop or structural drop) -- without it the summary claimed every set
// was at the header weight (7/2's "were S3/S4 at 120 or 100?" ambiguity).
function setDropTag(exIdx, setIdx) {
  const eff = effectiveWeight(exIdx, setIdx);
  return (eff.dropped && eff.num) ? " @ " + eff.num : "";
}
// Session totals: logged sets + tonnage at the weights actually lifted
// (drops included via effectiveWeight) -- the two numbers a hypertrophy
// block trends session-over-session.
function sessionTotals() {
  let volume = 0;
  let anyWeight = false;
  setLogs.forEach(l => {
    const reps = Number(l.reps) || 0;
    const w = parseFloat(effectiveWeight(l.exercise, l.set).num);
    if (reps > 0 && isFinite(w)) { volume += reps * w; anyWeight = true; }
  });
  return { sets: setLogs.length, volume: anyWeight ? Math.round(volume) : null };
}
function totalLineText() {
  const parts = [];
  const total = getTotalDuration();
  if (total) parts.push(formatDuration(total));
  const t = sessionTotals();
  if (t.sets) parts.push(t.sets + " sets");
  if (t.volume) parts.push(t.volume.toLocaleString('en-US') + " lb");
  return parts.length ? "Total: " + parts.join(" · ") : "";
}
function buildSummary() {
  let text = dayType + " -- " + summaryDateStr() + "\n\n";
  for (let i = 0; i < workout.length; i++) {
    const ex = workout[i];
    const dur = getExerciseDuration(i);
    text += ex.name + " @ " + ex.weight;
    if (dur && dur > 0) text += "  (" + formatDuration(dur) + ")";
    text += "\n";
    for (let j = 0; j < ex.sets; j++) {
      const log = setLogs.find(l => l.exercise === i && l.set === j);
      if (log) {
        const diff = formatDifficulty(log);
        const note = log.note ? " -- " + log.note : "";
        text += "  S" + (j + 1) + ": " + log.reps + " reps" + setDropTag(i, j) + diff + note + "\n";
      } else {
        text += "  S" + (j + 1) + ": -\n";
      }
    }
    // Total-rep volume (the tracker's volume-PR currency) + a banked trigger
    // called out explicitly so the advance never rests on recall.
    const exLogs = setLogs.filter(l => l.exercise === i);
    if (exLogs.length) {
      text += "  total " + exLogs.reduce((a, l) => a + (Number(l.reps) || 0), 0) + " reps\n";
    }
    if (exerciseTriggerHit(i)) {
      text += "  TRIGGER HIT -> " + (ex.triggerWeight || "advance") + " next session\n";
    }
    if (i < workout.length - 1) text += "\n";
  }
  const totalLine = totalLineText();
  if (totalLine) text += "\n" + totalLine + "\n";
  return text;
}
function buildSummaryHTML() {
  let html = '<div class="exercise-header">' + dayType + ' -- ' + summaryDateStr() + '</div><br>';
  for (let i = 0; i < workout.length; i++) {
    const ex = workout[i];
    const dur = getExerciseDuration(i);
    let header = ex.name + ' @ ' + ex.weight;
    let durTag = (dur && dur > 0) ? ' <span class="duration-tag">(' + formatDuration(dur) + ')</span>' : '';
    html += '<div class="exercise-header">' + header + durTag + '</div>';
    for (let j = 0; j < ex.sets; j++) {
      const log = setLogs.find(l => l.exercise === i && l.set === j);
      if (log) {
        const diff = formatDifficulty(log);
        const note = log.note ? ' -- ' + escapeHTML(log.note) : '';
        html += '<div class="set-line">S' + (j + 1) + ': <span class="set-note">' + log.reps + ' reps' + setDropTag(i, j) + diff + note + '</span></div>';
      } else {
        html += '<div class="set-line">S' + (j + 1) + ': -</div>';
      }
    }
    const exLogs = setLogs.filter(l => l.exercise === i);
    if (exLogs.length) {
      html += '<div class="sum-reps">total ' + exLogs.reduce((a, l) => a + (Number(l.reps) || 0), 0) + ' reps</div>';
    }
    if (exerciseTriggerHit(i)) {
      html += '<div class="sum-trigger">TRIGGER HIT &rarr; ' + escapeHTML(ex.triggerWeight || 'advance') + ' next session</div>';
    }
    if (i < workout.length - 1) html += '<br>';
  }
  const totalLine = totalLineText();
  if (totalLine) html += '<div class="total-line">' + escapeHTML(totalLine) + '</div>';
  return html;
}

// ============ §16 PERSISTENCE ============
function saveState() {
  // A finished session must never persist: a save deferred past
  // finishWorkout's wipe (rAF race) would resurrect a dead state on reload.
  if (state === "finished") {
    try { localStorage.removeItem("gym-timer-state"); } catch(e) {}
    return;
  }
  const s = {
    savedAt: Date.now(),
    // Guards a saved session against restoring into a DIFFERENT day's build
    // (the config flips at day-close; indexes would point at the wrong
    // exercises). restoreState discards on mismatch.
    dayKey: dayType,
    currentExercise, currentSet, state, workoutStartTime, restEndTime, restRemaining, restTotalSeconds,
    viewingExercise, viewingSet,
    setLogs: setLogs.map(l => ({...l})),
    repCount,
    notes: elNotesInput.value,
    countdownFiredThresholds: [...countdownFiredThresholds],
    dissolvedGroups: [...dissolvedGroups],
    // Persist any mid-session reorder so refreshes don't snap it back.
    workoutOrder: workout.map(ex => ex.name)
  };
  try { localStorage.setItem("gym-timer-state", JSON.stringify(s)); } catch(e) {}
}
function restoreState() {
  try {
    const raw = localStorage.getItem("gym-timer-state");
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (s.savedAt && (Date.now() - s.savedAt > STATE_TTL_MS)) {
      try { localStorage.removeItem("gym-timer-state"); } catch(e) {}
      return false;
    }
    // Cross-build guards: a state saved under a different day's config, or
    // one whose cursor doesn't fit this build's shape, must not restore.
    if (s.state === "finished") {
      try { localStorage.removeItem("gym-timer-state"); } catch(e) {}
      return false;
    }
    if (s.dayKey && s.dayKey !== dayType) {
      try { localStorage.removeItem("gym-timer-state"); } catch(e) {}
      return false;
    }

    // Reapply a saved reorder BEFORE anything reads workout[].
    if (Array.isArray(s.workoutOrder) && s.workoutOrder.length === workout.length) {
      const byName = new Map(originalWorkout.map(ex => [ex.name, ex]));
      const reordered = s.workoutOrder.map(name => byName.get(name));
      if (reordered.every(ex => ex)) {
        workout.length = 0;
        reordered.forEach(ex => workout.push(ex));
      }
    }

    // Cursor-shape guard, AFTER the reorder so indexes are checked against
    // the same exercise order they were saved under.
    if (typeof s.currentExercise !== 'number' || s.currentExercise < 0 ||
        s.currentExercise >= workout.length ||
        typeof s.currentSet !== 'number' || s.currentSet < 0 ||
        s.currentSet > workout[s.currentExercise].sets) {
      try { localStorage.removeItem("gym-timer-state"); } catch(e) {}
      return false;
    }

    currentExercise = s.currentExercise;
    currentSet = s.currentSet;
    viewingExercise = (typeof s.viewingExercise === 'number') ? s.viewingExercise : currentExercise;
    viewingSet = (typeof s.viewingSet === 'number') ? s.viewingSet : currentSet;
    workoutStartTime = (typeof s.workoutStartTime === 'number') ? s.workoutStartTime : null;
    repCount = s.repCount || 10;
    setLogs.length = 0;
    s.setLogs.forEach(l => setLogs.push(l));
    state = s.state;
    restEndTime = s.restEndTime;
    restRemaining = s.restRemaining;
    restTotalSeconds = s.restTotalSeconds || s.restRemaining || 0;
    countdownFiredThresholds = new Set(s.countdownFiredThresholds || []);
    // Superset linkage: restore mid-session unlinks, then re-derive the
    // sequence from the (possibly reordered) workout and re-locate the cursor.
    dissolvedGroups = new Set(Array.isArray(s.dissolvedGroups) ? s.dissolvedGroups : []);
    rebuildSequence();

    if (state === "resting" || state === "paused" || state === "finishing") {
      const lastLog = setLogs[setLogs.length - 1];
      if (lastLog) currentLogEntry = lastLog;
    }
    applyState(s.notes || "");
    return true;
  } catch(e) { return false; }
}

// ============ §17 LIFECYCLE + INIT ============
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) {}
}
function releaseWakeLock() {
  try { if (wakeLock) wakeLock.release(); } catch(e) {}
  wakeLock = null;
}

async function ensureNotifPermission() {
  if (!('Notification' in window)) return false;
  if (Notification.permission === 'granted') return true;
  if (Notification.permission === 'denied') return false;
  try {
    const r = await Notification.requestPermission();
    return r === 'granted';
  } catch (e) { return false; }
}
function scheduleRestNotif(ms) {
  cancelRestNotif();
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  restNotifTimer = setTimeout(() => {
    restNotifTimer = null;
    if (document.visibilityState !== 'visible') {
      try {
        new Notification("Rest done -- GO!", {
          body: workout[currentExercise].name + " set " + (currentSet + 1),
          tag: "gym-rest"
        });
      } catch(e) {}
    }
  }, ms);
}
function cancelRestNotif() {
  if (restNotifTimer) { clearTimeout(restNotifTimer); restNotifTimer = null; }
}

// Shared handler for tab-return + BFCache restore. iOS may have closed the
// AudioContext while backgrounded -- recover BEFORE any path below fires
// audio (the expired-rest restDone() call). Recovery kicks off async
// re-decoding; by the time the user looks at the timer and taps, it's done.
function handleResumeFromBackground() {
  recoverAudioCtx();
  if (state === "resting" && restEndTime) {
    const remaining = Math.ceil((restEndTime - Date.now()) / 1000);
    if (remaining <= 0) {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      restDone();
    } else {
      restRemaining = remaining;
      elTimer.textContent = formatTime(remaining);
      updateRestRing();
      // Threshold catch-up: cues whose trigger second passed while
      // backgrounded are suppressed (a late fire is a stale announcement).
      [60, 30, 10, 5, 4, 3, 2, 1].forEach(t => {
        if (t > remaining) countdownFiredThresholds.add(t);
      });
      // Re-arm the OS notification for the true remaining window -- iOS
      // clamps backgrounded setTimeout, so the one armed at setDone may have
      // fired into nothing or never fire (6/1 review finding).
      scheduleRestNotif(remaining * 1000);
      // Re-arm the keepalive (page reload mid-rest, or lost to a context
      // recreation). Idempotent.
      startAudioKeepalive();
    }
  }
  // Re-acquire in every ACTIVE state -- "ready" means he's mid-set with Set
  // Done pending; backgrounding released the lock and the screen would sleep.
  if (state !== "finished" && state !== "pre-start" && !wakeLock) {
    requestWakeLock();
  }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  handleResumeFromBackground();
});
// pageshow fires on BFCache restore (iOS back/forward, tab swipe-back).
// AudioContexts get closed in BFCache; without the rest-expiry catch-up here
// a restore during an expired rest left the timer stuck at the stale REST
// display until a tap.
window.addEventListener("pageshow", (e) => {
  if (e.persisted) handleResumeFromBackground();
});

// URL reset (?reset=1) wipes saved workout state, then strips the param so
// refreshes don't keep resetting.
if (new URLSearchParams(location.search).has('reset')) {
  try { localStorage.removeItem("gym-timer-state"); } catch(e) {}
  try { window.history.replaceState(null, '', location.pathname); } catch(e) {}
}

elSkip.style.display = "none";
showRestRing(false);
applySettingsToggles();
VoiceCue.init();
attachGlobalAudioRecovery();
if (!restoreState()) {
  // Fresh load (no saved state, or TTL expired): pre-start. The Start tap
  // unlocks audio on iOS, plays the day cue, and records workoutStartTime.
  state = "pre-start";
  applyState("");
}
// Center the dial after initial layout settles, and on any resize.
requestAnimationFrame(centerMainButton);
setTimeout(centerMainButton, 50);
window.addEventListener("resize", centerMainButton);
window.addEventListener("orientationchange", () => setTimeout(centerMainButton, 100));

// ============ §18 VISUAL FX OBSERVER ============
// Presentation only: watches text/class changes and pulses fx-* classes.
// Never reads or changes workout state, timing, audio, storage, or controls.
(function () {
  const timer = document.getElementById("timer-display");
  const mainButton = document.getElementById("main-btn");
  const buttonWrap = document.getElementById("btn-wrap");
  const progress = document.getElementById("progress");
  if (!timer || !mainButton || !buttonWrap || !progress) return;

  const cleanupTimers = new WeakMap();
  function pulse(node, className, duration) {
    const oldTimer = cleanupTimers.get(node);
    if (oldTimer) clearTimeout(oldTimer);
    node.classList.remove(className);
    node.classList.add(className);
    cleanupTimers.set(node, setTimeout(function () {
      node.classList.remove(className);
      cleanupTimers.delete(node);
    }, duration));
  }

  let timerText = timer.textContent;
  function syncTimer() {
    const nextText = timer.textContent;
    if (nextText !== timerText) {
      if (timerText) pulse(timer, "fx-tick", 180);
      timerText = nextText;
    }
    const parts = /^(\d+):(\d{2})$/.exec(nextText);
    const seconds = parts ? (Number(parts[1]) * 60 + Number(parts[2])) : NaN;
    const finalCountdown = buttonWrap.classList.contains("show-ring") &&
      Number.isFinite(seconds) && seconds > 0 && seconds <= 10;
    buttonWrap.classList.toggle("fx-final10", finalCountdown);
  }

  let controlKey = "";
  function syncControl() {
    const nextKey = mainButton.className + "|" + mainButton.textContent + "|" +
      String(buttonWrap.classList.contains("show-ring")) + "|" +
      String(buttonWrap.classList.contains("paused"));
    if (controlKey && nextKey !== controlKey) pulse(buttonWrap, "fx-shift", 180);
    controlKey = nextKey;
  }

  new MutationObserver(syncTimer).observe(timer, {
    childList: true,
    characterData: true,
    subtree: true
  });

  new MutationObserver(syncControl).observe(mainButton, {
    attributes: true,
    childList: true,
    characterData: true,
    subtree: true
  });

  new MutationObserver(syncControl).observe(buttonWrap, {
    attributes: true,
    attributeFilter: ["class"]
  });

  new MutationObserver(function () {
    pulse(progress, "fx-rail", 220);
  }).observe(progress, { childList: true });

  syncTimer();
  syncControl();
}());
</script>
