function restClipForDuration(seconds) {
  if (seconds === 180) return 'rest-3min';
  if (seconds === 150) return 'rest-150sec'; // clip not recorded yet; fetchFailed guard skips it gap-free
  if (seconds === 120) return 'rest-2min';
  if (seconds === 90) return 'rest-90sec';
  if (seconds === 60) return 'rest-60sec';
  return null;
}

// Set-position announcement at the end of a rest. Null on a first set (the
// up-next + exercise-name cue covered it).
function setStartClipFor(exIdx, setIdx) {
  if (!workout[exIdx]) return null;
  if (setIdx === 0) return null;
  const isFinal = (setIdx === workout[exIdx].sets - 1);
  if (isFinal) return 'final-set';
  if (setIdx === 1) return 'set-2';
  if (setIdx === 2) return 'set-3';
  if (setIdx === 3) return 'set-4';
  return null;
}

// Map an exercise's weight string to its callout clips. [] if no usable
// weight. Handles the modifier suffix ("115 lbs + modifier"); half-weights
// use the dash-decimal slug ("22.5" → "wgt-22-5").
function weightClipsFor(exerciseObj) {
  if (!exerciseObj || !exerciseObj.weight) return [];
  const w = String(exerciseObj.weight).toLowerCase();
  const numMatch = w.match(/(\d+(?:\.\d+)?)/);
  if (!numMatch) return [];
  const slug = numMatch[1].replace('.', '-');
  const result = ['wgt-' + slug];
  if (w.includes('modifier')) result.push('wgt-plus-modifier');
  return result;
}

// The weight callout for a freshly-materialized auto-drop. Announced once, at
// the start of the rest before the set that loads the backoff (that's when
// he's re-pinning the stack). Sticky continuation sets stay silent; a missing
// wgt clip skips gap-free via the fetchFailed guard.
function dropAnnounceClips(exIdx, setIdx) {
  const ex = workout[exIdx];
  if (!ex || !ex.backoff || setIdx < 1) return [];
  const st = stickyDropState(exIdx, setIdx);
  if (!st.dropped || st.firedAt !== setIdx) return [];
  const m = String(ex.backoff).match(/(\d+(?:\.\d+)?)/);
  if (!m) return [];
  return ['wgt-' + m[1].replace('.', '-')];
}

// Map a rep-range string like "8-12" to its aim cue.
function repRangeClipFor(repsStr) {
  if (!repsStr) return null;
  const m = String(repsStr).match(/(\d+)\s*-\s*(\d+)/);
  if (!m) return null;
  const key = parseInt(m[1], 10) + '-' + parseInt(m[2], 10);
  const map = {
    '6-10':  'cue-aim-6-10',
    '8-12':  'cue-aim-8-12',
    '10-12': 'cue-aim-10-12',
    '12-15': 'cue-aim-12-15',
    '15-20': 'cue-aim-15-20'
  };
  return map[key] || null;
}

// Threshold-based countdown announcements (from startCountdown). Each
// threshold fires once per rest; reset when a new rest begins.
function maybeFireCountdownCue(secCeil) {
  if (countdownFiredThresholds.has(secCeil)) return;
  const cues = {
    60: '1min-remaining',
    30: '30sec-remaining',
    10: '10sec-remaining',
    5: 'countdown-5',
    4: 'countdown-4',
    3: 'countdown-3',
    2: 'countdown-2',
    1: 'countdown-1'
  };
  const name = cues[secCeil];
  if (!name) return;
  // Skip remaining-N cues when total rest is at/below the threshold
  // (redundant with the rest-start announcement).
  if ((secCeil === 60 && restTotalSeconds <= 60) ||
      (secCeil === 30 && restTotalSeconds <= 30) ||
      (secCeil === 10 && restTotalSeconds <= 10)) {
    countdownFiredThresholds.add(secCeil);
    return;
  }
  // Only mark the threshold fired if audio is actually playable -- otherwise
  // the next 100ms tick retries once the context recovers. Without this gate,
  // every silent-fail during tab-return recovery permanently ate that cue.
  if (!audioCtx || audioCtx.state !== 'running') return;
  countdownFiredThresholds.add(secCeil);
  VoiceCue.play(name);
}

// The rest-expiry announcement (restDone + the expired-restore path share it).
function restEndCueSeq() {
  const seq = ['rest-complete'];
  if (settings.autoStart) {
    const setStart = setStartClipFor(currentExercise, currentSet);
    if (setStart) seq.push(setStart);
  } else {
    seq.push('tap-to-start');
  }
  return seq;
}
// Play now if audio is live, else queue for the first real gesture (a cue
// fired with no user gesture since tab-return would silent-fail and be lost).
function playOrQueue(seq) {
  if (audioCtx && audioCtx.state === 'running') {
    VoiceCue.playSequence(seq);
  } else {
    pendingPostGestureCues.push(seq);
  }
}

// ============ §9 ADVISOR (drops, triggers, set notes) ============
// AUTO-DROP PREDICATE (v5, Soren OK'd 7/5) -- THE single source of truth for
// "should the next set load the backoff?". The advice text (dynamicRepAdvice)
// and the on-screen weight (effectiveWeight via stickyDropState) both route
// through this one function, so note and loaded weight can never disagree.
// Given graded logs so far (prevLogs = sets 0..n-1), decide for set n:
//   (1) REACTIVE: last set BELOW the floor at HARD/MAX, or exactly AT the
//       floor while MAXED (a HARD set at the floor HOLDS -- reserve left).
//   (2) PREDICTIVE: the last THREE sets all MAX with TWO declining steps, and
//       the last step's slope projects the next set under the floor.
//       History: v3 projected off ANY downtrend (misfired on Row 7/2 -- a
//       paced HARD 12 falling to a MAX 9 is pacing, not fatigue); v4 required
//       two MAX sets + one declining step (still fired on LP 7/4's 11->9, a
//       normal early-set fade). One declining step is ordinary; TWO at MAX is
//       a real crater forming. 13->11->9 fires; 11->9 never does.
//   MOD/LIGHT never drop. A zero-rep set reads as "stopped early", never a
//   weight failure.
function dropPredicate(prevLogs, lo) {
  const last = prevLogs[prevLogs.length - 1];
  if (!last) return false;
  const r = Number(last.reps);
  if (isNaN(r) || r <= 0) return false;
  const d = +last.difficulty || 0;
  const hardOrMax = d >= 4;
  const maxed = d >= 5;
  if (!hardOrMax) return false;
  if (r < lo || (r === lo && maxed)) return true;
  if (r > lo && maxed && prevLogs.length >= 3) {
    const p2 = prevLogs[prevLogs.length - 2];
    const p3 = prevLogs[prevLogs.length - 3];
    const r2 = Number(p2.reps), r3 = Number(p3.reps);
    const d2 = +p2.difficulty || 0, d3 = +p3.difficulty || 0;
    if (!isNaN(r2) && !isNaN(r3) && d2 >= 5 && d3 >= 5 && r3 > r2 && r2 > r) {
      if ((r - (r2 - r)) < lo) return true;
    }
  }
  return false;
}

// STICKY DROP (Soren 7/5): once the drop materializes for a set, every later
// set of that exercise stays at the backoff. A recovered set no longer flips
// the display back to the prescription -- that produced the 7/4 incoherence
// ("Hold 235" note over a 205 display). Walks the graded sets in order and
// latches at the FIRST set the predicate fires for; an ungraded set before
// any latch means we can't evaluate (no drop); an ungraded set after the
// latch changes nothing (the drop already happened on the machine).
// Returns { dropped, firedAt } -- firedAt = first set index loaded at the backoff.
function stickyDropState(exIdx, setIdx) {
  const ex = workout[exIdx];
  if (!ex || !ex.backoff || setIdx < 1) return { dropped: false, firedAt: null };
  const rng = String(ex.reps || "").match(/(\d+)\D+(\d+)/);
  if (!rng) return { dropped: false, firedAt: null };
  const lo = +rng[1];
  const prevLogs = [];
  for (let i = 0; i < setIdx; i++) {
    const lg = logAt(exIdx, i);
    if (!lg || lg.difficulty == null) break; // ungraded gap: can't evaluate further
    prevLogs.push({ reps: lg.reps, difficulty: lg.difficulty });
    if (dropPredicate(prevLogs, lo)) return { dropped: true, firedAt: i + 1 };
  }
  return { dropped: false, firedAt: null };
}

// Dynamic per-set advice: a REALISTIC rep target for the upcoming set from
// the ACTUAL last-set reps + effort, plus the drop calls. difficulty = 1-5
// (3 MOD, 4 HARD, 5 MAX). ex.backoff = the drop target; ex.dropLastSet =
// last set is already a structural drop (defer to its static note there);
// ex.noDropAdvice = pain-limited slot (a short set means pain stopped it,
// not the weight -- never advise a drop, fall through to the static cues).
function dynamicRepAdvice(setIdx, prev, ex) {
  if (!prev || !prev.length || setIdx < 1) return null;
  if (ex.dropLastSet && setIdx === ex.sets - 1) return null;
  var rng = String(ex.reps || "").match(/(\d+)\D+(\d+)/);
  if (!rng) return null;
  var lo = +rng[1], hi = +rng[2];
  var last = prev[prev.length - 1];
  var r = Number(last.reps);
  if (isNaN(r)) return null;
  var d = +last.difficulty || 0;
  var hardOrMax = d >= 4;
  var maxed = d >= 5;
  var roomLeft = d > 0 && d <= 3;
  var wm = String(ex.weight).match(/(\d+(?:\.\d+)?)/);
  var w = wm ? wm[1] : "the weight";
  var bo = ex.backoff || null;
  var L = "S" + (setIdx + 1);
  // P = the COMPLETED set the numbers describe. Facts get P; instructions get
  // "here"/L. (The old texts hung the prior set's reps on the upcoming set's
  // label -- "S2 was 12 at max" shown before S2 happened; 7/5 hunt.)
  var P = "S" + setIdx;
  var aimHi = Math.min(lo + 2, hi);
  var pLo, pHi;
  if (hardOrMax) { pLo = Math.max(r - 2, 1); pHi = Math.max(r - 1, 1); }
  else if (roomLeft) { pLo = r; pHi = Math.min(r + 2, hi); }
  else { pLo = Math.max(r - 1, 1); pHi = r; }

  if (r <= 0) return P + " stopped early. Reset, go by feel this set.";

  // All drop decisions route through dropPredicate -- the same function
  // effectiveWeight consults -- so advice and on-screen weight share one brain.
  if (bo) {
    // Sticky-continues: the drop materialized for an EARLIER set. This set
    // stays at the backoff -- never bounce back off one recovered set.
    var earlierFired = false;
    for (var k = 1; k < prev.length; k++) {
      if (dropPredicate(prev.slice(0, k), lo)) { earlierFired = true; break; }
    }
    if (earlierFired) {
      var boNum = (String(bo).match(/(\d+(?:\.\d+)?)/) || [])[1] || String(bo);
      return L + " stays at " + boNum + " (dropped from " + w + "). Aim " + pLo + "-" + pHi + ".";
    }
    // Drop materializes on THIS set: message by which rule fired.
    if (hardOrMax && dropPredicate(prev, lo)) {
      if (r < lo || (r === lo && maxed)) {
        var why = (r < lo) ? (" was " + r + ", under " + lo) : (" was " + r + " at the floor, maxed");
        return P + why + ". Dropping to " + bo + " -- aim " + lo + "-" + aimHi + ".";
      }
      // Predictive: predicate guarantees three MAX sets, two declining steps.
      var pv2 = prev[prev.length - 2];
      var pv3 = prev[prev.length - 3];
      var projNext = r - (Number(pv2.reps) - r);
      return "Three MAX sets fading (" + Number(pv3.reps) + " to " + Number(pv2.reps) + " to " + r + ", proj ~" + projNext + " next). Dropping to " + bo + " -- aim " + lo + "-" + aimHi + ".";
    }
  }

  // Pain-limited slots: never advise a drop -- static form/STOP cues own it.
  if (ex.noDropAdvice && hardOrMax && r <= lo) return null;

  // No backoff defined (groovers like Face Pulls): advise only, never auto-drop.
  if (r < lo && hardOrMax) {
    return P + " was " + r + ", under " + lo + ". Drop a notch here.";
  }
  if (r === lo && hardOrMax) {
    return maxed
      ? P + " at the floor (" + r + "), maxed. Drop a notch here."
      : P + " at the floor (" + r + ") with a little left. Hold " + w + ", push for more.";
  }
  if (r >= hi && roomLeft) {
    return P + " hit " + r + " (top) with room. Bump the weight next session. Here: " + (hi - 1) + "-" + hi + ".";
  }
  if (roomLeft) {
    return P + " was " + r + " with room. Push " + pLo + "-" + pHi + " here, hold " + w + ".";
  }
  return P + " was " + r + (hardOrMax ? " at max" : "") + ". Aim " + pLo + "-" + pHi + " here, hold " + w + ".";
}

function defaultAdvice(setIdx, prev, ex) {
  if (!Array.isArray(ex.trigger) || setIdx === 0) return null;
  if (setIdx >= ex.trigger.length) return null;
  const reqHere = ex.trigger[setIdx];
  const passingPrior = prev.every((log, i) => log.reps >= ex.trigger[i]);
  const weightTag = ex.triggerWeight ? " for " + ex.triggerWeight : "";
  if (passingPrior) {
    if (setIdx === ex.trigger.length - 1) {
      return "TRIGGER ALIVE -- " + reqHere + "+ here flips" + weightTag + " next session. Push, form first.";
    }
    return "On track for trigger" + weightTag + " -- push " + reqHere + "+ here.";
  }
  // Trigger already out: say nothing -- never tell him to "match" a trigger
  // number he's failing; the rep/drop advisor or static note owns that case
  // (Soren's 6/10 call).
  return null;
}

// Returns { text, advisor } -- advisor=true when the note is a LIVE computed
// call (adviceFor / dynamicRepAdvice / trigger advice), false for the canned
// setNotes/note fallback. The note card styles the two differently.
//
// SAFETY IS NOT IN HERE, AND THAT IS THE POINT (v8B, superseding the v7b
// withSafety() prefix). An injury constraint used to live only in setNotes,
// which this function returns as a FALLBACK -- so once the prior set was graded
// and dynamicRepAdvice returned a string (it ends in two unconditional
// catch-alls), the advisor won and the constraint vanished. Verified 2026-08-05
// on the live Lower build: after grading Leg Curl S1, S2's card read "S1 was 9
// with room. Push 9-11 here, hold 40 lbs." with the medial-thigh hard stop
// nowhere on it.
// v7b prefixed ex.safety onto whatever this returned, which worked but left the
// constraint inside a string the advisor also owns. v8 moves it to its own DOM
// element written by renderSafety(). Survival is now STRUCTURAL: this function
// has no reference to #safety-banner and renderSafety has no reference to the
// advisor, so neither can overwrite the other regardless of which branch fires.
function computeSetNoteInfo(exIdx, setIdx) {
  const ex = workout[exIdx];
  if (!ex) return { text: "", advisor: false };
  // Build prev-set logs in order. A prior set counts as "logged" only when
  // BOTH reps and difficulty are committed -- keeps dynamic advice from
  // firing off default reps before the user actually graded the set.
  const prevLogs = [];
  let allLogged = true;
  for (let i = 0; i < setIdx; i++) {
    const log = logAt(exIdx, i);
    if (log && log.difficulty != null) {
      prevLogs.push({ reps: log.reps, difficulty: log.difficulty });
    } else {
      allLogged = false;
      break;
    }
  }
  if (allLogged && prevLogs.length === setIdx && setIdx > 0) {
    if (typeof ex.adviceFor === 'function') {
      const dynamic = ex.adviceFor(setIdx, prevLogs, ex);
      if (dynamic) return { text: dynamic, advisor: true };
    }
    const reactive = dynamicRepAdvice(setIdx, prevLogs, ex);
    if (reactive) return { text: reactive, advisor: true };
    const generic = defaultAdvice(setIdx, prevLogs, ex);
    if (generic) return { text: generic, advisor: true };
  }
  // Static fallback (S1 always lands here; later sets land here pre-grading).
  if (Array.isArray(ex.setNotes) && ex.setNotes[setIdx]) return { text: ex.setNotes[setIdx], advisor: false };
  return { text: ex.note || "", advisor: false };
}
function computeSetNote(exIdx, setIdx) {
  return computeSetNoteInfo(exIdx, setIdx).text;
}

// Did this exercise bank its advance trigger? Every set's logged reps must
// meet the trigger row AT THE PRESCRIBED WEIGHT -- a materialized auto-drop
// voids the bank (numbers hit at the backoff aren't the trigger).
function exerciseTriggerHit(exIdx) {
  const ex = workout[exIdx];
  if (!ex || !Array.isArray(ex.trigger) || ex.trigger.length !== ex.sets) return false;
  if (ex.backoff && stickyDropState(exIdx, ex.sets - 1).dropped) return false;
  for (let i = 0; i < ex.sets; i++) {
    const log = logAt(exIdx, i);
    if (!log || Number(log.reps) < ex.trigger[i]) return false;
  }
  return true;
}

// One-shot celebration pulse on the exercise's dots row when its final set
// banks the trigger. Re-renders during the window simply drop the class early.
function pulseTriggerHit(exIdx) {
  requestAnimationFrame(() => {
    const row = elProgress.querySelector('.exercise-group[data-exercise-idx="' + exIdx + '"] .exercise-dots');
    if (!row) return;
    row.classList.add('trigger-hit');
    setTimeout(() => row.classList.remove('trigger-hit'), 1200);
  });
}

// The weight to actually load THIS set: reflects (a) a structural drop set
// (ex.dropLastSet, weight like "110 lbs (S4 -> 90)") and (b) a reactive
// advisor drop (ex.backoff). The number on screen is what goes on the
// machine, never the stale top-of-session prescription.
function effectiveWeight(exIdx, setIdx) {
  const ex = workout[exIdx];
  const baseStr = String(ex.weight || "");
  const baseNum = (baseStr.match(/(\d+(?:\.\d+)?)/) || [])[1] || null;
  const clean = baseStr.replace(/\s*\([^)]*\)\s*/g, "").trim() || baseStr;
  let dropNum = null;
  // (a) structural drop set: the last set of a dropLastSet exercise.
  if (ex.dropLastSet && setIdx === ex.sets - 1) {
    const m = baseStr.match(/(?:→|->|drop to)\s*(\d+(?:\.\d+)?)/i);
    if (m) dropNum = m[1];
  }
  // (b) auto-drop (sticky): from set 2 on, load the backoff whenever
  // stickyDropState says a drop materialized for this or any earlier set.
  if (dropNum == null && setIdx >= 1 && ex.backoff) {
    if (stickyDropState(exIdx, setIdx).dropped) {
      dropNum = (String(ex.backoff).match(/(\d+(?:\.\d+)?)/) || [])[1] || null;
    }
  }
  if (dropNum != null && dropNum !== baseNum) {
    return { dropped: true, num: dropNum, html: '<span class="wt-now">▼ ' + dropNum + ' lbs</span><span class="wt-was">from ' + baseNum + '</span>' };
  }
  return { dropped: false, num: baseNum, html: clean };
}
function setInfoHTML(exIdx, setIdx) {
  const ex = workout[exIdx];
  return effectiveWeight(exIdx, setIdx).html + "  ·  Set " + (setIdx + 1) + "/" + ex.sets + "  ·  " + ex.reps + " reps";
}

// ============ §10 RENDERING ============
// Returns the log entry the log area is displaying/editing:
// browsing → the viewed set's log (may be null for future sets);
// working during rest → the just-completed set's log.
function getActiveLogForEdit() {
  if (isBrowsing()) {
    return logAt(viewingExercise, viewingSet);
  }
  return currentLogEntry || null;
}
function renderDifficulty(log) {
  if (!elDifficultyRow) return;
  const currentDiff = log ? log.difficulty : null;
  elDifficultyRow.querySelectorAll('.diff-btn').forEach(btn => {
    btn.classList.toggle('selected', Number(btn.dataset.diff) === currentDiff);
  });
}
function renderSetLabel() {
  if (!elSetLabelText) return;
  // Show the set# of whatever log is actively being edited, not the cursor
  // position: during rest the cursor already points at the upcoming set while
  // the log-area fields hold the set just completed.
  const activeLog = getActiveLogForEdit();
  const setIdx = activeLog
    ? activeLog.set
    : (isBrowsing() ? viewingSet : currentSet);
  // Superset ambiguity: mid-pair rest, the header shows the UPCOMING exercise
  // while the log area edits the partner's just-done set -- a bare "S2" reads
  // as the wrong exercise's set. Name the exercise when they differ.
  const shownEx = isBrowsing() ? viewingExercise : currentExercise;
  if (activeLog && activeLog.exercise !== shownEx && workout[activeLog.exercise]) {
    const tag = workout[activeLog.exercise].short || workout[activeLog.exercise].name;
    elSetLabelText.textContent = tag + " S" + (setIdx + 1);
    elSetLabelText.classList.add("ctx");
  } else {
    elSetLabelText.textContent = "S" + (setIdx + 1);
    elSetLabelText.classList.remove("ctx");
  }
}
function syncLogArea() {
  const log = getActiveLogForEdit();
  if (log) {
    repCount = log.reps;
    repPicker.setValue(log.reps);
    elNotesInput.value = log.note || "";
  } else {
    // No active log (pre-first-Set-Done, or browsing a future set) — show
    // the displayed exercise's default reps so the row isn't empty.
    const exIdx = isBrowsing() ? viewingExercise : currentExercise;
    const ex = workout[exIdx];
    repCount = ex ? getMaxReps(ex.reps) : 0;
    repPicker.setValue(repCount);
    elNotesInput.value = "";
  }
  renderDifficulty(log);
  renderSetLabel();
}
function showLogArea() {
  elNotesInput.placeholder = "+ note";
  elLogArea.style.display = "flex";
  syncLogArea();
}
function hideLogArea() {
  elLogArea.style.display = "none";
}
function captureLog() {
  // Reps/notes/difficulty save in real time via input handlers; this just
  // clears the active-log reference at transition points.
  currentLogEntry = null;
}

// Sequence position of every (exercise,set) — dot completed/active semantics
// follow PERFORMED order (the interleave), not linear order, so a finished
// row S1 reads completed while press S2-S4 are still pending.
function seqPosMap() {
  const m = new Map();
  sequence.forEach((e, i) => m.set(e.ex + ":" + e.set, i));
  return m;
}
function renderProgress() {
  elProgress.innerHTML = "";
  const pos = seqPosMap();
  const isResting = (state === "resting" || state === "paused");
  const isDoingSet = (state === "ready" || state === "alert" || state === "finishing");
  for (let i = 0; i < workout.length; i++) {
    const group = document.createElement("div");
    group.className = "exercise-group";
    group.dataset.exerciseIdx = i;
    const gid = groupIdOf(i);
    if (gid) {
      group.classList.add("ss-linked");
      group.dataset.ssGroup = gid;
    }
    const dotsRow = document.createElement("div");
    dotsRow.className = "exercise-dots";
    let maxPos = -1;
    for (let j = 0; j < workout[i].sets; j++) {
      const dot = document.createElement("div");
      dot.className = "dot";
      const exIdx = i, setIdx = j;
      // Dataset drives the unified tap handler on #progress.
      dot.dataset.exerciseIdx = exIdx;
      dot.dataset.setIdx = setIdx;
      const key = exIdx + ":" + setIdx;
      const p = pos.has(key) ? pos.get(key) : 0;
      if (p > maxPos) maxPos = p;
      // A dot is "completed" only if a set was actually LOGGED for it. Position
      // alone is a lie after a reorder: reorderExercise splices the prescription
      // and rebuilds the sequence, so dragging an exercise from later to earlier
      // drops all of its unperformed sets below seqIndex, and the old
      // `p < seqIndex` test rendered every one of them as done. They then sat
      // behind the cursor and were never offered again -- silent set loss, and
      // the most likely mechanism for the 7/28 face-pull disappearance.
      // Unperformed-but-passed sets now render as "missed" instead: visible,
      // tappable, and obviously not finished.
      const isLogged = !!logAt(exIdx, setIdx);
      if (p < seqIndex && !isLogged) {
        dot.classList.add("missed");
        dot.setAttribute("role", "button");
        dot.setAttribute("aria-label", "Missed " + workout[i].name + " set " + (j + 1));
      } else if (p < seqIndex) {
        dot.classList.add("completed");
        if (p === seqIndex - 1 && isResting) {
          dot.classList.add("echoing");
        }
        dot.setAttribute("role", "button");
        dot.setAttribute("aria-label", "View " + workout[i].name + " set " + (j + 1));
      } else if (p === seqIndex) {
        dot.classList.add("active");
        if (isDoingSet) dot.classList.add("blinking");
      }
      if (exIdx === viewingExercise && setIdx === viewingSet && isBrowsing()) {
        dot.classList.add("cursor");
      }
      dotsRow.appendChild(dot);
    }
    const label = document.createElement("div");
    label.className = "exercise-label";
    if (i === currentExercise) label.classList.add("active");
    else if (maxPos < seqIndex) label.classList.add("completed");
    label.textContent = workout[i].name;
    group.appendChild(label);
    group.appendChild(dotsRow);
    if (gid) {
      if (firstMemberOfGroup(gid) === i) {
        const un = document.createElement("button");
        un.className = "ss-unlink";
        un.type = "button";
        un.textContent = "unlink";
        un.setAttribute("aria-label", "Dissolve superset " + gid);
        // Keep the tap out of the drag-reorder + dot-tap delegation.
        un.addEventListener("pointerdown", ev => ev.stopPropagation());
        un.addEventListener("pointerup", ev => ev.stopPropagation());
        un.addEventListener("click", ev => { ev.stopPropagation(); dissolveGroup(gid); });
        group.appendChild(un);
      }
    }
    elProgress.appendChild(group);
  }
}

// THE SAFETY CHANNEL. One function, two call sites (renderExercise and
// refreshSetNote), one input: exById(exId).safety. It reads nothing else and
// nothing else writes #safety-banner. That is the whole design -- an advisor
// cannot overwrite a field it has no code path to.
// textContent, not innerHTML: config prose is not markup.
function renderSafety(exId) {
  if (!elSafety) return;
  const ex = exById(exId);
  elSafety.textContent = (ex && ex.safety) ? ex.safety : "";
}

// Re-render JUST the note + weight line. Cheaper than renderExercise() and
// non-disruptive to layout. Called from rep-picker onChange + the difficulty
// handler so set N's advice updates live as the user grades set N-1.
function refreshSetNote() {
  const exIdx = isBrowsing() ? viewingExercise : currentExercise;
  const setIdx = isBrowsing() ? viewingSet : currentSet;
  // Weight refreshes too: grading the prior set can flip the upcoming set to
  // a reactive drop, and the loaded weight must track that live.
  elSet.innerHTML = setInfoHTML(exIdx, setIdx);
  renderSafety(exIdAt(exIdx));
  const info = computeSetNoteInfo(exIdx, setIdx);
  elNote.textContent = info.text;
  elNote.classList.toggle("advisor", info.advisor);
  fitNoteToBox();
}

function renderExercise() {
  // Browsing shows the viewed set's context; otherwise the working set's.
  const exIdx = isBrowsing() ? viewingExercise : currentExercise;
  let setIdx = isBrowsing() ? viewingSet : currentSet;
  const ex = workout[exIdx];
  // Finishing state: currentSet already ran past the last index (setDone
  // increments before detecting the end) -- unclamped, a browse-and-return
  // on the finish screen renders "Set 5/4".
  if (state === "finishing" && setIdx >= ex.sets) setIdx = ex.sets - 1;
  elName.textContent = ex.name;
  elSet.innerHTML = setInfoHTML(exIdx, setIdx);
  // Every display path funnels through here, so the banner tracks whichever
  // exercise is on screen -- including a browse of another machine's set.
  renderSafety(ex.id);
  const noteInfo = computeSetNoteInfo(exIdx, setIdx);
  elNote.textContent = noteInfo.text;
  elNote.classList.toggle("advisor", noteInfo.advisor);
  fitNoteToBox();
  renderProgress();
  requestAnimationFrame(centerMainButton);
}

// Auto-shrink long notes to the note card's ACTUAL height; 1-2 line notes
// keep the default size, only true 3+ line overflow steps down.
function fitNoteToBox() {
  if (!elNote) return;
  elNote.style.fontSize = '';
  elNote.style.lineHeight = '';
  if (!elNote.textContent) return;
  const maxHeight = elNote.clientHeight || 70;
  if (elNote.scrollHeight <= maxHeight) return;
  for (let fs = 18; fs >= 8; fs -= 0.5) {
    elNote.style.fontSize = fs + 'px';
    elNote.style.lineHeight = '1.22';
    if (elNote.scrollHeight <= maxHeight) return;
  }
  elNote.style.fontSize = '8px';
  elNote.style.lineHeight = '1.15';
}

function formatTime(seconds) {
  // Always ceil (handles floats from precise pause/resume math).
  const total = Math.max(0, Math.ceil(seconds));
  const m = Math.floor(total / 60);
  const s = total % 60;
  return `${m}:${s.toString().padStart(2, "0")}`;
}

// GO alert: restart the digit-nudge animation via class re-add.
function startFlash() {
  document.body.classList.remove('alert-flashing');
  void document.body.offsetWidth;
  document.body.classList.add('alert-flashing');
}
function stopFlash() {
  document.body.classList.remove('alert-flashing');
}

// Rest ring: arc + comet head track the remaining fraction.
function updateRestRing() {
  // While paused, restEndTime is frozen in the past -- the live value is the
  // captured restRemaining. Without this branch, a reload while paused
  // rendered the ring EMPTY instead of the paused fraction.
  let remaining;
  if (state === "paused" && restTotalSeconds) {
    remaining = Math.max(0, restRemaining);
  } else if (restEndTime && restTotalSeconds) {
    remaining = Math.max(0, (restEndTime - Date.now()) / 1000);
  } else {
    elRingBar.setAttribute("stroke-dashoffset", RING_CIRCUMFERENCE);
    if (elRingHead) elRingHead.setAttribute("r", "0");
    return;
  }
  const fraction = Math.max(0, Math.min(1, remaining / restTotalSeconds));
  const offset = RING_CIRCUMFERENCE * (1 - fraction);
  elRingBar.setAttribute("stroke-dashoffset", offset);
  if (elRingHead) {
    const a = 2 * Math.PI * fraction;
    elRingHead.setAttribute("r", fraction > 0 ? "3.4" : "0");
    elRingHead.setAttribute("cx", (92 + 88 * Math.cos(a)).toFixed(2));
    elRingHead.setAttribute("cy", (92 + 88 * Math.sin(a)).toFixed(2));
  }
}
function showRestRing(show, paused) {
  elBtnWrap.classList.toggle("show-ring", !!show);
  elBtnWrap.classList.toggle("paused", !!paused);
}

// Timer display modes: t-final (red digits, last 10s of a rest) and
// t-elapsed (dim session chronograph). Countdown/transition writers clear
// them; the tickers re-apply what their state warrants.
function clearTimerModes() {
  elTimer.classList.remove("t-final");
  elTimer.classList.remove("t-elapsed");
}

// Session chronograph: under the bar (ready) and while logging the last set
// (finishing), the big display shows dim elapsed time instead of a dead
// "-:--". Countdown states own the display otherwise.
function updateElapsedDisplay() {
  if ((state === "ready" || state === "finishing") && workoutStartTime) {
    elTimer.textContent = formatTime((Date.now() - workoutStartTime) / 1000);
    elTimer.classList.add("t-elapsed");
    if (state === "ready" && !elTimerLabel.textContent) {
      elTimerLabel.textContent = "ELAPSED";
    }
  }
}
setInterval(updateElapsedDisplay, 1000);

// Pre-start footer: "21 SETS · ~35 MIN" -- walks the interleaved sequence and
// prices each transition the way the engine will run it (superset GO = free,
// filler→anchor = pair rest, boundary = 0/60s by the skip-rest setting).
function sessionPlanLabel() {
  const setCount = sequence.length;
  let restSum = 0;
  for (let i = 0; i < sequence.length - 1; i++) {
    const cur = sequence[i], nxt = sequence[i + 1];
    if (cur.ex === nxt.ex) { restSum += workout[cur.ex].rest || 0; continue; }
    const g = groupIdOf(cur.ex);
    const hop = g && groupIdOf(nxt.ex) === g;
    if (hop && slotOf(cur.ex) === 1) continue;
    if (hop) { restSum += workout[nxt.ex].rest || 0; continue; }
    if (!settings.skipExerciseRest) restSum += 60;
  }
  const est = Math.round((setCount * 45 + restSum) / 60);
  return setCount + " SETS · ~" + est + " MIN";
}

// Position the main dial so its vertical center sits at the midpoint of
// (timer-display bottom, difficulty-row top), from real rendered coordinates.
// Adaptive size: 184 down to a 104px tap-target floor -- at 375x667 the slot
// is smaller than any fixed size, so the dial shrinks to fit (7/5 layout
// hunt), stepping the label font down when compact.
function centerMainButton() {
  if (!elTimer || !elTimerLabel || !elDifficultyRow || !elBtnWrap || !elBtn) return;
  const labelRect = elTimerLabel.getBoundingClientRect();
  const diffRect = elDifficultyRow.getBoundingClientRect();
  // Anchor the slot bottom on the difficulty row when the log area is shown,
  // else on the bottom bar (pre-start hides the log area).
  const barRect = elBottomBar ? elBottomBar.getBoundingClientRect() : null;
  const anchorTop = (diffRect.height > 0) ? diffRect.top : (barRect ? barRect.top : 0);
  if (!anchorTop) return;
  // 24px of air above and below the dial is a luxury on an SE-class screen, and
  // v8's safety banner spends ~28px of the same budget. Measured 2026-08-05 at
  // 375x667 mid-rest: the slot fell to 81px while btnH clamped to its 104px
  // floor, so the dial OVERFLOWED its own slot by ~11px each way -- it still
  // cleared the difficulty row, but only because the 24px clearance absorbed
  // the overflow, which means the clearance was never really 24px. Spending it
  // deliberately at compact heights is honest; letting the clamp silently eat
  // it is not. Roomy screens keep the full 24.
  const compact = (window.innerHeight <= 740);
  const CLEAR_ABOVE = compact ? 14 : 24;
  const CLEAR_BELOW = compact ? 14 : 24;
  const MAX_BTN = 184;
  const MIN_BTN = 104;
  const slotTop = labelRect.bottom + CLEAR_ABOVE;
  const slotBottom = anchorTop - CLEAR_BELOW;
  const slotHeight = Math.max(0, slotBottom - slotTop);
  const btnH = Math.max(MIN_BTN, Math.min(MAX_BTN, slotHeight));
  if (btnH < 140) {
    elBtn.style.fontSize = "11px";
    elBtn.style.letterSpacing = "1px";
  } else {
    elBtn.style.fontSize = "";
    elBtn.style.letterSpacing = "";
  }
  elBtnWrap.style.width = btnH + "px";
  elBtnWrap.style.height = btnH + "px";
  elBtn.style.width = (btnH - 4) + "px";
  elBtn.style.height = (btnH - 4) + "px";
  const top = slotTop + (slotHeight - btnH) / 2;
  elBtnWrap.style.top = top + "px";
  elBtnWrap.style.transform = "translateX(-50%)";
  // Keep the NOW/SET pills centered on the dial (they float at its left).
  if (elPillsStack) elPillsStack.style.top = (top + btnH / 2) + "px";
}

// ============ §11 STATE MACHINE ============
function startCountdown() {
  if (timerInterval) clearInterval(timerInterval);
  updateRestRing();
  // 100ms updates = smooth ring without CSS transitions.
  timerInterval = setInterval(() => {
    const remaining = Math.max(0, (restEndTime - Date.now()) / 1000);
    if (remaining <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      updateRestRing();
      restDone();
    } else {
      restRemaining = remaining;
      const secCeil = Math.ceil(remaining);
      maybeFireCountdownCue(secCeil);
      elTimer.textContent = formatTime(secCeil);
      elTimer.classList.toggle("t-final", secCeil <= 10);
      updateRestRing();
    }
  }, 100);
}

// Render the UI for the current state. notesValue seeds the notes field
// (restore path); syncLogArea overrides per-branch values with the active
// log's data at the end.
function applyState(notesValue) {
  showRestRing(false, false);
  clearTimerModes();

  if (state === "resting" && restEndTime) {
    const remaining = Math.ceil((restEndTime - Date.now()) / 1000);
    if (remaining <= 0) {
      state = "alert";
      restEndTime = null;
      renderExercise();
      elTimer.textContent = "0:00";
      elTimerLabel.textContent = "GO";
      elBtn.textContent = "Start Set";
      elBtn.className = "go";
      elSkip.style.display = "none";
      elLogArea.style.display = "flex";
      startFlash();
      triggerAlertFeedback();
      // Restored into an already-expired rest: no user gesture yet, so a
      // play now would silent-fail -- queue for the first real tap.
      playOrQueue(restEndCueSeq());
    } else {
      restRemaining = remaining;
      renderExercise();
      elTimer.textContent = formatTime(remaining);
      elTimerLabel.textContent = "REST";
      elBtn.textContent = "Pause";
      elBtn.className = "resting";
      elSkip.style.display = "flex";
      elLogArea.style.display = "flex";
      repPicker.setValue(repCount);
      elNotesInput.value = notesValue;
      showRestRing(true, false);
      requestWakeLock();
      scheduleRestNotif(remaining * 1000);
      startCountdown();
    }
  } else if (state === "alert") {
    renderExercise();
    elTimer.textContent = "0:00";
    elTimerLabel.textContent = "GO";
    elBtn.textContent = "Start Set";
    elBtn.className = "go";
    elSkip.style.display = "none";
    elLogArea.style.display = "flex";
    elNotesInput.value = notesValue;
    startFlash();
    triggerAlertFeedback();
  } else if (state === "paused") {
    renderExercise();
    elTimer.textContent = formatTime(restRemaining);
    elTimerLabel.textContent = "PAUSED";
    elBtn.textContent = "Resume";
    elBtn.className = "paused";
    elSkip.style.display = "flex";
    elLogArea.style.display = "flex";
    repPicker.setValue(repCount);
    elNotesInput.value = notesValue;
    showRestRing(true, true);
    updateRestRing();
  } else if (state === "finishing") {
    renderExercise();
    elBtn.textContent = "Finish";
    elBtn.className = "go";
    elTimer.textContent = "-:--";
    elTimerLabel.textContent = "LOG YOUR LAST SET";
    elSkip.style.display = "none";
    elLogArea.style.display = "flex";
    repPicker.setValue(repCount);
    elNotesInput.value = notesValue;
  } else if (state === "ready") {
    renderExercise();
    elTimer.textContent = "-:--";
    elTimerLabel.textContent = "";
    elBtn.textContent = "Set Done";
    elBtn.className = "";
    elSkip.style.display = "none";
    elLogArea.style.display = "flex";
    elNotesInput.value = notesValue;
  } else if (state === "pre-start") {
    // Workout hasn't begun. The Start tap plays the day-name + first-exercise
    // audio, records workoutStartTime, and transitions to "ready".
    renderExercise();
    // Chronograph at zero + the session plan (set count, honest time estimate
    // priced off the interleave + rest config).
    elTimer.textContent = "0:00";
    elTimer.classList.add("t-elapsed");
    elTimerLabel.textContent = sessionPlanLabel();
    elBtn.textContent = "Start Workout";
    elBtn.className = "go";
    elSkip.style.display = "none";
    elLogArea.style.display = "none";
  } else {
    renderExercise();
  }
  // Disable the dial + show the return pills while browsing.
  if (isBrowsing()) {
    elBtn.style.opacity = '0.35';
    elBtn.style.pointerEvents = 'none';
    elReturnPill.classList.add('visible');
    elSetCurrentBtn.classList.add('visible');
    elBtn.classList.add('browsing');
    elLogArea.style.display = 'flex';
  } else {
    elBtn.style.opacity = '';
    elBtn.style.pointerEvents = '';
    elReturnPill.classList.remove('visible');
    elSetCurrentBtn.classList.remove('visible');
    elBtn.classList.remove('browsing');
    // Log area stays visible in non-finished states. Pre-start is excluded:
    // nothing exists to log yet, and an unconditional re-show would override
    // the pre-start branch's hide (7/5 layout hunt).
    if (state !== 'finished' && state !== 'pre-start') elLogArea.style.display = 'flex';
  }
  // Sync the log area with the active log entry (overrides the per-branch
  // repPicker/notes seeds above).
  if (elLogArea.style.display === 'flex') syncLogArea();
  updateElapsedDisplay();
}

// Pre-start → ready. Records the workout start (real set-1 duration, session
// chronograph anchor) and plays the day-type + first-exercise cue (the tap
// is the audio-unlock gesture on iOS).
function startWorkout() {
  workoutStartTime = Date.now();
  pendingPostGestureCues.length = 0;
  state = "ready";
  applyState("");
  saveState();
  const startClip = dayType.toLowerCase().includes("upper") ? 'start-upper' : 'start-lower';
  // First exercise = the sequence head (with supersets still the first
  // anchor, but a slot-2-first config would start elsewhere than workout[0]).
  const first = sequence[0] || { ex: 0, set: 0 };
  const firstEx = workout[first.ex];
  const firstExClip = exerciseClipName(firstEx && firstEx.name);
  const seq = [startClip, firstExClip].filter(Boolean);
  if (firstEx) {
    seq.push(...weightClipsFor(firstEx));
    const repClip = repRangeClipFor(firstEx.reps);
    if (repClip) seq.push(repClip);
  }
  if (seq.length) VoiceCue.playSequence(seq);
}

function setDone() {
  stopFlash();
  // Any announcement queued while audio was suspended (e.g. the rest-expiry
  // cue from a phone-in-pocket rest) is STALE -- the user just acted on the
  // state it described. Without this clear, the first tap after returning to
  // the tab replayed "rest complete, set N..." over the new "received" cue.
  pendingPostGestureCues.length = 0;
  // Read in-progress inputs BEFORE creating the new log entry so reps/
  // difficulty/notes set DURING the set carry over instead of getting
  // clobbered by defaults.
  const draftReps = repCount;
  const draftNote = elNotesInput.value || "";
  const selectedDiffBtn = elDifficultyRow.querySelector('.diff-btn.selected');
  // No difficulty tapped => MAX (5). Soren's call 2026-07-29. An UNGRADED set was
  // not neutral -- it silently DISABLED the load logic: the auto-drop predicate
  // reads `+last.difficulty || 0` (never HARD/MAX, so it cannot fire) and
  // computeSetNote's history walk BREAKS on `difficulty == null`. So a set he
  // simply forgot to grade turned off the very mechanism meant to protect him.
  // Defaulting to MAX fails SAFE: it assumes the set was maximal, so the drop
  // fires rather than leaving him grinding a load he can no longer hold.
  // The grade stays fully editable after the fact via the set pill.
  const DEFAULT_DIFF = 5;
  const draftDiff = selectedDiffBtn ? Number(selectedDiffBtn.dataset.diff) : DEFAULT_DIFF;
  captureLog();

  // Dedup: re-logging an already-logged (exercise,set) — e.g. after browsing
  // back via the ↓SET pill — must UPDATE that entry, not append a second one.
  // Reads take the first match, so a duplicate would shadow the correction:
  // stale reps in the summary, the fresh edit unreachable.
  const exNow = workout[currentExercise];
  let logEntry = logAt(currentExercise, currentSet);
  if (logEntry) {
    // A re-log edits only the mutable fields. weightLbs/dropped/rest*/at stay
    // exactly as they were stamped -- the set was already performed at that
    // weight, and no later keystroke gets to change what happened.
    logEntry.reps = draftReps;
    logEntry.note = draftNote;
    logEntry.difficulty = draftDiff;
    logEntry.editedAt = Date.now();
  } else {
    const at = Date.now();
    // FREEZE THE WEIGHT HERE, from the same effectiveWeight() the screen was
    // showing while he stood at the machine. From this line on, every reader
    // describing a PERFORMED set reads entry.weightLbs; effectiveWeight() is
    // only ever asked about PENDING sets again.
    const eff = effectiveWeight(currentExercise, currentSet);
    const effNum = (eff.num == null) ? NaN : parseFloat(eff.num);
    const prescribed = parseFloat((String(exNow.weight || "").match(/(\d+(?:\.\d+)?)/) || [])[1]);
    // Actual rest = gap since the previous set OF THIS EXERCISE, minus any
    // time the session spent paused. That number is what the commit-F trigger
    // gate reads to catch a rep count inflated by an 8-minute wander.
    const prev = performedOf(exNow.id).slice(-1)[0] || null;
    const restActualSec = prev
      ? Math.max(0, Math.round(((at - prev.at) - (pausedCumMs - (prev.pausedCumMs || 0))) / 1000))
      : null;
    logEntry = {
      kind: "set",
      n: ++ledgerSeq,
      exId: exNow.id,
      set: currentSet + 1,
      reps: draftReps,
      difficulty: draftDiff,
      note: draftNote,
      weightLbs: isFinite(effNum) ? effNum : null,
      prescribedLbs: isFinite(prescribed) ? prescribed : null,
      dropped: !!eff.dropped,
      pairId: null,                       // explicit pairs arrive in commit E
      restPlannedSec: exNow.rest || null,
      restActualSec: restActualSec,
      pausedCumMs: pausedCumMs,
      at: at,
      editedAt: null
    };
    ledger.push(logEntry);
  }
  currentLogEntry = logEntry;

  const finishedExercise = currentExercise;
  const finishedSet = currentSet;
  // Exercise just completed its final set with the advance trigger banked →
  // celebrate (voice + dots pulse); the summary flags the advance.
  const bankedTrigger = (finishedSet === workout[finishedExercise].sets - 1) &&
    exerciseTriggerHit(finishedExercise);
  clearTimerModes();
  // SUPERSET ENGINE: advancement walks `sequence` (interleaved order), not
  // (exercise, set++). Sync first in case an external path (jump-to-set,
  // restore) moved the cursor without updating seqIndex.
  if (!sequence[seqIndex] || sequence[seqIndex].ex !== finishedExercise || sequence[seqIndex].set !== finishedSet) {
    syncSeqIndex();
  }
  const nextEntry = sequence[seqIndex + 1] || null;
  currentSet++;

  showLogArea();

  const isLastSet = !nextEntry;
  if (isLastSet) {
    viewingExercise = currentExercise;
    viewingSet = currentSet - 1;
    elBtn.textContent = "Finish";
    elBtn.className = "go";
    state = "finishing";
    elTimer.textContent = "-:--";
    elTimerLabel.textContent = "LOG YOUR LAST SET";
    elSkip.style.display = "none";
    showRestRing(false);
    renderProgress();
    if (bankedTrigger) pulseTriggerHit(finishedExercise);
    updateElapsedDisplay();
    VoiceCue.playSequence(bankedTrigger
      ? ['received', 'cue-trigger-hit', 'final-set-logged']
      : ['received', 'final-set-logged']);
    requestAnimationFrame(() => { saveState(); });
    return;
  }

  // Advance along the interleaved sequence.
  seqIndex++;
  currentExercise = nextEntry.ex;
  currentSet = nextEntry.set;

  // Keep the viewing cursor pinned to the working position.
  viewingExercise = currentExercise;
  viewingSet = currentSet;

  const switchingExercise = (finishedExercise !== currentExercise);
  const gFin = groupIdOf(finishedExercise);
  const supersetHop = switchingExercise && !!gFin && groupIdOf(currentExercise) === gFin;
  // Anchor (slot 1) → filler (slot 2): GO immediately -- the walk between
  // machines IS the transition (Soren's superset spec 7/6).
  const supersetGo = supersetHop && slotOf(finishedExercise) === 1;
  // Filler → anchor: the REAL pair rest (the upcoming anchor's full rest).
  const supersetReturn = supersetHop && !supersetGo;

  // IMMEDIATE hops: a superset GO (always), or an exercise boundary with the
  // skip-rest setting ON (Soren 7/5): no countdown, the voice announces the walk.
  if (supersetGo || (switchingExercise && !supersetHop && settings.skipExerciseRest)) {
    state = "ready";
    restEndTime = null;
    restRemaining = 0;
    restTotalSeconds = 0;
    // The old UP NEXT rest was an accidental double-tap guard at exercise
    // boundaries. Without it, a bounce-tap on Set Done would instantly log a
    // phantom S1 -- brief lockout instead.
    setDoneLockUntil = Date.now() + 900;
    elTimer.textContent = "-:--";
    elTimerLabel.textContent = supersetGo
      ? ("SUPERSET → " + (workout[currentExercise].short || workout[currentExercise].name).toUpperCase())
      : "";
    elBtn.textContent = "Set Done";
    elBtn.className = "";
    elSkip.style.display = "none";
    renderExercise();
    showRestRing(false);
    // Reset the log area to the NEW exercise's upcoming-set defaults (the
    // rested path does this at rest-end) -- otherwise the previous exercise's
    // just-logged set carried onto the next machine's screen (7/5 hunt).
    // Last-set corrections still work via the progress-dot edit modal.
    captureLog();
    syncLogArea();
    {
      const isFinalExercise = !sequence.slice(seqIndex + 1).some(e => e.ex !== currentExercise);
      const exClip = exerciseClipName(workout[currentExercise].name);
      // supersetGo: the finished exercise is NOT complete (more of its sets
      // pend in the interleave) -- no 'exercise-complete', keep the cue tight.
      const seq = supersetGo ? ['received'] : ['received', 'exercise-complete'];
      if (bankedTrigger) seq.splice(1, 0, 'cue-trigger-hit');
      seq.push(isFinalExercise ? 'final-exercise' : 'up-next');
      if (exClip) seq.push(exClip);
      // Weight/reps announce only on the exercise's FIRST set; re-announcing
      // every superset hop is noise.
      if (currentSet === 0) {
        seq.push(...weightClipsFor(workout[currentExercise]));
        const repClipSkip = repRangeClipFor(workout[currentExercise].reps);
        if (repClipSkip) seq.push(repClipSkip);
      }
      // A drop that just materialized for the upcoming set: state the new
      // weight now, while he's at the machine setting the pin.
      seq.push(...dropAnnounceClips(currentExercise, currentSet));
      VoiceCue.playSequence(seq);
    }
    if (bankedTrigger) pulseTriggerHit(finishedExercise);
    updateElapsedDisplay();
    requestAnimationFrame(() => {
      initAudio();
      requestWakeLock();
      saveState();
    });
    return;
  }

  elSkip.style.display = "flex";
  elSkip.style.pointerEvents = "auto";
  state = "resting";
  restRemaining = supersetReturn ? workout[currentExercise].rest
                : switchingExercise ? 60
                : workout[finishedExercise].rest;
  restTotalSeconds = restRemaining;
  restEndTime = Date.now() + restRemaining * 1000;
  elTimer.textContent = formatTime(restRemaining);
  elTimerLabel.textContent = (switchingExercise && !supersetReturn) ? "UP NEXT" : "REST";
  elBtn.textContent = "Pause";
  elBtn.className = "resting";
  renderExercise();
  // Re-render the set label AFTER the cursor advanced: the pre-advancement
  // showLogArea render can't know the header now shows a different exercise
  // than the log being edited (the superset-return "CALVES S1" tag case).
  renderSetLabel();
  showRestRing(true, false);
  countdownFiredThresholds = new Set();
  startCountdown();

  if (bankedTrigger) pulseTriggerHit(finishedExercise);

  // Voice: "Received" then branch (superset return / exercise switch / in-exercise rest).
  {
    let seq;
    if (supersetReturn) {
      // Back to the anchor after the filler set: where we're headed + the
      // pair rest. No 'exercise-complete' (the pair is mid-flight), no weight
      // re-announce (same weight all sets; announced at the anchor's S1).
      const exClip = exerciseClipName(workout[currentExercise].name);
      seq = ['received', 'up-next'];
      if (exClip) seq.push(exClip);
      seq.push(...dropAnnounceClips(currentExercise, currentSet));
      const pairRestClip = restClipForDuration(restRemaining);
      if (pairRestClip) seq.push(pairRestClip);
    } else if (switchingExercise) {
      const isFinalExercise = !sequence.slice(seqIndex + 1).some(e => e.ex !== currentExercise);
      const exClip = exerciseClipName(workout[currentExercise].name);
      seq = ['received', 'exercise-complete'];
      seq.push(isFinalExercise ? 'final-exercise' : 'up-next');
      if (exClip) seq.push(exClip);
      seq.push(...weightClipsFor(workout[currentExercise]));
      const repClipSwitch = repRangeClipFor(workout[currentExercise].reps);
      if (repClipSwitch) seq.push(repClipSwitch);
      const switchRestClip = restClipForDuration(restRemaining);
      if (switchRestClip) seq.push(switchRestClip);
    } else {
      const restClip = restClipForDuration(workout[finishedExercise].rest);
      seq = restClip ? ['received', restClip] : ['received'];
      // In-exercise rest: the drop the just-logged set may have triggered
      // applies to the very next set -- announce the backoff weight once.
      seq.push(...dropAnnounceClips(currentExercise, currentSet));
    }
    if (bankedTrigger) seq.splice(1, 0, 'cue-trigger-hit');
    VoiceCue.playSequence(seq);
  }

  // Defer non-critical work a frame so the UI updates immediately.
  requestAnimationFrame(() => {
    initAudio();
    requestWakeLock();
    ensureNotifPermission();
    scheduleRestNotif(Math.max(0, restEndTime - Date.now()));
    saveState();
  });
}

function restDone() {
  if (state !== "resting") return;
  cancelRestNotif();
  captureLog();
  clearTimerModes();
  showRestRing(false);

  if (settings.autoStart) {
    state = "ready";
    elTimer.textContent = "-:--";
    elTimerLabel.textContent = "GO";
    elBtn.textContent = "Set Done";
    elBtn.className = "";
    elSkip.style.display = "none";
    renderExercise();
  } else {
    state = "alert";
    elTimer.textContent = "0:00";
    elTimerLabel.textContent = "GO";
    elBtn.textContent = "Start Set";
    elBtn.className = "go";
    elSkip.style.display = "none";
    renderExercise();
  }
  elLogArea.style.display = "flex";
  syncLogArea();
  startFlash();
  updateElapsedDisplay();
  // If we landed here from visibilitychange with the context still suspended
  // (no gesture since tab-return), a play now would silent-fail and the cue
  // would be lost -- queue for the gesture-recovery drain instead.
  playOrQueue(restEndCueSeq());
  requestAnimationFrame(() => {
    triggerAlertFeedback();
    saveState();
  });
}

function pauseRest() {
  captureLog();
  pendingPostGestureCues.length = 0;
  cancelRestNotif();
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  // Capture EXACT remaining (float seconds) so resume doesn't round-up jump.
  restRemaining = Math.max(0, (restEndTime - Date.now()) / 1000);
  state = "paused";
  // Paused wall-clock is excluded from restActualSec: a rest he deliberately
  // froze is not the same evidence as a rest he wandered away from, and only
  // the second one should be able to demote a trigger (commit F).
  if (pauseStartedAt == null) pauseStartedAt = Date.now();
  clearTimerModes();
  elBtn.textContent = "Resume";
  elBtn.className = "paused";
  elTimerLabel.textContent = "PAUSED";
  showRestRing(true, true);
  renderProgress();
  saveState();
  VoiceCue.cancel();
  VoiceCue.play('paused');
}

// Close an open pause window and bank its duration. Called from EVERY exit out
// of "paused" -- Resume and Skip Rest both -- because a window left open would
// keep accruing into the next set's restActualSec forever.
function closePauseWindow() {
  if (pauseStartedAt == null) return;
  pausedCumMs += Math.max(0, Date.now() - pauseStartedAt);
  pauseStartedAt = null;
}

function resumeRest() {
  captureLog();
  closePauseWindow();
  state = "resting";
  elBtn.textContent = "Pause";
  elBtn.className = "resting";
  elTimerLabel.textContent = "REST";
  showRestRing(true, false);
  renderProgress();
  // Restart the clock IMMEDIATELY -- the old code deferred restEndTime until
  // the 'resumed' cue finished, and pausing again inside that window read the
  // stale (expired) restEndTime and zeroed the rest. The cue plays over the
  // running countdown.
  restEndTime = Date.now() + restRemaining * 1000;
  scheduleRestNotif(restRemaining * 1000);
  saveState();
  startCountdown();
  VoiceCue.cancel();
  VoiceCue.play('resumed');
}

function skipRest() {
  // Re-entry guard: the skip button defers this 160ms for its press
  // animation, so a rapid double-tap queued TWO calls -- the second re-ran
  // the whole transition. State has already moved on; bail.
  if (state !== "resting" && state !== "paused") return;
  closePauseWindow();
  VoiceCue.cancel();
  // A queued rest-expiry announcement is stale the moment he skips.
  pendingPostGestureCues.length = 0;
  cancelRestNotif();
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  captureLog();
  showRestRing(false);
  state = "ready";
  clearTimerModes();
  elTimer.textContent = "-:--";
  elTimerLabel.textContent = "";
  elBtn.textContent = "Set Done";
  elBtn.className = "";
  elSkip.style.display = "none";
  renderExercise();
  elLogArea.style.display = "flex";
  syncLogArea();
  updateElapsedDisplay();
  saveState();
  // Voice (Soren 7/4): a skip plays NOTHING. He tapped it -- he knows the
  // rest is over and the screen already shows what's next. User-initiated
  // actions get silence, not announcements.
}

function acknowledgeAlert() {
  captureLog();  // pin any pending reps/notes to the log entry
  stopFlash();
  // The queued cue (if any) IS this alert's announcement -- acting on it
  // makes it stale.
  pendingPostGestureCues.length = 0;
  state = "ready";
  clearTimerModes();
  elTimer.textContent = "-:--";
  elTimerLabel.textContent = "";
  elBtn.textContent = "Set Done";
  elBtn.className = "";
  renderExercise();
  updateElapsedDisplay();
  saveState();
}

function finishWorkout() {
  cancelRestNotif();
  releaseWakeLock();
  captureLog();
  hideLogArea();
  showRestRing(false);
  state = "finished";
  elDayTitle.style.display = "none";
  elName.style.display = "none";
  elSet.style.display = "none";
  if (elSafety) { elSafety.textContent = ""; elSafety.style.display = "none"; }
  elNote.style.display = "none";
  elTimer.style.display = "none";
  elTimerLabel.style.display = "none";
  elBtnWrap.style.display = "none";
  elSkip.style.display = "none";
  elProgress.style.display = "none";
  elReturnPill.classList.remove('visible');
  elSetCurrentBtn.classList.remove('visible');
  elSettingsBtn.style.display = "none";
  elDone.style.display = "block";
  document.body.classList.add('finished');
  elSummary.innerHTML = buildSummaryHTML();
  // Auto-copy the summary on finish (runs inside the Set-Done tap gesture, so
  // writeText has transient activation). The button stays as a fallback.
  try {
    navigator.clipboard.writeText(buildSummary()).then(() => {
      elCopy.textContent = "Copied ✓ (auto)";
      elCopy.className = "copied";
      setTimeout(() => { elCopy.textContent = "Copy Summary"; elCopy.className = ""; }, 2500);
    }).catch(() => {});
  } catch(e) {}
  // Insurance: the finished summary survives a closed tab (state is wiped
  // below, clipboard writes can fail). Retrievable from localStorage.
  try {
    localStorage.setItem("gym-timer-last-summary",
      JSON.stringify({ at: Date.now(), text: buildSummary() }));
  } catch(e) {}
  try { localStorage.removeItem("gym-timer-state"); } catch(e) {}
  VoiceCue.cancel();
  pendingPostGestureCues.length = 0;
  VoiceCue.play('workout-complete');
  if (_audioKeepaliveInterval) {
    clearInterval(_audioKeepaliveInterval);
    _audioKeepaliveInterval = null;
  }
}

// ============ §12 BROWSING CURSOR (tap-to-cycle) ============
function cycleView(exIdx, setIdx) {
  // Second tap on the already-viewed completed set opens the edit modal.
  if (viewingExercise === exIdx && viewingSet === setIdx && isBrowsing()) {
    if (logAt(exIdx, setIdx)) { openEditModal(exIdx, setIdx); return; }
  }
  viewingExercise = exIdx;
  viewingSet = setIdx;
  renderExercise();
  elReturnPill.classList.toggle('visible', isBrowsing());
  elSetCurrentBtn.classList.toggle('visible', isBrowsing());
  if (isBrowsing()) {
    elBtn.style.opacity = '0.35';
    elBtn.style.pointerEvents = 'none';
    // Log area stays visible so the viewed set's reps/notes/diff are editable.
    elLogArea.style.display = 'flex';
    // Diagonal slash signals Set Done is inaccessible in view mode; the rest
    // timer keeps running internally.
    elBtn.classList.add('browsing');
  } else {
    elBtn.style.opacity = '';
    elBtn.style.pointerEvents = '';
    elBtn.classList.remove('browsing');
  }
  syncLogArea();
  saveState();
}

function returnToWorking() {
  viewingExercise = currentExercise;
  viewingSet = currentSet;
  renderExercise();
  elReturnPill.classList.remove('visible');
  elSetCurrentBtn.classList.remove('visible');
  elBtn.style.opacity = '';
  elBtn.style.pointerEvents = '';
  elBtn.classList.remove('browsing');
  if (state !== 'finished') {
    elLogArea.style.display = 'flex';
  } else {
    elLogArea.style.display = 'none';
  }
  syncLogArea();
  saveState();
}

// ============ §13 REORDER + BOARD TAPS ============
// Transform an exercise index across a splice(from,1) + splice(to,0,moved).
function transformExerciseIdx(ei, fromIdx, toIdx) {
  if (ei === fromIdx) return toIdx;
  if (fromIdx < ei && ei <= toIdx) return ei - 1;
  if (toIdx <= ei && ei < fromIdx) return ei + 1;
  return ei;
}

function reorderExercise(fromIdx, toIdx) {
  if (fromIdx === toIdx) return;
  if (fromIdx < 0 || fromIdx >= workout.length) return;
  if (toIdx < 0 || toIdx >= workout.length) return;

  VoiceCue.cancel();

  // The edit modal's editingLog reference survives a reorder (ledger entries
  // are identity-keyed, so a drag touches none of them), but a displayed
  // exercise NAME could go stale. Close to be safe.
  if (elEditModal.classList.contains("show")) closeEditModal();

  const moved = workout.splice(fromIdx, 1)[0];
  workout.splice(toIdx, 0, moved);

  // Remap every live exercise-index reference. The LEDGER is deliberately not
  // in this list: its entries key on ex.id, so a reorder cannot re-point a
  // logged set at a different machine. That rewrite-every-log-on-every-drag
  // pass is exactly the class of bug identity keys exist to delete.
  const remap = (ei) => transformExerciseIdx(ei, fromIdx, toIdx);
  currentExercise = remap(currentExercise);
  viewingExercise = remap(viewingExercise);

  // Superset groups ride on the exercise objects (ss tags), which just moved:
  // re-derive the interleaved sequence and re-locate the working cursor.
  rebuildSequence();

  renderExercise();  // rerenders name/weight/reps + board
  saveState();
}

// Long-press (600ms) + wide touchStartThreshold keeps taps from triggering
// drag. GUARD: Sortable comes from a CDN -- at the gym (spotty signal /
// offline reload) that fetch can fail, and an unguarded Sortable.create THREW
// here, killing every statement below it: VoiceCue.init (zero audio all
// session), restoreState (lost mid-workout state), and the tap handlers.
// Degrade to "no drag-reorder" instead.
let sortable = null;
try {
  if (typeof Sortable !== 'undefined') {
    sortable = Sortable.create(elProgress, {
      animation: 180,
      easing: "cubic-bezier(0.2, 0, 0, 1)",
      delay: 600,
      delayOnTouchOnly: true,
      touchStartThreshold: 15,
      forceFallback: true,
      fallbackTolerance: 6,
      fallbackOnBody: false,
      direction: 'horizontal',
      draggable: '.exercise-group',
      ghostClass: "sortable-ghost",
      chosenClass: "sortable-chosen",
      dragClass: "sortable-drag",
      onChoose() {
        if (elEditModal.classList.contains("show") || elSettingsModal.classList.contains("show")) {
          sortable.option("disabled", true);
          queueMicrotask(() => sortable.option("disabled", false));
          return;
        }
        document.body.classList.add("dragging-exercise");
      },
      onEnd(evt) {
        setTimeout(() => document.body.classList.remove("dragging-exercise"), 50);
        const from = evt.oldIndex;
        const to = evt.newIndex;
        if (from == null || to == null || from === to) return;
        reorderExercise(from, to);
      },
    });
  }
} catch (e) {}

// Tap-to-cycle via RAW touch events (bypasses SortableJS's click suppression
// on iOS). Click fallback for desktop. lastTouchTapTime dedupes the synthetic
// click iOS generates after touchend.
let tapStart = null;
let lastTouchTapTime = 0;

function handleTap(target) {
  if (!target) return false;
  if (document.body.classList.contains("dragging-exercise")) return false;
  if (elEditModal.classList.contains("show") || elSettingsModal.classList.contains("show")) return false;

  // Dot tap → jump to that exact set (or return to working when tapping the
  // active dot while browsing).
  const dotEl = (target.classList && target.classList.contains("dot"))
    ? target
    : (target.closest ? target.closest(".dot") : null);
  if (dotEl && dotEl.dataset && dotEl.dataset.exerciseIdx != null) {
    const exIdx = Number(dotEl.dataset.exerciseIdx);
    const setIdx = Number(dotEl.dataset.setIdx);
    if (!Number.isFinite(exIdx) || !Number.isFinite(setIdx)) return false;
    if (exIdx === currentExercise && setIdx === currentSet && isBrowsing()) {
      returnToWorking();
    } else {
      cycleView(exIdx, setIdx);
    }
    return true;
  }

  const group = target.closest ? target.closest(".exercise-group") : null;
  if (!group || !elProgress.contains(group)) return false;
  const exIdx = Number(group.dataset.exerciseIdx);
  if (!Number.isFinite(exIdx)) return false;
  if (exIdx === viewingExercise) {
    const ex = workout[exIdx];
    const nextSet = (viewingSet + 1) % ex.sets;
    cycleView(exIdx, nextSet);
  } else {
    cycleView(exIdx, 0);
  }
  return true;
}

elProgress.addEventListener("touchstart", (e) => {
  if (e.touches.length !== 1) { tapStart = null; return; }
  const t = e.touches[0];
  tapStart = { x: t.clientX, y: t.clientY, time: Date.now(), target: e.target };
}, { passive: true });

elProgress.addEventListener("touchmove", (e) => {
  if (!tapStart) return;
  const t = e.touches[0];
  if (!t) return;
  if (Math.abs(t.clientX - tapStart.x) > 15 || Math.abs(t.clientY - tapStart.y) > 15) {
    tapStart = null;  // scrolling/dragging, not a tap
  }
}, { passive: true });

elProgress.addEventListener("touchend", (e) => {
  if (!tapStart) return;
  const info = tapStart;
  tapStart = null;
  if (Date.now() - info.time > 700) return;
  if (e.changedTouches && e.changedTouches[0]) {
    const t = e.changedTouches[0];
    if (Math.abs(t.clientX - info.x) > 15 || Math.abs(t.clientY - info.y) > 15) return;
  }
  if (handleTap(info.target)) {
    lastTouchTapTime = Date.now();
    // Best-effort: suppress the synthetic click iOS generates next.
    try { e.preventDefault(); } catch (_) {}
  }
}, { passive: false });

elProgress.addEventListener("touchcancel", () => { tapStart = null; }, { passive: true });

// Desktop mouse fallback; skip the synthetic click after a processed touch tap.
elProgress.addEventListener("click", (e) => {
  if (Date.now() - lastTouchTapTime < 500) return;
  handleTap(e.target);
});

// Block the iOS long-press text-selection callout without affecting taps/drags.
elProgress.addEventListener("contextmenu", (e) => e.preventDefault());

// ============ §14 MODALS + INPUT HANDLERS ============
function openEditModal(exerciseIdx, setIdx) {
  const log = logAt(exerciseIdx, setIdx);
  if (!log) return;
  editingLog = log;
  editRepCount = log.reps;
  elEditExercise.textContent = workout[exerciseIdx].name;
  // The weight THIS set was actually done at, read from the FROZEN ledger
  // value. It used to be recomputed by effectiveWeight() here, which meant
  // editing the reps in this very modal could change the weight the modal
  // claimed the set was done at -- the header would move under his hands.
  elEditSet.textContent = "Set " + (setIdx + 1) + " · " +
    (log.dropped && log.weightLbs != null
      ? log.weightLbs + " lbs (dropped)"
      : (log.weightLbs != null ? log.weightLbs + " lbs" : workout[exerciseIdx].weight));
  elEditNotes.value = log.note || "";
  elEditModal.classList.add("show");

}

// Note modal — the inline field is read-only; tapping opens a real textarea
