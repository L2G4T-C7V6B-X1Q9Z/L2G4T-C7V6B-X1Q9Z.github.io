<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Gym Timer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@200;400;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'JetBrains Mono', monospace;
    background: #111;
    color: #ccc;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 120px;
    -webkit-user-select: none;
    user-select: none;
  }
  h1 {
    font-size: 11px;
    color: #888;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 32px;
    font-weight: 400;
  }
  #exercise-name {
    font-size: 22px;
    font-weight: 700;
    color: #eee;
    text-align: center;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
  }
  #set-info {
    font-size: 13px;
    color: #aaa;
    margin-bottom: 6px;
    letter-spacing: 1px;
  }
  #weight-info {
    font-size: 13px;
    color: #888;
    margin-bottom: 36px;
  }
  #timer-display {
    font-size: 80px;
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    color: #eee;
    margin-bottom: 6px;
    line-height: 1;
    letter-spacing: -2px;
  }
  #timer-label {
    font-size: 11px;
    color: #999;
    margin-bottom: 32px;
    height: 16px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  #main-btn {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 2px solid #333;
    background: #1a1a1a;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #bbb;
    cursor: pointer;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
    margin-bottom: 20px;
  }
  #main-btn:active {
    transform: scale(0.96);
  }
  #main-btn.resting {
    border-color: #c0392b;
    color: #c0392b;
  }
  #main-btn.paused {
    border-color: #555;
    color: #555;
  }
  #main-btn.go {
    border-color: #c0392b;
    background: #c0392b;
    color: #fff;
  }
  #skip-btn {
    background: none;
    border: 1px solid #333;
    color: #999;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 8px 20px;
    border-radius: 20px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  /* Nav buttons (back / forward) */
  .nav-btn {
    position: fixed;
    top: 16px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid #333;
    background: #1a1a1a;
    color: #aaa;
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 400;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 0;
    line-height: 1;
    transition: opacity 0.2s, color 0.2s, border-color 0.2s, transform 0.1s;
  }
  .nav-btn:active { transform: scale(0.92); }
  #nav-back { left: 16px; }
  #nav-forward { right: 16px; display: none; }
  .nav-btn.disabled {
    opacity: 0.22;
    pointer-events: none;
  }

  /* Bottom logging area */
  #log-area {
    display: none;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-top: auto;
    padding: 12px 20px;
    width: 100%;
    max-width: 360px;
  }
  #rep-counter {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .rep-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid #333;
    background: transparent;
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 400;
    color: #999;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .rep-btn:active {
    transform: scale(0.9);
    border-color: #c0392b;
    color: #c0392b;
  }
  #rep-count {
    font-size: 22px;
    font-weight: 700;
    color: #eee;
    min-width: 30px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #rep-label {
    font-size: 9px;
    color: #666;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  #notes-input {
    flex: 1;
    min-width: 0;
    padding: 8px 12px;
    border: 1px solid #333;
    border-radius: 6px;
    background: #1a1a1a;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #ddd;
    text-align: center;
    outline: none;
    transition: border-color 0.2s;
    -webkit-user-select: auto;
    user-select: auto;
  }
  #notes-input:focus {
    border-color: #c0392b;
  }
  #notes-input::placeholder {
    color: #555;
    font-size: 11px;
  }

  /* Bottom fixed bar — transparent so body bg shows through (unified flash) */
  #bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: transparent;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #progress {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 20px;
    padding: 12px 24px 16px;
    width: 100%;
  }
  .exercise-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .exercise-dots {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .exercise-label {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
    font-size: 9px;
    letter-spacing: 1px;
    color: #555;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .exercise-label.active { color: #c0392b; }
  .exercise-label.completed { color: #777; }

  /* Dots: base + states + animations */
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #2a2a2a;
    transition: background 0.3s;
    flex-shrink: 0;
    position: relative;
  }
  .dot.active { background: #c0392b; }
  .dot.completed { background: #fafafa; cursor: pointer; }

  /* Active dot blinking — Mazda turn signal pattern (snap on, gradual fade off).
     Just an outline ring, no blur, no glow. */
  @keyframes mazda-dot-blink {
    0%   { opacity: 1; }
    100% { opacity: 0; }
  }
  .dot.active.blinking::before {
    content: "";
    position: absolute;
    top: -4px;
    left: -4px;
    right: -4px;
    bottom: -4px;
    border: 1.5px solid #c0392b;
    border-radius: 50%;
    animation: mazda-dot-blink 1.0s ease-out infinite;
    pointer-events: none;
  }

  /* Just-completed dot echoes a white ghost rightward toward the next dot,
     fading out so it disappears before reaching the next dot. */
  @keyframes echo-travel {
    0%   { transform: translateX(0);    opacity: 0.85; }
    80%  { opacity: 0; }
    100% { transform: translateX(13px); opacity: 0; }
  }
  .dot.completed.echoing::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #fafafa;
    animation: echo-travel 1.4s ease-out infinite;
    pointer-events: none;
  }

  /* Body alert flash — Mazda turn signal pattern (snap on, gradual fade).
     Bottom bar inherits because it's transparent. */
  @keyframes mazda-bg-flash {
    0%   { background: #4a1410; }
    100% { background: #111; }
  }
  @keyframes mazda-timer-flash {
    0%   { color: #c0392b; }
    100% { color: #eee; }
  }
  body.alert-flashing {
    animation: mazda-bg-flash 0.85s ease-out 6;
  }
  body.alert-flashing #timer-display {
    animation: mazda-timer-flash 0.85s ease-out 6;
  }

  /* Edit modal */
  #edit-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  #edit-modal.show { display: flex; }
  .edit-card {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    max-width: 320px;
  }
  .edit-title {
    font-size: 16px;
    color: #eee;
    font-weight: 700;
    margin-bottom: 4px;
    letter-spacing: -0.3px;
  }
  .edit-subtitle {
    font-size: 11px;
    color: #888;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .edit-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .edit-label {
    font-size: 9px;
    color: #666;
    letter-spacing: 2px;
    text-transform: uppercase;
    width: 40px;
  }
  #edit-reps {
    font-size: 22px;
    font-weight: 700;
    color: #eee;
    min-width: 30px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #edit-notes {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid #333;
    border-radius: 6px;
    background: #111;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #ddd;
    outline: none;
    -webkit-user-select: auto;
    user-select: auto;
  }
  #edit-notes:focus { border-color: #c0392b; }
  .edit-actions {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  .edit-btn {
    flex: 1;
    padding: 12px;
    border: 1px solid #333;
    background: #111;
    color: #aaa;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 8px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .edit-btn.primary {
    border-color: #c0392b;
    background: #c0392b;
    color: #fff;
  }

  /* Done screen */
  #workout-done {
    display: none;
    text-align: center;
    width: 100%;
    max-width: 340px;
  }
  #workout-done h2 {
    font-size: 28px;
    color: #eee;
    font-weight: 700;
    margin-bottom: 24px;
    letter-spacing: -1px;
  }
  #summary {
    text-align: left;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
    font-size: 12px;
    line-height: 1.8;
    color: #999;
    white-space: pre-wrap;
  }
  #summary .exercise-header {
    color: #eee;
    font-weight: 700;
    font-size: 13px;
  }
  #summary .set-line {
    color: #666;
    padding-left: 8px;
  }
  #summary .set-note {
    color: #c0392b;
  }
  #copy-btn {
    width: 100%;
    padding: 14px;
    border: 2px solid #c0392b;
    background: #c0392b;
    color: #fff;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 10px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.15s;
  }
  #copy-btn:active {
    transform: scale(0.97);
  }
  #copy-btn.copied {
    background: #1a1a1a;
    color: #c0392b;
  }
</style>
</head>
<body>

<button id="nav-back" class="nav-btn disabled" aria-label="Go back">&#8592;</button>
<button id="nav-forward" class="nav-btn" aria-label="Go forward">&#8594;</button>

<h1 id="day-title">Upper Day</h1>
<div id="exercise-name"></div>
<div id="set-info"></div>
<div id="weight-info"></div>
<div id="timer-display" role="timer" aria-live="polite" aria-atomic="true"></div>
<div id="timer-label"></div>
<button id="main-btn" aria-label="Set done or rest control">Set Done</button>
<button id="skip-btn" aria-label="Skip rest">Skip Rest</button>

<div id="bottom-bar">
  <div id="log-area">
    <div id="rep-label">REPS</div>
    <div id="rep-counter">
      <button class="rep-btn" id="rep-minus" aria-label="Decrease reps">-</button>
      <div id="rep-count" aria-live="polite">10</div>
      <button class="rep-btn" id="rep-plus" aria-label="Increase reps">+</button>
    </div>
    <input type="text" id="notes-input" placeholder="notes..." inputmode="text" aria-label="Set notes">
  </div>
  <div id="progress"></div>
</div>

<div id="edit-modal" role="dialog" aria-modal="true" aria-labelledby="edit-exercise">
  <div class="edit-card">
    <div class="edit-title" id="edit-exercise"></div>
    <div class="edit-subtitle" id="edit-set"></div>
    <div class="edit-row">
      <div class="edit-label">REPS</div>
      <button class="rep-btn" id="edit-rep-minus" aria-label="Decrease reps">-</button>
      <div id="edit-reps">0</div>
      <button class="rep-btn" id="edit-rep-plus" aria-label="Increase reps">+</button>
    </div>
    <div class="edit-row">
      <div class="edit-label">NOTE</div>
      <input type="text" id="edit-notes" placeholder="notes..." inputmode="text" aria-label="Set notes">
    </div>
    <div class="edit-actions">
      <button class="edit-btn" id="edit-cancel">Cancel</button>
      <button class="edit-btn primary" id="edit-save">Save</button>
    </div>
  </div>
</div>

<div id="workout-done">
  <h2>Done.</h2>
  <div id="summary"></div>
  <button id="copy-btn">Copy Summary</button>
</div>

<script>
// ============ CONFIG ============
const dayType = "Upper Day";

const workout = [
  { name: "Chest Press Machine", sets: 3, reps: "8-12", repDefault: 10, weight: "100 lbs", rest: 150 },
  { name: "Lat Pulldown", sets: 3, reps: "8-12", repDefault: 10, weight: "95 lbs", rest: 150 },
  { name: "DB Lateral Raise", sets: 3, reps: "12-15", repDefault: 13, weight: "10 lbs", rest: 90 },
  { name: "Dumbbell Curls", sets: 2, reps: "10-12", repDefault: 11, weight: "15 lbs", rest: 90 },
];

const STATE_TTL_MS = 4 * 60 * 60 * 1000;
const HISTORY_MAX = 30;

// ============ STATE ============
const setLogs = [];

let currentExercise = 0;
let currentSet = 0;
let state = "ready";
let timerInterval = null;
let restRemaining = 0;
let restEndTime = null;
let currentLogEntry = null;
let repCount = 10;
let logExerciseIndex = 0;

let wakeLock = null;
let restNotifTimer = null;
let audioCtx = null;

let editingLog = null;
let editRepCount = 0;

// History stacks for back/forward navigation
const history = [];
const future = [];

// ============ DOM ============
const elDayTitle = document.getElementById("day-title");
const elName = document.getElementById("exercise-name");
const elSet = document.getElementById("set-info");
const elWeight = document.getElementById("weight-info");
const elTimer = document.getElementById("timer-display");
const elTimerLabel = document.getElementById("timer-label");
const elBtn = document.getElementById("main-btn");
const elSkip = document.getElementById("skip-btn");
const elProgress = document.getElementById("progress");
const elDone = document.getElementById("workout-done");
const elSummary = document.getElementById("summary");
const elCopy = document.getElementById("copy-btn");
const elLogArea = document.getElementById("log-area");
const elNotesInput = document.getElementById("notes-input");
const elRepCount = document.getElementById("rep-count");
const elRepMinus = document.getElementById("rep-minus");
const elRepPlus = document.getElementById("rep-plus");
const elNavBack = document.getElementById("nav-back");
const elNavForward = document.getElementById("nav-forward");
const elEditModal = document.getElementById("edit-modal");
const elEditExercise = document.getElementById("edit-exercise");
const elEditSet = document.getElementById("edit-set");
const elEditReps = document.getElementById("edit-reps");
const elEditNotes = document.getElementById("edit-notes");
const elEditCancel = document.getElementById("edit-cancel");
const elEditSave = document.getElementById("edit-save");
const elEditRepMinus = document.getElementById("edit-rep-minus");
const elEditRepPlus = document.getElementById("edit-rep-plus");

elDayTitle.textContent = dayType;
document.title = "Gym - " + dayType;

// ============ WAKE LOCK ============
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) {}
}
function releaseWakeLock() {
  try { if (wakeLock) wakeLock.release(); } catch(e) {}
  wakeLock = null;
}

// ============ NOTIFICATIONS ============
async function ensureNotifPermission() {
  if (!('Notification' in window)) return false;
  if (Notification.permission === 'granted') return true;
  if (Notification.permission === 'denied') return false;
  try {
    const r = await Notification.requestPermission();
    return r === 'granted';
  } catch (e) { return false; }
}
function scheduleRestNotif(ms) {
  cancelRestNotif();
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  restNotifTimer = setTimeout(() => {
    restNotifTimer = null;
    if (document.visibilityState !== 'visible') {
      try {
        new Notification("Rest done -- GO!", {
          body: workout[currentExercise].name + " set " + (currentSet + 1),
          tag: "gym-rest"
        });
      } catch(e) {}
    }
  }, ms);
}
function cancelRestNotif() {
  if (restNotifTimer) { clearTimeout(restNotifTimer); restNotifTimer = null; }
}

// ============ AUDIO + VIBRATION ============
function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch(e) {}
}
function playAlertSound() {
  try {
    if (!audioCtx) initAudio();
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    [0, 0.22].forEach(offset => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now + offset);
      gain.gain.setValueAtTime(0.0001, now + offset);
      gain.gain.exponentialRampToValueAtTime(0.4, now + offset + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.18);
      osc.start(now + offset);
      osc.stop(now + offset + 0.2);
    });
  } catch (e) {}
}
function triggerAlertFeedback() {
  if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 500]);
  playAlertSound();
}

// ============ RENDERING ============
function getGlobalSetIndex() {
  let idx = 0;
  for (let i = 0; i < currentExercise; i++) idx += workout[i].sets;
  return idx + currentSet;
}

function renderProgress() {
  elProgress.innerHTML = "";
  const globalCurrent = getGlobalSetIndex();
  const isResting = (state === "resting" || state === "paused");
  const isDoingSet = (state === "ready" || state === "alert" || state === "finishing");
  let idx = 0;
  for (let i = 0; i < workout.length; i++) {
    const group = document.createElement("div");
    group.className = "exercise-group";
    const dotsRow = document.createElement("div");
    dotsRow.className = "exercise-dots";
    for (let j = 0; j < workout[i].sets; j++) {
      const dot = document.createElement("div");
      dot.className = "dot";
      if (idx < globalCurrent) {
        dot.classList.add("completed");
        // The just-completed dot echoes toward the next during rest
        if (idx === globalCurrent - 1 && isResting) {
          dot.classList.add("echoing");
        }
        const exIdx = i, setIdx = j;
        dot.addEventListener("click", () => openEditModal(exIdx, setIdx));
        dot.setAttribute("role", "button");
        dot.setAttribute("aria-label", "Edit " + workout[i].name + " set " + (j + 1));
      } else if (idx === globalCurrent) {
        dot.classList.add("active");
        // Only blink during the actual set (not during rest).
        // During rest, the just-completed dot's echo signals transition.
        if (isDoingSet) {
          dot.classList.add("blinking");
        }
      }
      dotsRow.appendChild(dot);
      idx++;
    }
    const label = document.createElement("div");
    label.className = "exercise-label";
    if (i < currentExercise) label.classList.add("completed");
    else if (i === currentExercise) label.classList.add("active");
    label.textContent = workout[i].name;
    group.appendChild(label);
    group.appendChild(dotsRow);
    elProgress.appendChild(group);
  }
}

function renderExercise() {
  const ex = workout[currentExercise];
  elName.textContent = ex.name;
  elSet.textContent = `Set ${currentSet + 1} / ${ex.sets}  \u00b7  ${ex.reps} reps`;
  elWeight.textContent = ex.weight;
  renderProgress();
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${m}:${s.toString().padStart(2, "0")}`;
}

// ============ FLASH (Mazda turn signal pattern via CSS) ============
function startFlash() {
  document.body.classList.remove('alert-flashing');
  void document.body.offsetWidth; // force reflow to restart animation
  document.body.classList.add('alert-flashing');
}
function stopFlash() {
  document.body.classList.remove('alert-flashing');
}

// ============ LOG AREA ============
function showLogArea(exerciseIdx) {
  logExerciseIndex = exerciseIdx;
  const prevLogs = setLogs.filter(l => l.exercise === exerciseIdx && l.reps > 0);
  if (prevLogs.length > 0) {
    repCount = prevLogs[prevLogs.length - 1].reps;
  } else {
    repCount = workout[exerciseIdx].repDefault;
  }
  elRepCount.textContent = repCount;
  elNotesInput.value = "";
  elNotesInput.placeholder = "notes...";
  elLogArea.style.display = "flex";
}
function hideLogArea() {
  elLogArea.style.display = "none";
}
function captureLog() {
  if (currentLogEntry) {
    const note = elNotesInput.value.trim();
    currentLogEntry.reps = repCount;
    currentLogEntry.note = note;
    currentLogEntry = null;
  }
}

// ============ TIMER LOOP ============
function startCountdown() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    const remaining = Math.ceil((restEndTime - Date.now()) / 1000);
    if (remaining <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      restDone();
    } else {
      restRemaining = remaining;
      elTimer.textContent = formatTime(remaining);
    }
  }, 250);
}

// ============ HISTORY (back/forward) ============
function snapshot() {
  return {
    currentExercise, currentSet, state,
    restEndTime, restRemaining,
    setLogs: setLogs.map(l => ({...l})),
    repCount, logExerciseIndex,
    notes: elNotesInput.value,
    currentLogEntryIdx: currentLogEntry ? setLogs.indexOf(currentLogEntry) : -1
  };
}
function applySnapshot(s) {
  // Clean up active timers/animations before applying
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  cancelRestNotif();
  stopFlash();

  currentExercise = s.currentExercise;
  currentSet = s.currentSet;
  state = s.state;
  restEndTime = s.restEndTime;
  restRemaining = s.restRemaining;
  setLogs.length = 0;
  s.setLogs.forEach(l => setLogs.push(l));
  repCount = s.repCount;
  logExerciseIndex = s.logExerciseIndex;
  currentLogEntry = s.currentLogEntryIdx >= 0 ? setLogs[s.currentLogEntryIdx] : null;

  applyState(s.notes || "");
  saveState();
}
function applyState(notesValue) {
  // Render UI for current state
  if (state === "resting" && restEndTime) {
    const remaining = Math.ceil((restEndTime - Date.now()) / 1000);
    if (remaining <= 0) {
      // Rest already ended
      state = "alert";
      restEndTime = null;
      renderExercise();
      elTimer.textContent = "0:00";
      elTimerLabel.textContent = "GO";
      elBtn.textContent = "Start Set";
      elBtn.className = "go";
      elSkip.style.display = "none";
      hideLogArea();
      startFlash();
      triggerAlertFeedback();
    } else {
      restRemaining = remaining;
      renderExercise();
      elTimer.textContent = formatTime(remaining);
      elTimerLabel.textContent = "REST";
      elBtn.textContent = "Pause";
      elBtn.className = "resting";
      elSkip.style.display = "inline-block";
      elLogArea.style.display = "flex";
      elRepCount.textContent = repCount;
      elNotesInput.value = notesValue;
      requestWakeLock();
      scheduleRestNotif(remaining * 1000);
      startCountdown();
    }
  } else if (state === "alert") {
    renderExercise();
    elTimer.textContent = "0:00";
    elTimerLabel.textContent = "GO";
    elBtn.textContent = "Start Set";
    elBtn.className = "go";
    elSkip.style.display = "none";
    hideLogArea();
    elNotesInput.value = notesValue;
    startFlash();
    triggerAlertFeedback();
  } else if (state === "paused") {
    renderExercise();
    elTimer.textContent = formatTime(restRemaining);
    elTimerLabel.textContent = "PAUSED";
    elBtn.textContent = "Resume";
    elBtn.className = "paused";
    elSkip.style.display = "inline-block";
    elLogArea.style.display = "flex";
    elRepCount.textContent = repCount;
    elNotesInput.value = notesValue;
  } else if (state === "finishing") {
    renderExercise();
    elBtn.textContent = "Finish";
    elBtn.className = "go";
    elTimer.textContent = "-:--";
    elTimerLabel.textContent = "LOG YOUR LAST SET";
    elSkip.style.display = "none";
    elLogArea.style.display = "flex";
    elRepCount.textContent = repCount;
    elNotesInput.value = notesValue;
  } else if (state === "ready") {
    renderExercise();
    elTimer.textContent = "-:--";
    elTimerLabel.textContent = "";
    elBtn.textContent = "Set Done";
    elBtn.className = "";
    elSkip.style.display = "none";
    hideLogArea();
    elNotesInput.value = notesValue;
  } else {
    renderExercise();
  }
  updateNavButtons();
}
function pushHistory() {
  history.push(snapshot());
  if (history.length > HISTORY_MAX) history.shift();
  future.length = 0;
  updateNavButtons();
}
function back() {
  if (history.length === 0) return;
  future.push(snapshot());
  if (future.length > HISTORY_MAX) future.shift();
  const s = history.pop();
  applySnapshot(s);
}
function forward() {
  if (future.length === 0) return;
  history.push(snapshot());
  if (history.length > HISTORY_MAX) history.shift();
  const s = future.pop();
  applySnapshot(s);
}
function updateNavButtons() {
  elNavBack.classList.toggle("disabled", history.length === 0);
  elNavForward.style.display = future.length > 0 ? "flex" : "none";
}

// ============ STATE TRANSITIONS ============
function setDone() {
  pushHistory();
  stopFlash();
  captureLog();

  initAudio();
  requestWakeLock();
  ensureNotifPermission();

  const logEntry = {
    exercise: currentExercise,
    set: currentSet,
    reps: 0,
    note: ""
  };
  setLogs.push(logEntry);
  currentLogEntry = logEntry;

  const finishedExercise = currentExercise;
  currentSet++;

  showLogArea(finishedExercise);

  const isLastSet = finishedExercise >= workout.length - 1 && currentSet >= workout[finishedExercise].sets;
  if (isLastSet) {
    elBtn.textContent = "Finish";
    elBtn.className = "go";
    state = "finishing";
    elTimer.textContent = "-:--";
    elTimerLabel.textContent = "LOG YOUR LAST SET";
    elSkip.style.display = "none";
    renderProgress();
    saveState();
    return;
  }

  if (currentSet >= workout[currentExercise].sets) {
    currentExercise++;
    currentSet = 0;
  }

  elSkip.style.display = "inline-block";
  elSkip.style.pointerEvents = "auto";
  state = "resting";
  const switchingExercise = (finishedExercise !== currentExercise);
  restRemaining = switchingExercise ? 60 : workout[finishedExercise].rest;
  restEndTime = Date.now() + restRemaining * 1000;
  elTimer.textContent = formatTime(restRemaining);
  elTimerLabel.textContent = switchingExercise ? "UP NEXT" : "REST";
  elBtn.textContent = "Pause";
  elBtn.className = "resting";
  renderExercise();
  scheduleRestNotif(restRemaining * 1000);
  saveState();
  startCountdown();
}

function restDone() {
  cancelRestNotif();
  captureLog();
  hideLogArea();
  state = "alert";
  elTimer.textContent = "0:00";
  elTimerLabel.textContent = "GO";
  elBtn.textContent = "Start Set";
  elBtn.className = "go";
  elSkip.style.display = "none";
  renderExercise();
  startFlash();
  triggerAlertFeedback();
  saveState();
}

function pauseRest() {
  cancelRestNotif();
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  state = "paused";
  elBtn.textContent = "Resume";
  elBtn.className = "paused";
  elTimerLabel.textContent = "PAUSED";
  renderProgress();
  saveState();
}

function resumeRest() {
  state = "resting";
  restEndTime = Date.now() + restRemaining * 1000;
  elBtn.textContent = "Pause";
  elBtn.className = "resting";
  elTimerLabel.textContent = "REST";
  renderProgress();
  scheduleRestNotif(restRemaining * 1000);
  saveState();
  startCountdown();
}

function skipRest() {
  pushHistory();
  cancelRestNotif();
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  captureLog();
  hideLogArea();
  state = "ready";
  elTimer.textContent = "-:--";
  elTimerLabel.textContent = "";
  elBtn.textContent = "Set Done";
  elBtn.className = "";
  elSkip.style.display = "none";
  renderExercise();
  saveState();
}

function acknowledgeAlert() {
  pushHistory();
  stopFlash();
  state = "ready";
  elTimer.textContent = "-:--";
  elTimerLabel.textContent = "";
  elBtn.textContent = "Set Done";
  elBtn.className = "";
  renderExercise();
  saveState();
}

// ============ SUMMARY ============
function summaryDateStr() {
  return new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
}
function buildSummary() {
  let text = dayType + " -- " + summaryDateStr() + "\n\n";
  for (let i = 0; i < workout.length; i++) {
    const ex = workout[i];
    text += ex.name + " @ " + ex.weight + "\n";
    for (let j = 0; j < ex.sets; j++) {
      const log = setLogs.find(l => l.exercise === i && l.set === j);
      if (log) {
        const note = log.note ? " -- " + log.note : "";
        text += "  S" + (j + 1) + ": " + log.reps + " reps" + note + "\n";
      } else {
        text += "  S" + (j + 1) + ": -\n";
      }
    }
    if (i < workout.length - 1) text += "\n";
  }
  return text;
}
function buildSummaryHTML() {
  let html = '<div class="exercise-header">' + dayType + ' -- ' + summaryDateStr() + '</div><br>';
  for (let i = 0; i < workout.length; i++) {
    const ex = workout[i];
    html += '<div class="exercise-header">' + ex.name + ' @ ' + ex.weight + '</div>';
    for (let j = 0; j < ex.sets; j++) {
      const log = setLogs.find(l => l.exercise === i && l.set === j);
      if (log) {
        const note = log.note ? ' -- ' + log.note : '';
        html += '<div class="set-line">S' + (j + 1) + ': <span class="set-note">' + log.reps + ' reps' + note + '</span></div>';
      } else {
        html += '<div class="set-line">S' + (j + 1) + ': -</div>';
      }
    }
    if (i < workout.length - 1) html += '<br>';
  }
  return html;
}

function finishWorkout() {
  pushHistory();
  cancelRestNotif();
  releaseWakeLock();
  captureLog();
  hideLogArea();
  state = "finished";
  elDayTitle.style.display = "none";
  elName.style.display = "none";
  elSet.style.display = "none";
  elWeight.style.display = "none";
  elTimer.style.display = "none";
  elTimerLabel.style.display = "none";
  elBtn.style.display = "none";
  elSkip.style.display = "none";
  elProgress.style.display = "none";
  elNavBack.style.display = "none";
  elNavForward.style.display = "none";
  elDone.style.display = "block";
  elSummary.innerHTML = buildSummaryHTML();
  try { localStorage.removeItem("gym-timer-state"); } catch(e) {}
}

// ============ EDIT MODAL ============
function openEditModal(exerciseIdx, setIdx) {
  const log = setLogs.find(l => l.exercise === exerciseIdx && l.set === setIdx);
  if (!log) return;
  editingLog = log;
  editRepCount = log.reps;
  elEditExercise.textContent = workout[exerciseIdx].name;
  elEditSet.textContent = "Set " + (setIdx + 1) + " \u00b7 " + workout[exerciseIdx].weight;
  elEditReps.textContent = editRepCount;
  elEditNotes.value = log.note || "";
  elEditModal.classList.add("show");
}
function closeEditModal() {
  elEditModal.classList.remove("show");
  editingLog = null;
}

elEditCancel.addEventListener("click", closeEditModal);
elEditSave.addEventListener("click", () => {
  if (editingLog) {
    pushHistory();
    editingLog.reps = editRepCount;
    editingLog.note = elEditNotes.value.trim();
    saveState();
  }
  closeEditModal();
});
elEditRepMinus.addEventListener("click", () => {
  if (editRepCount > 0) { editRepCount--; elEditReps.textContent = editRepCount; }
});
elEditRepPlus.addEventListener("click", () => {
  editRepCount++;
  elEditReps.textContent = editRepCount;
});
elEditModal.addEventListener("click", (e) => {
  if (e.target === elEditModal) closeEditModal();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && elEditModal.classList.contains("show")) closeEditModal();
});

// ============ INPUT HANDLERS ============
elBtn.addEventListener("click", () => {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  if (state === "ready") setDone();
  else if (state === "alert") acknowledgeAlert();
  else if (state === "resting") pauseRest();
  else if (state === "paused") resumeRest();
  else if (state === "finishing") finishWorkout();
});

elSkip.addEventListener("click", (e) => {
  e.stopPropagation();
  if (state === "resting" || state === "paused") skipRest();
});

elRepMinus.addEventListener("click", (e) => {
  e.stopPropagation();
  if (repCount > 0) {
    repCount--;
    elRepCount.textContent = repCount;
    saveState();
  }
});
elRepPlus.addEventListener("click", (e) => {
  e.stopPropagation();
  repCount++;
  elRepCount.textContent = repCount;
  saveState();
});

elNotesInput.addEventListener("input", () => saveState());

elNavBack.addEventListener("click", back);
elNavForward.addEventListener("click", forward);

elCopy.addEventListener("click", () => {
  const text = buildSummary();
  navigator.clipboard.writeText(text).then(() => {
    elCopy.textContent = "Copied";
    elCopy.className = "copied";
    setTimeout(() => {
      elCopy.textContent = "Copy Summary";
      elCopy.className = "";
    }, 2000);
  });
});

// ============ STATE PERSISTENCE ============
function saveState() {
  const s = {
    savedAt: Date.now(),
    currentExercise, currentSet, state, restEndTime, restRemaining,
    setLogs: setLogs.map(l => ({...l})),
    repCount,
    notes: elNotesInput.value,
    logExerciseIndex,
    history: history.map(h => ({...h, setLogs: h.setLogs.map(l => ({...l}))})),
    future:  future.map(f => ({...f, setLogs: f.setLogs.map(l => ({...l}))}))
  };
  try { localStorage.setItem("gym-timer-state", JSON.stringify(s)); } catch(e) {}
}

function restoreState() {
  try {
    const raw = localStorage.getItem("gym-timer-state");
    if (!raw) return false;
    const s = JSON.parse(raw);

    if (s.savedAt && (Date.now() - s.savedAt > STATE_TTL_MS)) {
      try { localStorage.removeItem("gym-timer-state"); } catch(e) {}
      return false;
    }

    currentExercise = s.currentExercise;
    currentSet = s.currentSet;
    repCount = s.repCount || 10;
    if (typeof s.logExerciseIndex === 'number') logExerciseIndex = s.logExerciseIndex;
    setLogs.length = 0;
    s.setLogs.forEach(l => setLogs.push(l));
    state = s.state;
    restEndTime = s.restEndTime;
    restRemaining = s.restRemaining;

    // Restore history and future stacks
    history.length = 0;
    if (Array.isArray(s.history)) s.history.forEach(h => history.push(h));
    future.length = 0;
    if (Array.isArray(s.future)) s.future.forEach(f => future.push(f));

    if (state === "resting" || state === "paused" || state === "finishing") {
      const lastLog = setLogs[setLogs.length - 1];
      if (lastLog) currentLogEntry = lastLog;
    }

    applyState(s.notes || "");
    return true;
  } catch(e) { return false; }
}

// ============ VISIBILITY HANDLER ============
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (state === "resting" && restEndTime) {
    const remaining = Math.ceil((restEndTime - Date.now()) / 1000);
    if (remaining <= 0) {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      restDone();
    } else {
      restRemaining = remaining;
      elTimer.textContent = formatTime(remaining);
    }
  }
  if (state !== "ready" && state !== "finished" && !wakeLock) {
    requestWakeLock();
  }
});

// ============ INIT ============
elSkip.style.display = "none";
hideLogArea();
updateNavButtons();
if (!restoreState()) {
  elTimer.textContent = "-:--";
  elTimerLabel.textContent = "";
  renderExercise();
}
</script>
