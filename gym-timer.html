<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Gym Timer</title>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@200;400;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'JetBrains Mono', monospace;
    background: #111;
    color: #ccc;
    min-height: 100vh;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 64px 20px 170px;
    -webkit-user-select: none;
    user-select: none;
  }
  h1 {
    font-size: 11px;
    color: #888;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 24px;
    font-weight: 400;
    text-align: center;
  }
  #exercise-name {
    font-size: 22px;
    font-weight: 700;
    color: #eee;
    text-align: center;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
  }
  #set-info {
    font-size: 13px;
    color: #aaa;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
    text-align: center;
  }
  #exercise-note {
    font-size: 11px;
    color: #777;
    font-style: italic;
    margin-bottom: 24px;
    text-align: center;
    max-width: 300px;
    line-height: 1.45;
    /* Fixed height so 1/2/3-line notes don't shift the layout underneath. */
    height: 48px;
    overflow: hidden;
  }
  #timer-display {
    font-size: 76px;
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    color: #eee;
    margin-bottom: 4px;
    line-height: 1;
    letter-spacing: -2px;
    text-align: center;
  }
  #timer-label {
    font-size: 11px;
    color: #999;
    margin-bottom: 24px;
    height: 16px;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-align: center;
  }

  /* Main button + progress ring wrapper */
  .btn-wrap {
    /* Positioned by JS (centerMainButton) so its vertical center sits exactly
       at the midpoint of the timer-display bottom and the difficulty-row top,
       ignoring timer-label / padding slop. Inline styles from JS override
       these initial values. */
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 184px;
    height: 184px;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #main-btn {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 2px solid #333;
    background: #1a1a1a;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #bbb;
    cursor: pointer;
    transition: transform 0.2s, color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  #main-btn:active { transform: scale(0.96); }
  #main-btn.resting,
  #main-btn.paused {
    border-color: transparent;
    color: #c0392b;
  }
  #main-btn.paused { color: #777; }
  #main-btn.go {
    border-color: #c0392b;
    background: #c0392b;
    color: #fff;
  }

  /* Progress ring (drains as rest counts down) */
  #rest-ring {
    position: absolute;
    inset: 0;
    width: 184px;
    height: 184px;
    pointer-events: none;
    display: none;
    transform: rotate(-90deg);
  }
  .btn-wrap.show-ring #rest-ring { display: block; }
  #rest-ring-track {
    fill: none;
    stroke: rgba(192, 57, 43, 0.12);
    stroke-width: 3;
  }
  #rest-ring-bar {
    fill: none;
    stroke: #c0392b;
    stroke-width: 3;
    stroke-linecap: round;
    /* No CSS transition -- updates are driven directly by timer interval */
  }
  .btn-wrap.paused #rest-ring-bar {
    stroke: #777;
  }

  /* Skip button: small circular button positioned to the right of the main button,
     vertically aligned with its center. Fast-forward icon. */
  #skip-btn {
    position: absolute;
    left: calc(100% + 18px);
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #1a1a1a;
    border: 1px solid #333;
    color: #999;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: transform 0.12s ease, color 0.2s, border-color 0.2s, background 0.2s;
  }
  #skip-btn:active {
    transform: translateY(-50%) scale(0.85);
    color: #c0392b;
    border-color: #c0392b;
    background: rgba(192, 57, 43, 0.12);
  }
  #skip-btn svg {
    width: 18px;
    height: 18px;
    transition: transform 0.18s ease;
  }
  /* Subtle "skipping forward" cue: icon slides right + fades on press */
  @keyframes skip-icon-fly {
    0%   { transform: translateX(0);  opacity: 1; }
    100% { transform: translateX(8px); opacity: 0; }
  }
  #skip-btn.pressed svg {
    animation: skip-icon-fly 0.18s ease-out forwards;
  }

  /* Top corner buttons (back / forward / settings) — SVG icons, perfectly centered */
  .top-btn {
    position: fixed;
    top: 16px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid #333;
    background: #1a1a1a;
    color: #aaa;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 0;
    transition: opacity 0.2s, color 0.2s, border-color 0.2s, transform 0.1s;
  }
  .top-btn svg { width: 18px; height: 18px; display: block; }
  .top-btn:active { transform: scale(0.92); }
  #settings-btn { right: 16px; }
  #settings-btn svg { width: 20px; height: 20px; }
  .top-btn.disabled { opacity: 0.22; pointer-events: none; }

  /* Bottom logging area */
  #log-area {
    display: none;
    flex-direction: row;
    align-items: stretch;
    justify-content: center;
    gap: 8px;
    margin-top: auto;
    padding: 10px 20px 12px;
    width: 100%;
    max-width: 400px;
  }
  #set-label-col {
    display: flex;
    align-items: center;
    justify-content: center;
    padding-right: 8px;
    border-right: 1px solid #333;
    min-width: 22px;
    flex-shrink: 0;
  }
  #set-label-text {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
    font-size: 11px;
    font-weight: 700;
    color: #888;
    letter-spacing: 2px;
    white-space: nowrap;
  }
  #log-content {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }
  .log-row {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 16px;
    width: 100%;
  }
  #difficulty-row {
    display: flex;
    flex-direction: row;
    justify-content: center;
    gap: 4px;
    width: 100%;
  }
  /* Main button gets a 45deg diagonal slash while browsing a past set —
     signals "Set Done" (and related actions) are inaccessible in view mode.
     Timer text stays readable. Main-btn is given position:relative so the
     pseudo-element anchors to it. */
  #main-btn { position: relative; }
  #main-btn.browsing::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 12%;
    right: 12%;
    height: 2px;
    background: rgba(192, 57, 43, 0.7);
    transform: translateY(-50%) rotate(-45deg);
    pointer-events: none;
    z-index: 2;
  }
  /* Container for return-pill + progress, so return-pill can absolute-position
     relative to the progress row (left side) without displacing dots. */
  .progress-area {
    position: relative;
    width: 100%;
    display: flex;
    justify-content: center;
  }
  .diff-btn {
    flex: 1;
    max-width: 68px;
    background: transparent;
    color: #777;
    border: 1px solid #333;
    border-radius: 4px;
    padding: 6px 2px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .diff-btn:active { background: #1e1e1e; }
  .diff-btn.selected {
    background: #c0392b;
    color: #fff;
    border-color: #c0392b;
  }
  #rep-counter {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .rep-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid #333;
    background: transparent;
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 400;
    color: #999;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .rep-btn:active {
    transform: scale(0.9);
    border-color: #c0392b;
    color: #c0392b;
  }
  #rep-count {
    font-size: 22px;
    font-weight: 700;
    color: #eee;
    min-width: 30px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #rep-label {
    font-size: 9px;
    color: #666;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  #notes-input {
    flex: 1;
    min-width: 0;
    padding: 8px 12px;
    border: 1px solid #333;
    border-radius: 6px;
    background: #1a1a1a;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #ddd;
    text-align: center;
    outline: none;
    transition: border-color 0.2s;
    -webkit-user-select: auto;
    user-select: auto;
  }
  #notes-input:focus { border-color: #c0392b; }
  #notes-input::placeholder { color: #555; font-size: 11px; }

  /* Bottom fixed bar — transparent so body bg flashes through */
  #bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: transparent;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #progress {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 20px;
    padding: 12px 24px 16px;
    width: 100%;
  }
  /* Side-pill buttons (absolute inside bottom-bar, left edge, fade+slide in). */
  #return-pill, #set-current-btn {
    position: absolute;
    left: 14px;
    z-index: 40;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: #c0392b;
    background: rgba(26, 26, 26, 0.94);
    border: 1px solid rgba(192, 57, 43, 0.55);
    border-radius: 999px;
    text-transform: uppercase;
    padding: 8px 12px;
    cursor: pointer;
    text-align: center;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    opacity: 0;
    pointer-events: none;
    transform: translateX(-6px);
    transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #return-pill.visible, #set-current-btn.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(0);
  }
  /* NOW pill sits higher in the bottom-bar (log-area region). */
  #return-pill { top: 24px; }
  /* HERE pill sits in the progress-row region, below NOW. */
  #set-current-btn { bottom: 32px; }
  .exercise-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  /* SortableJS classes */
  /* .sortable-chosen = the item held via long-press (stays in list, scales up) */
  .exercise-group.sortable-chosen {
    transform: scale(1.04);
  }
  /* .sortable-drag = floating clone. Hidden entirely — the visible drag cue
     is the ghost placeholder and the other items animating around it. */
  .exercise-group.sortable-drag {
    opacity: 0 !important;
    pointer-events: none;
  }
  /* .sortable-ghost = the placeholder slot in the original list */
  .exercise-group.sortable-ghost {
    opacity: 0.25;
    background: #2a2a2a;
    border-radius: 4px;
  }
  .exercise-group.sortable-ghost > * { visibility: hidden; }
  /* Lock scroll + kill iOS pull-to-refresh + text selection during drag */
  body.dragging-exercise {
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  .exercise-dots {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .exercise-label {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
    font-size: 9px;
    letter-spacing: 1px;
    color: #555;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .exercise-label.active { color: #c0392b; }
  .exercise-label.completed { color: #777; }

  /* Dots */
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #2a2a2a;
    transition: background 0.3s;
    flex-shrink: 0;
    position: relative;
    box-sizing: border-box;
  }
  .dot.active { background: #c0392b; }
  .dot.completed { background: #fafafa; cursor: pointer; }
  .dot.cursor {
    border: 2px solid #c0392b;
    background: transparent;
  }

  /* Active dot blinking — hollow circle, red edge only, Mazda turn signal pattern.
     Same 8px diameter, just border, no fill. Snap on then gradual fade off. */
  @keyframes mazda-edge {
    0%   { border-color: #c0392b; }
    100% { border-color: rgba(192, 57, 43, 0); }
  }
  .dot.active.blinking {
    background: transparent;
    border: 1.5px solid #c0392b;
    animation: mazda-edge 0.7s ease-out infinite;
  }

  /* Just-completed dot echoes a white ghost rightward toward the next dot. */
  @keyframes echo-travel {
    0%   { transform: translateX(0);    opacity: 0.85; }
    80%  { opacity: 0; }
    100% { transform: translateX(13px); opacity: 0; }
  }
  .dot.completed.echoing::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #fafafa;
    animation: echo-travel 1.4s ease-out infinite;
    pointer-events: none;
  }

  /* Body alert flash — Mazda turn signal pattern, 700ms cycle. */
  @keyframes mazda-bg {
    0%   { background: #4a1410; }
    100% { background: #111; }
  }
  @keyframes mazda-timer {
    0%   { color: #c0392b; }
    100% { color: #eee; }
  }
  body.alert-flashing {
    animation: mazda-bg 0.7s ease-out 6;
  }
  body.alert-flashing #timer-display {
    animation: mazda-timer 0.7s ease-out 6;
  }

  /* Settings modal */
  #settings-modal, #edit-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  #settings-modal.show, #edit-modal.show { display: flex; }
  .modal-card {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    max-width: 320px;
  }
  .modal-title {
    font-size: 11px;
    color: #888;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 20px;
    font-weight: 400;
  }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid #252525;
  }
  .setting-row:last-child { border-bottom: none; }
  .setting-label {
    font-size: 13px;
    color: #ddd;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .setting-sub {
    font-size: 10px;
    color: #777;
    margin-top: 2px;
    letter-spacing: 0.5px;
  }
  .toggle {
    width: 44px;
    height: 24px;
    background: #333;
    border-radius: 12px;
    position: relative;
    cursor: pointer;
    transition: background 0.18s;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .toggle.on { background: #c0392b; }
  .toggle::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 20px;
    height: 20px;
    background: #f0f0f0;
    border-radius: 50%;
    transition: left 0.18s;
  }
  .toggle.on::after { left: 22px; }
  .modal-close {
    width: 100%;
    margin-top: 12px;
    padding: 10px;
    border: 1px solid #333;
    background: transparent;
    color: #aaa;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 8px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .modal-close.danger {
    border-color: #5a2a25;
    color: #c0392b;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .modal-close.danger:active {
    background: rgba(192, 57, 43, 0.1);
  }
  .modal-close.danger.confirming {
    background: #c0392b;
    color: #fff;
    border-color: #c0392b;
  }

  /* Edit modal-specific */
  .edit-title {
    font-size: 16px;
    color: #eee;
    font-weight: 700;
    margin-bottom: 4px;
    letter-spacing: -0.3px;
  }
  .edit-subtitle {
    font-size: 11px;
    color: #888;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .edit-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .edit-label {
    font-size: 9px;
    color: #666;
    letter-spacing: 2px;
    text-transform: uppercase;
    width: 40px;
  }
  #edit-reps {
    font-size: 22px;
    font-weight: 700;
    color: #eee;
    min-width: 30px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #edit-notes {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid #333;
    border-radius: 6px;
    background: #111;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #ddd;
    outline: none;
    -webkit-user-select: auto;
    user-select: auto;
  }
  #edit-notes:focus { border-color: #c0392b; }
  .edit-actions {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  .edit-btn {
    flex: 1;
    padding: 12px;
    border: 1px solid #333;
    background: #111;
    color: #aaa;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 8px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .edit-btn.primary {
    border-color: #c0392b;
    background: #c0392b;
    color: #fff;
  }

  /* Done screen */
  #workout-done {
    display: none;
    text-align: center;
    width: 100%;
    max-width: 340px;
  }
  #workout-done h2 {
    font-size: 28px;
    color: #eee;
    font-weight: 700;
    margin-bottom: 24px;
    letter-spacing: -1px;
  }
  #summary {
    text-align: left;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
    font-size: 12px;
    line-height: 1.8;
    color: #999;
    white-space: pre-wrap;
  }
  #summary .exercise-header {
    color: #eee;
    font-weight: 700;
    font-size: 13px;
  }
  #summary .duration-tag {
    color: #666;
    font-weight: 400;
    font-size: 11px;
  }
  #summary .set-line {
    color: #666;
    padding-left: 8px;
  }
  #summary .set-note {
    color: #c0392b;
  }
  #summary .total-line {
    color: #eee;
    font-weight: 700;
    margin-top: 12px;
  }
  #copy-btn {
    width: 100%;
    padding: 14px;
    border: 2px solid #c0392b;
    background: #c0392b;
    color: #fff;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 10px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.15s;
  }
  #copy-btn:active { transform: scale(0.97); }
  #copy-btn.copied {
    background: #1a1a1a;
    color: #c0392b;
  }
</style>
</head>
<body>

<button id="settings-btn" class="top-btn" aria-label="Settings">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
</button>

<h1 id="day-title">Upper Day</h1>
<div id="exercise-name"></div>
<div id="set-info"></div>
<div id="exercise-note"></div>
<div id="timer-display" role="timer" aria-live="polite" aria-atomic="true"></div>
<div id="timer-label"></div>
<div class="btn-wrap" id="btn-wrap">
  <button id="main-btn" aria-label="Set done or rest control">Set Done</button>
  <svg id="rest-ring" viewBox="0 0 184 184" aria-hidden="true">
    <circle id="rest-ring-track" cx="92" cy="92" r="88"></circle>
    <circle id="rest-ring-bar"   cx="92" cy="92" r="88"></circle>
  </svg>
  <button id="skip-btn" aria-label="Skip rest">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 4l9 8-9 8V4zm10 0l9 8-9 8V4z"/></svg>
  </button>
</div>

<div id="bottom-bar">
  <div id="log-area">
    <div id="set-label-col">
      <div id="set-label-text">S1</div>
    </div>
    <div id="log-content">
      <div id="difficulty-row">
        <button class="diff-btn" data-diff="1" aria-label="Easy">EASY</button>
        <button class="diff-btn" data-diff="2" aria-label="Light">LIGHT</button>
        <button class="diff-btn" data-diff="3" aria-label="Moderate">MOD</button>
        <button class="diff-btn" data-diff="4" aria-label="Hard">HARD</button>
        <button class="diff-btn" data-diff="5" aria-label="Maximum effort">MAX</button>
      </div>
      <div class="log-row">
        <div id="rep-label">REPS</div>
        <div id="rep-counter">
          <button class="rep-btn" id="rep-minus" aria-label="Decrease reps">-</button>
          <div id="rep-count" aria-live="polite">10</div>
          <button class="rep-btn" id="rep-plus" aria-label="Increase reps">+</button>
        </div>
        <input type="text" id="notes-input" placeholder="notes..." inputmode="text" aria-label="Set notes">
      </div>
    </div>
  </div>
  <div class="progress-area">
    <div id="progress"></div>
  </div>
  <div id="return-pill" role="button" aria-label="Back to current set">&#8592; NOW</div>
  <div id="set-current-btn" role="button" aria-label="Set this as current set">&#8594; HERE</div>
</div>

<div id="settings-modal" role="dialog" aria-modal="true" aria-label="Settings">
  <div class="modal-card">
    <div class="modal-title">Settings</div>
    <div class="setting-row">
      <div>
        <div class="setting-label">Auto-start next set</div>
        <div class="setting-sub">Skip the GO acknowledge step</div>
      </div>
      <div class="toggle" id="toggle-autostart" role="switch"></div>
    </div>
    <button class="modal-close danger" id="settings-reset">Reset Workout</button>
    <button class="modal-close" id="settings-close">Close</button>
  </div>
</div>

<div id="edit-modal" role="dialog" aria-modal="true" aria-labelledby="edit-exercise">
  <div class="modal-card">
    <div class="edit-title" id="edit-exercise"></div>
    <div class="edit-subtitle" id="edit-set"></div>
    <div class="edit-row">
      <div class="edit-label">REPS</div>
      <button class="rep-btn" id="edit-rep-minus" aria-label="Decrease reps">-</button>
      <div id="edit-reps">0</div>
      <button class="rep-btn" id="edit-rep-plus" aria-label="Increase reps">+</button>
    </div>
    <div class="edit-row">
      <div class="edit-label">NOTE</div>
      <input type="text" id="edit-notes" placeholder="notes..." inputmode="text" aria-label="Set notes">
    </div>
    <div class="edit-actions">
      <button class="edit-btn" id="edit-cancel">Cancel</button>
      <button class="edit-btn primary" id="edit-save">Save</button>
    </div>
  </div>
</div>

<div id="workout-done">
  <h2>Done.</h2>
  <div id="summary"></div>
  <button id="copy-btn">Copy Summary</button>
</div>

<script>
// ============ CONFIG ============
const dayType = "Upper Day";

const workout = [
  {
    name: "Chest Press Machine",
    sets: 3,
    reps: "8-12",
    weight: "110 or 115 lbs (NEW)",
    rest: 180,
    note: "PROGRESSION -- up one notch from 100. Last session: 100 x 12/12/10.5 (Apr 20) -- trigger met (12/12/10+). Pull pin up ONE, read the stamp to confirm whether it's 110 (+10 increment) or 115 (+15 increment). Full ROM (bar deep to chest, not shallow).",
    setNotes: [
      "First set at 110 or 115. Feel it out. 8+ is green. If S1 is ugly, drop back to 100.",
      "Match S1. Controlled 2s eccentric. No rushed reps.",
      "Last set. Push to 0-1 RIR. Goal: 8+ across all 3."
    ]
  },
  {
    name: "Lat Pulldown",
    sets: 3,
    reps: "8-12",
    weight: "100 lbs",
    rest: 180,
    note: "Last session: 100 x 12/10/7 (Apr 20, done LAST after curls -- biceps pre-fatigued, S3 discounted). Stay at 100, target 12/12/10+. Wide grip, pull to upper chest, don't lean back.",
    setNotes: [
      "Aim for 12. Drive elbows down, not back. Squeeze lats at the bottom.",
      "Target 12 to match S1. Controlled eccentric.",
      "Last set. 0-1 RIR. Goal: beat 10. If 12/12/10+, move to 110 next session."
    ]
  },
  {
    name: "DB Lateral Raise",
    sets: 3,
    reps: "12-15",
    weight: "10 lbs",
    rest: 90,
    note: "Last session: 10 x 15/15/~12 (Apr 20). Stay at 10, push for confirmed 15/15/15. Slight forward lean, pinky slightly up, no swinging. Next weight is 15 lbs (no 12.5s).",
    setNotes: [
      "Aim for 15. Slow up, slow down. Stop if form breaks.",
      "Target 15 again. If strict form 15/15/15, we jump to 15 lbs next.",
      "Last set. 0-1 RIR. Squeeze the top."
    ]
  },
  {
    name: "DB Curls",
    sets: 2,
    reps: "10-12",
    weight: "20 lbs",
    rest: 90,
    note: "Last session: 20 x 12/~6-7 (Apr 20) -- weight PR +5 from 15. Expected big rep drop on jump. Stay at 20 until 12/12. No swinging, full supination at top.",
    setNotes: [
      "Aim for 12. Strict form -- elbows pinned, no hip drive.",
      "Last set. 0-1 RIR. Beat 7 to show progress. Goal: 12/12 to move to 25."
    ]
  },
];

const STATE_TTL_MS = 4 * 60 * 60 * 1000;
const HISTORY_MAX = 30;
const RING_CIRCUMFERENCE = 2 * Math.PI * 88; // r=88 → ~552.92

// Snapshot the original workout order so reorder can be persisted/restored by exercise name.
// Never mutated; lookup source when rehydrating a reordered state from localStorage.
const originalWorkout = workout.slice();

// ============ SETTINGS ============
const defaultSettings = {
  sound: true,
  autoStart: true
};
let settings = { ...defaultSettings };
function loadSettings() {
  try {
    const raw = localStorage.getItem('gym-timer-settings');
    if (raw) settings = { ...defaultSettings, ...JSON.parse(raw) };
  } catch (e) {}
  settings.sound = true;
  delete settings.vibration;
}
function saveSettings() {
  try { localStorage.setItem('gym-timer-settings', JSON.stringify(settings)); } catch(e) {}
}
loadSettings();

// ============ STATE ============
const setLogs = [];

let currentExercise = 0;
let currentSet = 0;
let viewingExercise = 0;
let viewingSet = 0;
function isBrowsing() {
  return viewingExercise !== currentExercise || viewingSet !== currentSet;
}
// Returns the log entry to display/edit in the log area.
// - Browsing: the viewed set's log (may be null for future sets)
// - Working (during rest): currentLogEntry = just-completed set's log
function getActiveLogForEdit() {
  if (isBrowsing()) {
    return setLogs.find(l => l.exercise === viewingExercise && l.set === viewingSet) || null;
  }
  return currentLogEntry || null;
}
function renderDifficulty(log) {
  if (!elDifficultyRow) return;
  const currentDiff = log ? log.difficulty : null;
  elDifficultyRow.querySelectorAll('.diff-btn').forEach(btn => {
    btn.classList.toggle('selected', Number(btn.dataset.diff) === currentDiff);
  });
}
function renderSetLabel() {
  if (!elSetLabelText) return;
  const setIdx = isBrowsing() ? viewingSet : currentSet;
  elSetLabelText.textContent = "S" + (setIdx + 1);
}
// Position the main button so its vertical center sits at the midpoint of the
// timer-display bottom and the difficulty-row top. This is computed from real
// rendered coordinates so it stays accurate regardless of viewport size, note
// length, or state. Called from init + renderExercise + resize.
function centerMainButton() {
  if (!elTimer || !elDifficultyRow || !elBtnWrap) return;
  const timerRect = elTimer.getBoundingClientRect();
  const diffRect = elDifficultyRow.getBoundingClientRect();
  if (timerRect.height === 0 || diffRect.height === 0) return;
  const midY = (timerRect.bottom + diffRect.top) / 2;
  const btnH = elBtnWrap.offsetHeight || 184;
  elBtnWrap.style.top = (midY - btnH / 2) + "px";
  elBtnWrap.style.transform = "translateX(-50%)";
}
function syncLogArea() {
  const log = getActiveLogForEdit();
  if (log) {
    repCount = log.reps;
    elRepCount.textContent = log.reps;
    elNotesInput.value = log.note || "";
  } else {
    // No active log (pre-first-Set-Done, or browsing a future set) — show
    // default reps for the exercise being displayed so the row isn't empty.
    const exIdx = isBrowsing() ? viewingExercise : currentExercise;
    const ex = workout[exIdx];
    repCount = ex ? getMaxReps(ex.reps) : 0;
    elRepCount.textContent = repCount;
    elNotesInput.value = "";
  }
  renderDifficulty(log);
  renderSetLabel();
}
let state = "ready";
let timerInterval = null;
let restRemaining = 0;
let restTotalSeconds = 0;
let restEndTime = null;
let currentLogEntry = null;
let repCount = 10;
let logExerciseIndex = 0;

let wakeLock = null;
let restNotifTimer = null;
let audioCtx = null;

let editingLog = null;
let editRepCount = 0;

const history = [];
const future = [];

// ============ DOM ============
const elDayTitle = document.getElementById("day-title");
const elName = document.getElementById("exercise-name");
const elSet = document.getElementById("set-info");
const elNote = document.getElementById("exercise-note");
const elTimer = document.getElementById("timer-display");
const elTimerLabel = document.getElementById("timer-label");
const elBtn = document.getElementById("main-btn");
const elBtnWrap = document.getElementById("btn-wrap");
const elRingBar = document.getElementById("rest-ring-bar");
const elSkip = document.getElementById("skip-btn");
const elProgress = document.getElementById("progress");
const elDone = document.getElementById("workout-done");
const elSummary = document.getElementById("summary");
const elCopy = document.getElementById("copy-btn");
const elLogArea = document.getElementById("log-area");
const elNotesInput = document.getElementById("notes-input");
const elRepCount = document.getElementById("rep-count");
const elRepMinus = document.getElementById("rep-minus");
const elRepPlus = document.getElementById("rep-plus");
const elSettingsBtn = document.getElementById("settings-btn");
const elSettingsModal = document.getElementById("settings-modal");
const elSettingsClose = document.getElementById("settings-close");
const elToggleAutoStart = document.getElementById("toggle-autostart");
const elReturnPill = document.getElementById("return-pill");
const elSetCurrentBtn = document.getElementById("set-current-btn");
const elDifficultyRow = document.getElementById("difficulty-row");
const elSetLabelText = document.getElementById("set-label-text");
const elEditModal = document.getElementById("edit-modal");
const elEditExercise = document.getElementById("edit-exercise");
const elEditSet = document.getElementById("edit-set");
const elEditReps = document.getElementById("edit-reps");
const elEditNotes = document.getElementById("edit-notes");
const elEditCancel = document.getElementById("edit-cancel");
const elEditSave = document.getElementById("edit-save");
const elEditRepMinus = document.getElementById("edit-rep-minus");
const elEditRepPlus = document.getElementById("edit-rep-plus");

elDayTitle.textContent = dayType;
document.title = "Gym - " + dayType;
elRingBar.setAttribute("stroke-dasharray", RING_CIRCUMFERENCE);
elRingBar.setAttribute("stroke-dashoffset", RING_CIRCUMFERENCE); // start empty

// ============ WAKE LOCK ============
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) {}
}
function releaseWakeLock() {
  try { if (wakeLock) wakeLock.release(); } catch(e) {}
  wakeLock = null;
}

// ============ NOTIFICATIONS ============
async function ensureNotifPermission() {
  if (!('Notification' in window)) return false;
  if (Notification.permission === 'granted') return true;
  if (Notification.permission === 'denied') return false;
  try {
    const r = await Notification.requestPermission();
    return r === 'granted';
  } catch (e) { return false; }
}
function scheduleRestNotif(ms) {
  cancelRestNotif();
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  restNotifTimer = setTimeout(() => {
    restNotifTimer = null;
    if (document.visibilityState !== 'visible') {
      try {
        new Notification("Rest done -- GO!", {
          body: workout[currentExercise].name + " set " + (currentSet + 1),
          tag: "gym-rest"
        });
      } catch(e) {}
    }
  }, ms);
}
function cancelRestNotif() {
  if (restNotifTimer) { clearTimeout(restNotifTimer); restNotifTimer = null; }
}

// ============ AUDIO ============
function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch(e) {}
}
function playAlertSound() {
  try {
    if (!audioCtx) initAudio();
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    [0, 0.22].forEach(offset => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now + offset);
      gain.gain.setValueAtTime(0.0001, now + offset);
      gain.gain.exponentialRampToValueAtTime(0.4, now + offset + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.18);
      osc.start(now + offset);
      osc.stop(now + offset + 0.2);
    });
  } catch (e) {}
}
function triggerAlertFeedback() {
  playAlertSound();
}

// ============ HELPERS ============
function getMaxReps(repsStr) {
  const m = repsStr.match(/(\d+)\s*-\s*(\d+)/);
  return m ? parseInt(m[2], 10) : (parseInt(repsStr, 10) || 10);
}
function formatDuration(ms) {
  const totalSec = Math.max(0, Math.floor(ms / 1000));
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return m + "m " + s.toString().padStart(2, "0") + "s";
}
function getExerciseDuration(exerciseIdx) {
  const logs = setLogs.filter(l => l.exercise === exerciseIdx && l.timestamp);
  if (logs.length === 0) return null;
  if (logs.length === 1) return 0;
  const first = Math.min(...logs.map(l => l.timestamp));
  const last  = Math.max(...logs.map(l => l.timestamp));
  return last - first;
}

// ============ RENDERING ============
function getGlobalSetIndex() {
  let idx = 0;
  for (let i = 0; i < currentExercise; i++) idx += workout[i].sets;
  return idx + currentSet;
}

function renderProgress() {
  elProgress.innerHTML = "";
  const globalCurrent = getGlobalSetIndex();
  const isResting = (state === "resting" || state === "paused");
  const isDoingSet = (state === "ready" || state === "alert" || state === "finishing");
  let idx = 0;
  for (let i = 0; i < workout.length; i++) {
    const group = document.createElement("div");
    group.className = "exercise-group";
    group.dataset.exerciseIdx = i;
    const dotsRow = document.createElement("div");
    dotsRow.className = "exercise-dots";
    for (let j = 0; j < workout[i].sets; j++) {
      const dot = document.createElement("div");
      dot.className = "dot";
      const exIdx = i, setIdx = j;
      // Dataset drives the unified pointer-up tap handler on #progress.
      dot.dataset.exerciseIdx = exIdx;
      dot.dataset.setIdx = setIdx;
      if (idx < globalCurrent) {
        dot.classList.add("completed");
        if (idx === globalCurrent - 1 && isResting) {
          dot.classList.add("echoing");
        }
        dot.setAttribute("role", "button");
        dot.setAttribute("aria-label", "View " + workout[i].name + " set " + (j + 1));
      } else if (idx === globalCurrent) {
        dot.classList.add("active");
        if (isDoingSet) dot.classList.add("blinking");
      }
      if (exIdx === viewingExercise && setIdx === viewingSet && isBrowsing()) {
        dot.classList.add("cursor");
      }
      dotsRow.appendChild(dot);
      idx++;
    }
    const label = document.createElement("div");
    label.className = "exercise-label";
    if (i < currentExercise) label.classList.add("completed");
    else if (i === currentExercise) label.classList.add("active");
    label.textContent = workout[i].name;
    group.appendChild(label);
    group.appendChild(dotsRow);
    elProgress.appendChild(group);
  }
}

function renderExercise() {
  // When browsing, show the viewed set's context; otherwise current working.
  const exIdx = isBrowsing() ? viewingExercise : currentExercise;
  const setIdx = isBrowsing() ? viewingSet : currentSet;
  const ex = workout[exIdx];
  elName.textContent = ex.name;
  // Order: Weight \u00b7 Set X/Y \u00b7 reps
  elSet.textContent = ex.weight + "  \u00b7  Set " + (setIdx + 1) + "/" + ex.sets + "  \u00b7  " + ex.reps + " reps";
  // Set-specific note takes priority, falls back to exercise note
  let noteText = "";
  if (Array.isArray(ex.setNotes) && ex.setNotes[setIdx]) {
    noteText = ex.setNotes[setIdx];
  } else if (ex.note) {
    noteText = ex.note;
  }
  elNote.textContent = noteText;
  renderProgress();
  requestAnimationFrame(centerMainButton);
}

function formatTime(seconds) {
  // Always ceil (handles floats from precise pause/resume math)
  const total = Math.max(0, Math.ceil(seconds));
  const m = Math.floor(total / 60);
  const s = total % 60;
  return `${m}:${s.toString().padStart(2, "0")}`;
}

// ============ FLASH (Mazda) ============
function startFlash() {
  document.body.classList.remove('alert-flashing');
  void document.body.offsetWidth;
  document.body.classList.add('alert-flashing');
}
function stopFlash() {
  document.body.classList.remove('alert-flashing');
}

// ============ REST RING ============
function updateRestRing() {
  if (!restEndTime || !restTotalSeconds) {
    elRingBar.setAttribute("stroke-dashoffset", RING_CIRCUMFERENCE);
    return;
  }
  const remaining = Math.max(0, (restEndTime - Date.now()) / 1000);
  const fraction = Math.max(0, Math.min(1, remaining / restTotalSeconds));
  const offset = RING_CIRCUMFERENCE * (1 - fraction);
  elRingBar.setAttribute("stroke-dashoffset", offset);
}
function showRestRing(show, paused) {
  elBtnWrap.classList.toggle("show-ring", !!show);
  elBtnWrap.classList.toggle("paused", !!paused);
}

// ============ LOG AREA ============
function showLogArea(exerciseIdx) {
  logExerciseIndex = exerciseIdx;
  elNotesInput.placeholder = "notes...";
  elLogArea.style.display = "flex";
  syncLogArea();
}
function hideLogArea() {
  elLogArea.style.display = "none";
}
function captureLog() {
  // Reps/notes/difficulty are saved in real-time via input handlers.
  // This just clears the active log reference at transition points.
  currentLogEntry = null;
}

// ============ TIMER LOOP ============
function startCountdown() {
  if (timerInterval) clearInterval(timerInterval);
  updateRestRing();
  // 100ms updates = smooth ring without CSS transition
  timerInterval = setInterval(() => {
    const remaining = Math.max(0, (restEndTime - Date.now()) / 1000);
    if (remaining <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      updateRestRing();
      restDone();
    } else {
      restRemaining = remaining;
      elTimer.textContent = formatTime(Math.ceil(remaining));
      updateRestRing();
    }
  }, 100);
}

// ============ HISTORY (back/forward) ============
function snapshot() {
  return {
    currentExercise, currentSet, state,
    restEndTime, restRemaining, restTotalSeconds,
    setLogs: setLogs.map(l => ({...l})),
    repCount, logExerciseIndex,
    notes: elNotesInput.value,
    currentLogEntryIdx: currentLogEntry ? setLogs.indexOf(currentLogEntry) : -1
  };
}
function applySnapshot(s) {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  cancelRestNotif();
  stopFlash();

  currentExercise = s.currentExercise;
  currentSet = s.currentSet;
  viewingExercise = currentExercise;
  viewingSet = currentSet;
  state = s.state;
  restEndTime = s.restEndTime;
  restRemaining = s.restRemaining;
  restTotalSeconds = s.restTotalSeconds || s.restRemaining || 0;
  setLogs.length = 0;
  s.setLogs.forEach(l => setLogs.push(l));
  repCount = s.repCount;
  logExerciseIndex = s.logExerciseIndex;
  currentLogEntry = s.currentLogEntryIdx >= 0 ? setLogs[s.currentLogEntryIdx] : null;

  // If restoring an expired resting state, restart the countdown with full rest period
  // (otherwise back from alert just bounces right back to alert)
  if (state === "resting" && restEndTime && restEndTime < Date.now()) {
    restEndTime = Date.now() + restRemaining * 1000;
  }

  applyState(s.notes || "");
  saveState();
}
function applyState(notesValue) {
  showRestRing(false, false);

  if (state === "resting" && restEndTime) {
    const remaining = Math.ceil((restEndTime - Date.now()) / 1000);
    if (remaining <= 0) {
      state = "alert";
      restEndTime = null;
      renderExercise();
      elTimer.textContent = "0:00";
      elTimerLabel.textContent = "GO";
      elBtn.textContent = "Start Set";
      elBtn.className = "go";
      elSkip.style.display = "none";
      elLogArea.style.display = "flex";
      startFlash();
      triggerAlertFeedback();
    } else {
      restRemaining = remaining;
      renderExercise();
      elTimer.textContent = formatTime(remaining);
      elTimerLabel.textContent = "REST";
      elBtn.textContent = "Pause";
      elBtn.className = "resting";
      elSkip.style.display = "flex";
      elLogArea.style.display = "flex";
      elRepCount.textContent = repCount;
      elNotesInput.value = notesValue;
      showRestRing(true, false);
      requestWakeLock();
      scheduleRestNotif(remaining * 1000);
      startCountdown();
    }
  } else if (state === "alert") {
    renderExercise();
    elTimer.textContent = "0:00";
    elTimerLabel.textContent = "GO";
    elBtn.textContent = "Start Set";
    elBtn.className = "go";
    elSkip.style.display = "none";
    elLogArea.style.display = "flex";
    elNotesInput.value = notesValue;
    startFlash();
    triggerAlertFeedback();
  } else if (state === "paused") {
    renderExercise();
    elTimer.textContent = formatTime(restRemaining);
    elTimerLabel.textContent = "PAUSED";
    elBtn.textContent = "Resume";
    elBtn.className = "paused";
    elSkip.style.display = "flex";
    elLogArea.style.display = "flex";
    elRepCount.textContent = repCount;
    elNotesInput.value = notesValue;
    showRestRing(true, true);
    updateRestRing();
  } else if (state === "finishing") {
    renderExercise();
    elBtn.textContent = "Finish";
    elBtn.className = "go";
    elTimer.textContent = "-:--";
    elTimerLabel.textContent = "LOG YOUR LAST SET";
    elSkip.style.display = "none";
    elLogArea.style.display = "flex";
    elRepCount.textContent = repCount;
    elNotesInput.value = notesValue;
  } else if (state === "ready") {
    renderExercise();
    elTimer.textContent = "-:--";
    elTimerLabel.textContent = "";
    elBtn.textContent = "Set Done";
    elBtn.className = "";
    elSkip.style.display = "none";
    elLogArea.style.display = "flex";
    elNotesInput.value = notesValue;
  } else {
    renderExercise();
  }
  // Disable main button + show return/here pills while browsing
  if (isBrowsing()) {
    elBtn.style.opacity = '0.35';
    elBtn.style.pointerEvents = 'none';
    elReturnPill.classList.add('visible');
    elSetCurrentBtn.classList.add('visible');
    elBtn.classList.add('browsing');
    elLogArea.style.display = 'flex';
  } else {
    elBtn.style.opacity = '';
    elBtn.style.pointerEvents = '';
    elReturnPill.classList.remove('visible');
    elSetCurrentBtn.classList.remove('visible');
    elBtn.classList.remove('browsing');
    // Keep log area visible in non-finished states (user can always see/edit notes)
    if (state !== 'finished') elLogArea.style.display = 'flex';
  }
  // Sync log area UI (reps/notes/difficulty) with the active log entry.
  // Overrides per-branch elRepCount/elNotesInput values set above, ensuring
  // UI matches whichever log is being edited (current working or viewed).
  if (elLogArea.style.display === 'flex') syncLogArea();
  updateNavButtons();
}
function pushHistory() {
  history.push(snapshot());
  if (history.length > HISTORY_MAX) history.shift();
  future.length = 0;
  updateNavButtons();
}
function back() {
  if (history.length === 0) return;
  future.push(snapshot());
  if (future.length > HISTORY_MAX) future.shift();
  const s = history.pop();
  applySnapshot(s);
}
function forward() {
  if (future.length === 0) return;
  history.push(snapshot());
  if (history.length > HISTORY_MAX) history.shift();
  const s = future.pop();
  applySnapshot(s);
}
function updateNavButtons() {}

// ============ STATE TRANSITIONS ============
function setDone() {
  pushHistory();
  stopFlash();
  captureLog();

  const logEntry = {
    exercise: currentExercise,
    set: currentSet,
    reps: getMaxReps(workout[currentExercise].reps),
    note: "",
    difficulty: null,
    timestamp: Date.now()
  };
  setLogs.push(logEntry);
  currentLogEntry = logEntry;

  const finishedExercise = currentExercise;
  currentSet++;

  showLogArea(finishedExercise);

  const isLastSet = finishedExercise >= workout.length - 1 && currentSet >= workout[finishedExercise].sets;
  if (isLastSet) {
    viewingExercise = currentExercise;
    viewingSet = currentSet;
    elBtn.textContent = "Finish";
    elBtn.className = "go";
    state = "finishing";
    elTimer.textContent = "-:--";
    elTimerLabel.textContent = "LOG YOUR LAST SET";
    elSkip.style.display = "none";
    showRestRing(false);
    renderProgress();
    requestAnimationFrame(() => { saveState(); });
    return;
  }

  if (currentSet >= workout[currentExercise].sets) {
    currentExercise++;
    currentSet = 0;
  }

  // Keep viewing cursor pinned to working position after advancement
  viewingExercise = currentExercise;
  viewingSet = currentSet;

  elSkip.style.display = "flex";
  elSkip.style.pointerEvents = "auto";
  state = "resting";
  const switchingExercise = (finishedExercise !== currentExercise);
  restRemaining = switchingExercise ? 60 : workout[finishedExercise].rest;
  restTotalSeconds = restRemaining;
  restEndTime = Date.now() + restRemaining * 1000;
  elTimer.textContent = formatTime(restRemaining);
  elTimerLabel.textContent = switchingExercise ? "UP NEXT" : "REST";
  elBtn.textContent = "Pause";
  elBtn.className = "resting";
  renderExercise();
  showRestRing(true, false);
  startCountdown();

  // Defer all expensive non-critical work to next frame so the UI updates immediately
  requestAnimationFrame(() => {
    initAudio();
    requestWakeLock();
    ensureNotifPermission();
    scheduleRestNotif(restRemaining * 1000);
    saveState();
  });
}

function restDone() {
  pushHistory();
  cancelRestNotif();
  captureLog();
  // Log area stays visible across rest->ready/alert transition so user always
  // has access to notes/reps/diff, even on the Start Set / Set Done screens.
  showRestRing(false);

  if (settings.autoStart) {
    state = "ready";
    elTimer.textContent = "-:--";
    elTimerLabel.textContent = "GO";
    elBtn.textContent = "Set Done";
    elBtn.className = "";
    elSkip.style.display = "none";
    renderExercise();
  } else {
    state = "alert";
    elTimer.textContent = "0:00";
    elTimerLabel.textContent = "GO";
    elBtn.textContent = "Start Set";
    elBtn.className = "go";
    elSkip.style.display = "none";
    renderExercise();
  }
  elLogArea.style.display = "flex";
  syncLogArea();
  startFlash();
  updateNavButtons();
  // Defer audio/save so UI updates first (no perceptible lag)
  requestAnimationFrame(() => {
    triggerAlertFeedback();
    saveState();
  });
}

function pauseRest() {
  captureLog();
  cancelRestNotif();
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  // Capture EXACT remaining time (float seconds) so resume doesn't round-up jump
  restRemaining = Math.max(0, (restEndTime - Date.now()) / 1000);
  state = "paused";
  elBtn.textContent = "Resume";
  elBtn.className = "paused";
  elTimerLabel.textContent = "PAUSED";
  showRestRing(true, true);
  renderProgress();
  saveState();
}

function resumeRest() {
  captureLog();
  state = "resting";
  restEndTime = Date.now() + restRemaining * 1000;
  elBtn.textContent = "Pause";
  elBtn.className = "resting";
  elTimerLabel.textContent = "REST";
  showRestRing(true, false);
  renderProgress();
  scheduleRestNotif(restRemaining * 1000);
  saveState();
  startCountdown();
}

function skipRest() {
  pushHistory();
  cancelRestNotif();
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  captureLog();
  // Log area stays visible across skip (user still has notes/reps/diff UI)
  showRestRing(false);
  state = "ready";
  elTimer.textContent = "-:--";
  elTimerLabel.textContent = "";
  elBtn.textContent = "Set Done";
  elBtn.className = "";
  elSkip.style.display = "none";
  renderExercise();
  elLogArea.style.display = "flex";
  syncLogArea();
  saveState();
}

function acknowledgeAlert() {
  pushHistory();
  captureLog();  // Safety: ensure any pending reps/notes are pinned to the log entry
  stopFlash();
  state = "ready";
  elTimer.textContent = "-:--";
  elTimerLabel.textContent = "";
  elBtn.textContent = "Set Done";
  elBtn.className = "";
  renderExercise();
  saveState();
}

// ============ DRAG REORDER ============
// Long-press on an exercise-group (label + dots area) to grab it.
// Drag to target position, release to commit.
// Short tap on a completed dot still opens the edit modal (handled by skipping drag init when target is a completed dot).

// Transform an exercise index according to a splice(fromIdx,1) + splice(toIdx,0,moved) reorder.
function transformExerciseIdx(ei, fromIdx, toIdx) {
  if (ei === fromIdx) return toIdx;
  if (fromIdx < ei && ei <= toIdx) return ei - 1;
  if (toIdx <= ei && ei < fromIdx) return ei + 1;
  return ei;
}

function reorderExercise(fromIdx, toIdx) {
  if (fromIdx === toIdx) return;
  if (fromIdx < 0 || fromIdx >= workout.length) return;
  if (toIdx < 0 || toIdx >= workout.length) return;

  pushHistory();

  // If the edit modal is open on a log, its editingLog reference survives
  // (setLogs array isn't reordered, only log.exercise values get remapped),
  // but any displayed exercise NAME in the modal could go stale. Close to be safe.
  if (elEditModal.classList.contains("show")) closeEditModal();

  // Shuffle the workout array
  const moved = workout.splice(fromIdx, 1)[0];
  workout.splice(toIdx, 0, moved);

  // Remap every live exercise-index reference
  const remap = (ei) => transformExerciseIdx(ei, fromIdx, toIdx);

  currentExercise = remap(currentExercise);
  logExerciseIndex = remap(logExerciseIndex);
  viewingExercise = remap(viewingExercise);
  setLogs.forEach(l => { l.exercise = remap(l.exercise); });

  // Remap history and future snapshots too, so back/forward stay correct
  const remapSnapshot = (snap) => {
    if (typeof snap.currentExercise === 'number') snap.currentExercise = remap(snap.currentExercise);
    if (typeof snap.logExerciseIndex === 'number') snap.logExerciseIndex = remap(snap.logExerciseIndex);
    if (Array.isArray(snap.setLogs)) {
      snap.setLogs.forEach(l => { l.exercise = remap(l.exercise); });
    }
  };
  history.forEach(remapSnapshot);
  future.forEach(remapSnapshot);

  renderExercise();  // rerenders name/weight/reps + calls renderProgress()
  saveState();

}

// ============ VIEWING CURSOR (tap-to-cycle) ============
function cycleView(exIdx, setIdx) {
  // Second tap on the already-viewed completed set opens edit modal
  if (viewingExercise === exIdx && viewingSet === setIdx && isBrowsing()) {
    const log = setLogs.find(l => l.exercise === exIdx && l.set === setIdx);
    if (log) { openEditModal(exIdx, setIdx); return; }
  }
  viewingExercise = exIdx;
  viewingSet = setIdx;
  renderExercise();
  elReturnPill.classList.toggle('visible', isBrowsing());
  elSetCurrentBtn.classList.toggle('visible', isBrowsing());
  if (isBrowsing()) {
    elBtn.style.opacity = '0.35';
    elBtn.style.pointerEvents = 'none';
    // Force log area visible so user can see/edit the viewed set's reps+notes+diff
    elLogArea.style.display = 'flex';
    // Diagonal slash across the main button signals "Set Done" is inaccessible
    // in view mode. Rest-timer continues running internally.
    elBtn.classList.add('browsing');
  } else {
    elBtn.style.opacity = '';
    elBtn.style.pointerEvents = '';
    elBtn.classList.remove('browsing');
  }
  syncLogArea();
  saveState();
}

function returnToWorking() {
  viewingExercise = currentExercise;
  viewingSet = currentSet;
  renderExercise();
  elReturnPill.classList.remove('visible');
  elSetCurrentBtn.classList.remove('visible');
  elBtn.style.opacity = '';
  elBtn.style.pointerEvents = '';
  elBtn.classList.remove('browsing');
  // Log area is always visible except when workout is finished.
  if (state !== 'finished') {
    elLogArea.style.display = 'flex';
  } else {
    elLogArea.style.display = 'none';
  }
  syncLogArea();
  saveState();
}

// ============ SUMMARY ============
function summaryDateStr() {
  return new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
}
function getTotalDuration() {
  const ts = setLogs.filter(l => l.timestamp).map(l => l.timestamp);
  if (ts.length < 2) return null;
  return Math.max(...ts) - Math.min(...ts);
}
const DIFFICULTY_LABELS = ['', 'EASY', 'LIGHT', 'MOD', 'HARD', 'MAX'];
function formatDifficulty(log) {
  return (log && log.difficulty) ? ' [' + DIFFICULTY_LABELS[log.difficulty] + ']' : '';
}
function buildSummary() {
  let text = dayType + " -- " + summaryDateStr() + "\n\n";
  for (let i = 0; i < workout.length; i++) {
    const ex = workout[i];
    const dur = getExerciseDuration(i);
    text += ex.name + " @ " + ex.weight;
    if (dur && dur > 0) text += "  (" + formatDuration(dur) + ")";
    text += "\n";
    for (let j = 0; j < ex.sets; j++) {
      const log = setLogs.find(l => l.exercise === i && l.set === j);
      if (log) {
        const diff = formatDifficulty(log);
        const note = log.note ? " -- " + log.note : "";
        text += "  S" + (j + 1) + ": " + log.reps + " reps" + diff + note + "\n";
      } else {
        text += "  S" + (j + 1) + ": -\n";
      }
    }
    if (i < workout.length - 1) text += "\n";
  }
  const total = getTotalDuration();
  if (total) text += "\nTotal: " + formatDuration(total) + "\n";
  return text;
}
function buildSummaryHTML() {
  let html = '<div class="exercise-header">' + dayType + ' -- ' + summaryDateStr() + '</div><br>';
  for (let i = 0; i < workout.length; i++) {
    const ex = workout[i];
    const dur = getExerciseDuration(i);
    let header = ex.name + ' @ ' + ex.weight;
    let durTag = (dur && dur > 0) ? ' <span class="duration-tag">(' + formatDuration(dur) + ')</span>' : '';
    html += '<div class="exercise-header">' + header + durTag + '</div>';
    for (let j = 0; j < ex.sets; j++) {
      const log = setLogs.find(l => l.exercise === i && l.set === j);
      if (log) {
        const diff = formatDifficulty(log);
        const note = log.note ? ' -- ' + log.note : '';
        html += '<div class="set-line">S' + (j + 1) + ': <span class="set-note">' + log.reps + ' reps' + diff + note + '</span></div>';
      } else {
        html += '<div class="set-line">S' + (j + 1) + ': -</div>';
      }
    }
    if (i < workout.length - 1) html += '<br>';
  }
  const total = getTotalDuration();
  if (total) html += '<div class="total-line">Total: ' + formatDuration(total) + '</div>';
  return html;
}

function finishWorkout() {
  pushHistory();
  cancelRestNotif();
  releaseWakeLock();
  captureLog();
  hideLogArea();
  showRestRing(false);
  state = "finished";
  elDayTitle.style.display = "none";
  elName.style.display = "none";
  elSet.style.display = "none";
  elNote.style.display = "none";
  elTimer.style.display = "none";
  elTimerLabel.style.display = "none";
  elBtnWrap.style.display = "none";
  elSkip.style.display = "none";
  elProgress.style.display = "none";
  elReturnPill.classList.remove('visible');
  elSetCurrentBtn.classList.remove('visible');
  elSettingsBtn.style.display = "none";
  elDone.style.display = "block";
  elSummary.innerHTML = buildSummaryHTML();
  try { localStorage.removeItem("gym-timer-state"); } catch(e) {}
}

// ============ EDIT MODAL ============

function openSettings() {

const elSettingsReset = document.getElementById("settings-reset");
let resetConfirmTimer = null;

// ============ INPUT HANDLERS ============
elBtn.addEventListener("click", () => {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  if (state === "ready") setDone();
  else if (state === "alert") acknowledgeAlert();
  else if (state === "resting") pauseRest();
  else if (state === "paused") resumeRest();
  else if (state === "finishing") finishWorkout();
});
elSkip.addEventListener("click", (e) => {
  e.stopPropagation();
  if (state !== "resting" && state !== "paused") return;
  // Subtle press animation: icon flies right while we transition state
  elSkip.classList.add("pressed");
  setTimeout(() => {
    skipRest();
    elSkip.classList.remove("pressed");
  }, 160);
});
elRepMinus.addEventListener("click", (e) => {

  if (log) {
    log.reps = Math.max(0, log.reps - 1);

    log.reps += 1;
    elRepCount.textContent = log.reps;
    if (log === currentLogEntry) repCount = log.reps;

    elRepCount.textContent = repCount;

elNotesInput.addEventListener("input", () => {

});
elDifficultyRow.addEventListener("click", (e) => {

  const diff = Number(btn.dataset.diff);
  if (!diff) return;

});
elReturnPill.addEventListener("click", returnToWorking);
elSetCurrentBtn.addEventListener("click", () => {
  // Set the currently-viewed set as the new working position.
  // Only functional while browsing (viewing != working).
  if (!isBrowsing()) return;
  pushHistory();
  currentExercise = viewingExercise;
  currentSet = viewingSet;
  // viewing now equals working, so isBrowsing() is false.
  elReturnPill.classList.remove('visible');
  elSetCurrentBtn.classList.remove('visible');
  elBtn.classList.remove('browsing');
  elBtn.style.opacity = '';
  elBtn.style.pointerEvents = '';
  renderExercise();
  syncLogArea();
  saveState();
});

// ============ DRAG REORDER (SortableJS) + TAP-TO-JUMP ============
// Long-press threshold (600ms) + wide touchStartThreshold (15px) keeps
// taps from accidentally triggering drag. fallbackOnBody:false anchors
// the clone inside #progress so drag position matches the finger.
// direction:'horizontal' matches the actual row layout.
const sortable = Sortable.create(elProgress, {
  animation: 180,
  easing: "cubic-bezier(0.2, 0, 0, 1)",
  delay: 600,
  delayOnTouchOnly: true,
  touchStartThreshold: 15,
  forceFallback: true,
  fallbackTolerance: 6,
  fallbackOnBody: false,
  direction: 'horizontal',
  draggable: '.exercise-group',
  ghostClass: "sortable-ghost",
  chosenClass: "sortable-chosen",
  dragClass: "sortable-drag",

  onChoose() {
    if (elEditModal.classList.contains("show") || elSettingsModal.classList.contains("show")) {
      sortable.option("disabled", true);
      queueMicrotask(() => sortable.option("disabled", false));
      return;
    }
    document.body.classList.add("dragging-exercise");
  },
  onEnd(evt) {
    setTimeout(() => document.body.classList.remove("dragging-exercise"), 50);
    const from = evt.oldIndex;
    const to = evt.newIndex;
    if (from == null || to == null || from === to) return;
    reorderExercise(from, to);
  },
});

// Tap-to-cycle via RAW touch events (bypasses SortableJS's click suppression
// on iOS). Click fallback for desktop mouse. Dedupe with lastTapTime so we
// don't double-fire when iOS generates a synthetic click after touchend.
let tapStart = null;
let lastTouchTapTime = 0;

function handleTap(target) {
  if (!target) return false;
  if (document.body.classList.contains("dragging-exercise")) return false;
  if (elEditModal.classList.contains("show") || elSettingsModal.classList.contains("show")) return false;

  // Dot tap? Jump to that exact set (or return to working if tapping the
  // active dot while browsing).
  const dotEl = (target.classList && target.classList.contains("dot"))
    ? target
    : (target.closest ? target.closest(".dot") : null);
  if (dotEl && dotEl.dataset && dotEl.dataset.exerciseIdx != null) {
    const exIdx = Number(dotEl.dataset.exerciseIdx);
    const setIdx = Number(dotEl.dataset.setIdx);
    if (!Number.isFinite(exIdx) || !Number.isFinite(setIdx)) return false;
    if (exIdx === currentExercise && setIdx === currentSet && isBrowsing()) {
      returnToWorking();
    } else {
      cycleView(exIdx, setIdx);
    }
    return true;
  }

  const group = target.closest ? target.closest(".exercise-group") : null;
  if (!group || !elProgress.contains(group)) return false;
  const exIdx = Number(group.dataset.exerciseIdx);
  if (!Number.isFinite(exIdx)) return false;
  if (exIdx === viewingExercise) {
    const ex = workout[exIdx];
    const nextSet = (viewingSet + 1) % ex.sets;
    cycleView(exIdx, nextSet);
  } else {
    cycleView(exIdx, 0);
  }
  return true;
}

elProgress.addEventListener("touchstart", (e) => {
  if (e.touches.length !== 1) { tapStart = null; return; }
  const t = e.touches[0];
  tapStart = { x: t.clientX, y: t.clientY, time: Date.now(), target: e.target };
}, { passive: true });

elProgress.addEventListener("touchmove", (e) => {
  if (!tapStart) return;
  const t = e.touches[0];
  if (!t) return;
  if (Math.abs(t.clientX - tapStart.x) > 15 || Math.abs(t.clientY - tapStart.y) > 15) {
    tapStart = null;  // scrolling/dragging, not a tap
  }
}, { passive: true });

elProgress.addEventListener("touchend", (e) => {
  if (!tapStart) return;
  const info = tapStart;
  tapStart = null;
  if (Date.now() - info.time > 700) return;
  if (e.changedTouches && e.changedTouches[0]) {
    const t = e.changedTouches[0];
    if (Math.abs(t.clientX - info.x) > 15 || Math.abs(t.clientY - info.y) > 15) return;
  }
  if (handleTap(info.target)) {
    lastTouchTapTime = Date.now();
    // Best-effort: suppress the synthetic click iOS generates next.
    try { e.preventDefault(); } catch (_) {}
  }
}, { passive: false });

elProgress.addEventListener("touchcancel", () => { tapStart = null; }, { passive: true });

// Desktop mouse fallback. Skip if this click is the synthetic one following
// a touch tap we already processed.
elProgress.addEventListener("click", (e) => {
  if (Date.now() - lastTouchTapTime < 500) return;
  handleTap(e.target);
});

// iOS may show the native text-selection callout on long-press. Preventing
// contextmenu blocks it without affecting taps or drags.
elProgress.addEventListener("contextmenu", (e) => e.preventDefault());
elCopy.addEventListener("click", () => {
  const text = buildSummary();
  navigator.clipboard.writeText(text).then(() => {
    elCopy.textContent = "Copied";
    elCopy.className = "copied";
    setTimeout(() => {
      elCopy.textContent = "Copy Summary";
      elCopy.className = "";
    }, 2000);
  });
});

// ============ STATE PERSISTENCE ============
function saveState() {
  const s = {
    savedAt: Date.now(),
    currentExercise, currentSet, state, restEndTime, restRemaining, restTotalSeconds,
    viewingExercise, viewingSet,
    setLogs: setLogs.map(l => ({...l})),
    repCount,
    notes: elNotesInput.value,
    logExerciseIndex,
    // Persist any mid-session reorder so refreshes/background kills don't snap back
    workoutOrder: workout.map(ex => ex.name),
    history: history.map(h => ({...h, setLogs: h.setLogs.map(l => ({...l}))})),
    future:  future.map(f => ({...f, setLogs: f.setLogs.map(l => ({...l}))}))
  };
  try { localStorage.setItem("gym-timer-state", JSON.stringify(s)); } catch(e) {}
}
function restoreState() {
  try {
    const raw = localStorage.getItem("gym-timer-state");
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (s.savedAt && (Date.now() - s.savedAt > STATE_TTL_MS)) {
      try { localStorage.removeItem("gym-timer-state"); } catch(e) {}
      return false;
    }

    // Reapply saved reorder BEFORE anything else reads workout[].
    // If saved order has same names as current workout, rebuild workout to match.
    if (Array.isArray(s.workoutOrder) && s.workoutOrder.length === workout.length) {
      const byName = new Map(originalWorkout.map(ex => [ex.name, ex]));
      const reordered = s.workoutOrder.map(name => byName.get(name));
      if (reordered.every(ex => ex)) {
        workout.length = 0;
        reordered.forEach(ex => workout.push(ex));
      }
    }

    currentExercise = s.currentExercise;
    currentSet = s.currentSet;
    viewingExercise = (typeof s.viewingExercise === 'number') ? s.viewingExercise : currentExercise;
    viewingSet = (typeof s.viewingSet === 'number') ? s.viewingSet : currentSet;
    repCount = s.repCount || 10;
    if (typeof s.logExerciseIndex === 'number') logExerciseIndex = s.logExerciseIndex;
    setLogs.length = 0;
    s.setLogs.forEach(l => setLogs.push(l));
    state = s.state;
    restEndTime = s.restEndTime;
    restRemaining = s.restRemaining;
    restTotalSeconds = s.restTotalSeconds || s.restRemaining || 0;

    history.length = 0;
    if (Array.isArray(s.history)) s.history.forEach(h => history.push(h));
    future.length = 0;
    if (Array.isArray(s.future)) s.future.forEach(f => future.push(f));

    if (state === "resting" || state === "paused" || state === "finishing") {
      const lastLog = setLogs[setLogs.length - 1];
      if (lastLog) currentLogEntry = lastLog;
    }
    applyState(s.notes || "");
    return true;
  } catch(e) { return false; }
}

// ============ VISIBILITY HANDLER ============
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (state === "resting" && restEndTime) {
    const remaining = Math.ceil((restEndTime - Date.now()) / 1000);
    if (remaining <= 0) {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      restDone();
    } else {
      restRemaining = remaining;
      elTimer.textContent = formatTime(remaining);
      updateRestRing();
    }
  }
  if (state !== "ready" && state !== "finished" && !wakeLock) {
    requestWakeLock();
  }
});

// ============ INIT ============
// Allow URL reset (e.g. ?reset=1) to wipe saved workout state
if (new URLSearchParams(location.search).has('reset')) {
  try { localStorage.removeItem("gym-timer-state"); } catch(e) {}
  // Strip ?reset from URL so refreshes don't keep resetting.
  // NOTE: the local `history` const above shadows window.history inside this script,
  // so we have to reach for the real thing explicitly.
  try { window.history.replaceState(null, '', location.pathname); } catch(e) {}
}

elSkip.style.display = "none";
showRestRing(false);
updateNavButtons();
applySettingsToggles();
if (!restoreState()) {
  elTimer.textContent = "-:--";
  elTimerLabel.textContent = "";
  renderExercise();
  // Log area is always visible except when workout is finished.
  elLogArea.style.display = "flex";
  syncLogArea();
}
// Center main button after initial layout settles, and on any resize.
requestAnimationFrame(centerMainButton);
setTimeout(centerMainButton, 50);
window.addEventListener("resize", centerMainButton);
window.addEventListener("orientationchange", () => setTimeout(centerMainButton, 100));
</script>

</body>
