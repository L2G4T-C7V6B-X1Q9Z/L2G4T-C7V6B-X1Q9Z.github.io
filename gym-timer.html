<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Gym Timer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@200;400;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'JetBrains Mono', monospace;
    background: #111;
    color: #ccc;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 76px 20px 140px;
    -webkit-user-select: none;
    user-select: none;
  }
  h1 {
    font-size: 11px;
    color: #888;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 24px;
    font-weight: 400;
    text-align: center;
  }
  #exercise-name {
    font-size: 22px;
    font-weight: 700;
    color: #eee;
    text-align: center;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
  }
  #set-info {
    font-size: 13px;
    color: #aaa;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
    text-align: center;
  }
  #exercise-note {
    font-size: 11px;
    color: #777;
    font-style: italic;
    margin-bottom: 24px;
    text-align: center;
    max-width: 300px;
    line-height: 1.45;
    min-height: 16px;
  }
  #timer-display {
    font-size: 76px;
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    color: #eee;
    margin-bottom: 4px;
    line-height: 1;
    letter-spacing: -2px;
    text-align: center;
  }
  #timer-label {
    font-size: 11px;
    color: #999;
    margin-bottom: 24px;
    height: 16px;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-align: center;
  }

  /* Main button + progress ring wrapper */
  .btn-wrap {
    position: relative;
    width: 184px;
    height: 184px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #main-btn {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 2px solid #333;
    background: #1a1a1a;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #bbb;
    cursor: pointer;
    transition: transform 0.2s, color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  #main-btn:active { transform: scale(0.96); }
  #main-btn.resting,
  #main-btn.paused {
    border-color: transparent;
    color: #c0392b;
  }
  #main-btn.paused { color: #777; }
  #main-btn.go {
    border-color: #c0392b;
    background: #c0392b;
    color: #fff;
  }

  /* Progress ring (drains as rest counts down) */
  #rest-ring {
    position: absolute;
    inset: 0;
    width: 184px;
    height: 184px;
    pointer-events: none;
    display: none;
    transform: rotate(-90deg);
  }
  .btn-wrap.show-ring #rest-ring { display: block; }
  #rest-ring-track {
    fill: none;
    stroke: rgba(192, 57, 43, 0.12);
    stroke-width: 3;
  }
  #rest-ring-bar {
    fill: none;
    stroke: #c0392b;
    stroke-width: 3;
    stroke-linecap: round;
    /* No CSS transition -- updates are driven directly by timer interval */
  }
  .btn-wrap.paused #rest-ring-bar {
    stroke: #777;
  }

  /* Skip button: small circular button positioned to the right of the main button,
     vertically aligned with its center. Fast-forward icon. */
  #skip-btn {
    position: absolute;
    left: calc(100% + 18px);
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #1a1a1a;
    border: 1px solid #333;
    color: #999;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: transform 0.12s ease, color 0.2s, border-color 0.2s, background 0.2s;
  }
  #skip-btn:active {
    transform: translateY(-50%) scale(0.85);
    color: #c0392b;
    border-color: #c0392b;
    background: rgba(192, 57, 43, 0.12);
  }
  #skip-btn svg {
    width: 18px;
    height: 18px;
    transition: transform 0.18s ease;
  }
  /* Subtle "skipping forward" cue: icon slides right + fades on press */
  @keyframes skip-icon-fly {
    0%   { transform: translateX(0);  opacity: 1; }
    100% { transform: translateX(8px); opacity: 0; }
  }
  #skip-btn.pressed svg {
    animation: skip-icon-fly 0.18s ease-out forwards;
  }

  /* Top corner buttons (back / forward / settings) — SVG icons, perfectly centered */
  .top-btn {
    position: fixed;
    top: 16px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid #333;
    background: #1a1a1a;
    color: #aaa;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 0;
    transition: opacity 0.2s, color 0.2s, border-color 0.2s, transform 0.1s;
  }
  .top-btn svg { width: 18px; height: 18px; display: block; }
  .top-btn:active { transform: scale(0.92); }
  #nav-back { left: 16px; }
  #nav-forward { left: 68px; display: none; }
  #settings-btn { right: 16px; }
  #settings-btn svg { width: 20px; height: 20px; }
  .top-btn.disabled { opacity: 0.22; pointer-events: none; }

  /* Bottom logging area */
  #log-area {
    display: none;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-top: auto;
    padding: 12px 20px;
    width: 100%;
    max-width: 360px;
  }
  #rep-counter {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .rep-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid #333;
    background: transparent;
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 400;
    color: #999;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .rep-btn:active {
    transform: scale(0.9);
    border-color: #c0392b;
    color: #c0392b;
  }
  #rep-count {
    font-size: 22px;
    font-weight: 700;
    color: #eee;
    min-width: 30px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #rep-label {
    font-size: 9px;
    color: #666;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  #notes-input {
    flex: 1;
    min-width: 0;
    padding: 8px 12px;
    border: 1px solid #333;
    border-radius: 6px;
    background: #1a1a1a;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #ddd;
    text-align: center;
    outline: none;
    transition: border-color 0.2s;
    -webkit-user-select: auto;
    user-select: auto;
  }
  #notes-input:focus { border-color: #c0392b; }
  #notes-input::placeholder { color: #555; font-size: 11px; }

  /* Bottom fixed bar — transparent so body bg flashes through */
  #bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: transparent;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #progress {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 20px;
    padding: 12px 24px 16px;
    width: 100%;
  }
  .exercise-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  /* Long-press feedback: slight shrink + fade to signal grab is ready */
  .exercise-group.drag-pressed {
    transform: scale(0.94);
    opacity: 0.75;
  }
  /* Once drag is active, hide the original so the ghost reads as the "held" one */
  .exercise-group.drag-dragging {
    opacity: 0;
    pointer-events: none;
  }
  /* Highlight the drop target with a red underline + subtle scale */
  .exercise-group.drag-target {
    transform: scale(1.08);
  }
  .exercise-group.drag-target .exercise-label {
    color: #c0392b;
  }
  /* Floating ghost follows the pointer */
  .drag-ghost {
    position: fixed;
    left: 0;
    top: 0;
    pointer-events: none;
    z-index: 1000;
    transform-origin: center;
    filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.55));
  }
  .drag-ghost .exercise-label {
    color: #c0392b !important;
  }
  /* Lock page scroll during reorder so the user can drag freely */
  body.reordering {
    overflow: hidden;
    touch-action: none;
  }
  .exercise-dots {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .exercise-label {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
    font-size: 9px;
    letter-spacing: 1px;
    color: #555;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .exercise-label.active { color: #c0392b; }
  .exercise-label.completed { color: #777; }

  /* Dots */
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #2a2a2a;
    transition: background 0.3s;
    flex-shrink: 0;
    position: relative;
    box-sizing: border-box;
  }
  .dot.active { background: #c0392b; }
  .dot.completed { background: #fafafa; cursor: pointer; }

  /* Active dot blinking — hollow circle, red edge only, Mazda turn signal pattern.
     Same 8px diameter, just border, no fill. Snap on then gradual fade off. */
  @keyframes mazda-edge {
    0%   { border-color: #c0392b; }
    100% { border-color: rgba(192, 57, 43, 0); }
  }
  .dot.active.blinking {
    background: transparent;
    border: 1.5px solid #c0392b;
    animation: mazda-edge 0.7s ease-out infinite;
  }

  /* Just-completed dot echoes a white ghost rightward toward the next dot. */
  @keyframes echo-travel {
    0%   { transform: translateX(0);    opacity: 0.85; }
    80%  { opacity: 0; }
    100% { transform: translateX(13px); opacity: 0; }
  }
  .dot.completed.echoing::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #fafafa;
    animation: echo-travel 1.4s ease-out infinite;
    pointer-events: none;
  }

  /* Body alert flash — Mazda turn signal pattern, 700ms cycle. */
  @keyframes mazda-bg {
    0%   { background: #4a1410; }
    100% { background: #111; }
  }
  @keyframes mazda-timer {
    0%   { color: #c0392b; }
    100% { color: #eee; }
  }
  body.alert-flashing {
    animation: mazda-bg 0.7s ease-out 6;
  }
  body.alert-flashing #timer-display {
    animation: mazda-timer 0.7s ease-out 6;
  }

  /* Settings modal */
  #settings-modal, #edit-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  #settings-modal.show, #edit-modal.show { display: flex; }
  .modal-card {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    max-width: 320px;
  }
  .modal-title {
    font-size: 11px;
    color: #888;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 20px;
    font-weight: 400;
  }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid #252525;
  }
  .setting-row:last-child { border-bottom: none; }
  .setting-label {
    font-size: 13px;
    color: #ddd;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .setting-sub {
    font-size: 10px;
    color: #777;
    margin-top: 2px;
    letter-spacing: 0.5px;
  }
  .toggle {
    width: 44px;
    height: 24px;
    background: #333;
    border-radius: 12px;
    position: relative;
    cursor: pointer;
    transition: background 0.18s;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .toggle.on { background: #c0392b; }
  .toggle::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 20px;
    height: 20px;
    background: #f0f0f0;
    border-radius: 50%;
    transition: left 0.18s;
  }
  .toggle.on::after { left: 22px; }
  .modal-close {
    width: 100%;
    margin-top: 12px;
    padding: 10px;
    border: 1px solid #333;
    background: transparent;
    color: #aaa;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 8px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .modal-close.danger {
    border-color: #5a2a25;
    color: #c0392b;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .modal-close.danger:active {
    background: rgba(192, 57, 43, 0.1);
  }
  .modal-close.danger.confirming {
    background: #c0392b;
    color: #fff;
    border-color: #c0392b;
  }

  /* Edit modal-specific */
  .edit-title {
    font-size: 16px;
    color: #eee;
    font-weight: 700;
    margin-bottom: 4px;
    letter-spacing: -0.3px;
  }
  .edit-subtitle {
    font-size: 11px;
    color: #888;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .edit-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .edit-label {
    font-size: 9px;
    color: #666;
    letter-spacing: 2px;
    text-transform: uppercase;
    width: 40px;
  }
  #edit-reps {
    font-size: 22px;
    font-weight: 700;
    color: #eee;
    min-width: 30px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #edit-notes {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid #333;
    border-radius: 6px;
    background: #111;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #ddd;
    outline: none;
    -webkit-user-select: auto;
    user-select: auto;
  }
  #edit-notes:focus { border-color: #c0392b; }
  .edit-actions {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  .edit-btn {
    flex: 1;
    padding: 12px;
    border: 1px solid #333;
    background: #111;
    color: #aaa;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 8px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .edit-btn.primary {
    border-color: #c0392b;
    background: #c0392b;
    color: #fff;
  }

  /* Done screen */
  #workout-done {
    display: none;
    text-align: center;
    width: 100%;
    max-width: 340px;
  }
  #workout-done h2 {
    font-size: 28px;
    color: #eee;
    font-weight: 700;
    margin-bottom: 24px;
    letter-spacing: -1px;
  }
  #summary {
    text-align: left;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
    font-size: 12px;
    line-height: 1.8;
    color: #999;
    white-space: pre-wrap;
  }
  #summary .exercise-header {
    color: #eee;
    font-weight: 700;
    font-size: 13px;
  }
  #summary .duration-tag {
    color: #666;
    font-weight: 400;
    font-size: 11px;
  }
  #summary .set-line {
    color: #666;
    padding-left: 8px;
  }
  #summary .set-note {
    color: #c0392b;
  }
  #summary .total-line {
    color: #eee;
    font-weight: 700;
    margin-top: 12px;
  }
  #copy-btn {
    width: 100%;
    padding: 14px;
    border: 2px solid #c0392b;
    background: #c0392b;
    color: #fff;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 10px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.15s;
  }
  #copy-btn:active { transform: scale(0.97); }
  #copy-btn.copied {
    background: #1a1a1a;
    color: #c0392b;
  }
</style>
</head>
<body>

<button id="nav-back" class="top-btn disabled" aria-label="Go back">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</button>
<button id="nav-forward" class="top-btn" aria-label="Go forward">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
</button>
<button id="settings-btn" class="top-btn" aria-label="Settings">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
</button>

<h1 id="day-title">Upper Day</h1>
<div id="exercise-name"></div>
<div id="set-info"></div>
<div id="exercise-note"></div>
<div id="timer-display" role="timer" aria-live="polite" aria-atomic="true"></div>
<div id="timer-label"></div>
<div class="btn-wrap" id="btn-wrap">
  <button id="main-btn" aria-label="Set done or rest control">Set Done</button>
  <svg id="rest-ring" viewBox="0 0 184 184" aria-hidden="true">
    <circle id="rest-ring-track" cx="92" cy="92" r="88"></circle>
    <circle id="rest-ring-bar"   cx="92" cy="92" r="88"></circle>
  </svg>
  <button id="skip-btn" aria-label="Skip rest">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 4l9 8-9 8V4zm10 0l9 8-9 8V4z"/></svg>
  </button>
</div>

<div id="bottom-bar">
  <div id="log-area">
    <div id="rep-label">REPS</div>
    <div id="rep-counter">
      <button class="rep-btn" id="rep-minus" aria-label="Decrease reps">-</button>
      <div id="rep-count" aria-live="polite">10</div>
      <button class="rep-btn" id="rep-plus" aria-label="Increase reps">+</button>
    </div>
    <input type="text" id="notes-input" placeholder="notes..." inputmode="text" aria-label="Set notes">
  </div>
  <div id="progress"></div>
</div>

<div id="settings-modal" role="dialog" aria-modal="true" aria-label="Settings">
  <div class="modal-card">
    <div class="modal-title">Settings</div>
    <div class="setting-row">
      <div>
        <div class="setting-label">Sound</div>
        <div class="setting-sub">Beep when rest ends</div>
      </div>
      <div class="toggle" id="toggle-sound" role="switch"></div>
    </div>
    <div class="setting-row">
      <div>
        <div class="setting-label">Vibration</div>
        <div class="setting-sub">Buzz when rest ends</div>
      </div>
      <div class="toggle" id="toggle-vibration" role="switch"></div>
    </div>
    <div class="setting-row">
      <div>
        <div class="setting-label">Auto-start next set</div>
        <div class="setting-sub">Skip the GO acknowledge step</div>
      </div>
      <div class="toggle" id="toggle-autostart" role="switch"></div>
    </div>
    <button class="modal-close danger" id="settings-reset">Reset Workout</button>
    <button class="modal-close" id="settings-close">Close</button>
  </div>
</div>

<div id="edit-modal" role="dialog" aria-modal="true" aria-labelledby="edit-exercise">
  <div class="modal-card">
    <div class="edit-title" id="edit-exercise"></div>
    <div class="edit-subtitle" id="edit-set"></div>
    <div class="edit-row">
      <div class="edit-label">REPS</div>
      <button class="rep-btn" id="edit-rep-minus" aria-label="Decrease reps">-</button>

</div>

<script>
// ============ CONFIG ============
const dayType = "Upper Day";

const workout = [
  {
    name: "Leg Press",

    reps: "8-12",
    weight: "195+BP lbs",
    rest: 180,

    ]
  },
  {

    setNotes: [

  },
  {

    setNotes: [

      "Adjust weight based on S1 feel. Full stretch is more important than weight.",
      "Last set. Push to 0-1 RIR. Slow controlled reps, no bouncing."
    ]
  },
  {
    name: "Cable Face Pulls",
    sets: 2,
    reps: "15-20",
    weight: "15 lbs",
    rest: 90,
    note: "Rear delt insurance (Phase 1 add). Last session: 15 x 12/20 (Apr 18) -- S1 undershot, S2 topped. Rope attachment, elbows high, pull toward forehead. Aim 15/15+ at 15 lbs.",
    setNotes: [
      "Aim for 15-20. Last week S1 was 12 (undershot). Squeeze rear delts, don't shrug.",
      "Last set. 0-1 RIR. Beat 20 if you can. If both sets hit 20, we move up next time."
    ]
  },
];

const STATE_TTL_MS = 4 * 60 * 60 * 1000;
const HISTORY_MAX = 30;
const RING_CIRCUMFERENCE = 2 * Math.PI * 88; // r=88 → ~552.92

// Snapshot the original workout order so reorder can be persisted/restored by exercise name.
// Never mutated; lookup source when rehydrating a reordered state from localStorage.
const originalWorkout = workout.slice();

// ============ DRAG REORDER CONFIG ============
const LONG_PRESS_MS = 450;       // hold this long before drag mode engages
const DRAG_MOVE_CANCEL_PX = 10;  // finger movement before long-press that cancels drag intent (treated as scroll)

// ============ SETTINGS ============
const defaultSettings = {
  sound: true,
  vibration: true,
  autoStart: true
};
let settings = { ...defaultSettings };
function loadSettings() {
  try {
    const raw = localStorage.getItem('gym-timer-settings');
    if (raw) settings = { ...defaultSettings, ...JSON.parse(raw) };
  } catch (e) {}
}
function saveSettings() {
  try { localStorage.setItem('gym-timer-settings', JSON.stringify(settings)); } catch(e) {}
}
loadSettings();

// ============ STATE ============
const setLogs = [];

let currentExercise = 0;
let currentSet = 0;
let state = "ready";
let timerInterval = null;
let restRemaining = 0;
let restTotalSeconds = 0;
let restEndTime = null;
let currentLogEntry = null;
let repCount = 10;
let logExerciseIndex = 0;

let wakeLock = null;
let restNotifTimer = null;
let audioCtx = null;

let editingLog = null;
let editRepCount = 0;

let dragState = null;  // drag-reorder: {pointerId, fromIdx, targetIdx, startX, startY, sourceEl, ghostEl, ghostOriginX, ghostOriginY, longPressTimer, pressed, dragging}

const history = [];
const future = [];

// ============ DOM ============
const elDayTitle = document.getElementById("day-title");
const elName = document.getElementById("exercise-name");
const elSet = document.getElementById("set-info");
const elNote = document.getElementById("exercise-note");
const elTimer = document.getElementById("timer-display");
const elTimerLabel = document.getElementById("timer-label");
const elBtn = document.getElementById("main-btn");
const elBtnWrap = document.getElementById("btn-wrap");
const elRingBar = document.getElementById("rest-ring-bar");
const elSkip = document.getElementById("skip-btn");
const elProgress = document.getElementById("progress");
const elDone = document.getElementById("workout-done");
const elSummary = document.getElementById("summary");
const elCopy = document.getElementById("copy-btn");
const elLogArea = document.getElementById("log-area");
const elNotesInput = document.getElementById("notes-input");
const elRepCount = document.getElementById("rep-count");
const elRepMinus = document.getElementById("rep-minus");
const elRepPlus = document.getElementById("rep-plus");
const elNavBack = document.getElementById("nav-back");
const elNavForward = document.getElementById("nav-forward");
const elSettingsBtn = document.getElementById("settings-btn");
const elSettingsModal = document.getElementById("settings-modal");
const elSettingsClose = document.getElementById("settings-close");
const elToggleSound = document.getElementById("toggle-sound");
const elToggleVibration = document.getElementById("toggle-vibration");
const elToggleAutoStart = document.getElementById("toggle-autostart");
const elEditModal = document.getElementById("edit-modal");
const elEditExercise = document.getElementById("edit-exercise");
const elEditSet = document.getElementById("edit-set");
const elEditReps = document.getElementById("edit-reps");
const elEditNotes = document.getElementById("edit-notes");
const elEditCancel = document.getElementById("edit-cancel");
const elEditSave = document.getElementById("edit-save");
const elEditRepMinus = document.getElementById("edit-rep-minus");
const elEditRepPlus = document.getElementById("edit-rep-plus");

elDayTitle.textContent = dayType;
document.title = "Gym - " + dayType;
elRingBar.setAttribute("stroke-dasharray", RING_CIRCUMFERENCE);
elRingBar.setAttribute("stroke-dashoffset", RING_CIRCUMFERENCE); // start empty

// ============ WAKE LOCK ============
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) {}
}
function releaseWakeLock() {
  try { if (wakeLock) wakeLock.release(); } catch(e) {}
  wakeLock = null;
}

// ============ NOTIFICATIONS ============
async function ensureNotifPermission() {
  if (!('Notification' in window)) return false;
  if (Notification.permission === 'granted') return true;
  if (Notification.permission === 'denied') return false;
  try {
    const r = await Notification.requestPermission();
    return r === 'granted';
  } catch (e) { return false; }
}
function scheduleRestNotif(ms) {
  cancelRestNotif();
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  restNotifTimer = setTimeout(() => {
    restNotifTimer = null;
    if (document.visibilityState !== 'visible') {
      try {
        new Notification("Rest done -- GO!", {
          body: workout[currentExercise].name + " set " + (currentSet + 1),
          tag: "gym-rest"
        });
      } catch(e) {}
    }
  }, ms);
}
function cancelRestNotif() {
  if (restNotifTimer) { clearTimeout(restNotifTimer); restNotifTimer = null; }
}

// ============ AUDIO + VIBRATION ============
function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch(e) {}
}
function playAlertSound() {
  if (!settings.sound) return;
  try {
    if (!audioCtx) initAudio();
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    [0, 0.22].forEach(offset => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now + offset);
      gain.gain.setValueAtTime(0.0001, now + offset);
      gain.gain.exponentialRampToValueAtTime(0.4, now + offset + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.18);
      osc.start(now + offset);
      osc.stop(now + offset + 0.2);
    });
  } catch (e) {}
}
function triggerAlertFeedback() {
  if (settings.vibration && navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 500]);
  playAlertSound();
}

// ============ HELPERS ============
function getMaxReps(repsStr) {
  const m = repsStr.match(/(\d+)\s*-\s*(\d+)/);
  return m ? parseInt(m[2], 10) : (parseInt(repsStr, 10) || 10);
}
function formatDuration(ms) {
  const totalSec = Math.max(0, Math.floor(ms / 1000));
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return m + "m " + s.toString().padStart(2, "0") + "s";
}
function getExerciseDuration(exerciseIdx) {
  const logs = setLogs.filter(l => l.exercise === exerciseIdx && l.timestamp);
  if (logs.length === 0) return null;
  if (logs.length === 1) return 0;
  const first = Math.min(...logs.map(l => l.timestamp));
  const last  = Math.max(...logs.map(l => l.timestamp));
  return last - first;
}

// ============ RENDERING ============
function getGlobalSetIndex() {
  let idx = 0;
  for (let i = 0; i < currentExercise; i++) idx += workout[i].sets;
  return idx + currentSet;
}

function renderProgress() {
  elProgress.innerHTML = "";
  const globalCurrent = getGlobalSetIndex();
  const isResting = (state === "resting" || state === "paused");
  const isDoingSet = (state === "ready" || state === "alert" || state === "finishing");
  let idx = 0;
  for (let i = 0; i < workout.length; i++) {
    const group = document.createElement("div");
    group.className = "exercise-group";
    group.dataset.exerciseIdx = i;
    const dotsRow = document.createElement("div");
    dotsRow.className = "exercise-dots";
    for (let j = 0; j < workout[i].sets; j++) {
      const dot = document.createElement("div");
      dot.className = "dot";
      if (idx < globalCurrent) {
        dot.classList.add("completed");
        if (idx === globalCurrent - 1 && isResting) {
          dot.classList.add("echoing");
        }
        const exIdx = i, setIdx = j;
        dot.addEventListener("click", () => openEditModal(exIdx, setIdx));
        dot.setAttribute("role", "button");
        dot.setAttribute("aria-label", "Edit " + workout[i].name + " set " + (j + 1));
      } else if (idx === globalCurrent) {
        dot.classList.add("active");
        if (isDoingSet) dot.classList.add("blinking");
      }
      dotsRow.appendChild(dot);
      idx++;
    }
    const label = document.createElement("div");
    label.className = "exercise-label";
    if (i < currentExercise) label.classList.add("completed");
    else if (i === currentExercise) label.classList.add("active");
    label.textContent = workout[i].name;
    group.appendChild(label);
    group.appendChild(dotsRow);
    elProgress.appendChild(group);
  }
}

function renderExercise() {
  const ex = workout[currentExercise];
  elName.textContent = ex.name;
  // Order: Weight \u00b7 Set X/Y \u00b7 reps
  elSet.textContent = ex.weight + "  \u00b7  Set " + (currentSet + 1) + "/" + ex.sets + "  \u00b7  " + ex.reps + " reps";
  // Set-specific note takes priority, falls back to exercise note
  let noteText = "";
  if (Array.isArray(ex.setNotes) && ex.setNotes[currentSet]) {
    noteText = ex.setNotes[currentSet];
  } else if (ex.note) {
    noteText = ex.note;
  }
  elNote.textContent = noteText;
  renderProgress();
}

function formatTime(seconds) {
  // Always ceil (handles floats from precise pause/resume math)
  const total = Math.max(0, Math.ceil(seconds));
  const m = Math.floor(total / 60);
  const s = total % 60;
  return `${m}:${s.toString().padStart(2, "0")}`;
}

// ============ FLASH (Mazda) ============
function startFlash() {
  document.body.classList.remove('alert-flashing');
  void document.body.offsetWidth;
  document.body.classList.add('alert-flashing');
}
function stopFlash() {
  document.body.classList.remove('alert-flashing');
}

// ============ REST RING ============
function updateRestRing() {
  if (!restEndTime || !restTotalSeconds) {
    elRingBar.setAttribute("stroke-dashoffset", RING_CIRCUMFERENCE);
    return;
  }
  const remaining = Math.max(0, (restEndTime - Date.now()) / 1000);
  const fraction = Math.max(0, Math.min(1, remaining / restTotalSeconds));
  const offset = RING_CIRCUMFERENCE * (1 - fraction);
  elRingBar.setAttribute("stroke-dashoffset", offset);
}
function showRestRing(show, paused) {
  elBtnWrap.classList.toggle("show-ring", !!show);
  elBtnWrap.classList.toggle("paused", !!paused);
}

// ============ LOG AREA ============
function showLogArea(exerciseIdx) {
  logExerciseIndex = exerciseIdx;
  // Default reps to MAX of the rep range for the exercise
  repCount = getMaxReps(workout[exerciseIdx].reps);
  elRepCount.textContent = repCount;
  elNotesInput.value = "";
  elNotesInput.placeholder = "notes...";
  elLogArea.style.display = "flex";
}
function hideLogArea() {
  elLogArea.style.display = "none";
}
function captureLog() {
  if (currentLogEntry) {
    const note = elNotesInput.value.trim();
    currentLogEntry.reps = repCount;
    currentLogEntry.note = note;
    currentLogEntry = null;
  }
}

// ============ TIMER LOOP ============
function startCountdown() {
  if (timerInterval) clearInterval(timerInterval);
  updateRestRing();
  // 100ms updates = smooth ring without CSS transition
  timerInterval = setInterval(() => {
    const remaining = Math.max(0, (restEndTime - Date.now()) / 1000);
    if (remaining <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      updateRestRing();
      restDone();
    } else {
      restRemaining = remaining;
      elTimer.textContent = formatTime(Math.ceil(remaining));
      updateRestRing();
    }
  }, 100);
}

// ============ HISTORY (back/forward) ============
function snapshot() {
  return {
    currentExercise, currentSet, state,
    restEndTime, restRemaining, restTotalSeconds,
    setLogs: setLogs.map(l => ({...l})),
    repCount, logExerciseIndex,
    notes: elNotesInput.value,
    currentLogEntryIdx: currentLogEntry ? setLogs.indexOf(currentLogEntry) : -1
  };
}
function applySnapshot(s) {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  cancelRestNotif();
  stopFlash();

  currentExercise = s.currentExercise;
  currentSet = s.currentSet;
  state = s.state;
  restEndTime = s.restEndTime;
  restRemaining = s.restRemaining;
  restTotalSeconds = s.restTotalSeconds || s.restRemaining || 0;
  setLogs.length = 0;
  s.setLogs.forEach(l => setLogs.push(l));
  repCount = s.repCount;
  logExerciseIndex = s.logExerciseIndex;
  currentLogEntry = s.currentLogEntryIdx >= 0 ? setLogs[s.currentLogEntryIdx] : null;

  // If restoring an expired resting state, restart the countdown with full rest period
  // (otherwise back from alert just bounces right back to alert)
  if (state === "resting" && restEndTime && restEndTime < Date.now()) {
    restEndTime = Date.now() + restRemaining * 1000;
  }

  applyState(s.notes || "");
  saveState();
}
function applyState(notesValue) {
  showRestRing(false, false);

  if (state === "resting" && restEndTime) {
    const remaining = Math.ceil((restEndTime - Date.now()) / 1000);
    if (remaining <= 0) {
      state = "alert";
      restEndTime = null;
      renderExercise();
      elTimer.textContent = "0:00";
      elTimerLabel.textContent = "GO";
      elBtn.textContent = "Start Set";
      elBtn.className = "go";
      elSkip.style.display = "none";
      hideLogArea();
      startFlash();
      triggerAlertFeedback();
    } else {
      restRemaining = remaining;
      renderExercise();
      elTimer.textContent = formatTime(remaining);
      elTimerLabel.textContent = "REST";
      elBtn.textContent = "Pause";
      elBtn.className = "resting";
      elSkip.style.display = "flex";
      elLogArea.style.display = "flex";
      elRepCount.textContent = repCount;
      elNotesInput.value = notesValue;
      showRestRing(true, false);
      requestWakeLock();
      scheduleRestNotif(remaining * 1000);
      startCountdown();
    }
  } else if (state === "alert") {
    renderExercise();
    elTimer.textContent = "0:00";
    elTimerLabel.textContent = "GO";
    elBtn.textContent = "Start Set";
    elBtn.className = "go";
    elSkip.style.display = "none";
    hideLogArea();
    elNotesInput.value = notesValue;
    startFlash();
    triggerAlertFeedback();
  } else if (state === "paused") {
    renderExercise();
    elTimer.textContent = formatTime(restRemaining);
    elTimerLabel.textContent = "PAUSED";
    elBtn.textContent = "Resume";
    elBtn.className = "paused";
    elSkip.style.display = "flex";
    elLogArea.style.display = "flex";
    elRepCount.textContent = repCount;
    elNotesInput.value = notesValue;
    showRestRing(true, true);
    updateRestRing();
  } else if (state === "finishing") {
    renderExercise();
    elBtn.textContent = "Finish";
    elBtn.className = "go";
    elTimer.textContent = "-:--";
    elTimerLabel.textContent = "LOG YOUR LAST SET";
    elSkip.style.display = "none";
    elLogArea.style.display = "flex";
    elRepCount.textContent = repCount;
    elNotesInput.value = notesValue;
  } else if (state === "ready") {
    renderExercise();
    elTimer.textContent = "-:--";
    elTimerLabel.textContent = "";
    elBtn.textContent = "Set Done";
    elBtn.className = "";
    elSkip.style.display = "none";
    hideLogArea();
    elNotesInput.value = notesValue;
  } else {
    renderExercise();
  }
  updateNavButtons();
}
function pushHistory() {
  history.push(snapshot());
  if (history.length > HISTORY_MAX) history.shift();
  future.length = 0;
  updateNavButtons();
}
function back() {
  if (history.length === 0) return;
  future.push(snapshot());
  if (future.length > HISTORY_MAX) future.shift();
  const s = history.pop();
  applySnapshot(s);
}
function forward() {
  if (future.length === 0) return;
  history.push(snapshot());
  if (history.length > HISTORY_MAX) history.shift();
  const s = future.pop();
  applySnapshot(s);
}
function updateNavButtons() {
  elNavBack.classList.toggle("disabled", history.length === 0);
  elNavForward.style.display = future.length > 0 ? "flex" : "none";
}

// ============ STATE TRANSITIONS ============
function setDone() {
  pushHistory();
  stopFlash();
  captureLog();

  const logEntry = {
    exercise: currentExercise,
    set: currentSet,
    reps: 0,
    note: "",
    timestamp: Date.now()
  };
  setLogs.push(logEntry);
  currentLogEntry = logEntry;

  const finishedExercise = currentExercise;
  currentSet++;

  showLogArea(finishedExercise);

  const isLastSet = finishedExercise >= workout.length - 1 && currentSet >= workout[finishedExercise].sets;
  if (isLastSet) {
    elBtn.textContent = "Finish";
    elBtn.className = "go";
    state = "finishing";
    elTimer.textContent = "-:--";
    elTimerLabel.textContent = "LOG YOUR LAST SET";
    elSkip.style.display = "none";
    showRestRing(false);
    renderProgress();
    requestAnimationFrame(() => { saveState(); });
    return;
  }

  if (currentSet >= workout[currentExercise].sets) {
    currentExercise++;
    currentSet = 0;
  }

  elSkip.style.display = "flex";
  elSkip.style.pointerEvents = "auto";
  state = "resting";
  const switchingExercise = (finishedExercise !== currentExercise);
  restRemaining = switchingExercise ? 60 : workout[finishedExercise].rest;
  restTotalSeconds = restRemaining;
  restEndTime = Date.now() + restRemaining * 1000;
  elTimer.textContent = formatTime(restRemaining);
  elTimerLabel.textContent = switchingExercise ? "UP NEXT" : "REST";
  elBtn.textContent = "Pause";
  elBtn.className = "resting";
  renderExercise();
  showRestRing(true, false);
  startCountdown();

  // Defer all expensive non-critical work to next frame so the UI updates immediately
  requestAnimationFrame(() => {
    initAudio();
    requestWakeLock();
    ensureNotifPermission();
    scheduleRestNotif(restRemaining * 1000);
    saveState();
  });
}

function restDone() {
  pushHistory();
  cancelRestNotif();
  captureLog();
  hideLogArea();
  showRestRing(false);

  if (settings.autoStart) {
    state = "ready";
    elTimer.textContent = "-:--";
    elTimerLabel.textContent = "GO";
    elBtn.textContent = "Set Done";
    elBtn.className = "";
    elSkip.style.display = "none";
    renderExercise();
  } else {
    state = "alert";
    elTimer.textContent = "0:00";
    elTimerLabel.textContent = "GO";
    elBtn.textContent = "Start Set";
    elBtn.className = "go";
    elSkip.style.display = "none";
    renderExercise();
  }
  startFlash();
  updateNavButtons();
  // Defer audio/vibration/save so UI updates first (no perceptible lag)
  requestAnimationFrame(() => {
    triggerAlertFeedback();
    saveState();
  });
}

function pauseRest() {
  cancelRestNotif();
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  // Capture EXACT remaining time (float seconds) so resume doesn't round-up jump
  restRemaining = Math.max(0, (restEndTime - Date.now()) / 1000);
  state = "paused";
  elBtn.textContent = "Resume";
  elBtn.className = "paused";
  elTimerLabel.textContent = "PAUSED";
  showRestRing(true, true);
  renderProgress();
  saveState();
}

function resumeRest() {
  state = "resting";
  restEndTime = Date.now() + restRemaining * 1000;
  elBtn.textContent = "Pause";
  elBtn.className = "resting";
  elTimerLabel.textContent = "REST";
  showRestRing(true, false);
  renderProgress();
  scheduleRestNotif(restRemaining * 1000);
  saveState();
  startCountdown();
}

function skipRest() {
  pushHistory();
  cancelRestNotif();
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  captureLog();
  hideLogArea();
  showRestRing(false);
  state = "ready";
  elTimer.textContent = "-:--";
  elTimerLabel.textContent = "";
  elBtn.textContent = "Set Done";
  elBtn.className = "";
  elSkip.style.display = "none";
  renderExercise();
  saveState();
}

function acknowledgeAlert() {
  pushHistory();
  captureLog();  // Safety: ensure any pending reps/notes are pinned to the log entry
  stopFlash();
  state = "ready";
  elTimer.textContent = "-:--";
  elTimerLabel.textContent = "";
  elBtn.textContent = "Set Done";
  elBtn.className = "";
  renderExercise();
  saveState();
}

// ============ DRAG REORDER ============
// Long-press on an exercise-group (label + dots area) to grab it.
// Drag to target position, release to commit.
// Short tap on a completed dot still opens the edit modal (handled by skipping drag init when target is a completed dot).

// Transform an exercise index according to a splice(fromIdx,1) + splice(toIdx,0,moved) reorder.
function transformExerciseIdx(ei, fromIdx, toIdx) {
  if (ei === fromIdx) return toIdx;
  if (fromIdx < ei && ei <= toIdx) return ei - 1;
  if (toIdx <= ei && ei < fromIdx) return ei + 1;
  return ei;
}

function reorderExercise(fromIdx, toIdx) {
  if (fromIdx === toIdx) return;
  if (fromIdx < 0 || fromIdx >= workout.length) return;
  if (toIdx < 0 || toIdx >= workout.length) return;

  pushHistory();

  // If the edit modal is open on a log, its editingLog reference survives
  // (setLogs array isn't reordered, only log.exercise values get remapped),
  // but any displayed exercise NAME in the modal could go stale. Close to be safe.
  if (elEditModal.classList.contains("show")) closeEditModal();

  // Shuffle the workout array
  const moved = workout.splice(fromIdx, 1)[0];
  workout.splice(toIdx, 0, moved);

  // Remap every live exercise-index reference
  const remap = (ei) => transformExerciseIdx(ei, fromIdx, toIdx);

  currentExercise = remap(currentExercise);
  logExerciseIndex = remap(logExerciseIndex);
  setLogs.forEach(l => { l.exercise = remap(l.exercise); });

  // Remap history and future snapshots too, so back/forward stay correct
  const remapSnapshot = (snap) => {
    if (typeof snap.currentExercise === 'number') snap.currentExercise = remap(snap.currentExercise);
    if (typeof snap.logExerciseIndex === 'number') snap.logExerciseIndex = remap(snap.logExerciseIndex);
    if (Array.isArray(snap.setLogs)) {
      snap.setLogs.forEach(l => { l.exercise = remap(l.exercise); });
    }
  };
  history.forEach(remapSnapshot);
  future.forEach(remapSnapshot);

  renderExercise();  // rerenders name/weight/reps + calls renderProgress()
  saveState();

  // Haptic confirmation of commit
  if (settings.vibration && navigator.vibrate) navigator.vibrate(15);
}

function clearDragTargetHighlight() {
  elProgress.querySelectorAll('.drag-target').forEach(el => el.classList.remove('drag-target'));
}

function cancelDragPress() {
  // Pointerdown happened but didn't graduate into a drag (e.g., user scrolled or tapped briefly).
  if (!dragState) return;
  clearTimeout(dragState.longPressTimer);
  if (dragState.sourceEl) dragState.sourceEl.classList.remove('drag-pressed');
  dragState = null;
}

function enterDragMode() {
  if (!dragState || dragState.dragging) return;

  dragState.dragging = true;

  // Haptic cue — the user has "grabbed" the exercise
  if (settings.vibration && navigator.vibrate) navigator.vibrate(30);

  // Clone the source group as a floating ghost
  const src = dragState.sourceEl;
  const rect = src.getBoundingClientRect();
  const ghost = src.cloneNode(true);
  ghost.classList.add('drag-ghost');
  ghost.classList.remove('drag-pressed');
  ghost.style.width = rect.width + 'px';
  ghost.style.height = rect.height + 'px';
  ghost.style.transform = `translate(${rect.left}px, ${rect.top}px) scale(1.08)`;
  document.body.appendChild(ghost);
  dragState.ghostEl = ghost;
  dragState.ghostOriginX = rect.left;
  dragState.ghostOriginY = rect.top;

  // Hide the original (its slot is still visible — just invisible content)
  src.classList.remove('drag-pressed');
  src.classList.add('drag-dragging');

  // Route all subsequent pointer events to the source element, even if the finger
  // leaves the viewport or the browser triggers a system gesture. Without capture,
  // iOS Safari can swallow pointercancel on system-level interrupts and leave the
  // ghost + body.reordering class permanently stuck.
  try { src.setPointerCapture(dragState.pointerId); } catch(e) {}

  // Cache each exercise-group's pre-transform position/height so the pointer-Y
  // comparison stays stable even as neighbors translate to open a gap.
  const groups = [...elProgress.querySelectorAll('.exercise-group')];
  dragState.initialRects = groups.map(g => {
    const r = g.getBoundingClientRect();
    return { el: g, top: r.top, height: g.offsetHeight };
  });

  document.body.classList.add('reordering');
}

function handleProgressPointerDown(e) {
  // Only one drag at a time — ignore extra touches while a drag or press is active
  if (dragState) return;

  // Don't start drag while a modal is open
  if (elEditModal.classList.contains('show') || elSettingsModal.classList.contains('show')) return;

  // Only respond to primary button / first touch
  if (e.button !== undefined && e.button !== 0) return;

  const group = e.target.closest('.exercise-group');
  if (!group) return;

  // Preserve existing tap-to-edit behavior for completed dots
  if (e.target.classList && e.target.classList.contains('dot') && e.target.classList.contains('completed')) {
    return;
  }

  const fromIdx = parseInt(group.dataset.exerciseIdx, 10);
  if (isNaN(fromIdx)) return;

  dragState = {
    pointerId: e.pointerId,
    fromIdx,
    targetIdx: fromIdx,
    startX: e.clientX,
    startY: e.clientY,
    sourceEl: group,
    ghostEl: null,
    ghostOriginX: 0,
    ghostOriginY: 0,
    pressed: false,
    dragging: false,
    longPressTimer: setTimeout(enterDragMode, LONG_PRESS_MS)
  };

  // Subtle immediate feedback so user knows their press registered
  group.classList.add('drag-pressed');
  dragState.pressed = true;
}

function handleDocumentPointerMove(e) {
  if (!dragState) return;
  if (dragState.pointerId !== undefined && e.pointerId !== dragState.pointerId) return;

  const dx = e.clientX - dragState.startX;
  const dy = e.clientY - dragState.startY;

  // Movement before long-press engages = treat as scroll, cancel drag intent
  if (!dragState.dragging) {
    if (Math.abs(dx) > DRAG_MOVE_CANCEL_PX || Math.abs(dy) > DRAG_MOVE_CANCEL_PX) {
      cancelDragPress();
    }
    return;
  }

  // In drag mode: prevent scroll and update ghost + open an insertion gap.
  if (e.cancelable) e.preventDefault();

  if (dragState.ghostEl) {
    const tx = dragState.ghostOriginX + dx;
    const ty = dragState.ghostOriginY + dy;
    dragState.ghostEl.style.transform = `translate(${tx}px, ${ty}px) scale(1.08)`;
  }

  // Determine insertion index from pointer Y and translate neighbors to open a gap
  // (iOS-style insert-between behavior, not swap-on-overlap).
  updateTargetFromPointer(e.clientY);
}

function updateTargetFromPointer(pointerY) {
  const source = dragState.sourceEl;
  const sourceIdx = dragState.fromIdx;
  // Use initial rects cached at drag-start so in-progress translations don't skew the Y comparison
  const rects = dragState.initialRects || [];
  const nonSourceRects = rects.filter(r => r.el !== source);

  // Gap k = "insert before non-source item k". Default to end if pointer is below all centers.
  let targetIdx = nonSourceRects.length;
  for (let i = 0; i < nonSourceRects.length; i++) {
    const center = nonSourceRects[i].top + nonSourceRects[i].height / 2;
    if (pointerY < center) {
      targetIdx = i;
      break;
    }
  }

  dragState.targetIdx = targetIdx;

  // Translate non-source items to visually open a gap at the insertion point.
  //   Above source (domIdx < sourceIdx) and at/past insertion point: shift DOWN
  //   Below source (domIdx > sourceIdx) and at/before insertion point: shift UP
  const sourceHeight = source.offsetHeight;
  rects.forEach((r, domIdx) => {
    if (r.el === source) return;
    let translation = 0;
    if (domIdx < sourceIdx) {
      if (domIdx >= targetIdx) translation = sourceHeight;
    } else {
      if (domIdx <= targetIdx) translation = -sourceHeight;
    }
    r.el.style.transform = translation ? `translateY(${translation}px)` : '';
  });
}

function clearDragTranslations() {
  elProgress.querySelectorAll('.exercise-group').forEach(el => {
    el.style.transform = '';
  });
}

// Tap-to-jump: short tap on an exercise label switches currentExercise to that index.
// Fixes the "stuck on leg press rest timer when another lifter is on the machine" case --
// the user needs to pivot to a different exercise without waiting out a rest countdown.
function jumpToExercise(idx) {
  if (idx < 0 || idx >= workout.length) return;
  if (idx === currentExercise) return;

  pushHistory();

  // Abort any running rest/flash so the jump is clean
  cancelRestNotif();
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  stopFlash();

  // Flush any pending log input (safety) before leaving current exercise
  captureLog();
  hideLogArea();
  showRestRing(false);

  // Land on first un-logged set of the target exercise; if all done, sit on the last
  const targetEx = workout[idx];
  const doneSets = new Set(setLogs.filter(l => l.exercise === idx).map(l => l.set));
  let firstUnlogged = 0;
  while (doneSets.has(firstUnlogged) && firstUnlogged < targetEx.sets) firstUnlogged++;
  if (firstUnlogged >= targetEx.sets) firstUnlogged = targetEx.sets - 1;

  currentExercise = idx;
  currentSet = firstUnlogged;
  state = "ready";

  elTimer.textContent = "-:--";
  elTimerLabel.textContent = "";
  elBtn.textContent = "Set Done";
  elBtn.className = "";
  elSkip.style.display = "none";

  renderExercise();
  saveState();

  if (settings.vibration && navigator.vibrate) navigator.vibrate(20);
}

function handleDocumentPointerUp(e) {
  if (!dragState) return;
  if (dragState.pointerId !== undefined && e.pointerId !== dragState.pointerId) return;

  clearTimeout(dragState.longPressTimer);

  if (dragState.dragging) {
    const from = dragState.fromIdx;
    const to = dragState.targetIdx;

    // Cleanup visuals BEFORE reorder so the about-to-move element reads fresh
    if (dragState.ghostEl) dragState.ghostEl.remove();
    if (dragState.sourceEl) {
      dragState.sourceEl.classList.remove('drag-dragging');
      dragState.sourceEl.classList.remove('drag-pressed');
    }
    clearDragTargetHighlight();
    clearDragTranslations();
    document.body.classList.remove('reordering');

    dragState = null;
    if (from !== to) reorderExercise(from, to);
    return;
  }

  // Wasn't a drag — short tap. Any tap on an exercise-group (except completed-dot
  // edits, which were intercepted in pointerdown) jumps to that exercise so the user
  // can pivot when a machine is taken without waiting out the current rest countdown.
  const tapIdx = dragState.fromIdx;
  if (dragState.sourceEl) dragState.sourceEl.classList.remove('drag-pressed');
  dragState = null;
  jumpToExercise(tapIdx);
}

function handleDocumentPointerCancel(e) {
  if (!dragState) return;
  if (dragState.pointerId !== undefined && e.pointerId !== dragState.pointerId) return;

  clearTimeout(dragState.longPressTimer);
  if (dragState.ghostEl) dragState.ghostEl.remove();
  if (dragState.sourceEl) {
    dragState.sourceEl.classList.remove('drag-dragging');
    dragState.sourceEl.classList.remove('drag-pressed');
  }
  clearDragTargetHighlight();
  clearDragTranslations();
  document.body.classList.remove('reordering');
  dragState = null;
}

// ============ SUMMARY ============
function summaryDateStr() {
  return new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
}
function getTotalDuration() {
  const ts = setLogs.filter(l => l.timestamp).map(l => l.timestamp);
  if (ts.length < 2) return null;
  return Math.max(...ts) - Math.min(...ts);
}
function buildSummary() {
  let text = dayType + " -- " + summaryDateStr() + "\n\n";
  for (let i = 0; i < workout.length; i++) {
    const ex = workout[i];
    const dur = getExerciseDuration(i);
    text += ex.name + " @ " + ex.weight;
    if (dur && dur > 0) text += "  (" + formatDuration(dur) + ")";
    text += "\n";
    for (let j = 0; j < ex.sets; j++) {
      const log = setLogs.find(l => l.exercise === i && l.set === j);
      if (log) {
        const note = log.note ? " -- " + log.note : "";
        text += "  S" + (j + 1) + ": " + log.reps + " reps" + note + "\n";
      } else {
        text += "  S" + (j + 1) + ": -\n";
      }
    }
    if (i < workout.length - 1) text += "\n";
  }
  const total = getTotalDuration();
  if (total) text += "\nTotal: " + formatDuration(total) + "\n";
  return text;
}
function buildSummaryHTML() {
  let html = '<div class="exercise-header">' + dayType + ' -- ' + summaryDateStr() + '</div><br>';
  for (let i = 0; i < workout.length; i++) {
    const ex = workout[i];
    const dur = getExerciseDuration(i);
    let header = ex.name + ' @ ' + ex.weight;
    let durTag = (dur && dur > 0) ? ' <span class="duration-tag">(' + formatDuration(dur) + ')</span>' : '';
    html += '<div class="exercise-header">' + header + durTag + '</div>';
    for (let j = 0; j < ex.sets; j++) {
      const log = setLogs.find(l => l.exercise === i && l.set === j);
      if (log) {
        const note = log.note ? ' -- ' + log.note : '';
        html += '<div class="set-line">S' + (j + 1) + ': <span class="set-note">' + log.reps + ' reps' + note + '</span></div>';
      } else {
        html += '<div class="set-line">S' + (j + 1) + ': -</div>';
      }
    }
    if (i < workout.length - 1) html += '<br>';
  }
  const total = getTotalDuration();
  if (total) html += '<div class="total-line">Total: ' + formatDuration(total) + '</div>';
  return html;
}

function finishWorkout() {
  pushHistory();
  cancelRestNotif();
  releaseWakeLock();
  captureLog();
  hideLogArea();
  showRestRing(false);
  state = "finished";
  elDayTitle.style.display = "none";
  elName.style.display = "none";
  elSet.style.display = "none";
  elNote.style.display = "none";
  elTimer.style.display = "none";
  elTimerLabel.style.display = "none";
  elBtnWrap.style.display = "none";
  elSkip.style.display = "none";
  elProgress.style.display = "none";
  elNavBack.style.display = "none";
  elNavForward.style.display = "none";
  elSettingsBtn.style.display = "none";
  elDone.style.display = "block";
  elSummary.innerHTML = buildSummaryHTML();
  try { localStorage.removeItem("gym-timer-state"); } catch(e) {}
}

// ============ EDIT MODAL ============
function openEditModal(exerciseIdx, setIdx) {
  const log = setLogs.find(l => l.exercise === exerciseIdx && l.set === setIdx);
  if (!log) return;
  editingLog = log;
  editRepCount = log.reps;
  elEditExercise.textContent = workout[exerciseIdx].name;
  elEditSet.textContent = "Set " + (setIdx + 1) + " \u00b7 " + workout[exerciseIdx].weight;
  elEditReps.textContent = editRepCount;
  elEditNotes.value = log.note || "";
  elEditModal.classList.add("show");
}
function closeEditModal() {
  elEditModal.classList.remove("show");
  editingLog = null;
}
elEditCancel.addEventListener("click", closeEditModal);
elEditSave.addEventListener("click", () => {
  if (editingLog) {
    pushHistory();
    editingLog.reps = editRepCount;
    editingLog.note = elEditNotes.value.trim();
    saveState();
  }
  closeEditModal();
});
elEditRepMinus.addEventListener("click", () => {
  if (editRepCount > 0) { editRepCount--; elEditReps.textContent = editRepCount; }
});
elEditRepPlus.addEventListener("click", () => {
  editRepCount++;
  elEditReps.textContent = editRepCount;
});
elEditModal.addEventListener("click", (e) => {
  if (e.target === elEditModal) closeEditModal();
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (elEditModal.classList.contains("show")) closeEditModal();
  else if (elSettingsModal.classList.contains("show")) closeSettings();
});

// ============ SETTINGS MODAL ============
function applySettingsToggles() {
  elToggleSound.classList.toggle("on", !!settings.sound);
  elToggleVibration.classList.toggle("on", !!settings.vibration);
  elToggleAutoStart.classList.toggle("on", !!settings.autoStart);
  elToggleSound.setAttribute("aria-checked", !!settings.sound);
  elToggleVibration.setAttribute("aria-checked", !!settings.vibration);
  elToggleAutoStart.setAttribute("aria-checked", !!settings.autoStart);
}
function openSettings() {
  applySettingsToggles();
  elSettingsModal.classList.add("show");
}
function closeSettings() {
  elSettingsModal.classList.remove("show");
}
const elSettingsReset = document.getElementById("settings-reset");
let resetConfirmTimer = null;
function resetConfirmReset() {
  elSettingsReset.classList.remove('confirming');
  elSettingsReset.textContent = 'Reset Workout';
  if (resetConfirmTimer) { clearTimeout(resetConfirmTimer); resetConfirmTimer = null; }
}
elSettingsBtn.addEventListener("click", openSettings);
elSettingsClose.addEventListener("click", () => { resetConfirmReset(); closeSettings(); });
elSettingsReset.addEventListener("click", () => {
  if (elSettingsReset.classList.contains('confirming')) {
    // Second tap -- actually reset
    try { localStorage.removeItem("gym-timer-state"); } catch(e) {}
    location.reload();
  } else {
    elSettingsReset.classList.add('confirming');
    elSettingsReset.textContent = 'Tap again to confirm';
    if (resetConfirmTimer) clearTimeout(resetConfirmTimer);
    resetConfirmTimer = setTimeout(resetConfirmReset, 3000);
  }
});
elSettingsModal.addEventListener("click", (e) => {
  if (e.target === elSettingsModal) closeSettings();
});
elToggleSound.addEventListener("click", () => {
  settings.sound = !settings.sound; saveSettings(); applySettingsToggles();
});
elToggleVibration.addEventListener("click", () => {
  settings.vibration = !settings.vibration; saveSettings(); applySettingsToggles();
});
elToggleAutoStart.addEventListener("click", () => {
  settings.autoStart = !settings.autoStart; saveSettings(); applySettingsToggles();
});

// ============ INPUT HANDLERS ============
elBtn.addEventListener("click", () => {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  if (state === "ready") setDone();
  else if (state === "alert") acknowledgeAlert();
  else if (state === "resting") pauseRest();
  else if (state === "paused") resumeRest();
  else if (state === "finishing") finishWorkout();
});
elSkip.addEventListener("click", (e) => {
  e.stopPropagation();
  if (state !== "resting" && state !== "paused") return;
  // Subtle press animation: icon flies right while we transition state
  elSkip.classList.add("pressed");
  setTimeout(() => {
    skipRest();
    elSkip.classList.remove("pressed");
  }, 160);
});
elRepMinus.addEventListener("click", (e) => {
  e.stopPropagation();
  if (repCount > 0) { repCount--; elRepCount.textContent = repCount; saveState(); }
});
elRepPlus.addEventListener("click", (e) => {
  e.stopPropagation();
  repCount++; elRepCount.textContent = repCount; saveState();
});
elNotesInput.addEventListener("input", () => saveState());
elNavBack.addEventListener("click", back);
elNavForward.addEventListener("click", forward);

// Drag reorder — pointer events delegated on #progress, move/up/cancel on document
// so a finger that leaves the source element still commits the drag correctly.
elProgress.addEventListener("pointerdown", handleProgressPointerDown);
document.addEventListener("pointermove", handleDocumentPointerMove, { passive: false });
document.addEventListener("pointerup", handleDocumentPointerUp);
document.addEventListener("pointercancel", handleDocumentPointerCancel);
// Prevent iOS long-press context menu while dragging an exercise-group.
elProgress.addEventListener("contextmenu", (e) => {
  if (dragState) e.preventDefault();
});
elCopy.addEventListener("click", () => {
  const text = buildSummary();
  navigator.clipboard.writeText(text).then(() => {
    elCopy.textContent = "Copied";
    elCopy.className = "copied";
    setTimeout(() => {
      elCopy.textContent = "Copy Summary";
      elCopy.className = "";
    }, 2000);
  });
});

// ============ STATE PERSISTENCE ============
function saveState() {
  const s = {
    savedAt: Date.now(),
    currentExercise, currentSet, state, restEndTime, restRemaining, restTotalSeconds,
    setLogs: setLogs.map(l => ({...l})),
    repCount,
    notes: elNotesInput.value,
    logExerciseIndex,
    // Persist any mid-session reorder so refreshes/background kills don't snap back
    workoutOrder: workout.map(ex => ex.name),
    history: history.map(h => ({...h, setLogs: h.setLogs.map(l => ({...l}))})),
    future:  future.map(f => ({...f, setLogs: f.setLogs.map(l => ({...l}))}))
  };
  try { localStorage.setItem("gym-timer-state", JSON.stringify(s)); } catch(e) {}
}
function restoreState() {
  try {
    const raw = localStorage.getItem("gym-timer-state");
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (s.savedAt && (Date.now() - s.savedAt > STATE_TTL_MS)) {
      try { localStorage.removeItem("gym-timer-state"); } catch(e) {}
      return false;
    }

    // Reapply saved reorder BEFORE anything else reads workout[].
    // If saved order has same names as current workout, rebuild workout to match.
    if (Array.isArray(s.workoutOrder) && s.workoutOrder.length === workout.length) {
      const byName = new Map(originalWorkout.map(ex => [ex.name, ex]));
      const reordered = s.workoutOrder.map(name => byName.get(name));
      if (reordered.every(ex => ex)) {
        workout.length = 0;
        reordered.forEach(ex => workout.push(ex));
      }
    }

    currentExercise = s.currentExercise;
    currentSet = s.currentSet;
    repCount = s.repCount || 10;
    if (typeof s.logExerciseIndex === 'number') logExerciseIndex = s.logExerciseIndex;
    setLogs.length = 0;
    s.setLogs.forEach(l => setLogs.push(l));
    state = s.state;
    restEndTime = s.restEndTime;
    restRemaining = s.restRemaining;
    restTotalSeconds = s.restTotalSeconds || s.restRemaining || 0;

    history.length = 0;
    if (Array.isArray(s.history)) s.history.forEach(h => history.push(h));
    future.length = 0;
    if (Array.isArray(s.future)) s.future.forEach(f => future.push(f));

    if (state === "resting" || state === "paused" || state === "finishing") {
      const lastLog = setLogs[setLogs.length - 1];
      if (lastLog) currentLogEntry = lastLog;
    }
    applyState(s.notes || "");
    return true;
  } catch(e) { return false; }
}

// ============ VISIBILITY HANDLER ============
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (state === "resting" && restEndTime) {
    const remaining = Math.ceil((restEndTime - Date.now()) / 1000);
    if (remaining <= 0) {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      restDone();
    } else {
      restRemaining = remaining;
      elTimer.textContent = formatTime(remaining);
      updateRestRing();
    }
  }
  if (state !== "ready" && state !== "finished" && !wakeLock) {
    requestWakeLock();
  }
});

// ============ INIT ============
// Allow URL reset (e.g. ?reset=1) to wipe saved workout state
if (new URLSearchParams(location.search).has('reset')) {
  try { localStorage.removeItem("gym-timer-state"); } catch(e) {}
  // Strip ?reset from URL so refreshes don't keep resetting.
  // NOTE: the local `history` const above shadows window.history inside this script,
  // so we have to reach for the real thing explicitly.
  try { window.history.replaceState(null, '', location.pathname); } catch(e) {}
}

elSkip.style.display = "none";
hideLogArea();
showRestRing(false);
updateNavButtons();
applySettingsToggles();
if (!restoreState()) {
  elTimer.textContent = "-:--";
  elTimerLabel.textContent = "";
  renderExercise();
}
</script>

</body>
</html>
