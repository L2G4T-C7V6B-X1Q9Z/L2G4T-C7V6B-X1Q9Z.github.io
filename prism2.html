<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prism II</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prism II">
<meta name="theme-color" content="#111214">
<link rel="apple-touch-icon" href="prism2-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#111214; --bg2:#17181b; --bg3:#1e2024;
  --ink:#ececec; --ink2:#8d9097; --ink3:#4b4e55; --line:#26282d;
  --dot:#2b2d33; --red:#e5312b; --red-dim:#7a1d19; --red-ink:#ff6a62;
  --disp:"Big Shoulders Display","Arial Narrow",Impact,"Helvetica Neue",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--mono);font-size:14px;line-height:1.3;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased;min-height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}

.screen{position:fixed;inset:0;display:none;flex-direction:column;padding:calc(var(--sat) + 14px) 20px max(var(--sab),14px);z-index:2}
body[data-screen="launch"] #s-launch,body[data-screen="set"] #s-set,body[data-screen="rest"] #s-rest,body[data-screen="done"] #s-done{display:flex}
/* 100% of the fixed containing block: the same box the screens get from inset:0, so the tank reaches the bottom edge wherever they do.
   (A canvas is a replaced element, so inset alone would leave it at its bitmap size; vw/dvh units were what left a gap on the phone.) */
#tank{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;image-rendering:pixelated;image-rendering:crisp-edges;opacity:0;transition:opacity .25s}
body[data-screen="rest"] #tank{opacity:1}
@media (prefers-reduced-motion:reduce){#tank{transition:none}}

.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.eyebrow b{color:var(--ink);font-weight:600}
.faint{color:var(--ink3)}
.disp{font-family:var(--disp);font-weight:900;line-height:.86;letter-spacing:-.01em}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}

.strip{display:flex;gap:3px;flex-wrap:wrap;align-content:flex-start}
.strip i{display:block;width:8px;height:8px;border-radius:1px;background:var(--dot)}
.strip i.done{background:var(--ink2)}
.strip i.cur{background:var(--red)}
.strip i.gap{width:5px;background:transparent}
body[data-screen="rest"] .strip i{background:var(--ink3)}   /* the tank cells are --dot, so undone squares need their own grey over a full tank */
body[data-screen="rest"] .strip i.done{background:var(--ink)}
body[data-screen="rest"] .strip i.gap{background:transparent}

/* launch */
#s-launch{justify-content:flex-start;gap:18px}
#s-launch .top{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.brand{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink3)}
.day-hero .disp{font-size:clamp(96px,30vw,140px);margin-top:16px}
.day-hero .meta{margin-top:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;border-radius:8px;font-family:var(--disp);font-weight:700;font-size:28px;letter-spacing:.04em;text-transform:uppercase;background:var(--bg3);color:var(--ink);border:1px solid var(--line)}
.btn.primary{background:var(--red);color:#fff;border-color:var(--red)}
.btn.quiet{background:transparent;border-color:var(--line);color:var(--ink2);font-size:18px;min-height:52px}
.btn:active{transform:translateY(1px);filter:brightness(.92)}
.tog{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.tog .pill{padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;letter-spacing:.1em}
.tog .pill.on{border-color:var(--ink);color:var(--ink)}
/* the list takes whatever the hero leaves; rows are tall enough that seven of them fill an iPhone 15 without a void above the buttons */
.exlist{display:flex;flex-direction:column;margin-top:18px;flex:1 1 auto;min-height:0;overflow:auto}
.exlist .li{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;font-size:14px;color:var(--ink2);padding:8px 0;border-bottom:1px solid var(--line);align-items:center;flex:1 0 auto;min-height:44px}
.exlist .li:first-child{border-top:1px solid var(--line)}
.exlist .li b{color:var(--ink);font-weight:600}
.exlist .li .w{color:var(--ink);font-weight:600;text-align:right}
/* drag-to-reorder: the handle owns the touch (touch-action:none) so the list does not scroll under it */
.grab{font-size:18px;line-height:1;color:var(--ink3);padding:6px 10px 6px 0;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.li.dragging{opacity:.55;background:var(--bg3)}
.li.dragging .grab{color:var(--red-ink)}
.audio-state{font-size:11px;letter-spacing:.12em;color:var(--ink3);text-transform:uppercase}

/* set */
#s-set{justify-content:flex-start;gap:14px}
/* head fills the screen above the controls; the weight/target hero centres in whatever is left, the log lines sit right above the picker */
.set-head{display:flex;flex-direction:column;gap:10px;flex:1 1 auto;min-height:0}
.exname{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.exname .n{font-family:var(--disp);font-weight:700;font-size:30px;letter-spacing:.02em;text-transform:uppercase;line-height:1;text-align:left}
.tag{font-size:10px;letter-spacing:.12em;padding:3px 7px;border:1px solid var(--red-dim);color:var(--red-ink);border-radius:3px;text-transform:uppercase}
.tag.open{background:var(--red-dim);color:#fff}
.safety{font-size:12px;color:var(--red-ink);display:none;line-height:1.35}
.safety.show{display:block}
.hero{display:flex;flex-direction:column;justify-content:center;gap:0;flex:1 1 auto;min-height:0;padding:6px 0}
.hero .w{display:flex;align-items:baseline;gap:10px}
.hero .w .disp{font-size:clamp(132px,46vw,200px)}
.hero .w .unit{font-size:14px;letter-spacing:.2em;color:var(--ink2);text-transform:uppercase;transform:translateY(-6px)}
.hero .w .from{font-size:12px;color:var(--ink3);letter-spacing:.08em}
.hero .t{display:flex;align-items:baseline;gap:14px;margin-top:-4px}
.hero .t .arrow{font-family:var(--disp);font-weight:500;font-size:48px;color:var(--ink3);line-height:1}
.hero .t .disp{font-size:clamp(72px,24vw,100px)}
.hero .t .range{font-size:13px;color:var(--ink2);letter-spacing:.08em}
.hero .t .range b{color:var(--ink);font-weight:600}
.log{display:flex;flex-direction:column;gap:6px}
.ghost{font-size:13px;color:var(--ink3);letter-spacing:.06em}
.ghost b{color:var(--ink2);font-weight:600}
.red{color:var(--red-ink)}
.advice{font-size:13px;letter-spacing:.04em;color:var(--ink2);min-height:18px}
.advice.drop,.advice.anchor{color:var(--red-ink)}
.cue{font-size:12px;color:var(--ink3);line-height:1.4;display:none}
.cue.show{display:block}
.controls{display:flex;flex-direction:column;gap:10px}
/* the rep picker is swipe-only (his call 9/4: "I can just swipe and scroll") */
.stepper{display:grid;grid-template-columns:1fr;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:8px;overflow:hidden;padding:8px 0 0}
.stepper .val{display:flex;flex-direction:column;align-items:stretch;justify-content:center;min-width:0}
.stepper .val .lbl{font-size:10px;letter-spacing:.2em;color:var(--ink3);text-transform:uppercase;text-align:center;margin-top:-4px;padding-bottom:6px}
/* the rep picker: a horizontal snap strip, swipe to the number, the centred one is the value */
#rep-scroll{height:84px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;display:flex;align-items:center;touch-action:pan-x;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#rep-scroll::-webkit-scrollbar{display:none}
#rep-scroll .rn{flex:0 0 56px;scroll-snap-align:center;text-align:center;font-family:var(--disp);font-weight:700;font-size:36px;color:var(--ink3);line-height:1;transition:font-size .08s,color .08s}
#rep-scroll .rn.on{color:var(--ink);font-size:72px}
#rep-scroll .pad{flex:0 0 calc(50% - 28px)}
@media (prefers-reduced-motion:reduce){#rep-scroll .rn{transition:none}}
.minor{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.08em;color:var(--ink3);text-transform:uppercase}
.minor button{color:var(--ink2);padding:8px 0}
.minor button.on{color:var(--red-ink)}
.minor button:disabled{color:var(--ink3);opacity:.6}

/* rest */
/* the countdown and the next set are one group at the top; the tank owns the space below them, the controls pin to the bottom */
#s-rest{justify-content:flex-start;gap:14px}
#s-rest .controls{margin-top:auto}
.rest-head{display:flex;justify-content:space-between;align-items:baseline}
/* the countdown is the red accent, always (his call 9/4: hard to read in white over the tank) */
.count{font-family:var(--mono);font-weight:600;font-size:clamp(96px,36vw,141px);line-height:1;letter-spacing:-.04em;margin-top:14px;text-align:center;color:var(--red-ink)}
.count.hot{color:var(--red-ink)}
.next{display:flex;flex-direction:column;gap:4px;margin-top:22px;padding-top:16px}
.next .nl{display:flex;justify-content:space-between;align-items:baseline}
.next .nl .n{font-family:var(--disp);font-weight:700;font-size:28px;text-transform:uppercase;letter-spacing:.02em}
.next .big{display:flex;align-items:baseline;gap:18px}
.next .big .disp{font-size:clamp(88px,28vw,120px)}
.next .big .unit{font-size:13px;letter-spacing:.2em;color:var(--ink2);text-transform:uppercase}
.next .big .tgt{display:flex;align-items:baseline;gap:8px;margin-left:auto}
.next .big .tgt .arrow{font-family:var(--disp);font-weight:500;font-size:40px;color:var(--ink3)}
.next .big .tgt .disp{font-size:clamp(72px,22vw,96px)}
.rest-ctl{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.go{background:var(--bg3);border:1px solid var(--line)}
body.hot .go{background:var(--red);border-color:var(--red);color:#fff}
/* halftone FX layers: the screen wipe (black dots) sits above the screens, the GO burst (red dots) above that; sheets stay above both */
#wipe,#burst{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;image-rendering:pixelated;image-rendering:crisp-edges;opacity:0}
#wipe{z-index:4}
#burst{z-index:5}

/* done */
#s-done{gap:14px;overflow:auto}
#s-done .stack{margin-top:auto}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin-top:4px}
.sum > div:first-child{grid-column:1/-1}
.sum .k{font-size:11px;letter-spacing:.16em;color:var(--ink3);text-transform:uppercase}
.sum .v{font-family:var(--disp);font-weight:700;font-size:44px;line-height:1}
.sum .v.wide{font-size:72px}
.lines{display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--ink2)}
.lines .l{display:grid;grid-template-columns:1fr auto;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.lines .l b{color:var(--ink);font-weight:600}
.lines .l .pr{color:var(--red-ink);letter-spacing:.12em;font-size:11px}
textarea{width:100%;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:13px/1.45 var(--mono);padding:10px;resize:none;-webkit-user-select:text;user-select:text}
textarea.export{flex:1 1 auto;min-height:110px;color:var(--ink2);font-size:12px}
textarea.note{height:72px;flex:0 0 auto}
textarea.inline{flex:1 1 auto;min-height:64px;margin:10px 0 8px;background:rgba(23,24,27,.78);color:var(--ink);font-size:14px;line-height:1.45}
.rest-top{flex:0 0 auto}
textarea::placeholder{color:var(--ink3)}

/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg2);border-top:1px solid var(--line);border-radius:14px 14px 0 0;padding:14px 20px calc(var(--sab) + 18px);transform:translateY(105%);transition:transform .22s;max-height:82dvh;overflow:auto}
.sheet.open{transform:none}
.scrim{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.55);display:none}
.scrim.on{display:block}
.sheet .li{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.sheet .li .dots{display:flex;gap:3px}
.sheet .li .dots i{width:8px;height:8px;border-radius:1px;background:var(--dot);display:block}
.sheet .li .dots i.done{background:var(--ink2)}
.sheet .li .dots i.cur{background:var(--red)}
.sheet .li button,.sheet .act{font-size:12px;letter-spacing:.12em;color:var(--ink2);padding:8px 10px;border:1px solid var(--line);border-radius:6px}
.sheet .li.cur b{color:var(--red-ink)}
.sheet .li .faint{font-size:12px;line-height:1.5}
.effort{display:grid;gap:8px}
.effort button{min-height:52px;border:1px solid var(--line);border-radius:8px;background:var(--bg3);font-family:var(--disp);font-weight:700;font-size:24px;color:var(--ink)}
.effort button:active{background:var(--line)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pills .pill{padding:7px 12px;border:1px solid var(--line);border-radius:999px;font-size:12px;letter-spacing:.1em;color:var(--ink2)}
.pills .pill.on{border-color:var(--ink);color:var(--ink)}
.tog.col{flex-direction:column;align-items:stretch;gap:0}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 100px);transform:translate(-50%,8px);z-index:7;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:6px;font-size:12px;letter-spacing:.08em;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}
</style>
</head>
<body data-screen="launch">

<canvas id="tank" aria-hidden="true"></canvas>
<canvas id="wipe" aria-hidden="true"></canvas>
<canvas id="burst" aria-hidden="true"></canvas>

<section class="screen" id="s-launch" aria-label="Start">
  <div class="top">
    <div class="row"><span class="brand">Prism II</span><button class="eyebrow" id="menu-btn">settings ›</button></div>
    <div class="day-hero">
      <div class="disp" id="l-day">UPPER</div>
      <div class="meta eyebrow" id="l-meta"></div>
      <div class="ghost num" id="l-last"></div>
    </div>
    <div class="exlist" id="l-list"></div>
  </div>
  <div class="stack">
    <button class="btn primary" id="l-start">Start</button>
    <button class="btn quiet" id="l-switch">Switch to Lower</button>
    <div class="tog"><span class="eyebrow">Voice</span><span class="audio-state" id="l-audio"></span><button class="pill on" id="l-voice">ON</button></div>
  </div>
</section>

<section class="screen" id="s-set" aria-label="Set">
  <div class="set-head">
    <div class="row">
      <button class="eyebrow" id="set-daylbl"><b>UPPER</b></button>
      <span style="display:flex;gap:18px"><button class="eyebrow" id="set-menubtn">settings</button><button class="eyebrow" id="set-listbtn">list ›</button></span>
    </div>
    <div class="strip" id="set-strip"></div>
    <div class="exname">
      <button class="n" id="set-exname">Chest Press</button>
      <span class="eyebrow num" id="set-idx">set 1 / 4</span>
      <button class="tag hidden" id="set-tag">cuff</button>
    </div>
    <div class="safety" id="set-safety"></div>
    <div class="hero">
      <div class="w"><button class="disp num" id="set-weight" aria-label="Change weight">120</button><span class="unit">lb</span><span class="from" id="set-from"></span></div>
      <div class="t"><span class="arrow">→</span><span class="disp num" id="set-target">12</span><span class="range num" id="set-range"></span></div>
    </div>
    <div class="log">
      <div class="ghost num" id="set-ghost"></div>
      <div class="ghost num" id="set-now"></div>
      <div class="advice" id="set-advice"></div>
      <div class="cue" id="set-cue"></div>
    </div>
  </div>
  <div class="controls">
    <div class="minor">
      <button id="set-undo">‹ undo last</button>
      <button id="set-cuebtn">cue</button>
      <button id="set-notebtn">note</button>
      <button id="set-pair">superset ›</button>
    </div>
    <div class="stepper">
      <div class="val"><div id="rep-scroll" aria-label="Reps"></div><span class="lbl">reps, to failure · swipe</span></div>
    </div>
    <button class="btn primary" id="set-done">Set done</button>
  </div>
</section>

<section class="screen" id="s-rest" aria-label="Rest">
  <div class="rest-top">
    <div class="rest-head">
      <span class="eyebrow" id="rest-lbl">Rest</span>
      <span style="display:flex;gap:18px"><button class="eyebrow" id="rest-menubtn">settings</button><button class="eyebrow" id="rest-listbtn">list ›</button></span>
    </div>
    <div class="strip" id="rest-strip" style="margin-top:10px"></div>
    <div class="count num" id="count">2:30</div>
  </div>
  <div class="next rest-top">
    <div class="nl"><span class="n" id="rest-exname">Chest Press</span><span class="eyebrow num" id="rest-idx"></span></div>
    <div class="big">
      <button class="disp num" id="rest-weight" aria-label="Change weight for the next set">120</button><span class="unit">lb</span>
      <span class="tgt"><span class="arrow">→</span><span class="disp num" id="rest-target">12</span></span>
    </div>
    <div class="advice num" id="rest-advice"></div>
  </div>
  <div class="controls">
    <div class="minor"><button id="rest-undo">‹ undo last</button><button id="rest-notebtn">note</button><span id="rest-logged"></span></div>
    <div class="rest-ctl">
      <button class="btn quiet" id="rest-plus">+30</button>
      <button class="btn go" id="rest-go">Go now</button>
    </div>
  </div>
</section>

<section class="screen" id="s-done" aria-label="Session complete">
  <div class="row"><span class="brand">Prism II</span><span class="eyebrow" id="done-day"></span></div>
  <div class="sum">
    <div><div class="k">Tonnage · lb</div><div class="v wide num" id="d-ton">0</div></div>
    <div><div class="k">Sets</div><div class="v num" id="d-sets">0</div></div>
    <div><div class="k">Time</div><div class="v num" id="d-time">0:00</div></div>
  </div>
  <div class="lines" id="d-lines"></div>
  <div class="eyebrow" id="d-adv"></div>
  <textarea class="note" id="d-note" placeholder="Notes for the log (order changes, what you actually loaded, anything for Claude). Goes into the summary."></textarea>
  <textarea class="export" id="d-export" readonly aria-label="Session summary"></textarea>
  <div class="stack">
    <button class="btn" id="d-copy">Copy summary</button>
    <button class="btn quiet" id="d-new">Back to start</button>
  </div>
</section>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
/* PRISM II - the weight and the target rep, a draining rest tank, and the
   ElevenLabs cue bank this site already carries under audio/. Every set is
   taken to failure, so there is no effort meter: the rep count is the signal. */
var BUILD = 'Prism II · 2026-09-04h CASCADE';
var DEMO = /[?&]demo=/.test(location.search);
/* query hooks (demo only): ?demo=rest&t=SEC pins the rest clock for a deterministic screenshot,
   &mid=MS paints one mid-fade frame MS after a level change, &dither=NAME picks a tank style,
   &sheet=list|menu|weight|note opens that sheet */
var Q=(function(){ var o={}; location.search.replace(/^\?/,'').split('&').forEach(function(p){ if(!p) return; var i=p.indexOf('='); try{ o[decodeURIComponent(i<0?p:p.slice(0,i))]=i<0?'':decodeURIComponent(p.slice(i+1)); }catch(e){} }); return o; })();
var FREEZE = DEMO && Q.t!=null;

/* prism2-plan.json is the source of truth for exercises and weights; this embedded copy only bootstraps a first load with no network.
   Change weights by editing the JSON (keep ids stable - history is keyed on them), bump its version, push. */
var EMBEDDED_PLANS = {
  Upper: [
    {id:'chest-press', name:'Chest Press', short:'PRESS', clip:'ex-chest-press', sets:4, lo:8, hi:12, weight:120, backoff:100, next:130, rest:150, anchor:true,
      cue:'Warm up first: one easy set of ~8 at 80. Full ROM, controlled descent, no elbow slam.'},
    {id:'cable-row', name:'Cable Rope Row', short:'ROW', clip:'ex-cable-row', sets:5, lo:8, hi:12, weight:120, backoff:100, next:130, rest:150, anchor:true,
      tag:'R shoulder', safety:'Right inner shoulder. Stop at the first pinch.',

/* "the next one" means the next one ON THE BOARD, so a reorder actually changes

function canPair(i){ var b=board(), pos=b.indexOf(i); if(partnerOf(i)!=null) return null;

  return null; }
function togglePair(){

  else { var k=canPair(i); if(k==null){ toast('nothing to pair with'); return; } S.exs[i].pair=k; S.exs[k].pair=i; toast('superset · '+ex(i).short+' + '+ex(k).short); }

function reapPairs(){ var p=planFor(S.day); for(var i=0;i<p.length;i++){ var pr=partnerOf(i); if(pr!=null && (remaining(i)===0||remaining(pr)===0)){ S.exs[i].pair=null; S.exs[pr].pair=null; } } }

/* ---------- logging ---------- */
function logSet(){
  var i=S.cur.ex, x=ex(i), w=curWeight(i), r=repVal;
  if(!S.logs[x.id]) S.logs[x.id]=[];
  var entry={r:r, w:w, t:Date.now()}; var best=bestAt(x.id,w); if(best&&r>best) entry.pr=true;
  S.logs[x.id].push(entry); S.order.push(i);
  if(S.anchor.armed&&!S.anchor.taken&&x.anchor&&S.logs[x.id].length===x.sets&&S.anchor.eligible===true){ S.anchor.taken=true; S.anchorTakenOn=x.id; }
  var dropFired=false;
  if(applyDrop(i, r)) dropFired=true;
  reapPairs(); save();
  var nx=nextSlot(); if(nx==null){ finish(); return; }
  var paired=partnerOf(i)!=null && nx===partnerOf(i);
  var rest=paired ? (i<nx?45:Math.max(x.rest, ex(nx).rest)) : x.rest;
  var nxEx=ex(nx), switching=nx!==i, isFinalEx=true; for(var k=0;k<planFor(S.day).length;k++){ if(k!==nx && remaining(k)>0) isFinalEx=false; }
  /* the cue sequence, in the live timer's own order */
  var cues=['received'];
  if(entry.pr) cues.push('cue-personal-record');
  var lx=S.logs[x.id]; if(switching && lx.length===x.sets && lx.every(function(e){ return e.r>=x.hi && e.w>=S.exs[i].w; })) cues.push('cue-trigger-hit');
  if(paired && i<nx){
    /* A -> B inside a superset: no transition timer either (his call 9/2, different muscle groups) */
    cues.push('up-next', nxEx.clip); var ldA=lastDrop(nx); if(ldA&&ldA.at===doneCount(nx)) cues.push(wgtClip(curWeight(nx)));
    S.cur.ex=nx; S.phase='set'; save(); renderSet(); toast('logged '+r+' @ '+fmtW(w)); Bank.seq(cues); return;
  }
  else if(paired){ cues.push('up-next', nxEx.clip); var ldB=lastDrop(nx); if(ldB&&ldB.at===doneCount(nx)) cues.push(wgtClip(curWeight(nx))); }
  else if(switching){
    /* no rest timer on an exercise change (his call 9/2: the walk to the next station is the rest) --
       straight to the next exercise's first set, with the arrival cues */
    cues.push('exercise-complete', isFinalEx?'final-exercise':'up-next', nxEx.clip, wgtClip(curWeight(nx)), aimClip(nxEx));
    S.cur.ex=nx; S.phase='set'; save(); renderSet(); toast('logged '+r+' @ '+fmtW(w)); Bank.seq(cues); return;
  }
  else if(dropFired){ cues.push(wgtClip(curWeight(i))); }
  cues.push(restClip(rest));
  S.cur.ex=nx; startRest(rest); Bank.seq(cues);
}
function undo(){
  if(!S.order.length) return;
  if(S.phase==='rest') endRest(false);
  Bank.cancel(); Bank.cancelScheduled();
  var i=S.order.pop(), x=ex(i), l=S.logs[x.id]; l.pop();
  revertDrop(i, l.length+1);
  if(S.anchorTakenOn===x.id && l.length<x.sets){ S.anchor.taken=false; S.anchorTakenOn=null; }
  S.cur.ex=i; S.phase='set'; save(); renderSet(); toast('undone');
}

/* ---------- REST + tank ---------- */
function startRest(sec){

  renderRestInfo();
  document.body.classList.remove('hot');

}
/* during rest S.cur.ex is already the NEXT slot (logSet advanced it before startRest), so this is the exercise he walks to next --

}

var tailKey=null;

  var hot=left<=10000; c.classList.toggle('hot',hot); document.body.classList.toggle('hot',hot);
  var s=Math.ceil(left/1000);
  if(s===60&&!spoke.t60&&S.restTotal>=120000){ spoke.t60=1; Bank.seq(['1min-remaining']); }
  if(s===30&&!spoke.t30&&S.restTotal>=60000){ spoke.t30=1; Bank.seq(['30sec-remaining']); }
  /* the live timer's countdown: three ticks and a GO tone on the audio clock, no voice */
  if(left>0 && left<=4600 && tailKey!==S.restEndsAt && Bank.state()==='running'){
    var t0=Bank.now()+left/1000, ok=true;
    [3,2,1].forEach(function(n){ var when=t0-n; if(when<Bank.now()-0.05) return; if(!Bank.playAt('sfx/tick.wav', when)) ok=false; });
    if(!Bank.playAt('sfx/go.wav', t0)) ok=false;

function plus30(){ Bank.cancelScheduled(); tailKey=null; S.restEndsAt+=30000; S.restTotal+=30000; delete spoke.t60; delete spoke.t30; save(); tick(); toast('+30'); }
/* ---------- halftone FX: screen wipes and the GO burst, on the same DOT8 screen as the tank ----------
   wipe(swap): the screen dithers down to black over WIPE_MS, swap() runs at full cover, then it dithers back up.
   burst(): red halftone blooms from the centre (density falling off outward) and dissolves; a pending screen swap rides its peak. */
var wipeC=$('wipe'), wctx=wipeC.getContext('2d'), burstC=$('burst'), bctx=burstC.getContext('2d');
var FX={wipe:null, burst:null, raf:null}, WIPE_MS=110, BURST_MS=150;   // per phase: cover, then uncover
function sizeFx(c){ var cw=c.clientWidth||window.innerWidth, ch=c.clientHeight||window.innerHeight, w=Math.max(1,Math.round(cw/CELL)), h=Math.max(1,Math.round(ch/CELL)); if(c.width!==w||c.height!==h){ c.width=w; c.height=h; } return {w:w,h:h}; }

  var d=sizeFx(c), w=d.w, h=d.h, img=ctx.createImageData(w,h), px=img.data;
  for(var y=0;y<h;y++){ for(var x=0;x<w;x++){ var dn=fn(x,y); if(dn<=0) continue; if(DOT8[(y&7)*8+(x&7)]<dn){ var o=(y*w+x)*4; px[o]=r; px[o+1]=g; px[o+2]=b; px[o+3]=255; } } }
  ctx.putImageData(img,0,0);
}
function fxOff(){ return DEMO||reduced(); }
/* synthesized sweep sfx on the Bank's own context: filtered noise whose band rides up with the curtain and back down as it leaves.
   No file, no decode, nothing before the Start tap; gated on the voice switch like every other sound. Quiet under the GO tone. */
function sfxSweep(ms, peak, lo, hi){
  try{
    var ac=Bank.ctx(); if(!ac||!prefs.voice) return;
    var n=Math.floor(ac.sampleRate*ms/1000), buf=ac.createBuffer(1,n,ac.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<n;i++) d[i]=Math.random()*2-1;
    var src=ac.createBufferSource(); src.buffer=buf;
    var bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.4;
    var t=ac.currentTime, half=ms/2000;
    bp.frequency.setValueAtTime(lo,t); bp.frequency.exponentialRampToValueAtTime(hi,t+half); bp.frequency.exponentialRampToValueAtTime(lo,t+2*half);
    var g=ac.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+.015); g.gain.setValueAtTime(peak,t+half); g.gain.exponentialRampToValueAtTime(.0001,t+2*half);

}
function wipe(swap){ if(fxOff()){ swap(); return; } if(FX.wipe){ if(FX.wipe.done) swap(); else { var prev=FX.wipe.swap; FX.wipe.swap=function(){ prev(); swap(); }; } return; }
  FX.wipe={t0:performance.now(), swap:swap, done:false}; wipeC.style.opacity=1; sfxSweep(WIPE_MS*2, .22, 420, 3200); fxStart(); }
function burst(){ if(fxOff()||FX.burst) return; FX.burst={t0:performance.now(), swap:null, done:false}; burstC.style.opacity=1; sfxSweep(BURST_MS*2, .3, 300, 5200); fxStart(); }
function fxStart(){ if(!FX.raf) FX.raf=requestAnimationFrame(fxFrame); }
/* the sweep: a skewed halftone curtain crosses the screen along a ~33° axis. t in 0..2: the leading edge covers (0..1),
   the trailing edge follows it off the far side (1..2), so the curtain passes through rather than blooming and fading.
   Its edge is a halftone ramp SWEEP_BAND wide along the axis; the swap happens under full cover at t=1. */

$('count').addEventListener('click', function(){ if(!DEMO||!S||S.phase!=='rest') return; var l=cycleDither(); S.restEndsAt=Date.now()+S.restTotal; toast('tank · '+l); });

/* ---------- demo states for screenshots: ?demo=set | rest | done (storage untouched) ---------- */
/* ?drag=FROM,TO (demo only): synthetic pointer drag of row FROM to position TO on whichever list is showing */
function demoDrag(){
  var m=/^(\d+),(\d+)$/.exec(Q.drag||''); if(!m) return;
  var list=$('sheet').classList.contains('open')?$('sheet'):$('l-list'), rows=list.querySelectorAll('.li'), from=+m[1], to=+m[2];
  if(!rows[from]||!rows[to]) return; var h=rows[from].querySelector('.grab'), r0=h.getBoundingClientRect(), r1=rows[to].getBoundingClientRect();
  function pe(type, el, y){ el.dispatchEvent(new PointerEvent(type, {bubbles:true, clientX:r0.left+4, clientY:y, pointerId:1, pointerType:'touch'})); }
  var y0=r0.top+r0.height/2, y1=r1.top+(to>from?r1.height-2:2);
  pe('pointerdown', h, y0); for(var k=1;k<=8;k++) pe('pointermove', h, y0+(y1-y0)*k/8); pe('pointerup', h, y1);
}
(function demo(){
  var m=/[?&]demo=(set|rest|done)/.exec(location.search); if(!m) return;
  newSession('Upper');
  S.logs['chest-press']=[{r:10,w:120,t:Date.now()-400000},{r:8,w:120,t:Date.now()-200000}]; S.order=[0,0]; S.cur.ex=0;
  function demoFx(){
    if(Q.wipe!=null){ wipeC.style.opacity=1; paintField(wipeC, wctx, sweepField(+Q.wipe, sizeFx(wipeC), false), 0,0,0); }
    if(Q.burst!=null){ burstC.style.opacity=1; paintField(burstC, bctx, sweepField(+Q.burst, sizeFx(burstC), true), 0xe5,0x31,0x2b); }
  }
  function demoSheet(){ demoFx(); var s=Q.sheet; if(s==='list') listSheet(); else if(s==='menu') menuSheet(); else if(s==='weight') weightSheet(); else if(s==='note') noteSheet(); if(Q.drag) setTimeout(demoDrag, 50); }
  if(m[1]==='set'){ renderSet(); demoSheet(); return; }
  if(m[1]==='rest'){
    var total=+Q.total||150, left=Q.t!=null?+Q.t:107;
    startRest(total); S.restEndsAt=Date.now()+left*1000;
    if(FREEZE){   /* pinned clock: no interval, no rAF, one deterministic paint (two for a mid-fade frame) */
      if(tickTimer){ clearInterval(tickTimer); tickTimer=null; }
      var mid=+Q.mid||0, hot=left<=10;
      if(mid){ drawTank(Math.min(1,(left+2)/total), left+2<=10, 0, true); drawTank(left/total, hot, mid, false); }
      else drawTank(left/total, hot, 0, true);
      $('count').textContent=fmtClock(left*1000); $('count').classList.toggle('hot',hot); document.body.classList.toggle('hot',hot);
    } else tick();
    demoSheet(); return; }
  S.logs['cable-row']=[{r:12,w:120},{r:11,w:120},{r:9,w:120},{r:9,w:100},{r:8,w:100}];
  S.logs['chest-press'].push({r:10,w:100},{r:7,w:100});
  S.logs['incline-press']=[{r:12,w:70,pr:true},{r:8,w:70},{r:6,w:70}];
  S.order=[0,0,0,0,1,1,1,1,1,2,2,2]; S.startedAt=Date.now()-1710000; S.note='pec deck exists, used 50'; finish();
})();
if(!DEMO) renderLaunch();
if(/[?&]demo=launch/.test(location.search)){ renderLaunch(Q.day||'Upper'); if(Q.drag) setTimeout(demoDrag, 50); }
})();
